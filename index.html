<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="康复知识库">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>康复知识库 · 21 位点 / 22 版次分级检索</title>
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1f;--muted:#6b6b70;--line:#e6e3dc;--card:#fff;--accent:#1f4e79;--soft:#f1efe9}
@media (prefers-color-scheme: dark){:root{--bg:#17181a;--fg:#eceae6;--muted:#a09e98;--line:#2e3033;--card:#1e2023;--accent:#8ab4d8;--soft:#24262a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
.wrap{display:grid;grid-template-columns:330px 1fr;height:100vh}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--card)}
.top{padding:14px 14px 8px}
h1{font-size:22px}
.brand{font-weight:700;font-size:15px;letter-spacing:.02em;margin-bottom:10px}
.brand small{color:var(--muted);font-weight:400;margin-left:6px}
.who{padding:0 14px 8px}
.who select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:12.5px;cursor:pointer}
.idcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0 16px;background:var(--card)}
.idcard .k2{font-weight:700;font-size:13px;margin:8px 0 4px;color:var(--accent)}
.idcard .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--accent)}
.fp{display:inline-block;margin-left:6px;padding:0 5px;border-radius:999px;font-size:10.5px;background:var(--soft);color:var(--accent);border:1px solid var(--line)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-left:3px solid var(--accent);background:var(--soft);padding:9px 12px;border-radius:0 10px 10px 0;margin:10px 0 16px;font-size:13px}
.banner a[data-who]{color:var(--accent);cursor:pointer;text-decoration:underline}
ul.srcs{font-size:12.5px;color:var(--muted);word-break:break-all}
ul.srcs a{color:var(--accent)}
input[type=search]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font-size:14px;outline:none}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 14px 6px}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 9px;border-radius:999px;font-size:12px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#filters{display:flex;gap:4px;padding:0 14px 8px;flex-wrap:wrap;align-items:center}
#filters .sep{width:100%;height:0}
.chipbtn{border:1px solid var(--line);background:transparent;color:var(--muted);font-size:11px;padding:3px 7px;border-radius:6px;cursor:pointer}
.chipbtn.on{background:var(--soft);color:var(--fg);border-color:var(--accent)}
#count{margin-left:auto;font-size:11px;color:var(--muted)}
#list{overflow:auto;flex:1;padding:0 8px 14px}
.item{display:flex;gap:8px;align-items:flex-start;padding:8px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--soft)}
.item.active{background:var(--soft);border-color:var(--accent)}
.it-title{font-size:13.5px;font-weight:600;line-height:1.4}
.it-sub{font-size:11.5px;color:var(--muted)}
.mini{margin-left:auto;font-size:10.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 4px}
.mini.full{color:#fff;background:#2e7d32;border-color:#2e7d32}
.badge{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--soft);color:var(--fg);flex:none;margin-top:2px}
.lv-L0{background:#e8f1fa;color:#1f4e79}.lv-L1{background:#e8f4e6;color:#2e6b2b}.lv-L2{background:#fff1df;color:#8a5300}.lv-L3{background:#f4e8f8;color:#6b2b80}.lv-L4{background:#fde9e7;color:#8a2c22}
@media (prefers-color-scheme: dark){.badge{color:#111}}
main{overflow:auto;padding:30px 44px 80px}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.04em}
main h1{margin:6px 0 10px;font-size:26px;line-height:1.3}
.meta{font-size:12.5px;color:var(--muted);margin-bottom:16px}
main h3{margin:26px 0 8px;font-size:14px;letter-spacing:.03em;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:5px}
main h3 small{color:var(--muted);font-weight:400;letter-spacing:0}
p{margin:6px 0}
.muted{color:var(--muted);font-size:13.5px}
ul.chapters{list-style:none;padding:0;margin:0;columns:1}
.vblock{margin:16px 0 22px}
.vhead{font-size:13.5px;font-weight:700;padding:6px 10px;background:var(--soft);border-left:3px solid var(--accent);border-radius:4px}
.vmeta{font-weight:400;color:var(--muted);font-size:11.5px}
.vnote{font-size:12px;color:var(--muted);margin-top:4px;font-weight:400}
ul.chapters li{display:flex;gap:8px;padding:6px 8px;border-bottom:1px dashed var(--line);cursor:pointer;font-size:13.5px;align-items:flex-start;break-inside:avoid}
@media(min-width:1200px){ul.chapters{columns:2;column-gap:40px}}
ul.chapters li:hover{background:var(--soft)}
ul.chapters li .box{width:16px;height:16px;border:1.5px solid var(--line);border-radius:4px;flex:none;text-align:center;font-size:11px;line-height:14px;margin-top:2px;color:#fff}
ul.chapters li.done{color:var(--muted)}
ul.chapters li.done .box{background:#2e7d32;border-color:#2e7d32}
.progwrap{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.progbar{flex:1;height:6px;background:var(--soft);border-radius:99px;overflow:hidden;max-width:340px}
.progfill{height:100%;background:#2e7d32;width:0;transition:width .2s}
#progress-label{font-size:11.5px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--accent);cursor:pointer;text-decoration:none}
.chip:hover{background:var(--soft)}
table.grid{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0}
table.grid th,table.grid td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.grid th{background:var(--soft);font-weight:600;white-space:nowrap}
td.stage{white-space:nowrap;font-weight:600}
.file{margin-top:36px;font-size:11.5px;color:var(--muted)}
.empty{max-width:640px;margin:8vh auto}
.empty h2{font-size:26px;margin-bottom:8px}
.hint{font-size:12.5px;color:var(--muted)}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;background:var(--soft)}
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat-n{font-size:26px;font-weight:700}
.stat-l{font-size:11.5px;color:var(--muted)}
.mbar{display:none}
.mask{display:none}
@media(max-width:820px){
  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:45;
        padding:9px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  .mbar b{font-size:15px}
  .mbar small{font-size:11px;color:var(--muted)}
  .mbar .sp{flex:1}
  #hamb,#mAsk{border:1px solid var(--line);background:var(--bg);border-radius:8px;
        font-size:15px;line-height:1;padding:7px 10px;cursor:pointer;color:var(--fg)}
  .wrap{display:block;height:auto}
  aside{position:fixed;top:0;bottom:0;left:0;width:84%;max-width:330px;z-index:60;
        transform:translateX(-102%);transition:transform .22s ease;border-right:1px solid var(--line);
        background:var(--bg);max-height:none;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.18)}
  body.nav-open aside{transform:none}
  body.nav-open .mask{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.35)}
  main{padding:14px 14px 90px;margin-left:0}
  h1{font-size:24px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 6px}
  .tabs button{flex:0 0 auto}
  #filters{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 10px 8px}
  #filters>*{flex:0 0 auto}
  table.grid{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;font-size:12.5px}
  table.grid th,table.grid td{white-space:normal;min-width:64px}
  ul.pts{font-size:13.5px}
  .askpanel{left:8px;right:8px;bottom:66px;width:auto;max-height:72vh}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat-n{font-size:22px}
  .askbtn{padding:9px 14px;font-size:13.5px}
  .chnav{gap:8px;font-size:13px}
}

/* 章节页 */
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
.atom{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--card);cursor:pointer;transition:border-color .15s}
.atom:hover{border-color:var(--accent)}
.atom-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.atom-h .more{margin-left:auto;color:var(--accent);cursor:pointer;font-size:12px;white-space:nowrap}
.atom-h .more:hover{text-decoration:underline}
.atom-h b{font-size:14.5px}
.atom-h span{font-size:12.5px;color:var(--muted)}
ul.pts{margin:8px 0 0;padding-left:18px;font-size:13.5px}
ul.pts li{margin:3px 0}
.tip{margin-top:8px;font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.relrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
textarea#chnote{width:100%;min-height:92px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);font:14px/1.6 inherit;resize:vertical}
.chnav{display:flex;justify-content:space-between;gap:10px;margin:26px 0 0;font-size:13px}
.chnav a{color:var(--accent);cursor:pointer;text-decoration:none}
/* 问答 */
.askbtn{position:fixed;right:26px;bottom:26px;z-index:40;border:none;border-radius:999px;padding:11px 18px;
  background:var(--accent);color:#fff;font-size:14px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.askpanel[hidden]{display:none}
.askpanel{position:fixed;right:26px;bottom:26px;width:min(430px,calc(100vw - 40px));height:min(620px,calc(100vh - 60px));
  background:var(--card);border:1px solid var(--line);border-radius:14px;z-index:41;display:flex;flex-direction:column;
  box-shadow:0 18px 48px rgba(0,0,0,.22)}
.askhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.askhead small{font-weight:400;color:var(--muted);font-size:11.5px}
.askhead button{margin-left:auto;border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
#askLog{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{font-size:13.5px;line-height:1.6;border-radius:10px;padding:9px 11px;max-width:92%}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff}
.msg.a{align-self:flex-start;background:var(--soft)}
.reslist{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.res{display:block;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:6px 9px;font-size:12.5px;cursor:pointer}
.res:hover{border-color:var(--accent)}
.res b{color:var(--accent);font-weight:600;margin-right:6px}
.asksug{display:flex;gap:5px;flex-wrap:wrap;padding:8px 14px 0}
.asksug button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;
  font-size:11.5px;padding:3px 8px;cursor:pointer}
.askfoot{display:flex;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--line)}
#askInput{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font-size:13.5px;outline:none}
#askInput:focus{border-color:var(--accent)}
#askSend{border:none;border-radius:9px;padding:0 16px;background:var(--accent);color:#fff;font-size:13.5px;cursor:pointer}
</style></head>
<body>
<div class="mbar"><button id="hamb" aria-label="目录">☰</button><b>康复知识库</b><span class="sp"></span><small id="mbarSub">21 位点</small><button id="mAsk" aria-label="问知识库">问</button></div>
<div class="mask" id="mask"></div>
<div class="wrap">
<aside>
  <div class="top">
    <div class="brand">康复知识库 <small id="brandSub">21 位点 / 22 版次</small></div>
    <div class="who"><select id="whoSel" title="选一个身份，相关的内容会被标成本阶段重点"><option value="">身份：不指定（全部内容）</option></select></div>
    <input id="search" type="search" placeholder="搜索：脑卒中 / 吞咽 / Berg / C1 …">
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="books">教材</button>
    <button class="tab" data-tab="topics">主题延伸</button>
    <button class="tab" data-tab="paths">学习路径</button>
    <button class="tab" data-tab="scales">量表速查</button>
    <button class="tab" data-tab="diseases">病种速查</button>
    <button class="tab" data-tab="overlaps">重合取舍</button>
    <button class="tab" data-tab="ident">身份适配</button>
    <button class="tab" data-tab="cert">资格证</button>
  </div>
  <div id="filters">
    <button class="chipbtn on" data-level="all">全部</button>
    <button class="chipbtn" data-level="L0">L0</button>
    <button class="chipbtn" data-level="L1">L1</button>
    <button class="chipbtn" data-level="L2">L2</button>
    <button class="chipbtn" data-level="L3">L3</button>
    <button class="chipbtn" data-level="L4">L4</button>
    <span class="sep"></span>
    <button class="chipbtn on" data-cat="all">全类</button>
    <button class="chipbtn" data-cat="A">A 入门</button>
    <button class="chipbtn" data-cat="B">B 基础</button>
    <button class="chipbtn" data-cat="C">C 评定</button>
    <button class="chipbtn" data-cat="D">D 技术</button>
    <button class="chipbtn" data-cat="E">E 专科</button>
    <button class="chipbtn" data-cat="F">F 综合</button>
    <span id="count"></span>
  </div>
  <div id="list"></div>
</aside>
<main id="main"></main>
</div>
<button id="askBtn" class="askbtn">问知识库</button>
<section id="askPanel" class="askpanel" hidden>
  <div class="askhead">问知识库 <small>检索 · 总结 · 直达章节</small><button id="askClose" title="收起">×</button></div>
  <div id="askLog"></div>
  <div class="asksug">
    <button data-q="脑卒中手功能怎么练">脑卒中手功能</button>
    <button data-q="膝置换术后多久能负重">膝置换术后</button>
    <button data-q="吞咽障碍怎么评">吞咽评定</button>
    <button data-q="肌力评定 MMT 分级">MMT 分级</button>
    <button data-q="脊髓损伤并发症">脊髓损伤</button>
  </div>
  <div class="askfoot">
    <input id="askInput" placeholder="说出你的需求，例如：偏瘫肩痛怎么处理" autocomplete="off">
    <button id="askSend">发送</button>

到“能做什么”，不停在诊断名上"], "t": "常考 ICF 成分举例、三级预防对应措施。", "kw": ["残疾", "ICF", "功能", "残损", "预防", "分类"], "d": [["怎么理解", "p", "残疾不是「身体坏了」这么简单，而是个人能力与环境要求之间不匹配。ICF 把这件事拆成两层：功能与残疾（身体功能 b、结构 s、活动与参与 d），以及背景因素（环境 e、个人因素）。同一个脊髓损伤者，在有坡道和无坡道的城市里，残疾程度完全不同——这就是 ICF 想表达的。"], ["逐条展开", "ul", ["三层旧分类：impairment（损伤，器官层面）→ disability（活动受限，个人层面）→ handicap（参与限制，社会层面）。", "ICF 两部分：第一部分「功能与残疾」含 b 身体功能、s 身体结构、d 活动与参与；第二部分「背景因素」含 e 环境因素与个人因素。", "限定值：每个编码后面加 .0—.4，表示问题严重度——0 无问题、1 轻度、2 中度、3 重度、4 完全。", "举例：偏瘫患者 b730 肌力功能 .2（中度下降）、d450 步行 .3（重度受限）、e120 公共交通 .4（完全障碍）。", "用途：ICF 不是诊断，而是「功能画像」，用来定目标、写评定报告、比较干预前后。"]], ["三级预防", "table", [["层级", "防什么", "典型措施"], ["一级", "防发生", "产前筛查、疫苗、交通安全、工伤防护"], ["二级", "防残疾（早诊早治）", "卒中溶栓、骨折早期固定、糖尿病足筛查"], ["三级", "防残障（功能与参与）", "假肢、步行训练、辅具、无障碍改造"]]], ["提示", "p", "考题里出现「残疾分类」先分清是器官层（损伤）还是社会层（参与）；出现「ICF 限定值」一定要写 0—4，别写成 1—5。"]]}, {"k": "liuxing", "n": "流行病学与需求", "c": "康复需求的人群分布与统计口径", "p": ["残疾率、患病率、致残原因构成比三组指标", "数据来源：抽样调查、登记报告、医保结算", "用于配置床位、人力与社区服务", "不同口径不可直接相加比较"], "t": "记定义与用途，不背具体百分比。", "kw": ["流行病", "统计", "调查", "致残原因", "分布"], "d": [["怎么理解", "p", "康复的「客户量」来自带残生存的人：慢病活得久了、创伤救回来了、老人多了，三条线叠加，康复需求就持续上升。流行病学这一章真正要记的不是具体数字，而是口径——残疾率、康复需求率、服务利用率是三件事。"], ["逐条展开", "ul", ["三次口径：患病率（有多少病人）→ 残疾率（留下多少功能障碍）→ 康复服务利用率（真正得到服务的人），逐级递减。", "我国残疾人基数按第二次全国残疾人抽样调查约 8500 万，肢体残疾占比最高，其次听力、视力、智力、精神。", "需求最集中的五类：脑卒中（年新发 200 万以上）、脊髓损伤、脑瘫、骨关节炎/骨折术后、颈腰痛。", "老龄化带来增量：65 岁以上跌倒、失能、长期照护；康复床位与治疗师数量仍明显不足。", "供给侧两个抓手：急性期早期介入（缩短住院日）+ 社区康复网络（承接出院后）。"]], ["提示", "p", "这一章不考背数字，考「为什么康复需求会持续增长」和「三个率为什么递减」——把慢病化、创伤存活率提高、老龄化三条讲清楚即可。"]]}, {"k": "lunli", "n": "伦理、文书与质控", "c": "康复伦理问题、医疗文书规范与质量控制", "p": ["伦理：知情同意、隐私保护、资源分配、终止治疗", "文书：入院评定、治疗记录、阶段小结、出院小结", "质控：评定完成率、目标达成率、并发症与再入院", "记录必须可复现：谁、何时、做了什么、反应如何"], "t": "文书类题答“客观、及时、完整、可追溯”。", "kw": ["伦理", "文书", "质控", "记录", "知情同意", "科研", "科学研究", "设备", "循证"], "d": [["怎么理解", "p", "康复伦理的特殊性在于三件事同时存在：治疗周期长（几个月到几年）、资源有限（床位与治疗师都紧张）、患者自主性可能受损（认知障碍、抑郁）。文书与质控则是把这些抽象原则变成可查、可追责的记录。"], ["逐条展开", "ul", ["四原则：尊重自主、不伤害、有利、公正。康复里最常冲突的是「有利」（多练一点好得快）与「不伤害」（练过头会疼、会伤）。", "知情同意：评定与治疗前说明目的、风险、替代方案；患者拒绝治疗，要记录「已告知、患者拒绝、后果说明」。", "常见冲突场景：家属要求继续住院但功能已平台期、患者想回家但家居环境不安全、医保额度与治疗强度。", "文书四件套：评定记录（初评/中评/末评）、治疗记录（每次）、阶段小结、出院小结；治疗记录常用 SOAP（主观/客观/评估/计划）。", "质控指标：平均住院日、功能改善率（如 Barthel 变化）、不良事件率（跌倒、压疮、训练中受伤）、满意度。"]], ["提示", "p", "案例题问「患者拒绝训练怎么办」，标准答法是：先沟通找原因（疼痛？恐惧？抑郁？）→ 调整方案 → 仍拒绝则记录并请团队/家属共同决策；不能强制，也不能不管。"]]}, {"k": "jiepou-gu", "n": "骨关节解剖", "c": "骨骼、关节、韧带与关节运动学基础", "p": ["骨性标志是触诊与手法的定位依据", "关节类型决定活动方向与生理性限制", "关节运动：滚动、滑动、旋转；生理运动与附属运动", "关节囊、韧带决定稳定方向与损伤机制"], "t": "先记标志点与运动轴，再记肌与神经支配。", "kw": ["解剖", "骨骼", "骨", "关节", "韧带", "标志"], "d": [["怎么理解", "p", "骨关节是康复的「杠杆与支点」。评定关节活动度、判断疼痛来源、设计训练动作，都要先知道这个关节有几个自由度、由谁稳定、正常活动范围多少。"], ["逐条展开", "ul", ["骨：长骨（杠杆）、短骨（腕踝，灵活）、扁骨（颅骨胸骨，保护）、不规则骨（椎骨）。", "关节三型：纤维连接（不动，如颅缝）、软骨连接（微动，如椎间盘、耻骨联合）、滑膜关节（自由活动，康复主要对象）。", "滑膜关节的基本结构：关节面与软骨、关节囊、关节腔、韧带；辅助结构有半月板、盂唇、滑囊、脂肪垫。", "自由度：单轴（肘、指间）、双轴（膝近似、腕）、三轴（肩、髋）。自由度决定能做哪些方向的 ROM 训练。", "稳定结构：韧带限制方向、关节囊限制范围、肌肉提供动态稳定；康复里「稳定」往往比「灵活」更该先练。"]], ["正常活动度速记", "table", [["关节", "主要方向与正常值"], ["肩", "前屈 180°、后伸 60°、外展 180°、内外旋各 90°"], ["肘", "屈 150°、伸 0°（过伸 5—10°）"], ["腕", "背伸 70°、掌屈 80°、桡偏 20°、尺偏 30°"], ["髋", "屈 120°、伸 30°、外展 45°、内收 30°"], ["膝", "屈 135°、伸 0°"], ["踝", "背屈 20°、跖屈 50°"]]], ["提示", "p", "评定 ROM 一定要写「主动 / 被动」两个值：主动明显小于被动 = 肌力或疼痛问题；两者都小 = 关节本身或软组织挛缩。"]]}, {"k": "jiepou-ji", "n": "肌肉解剖与功能", "c": "肌肉起止、配布与协同分工", "p": ["起止点决定力矩与运动方向", "原动肌、拮抗肌、固定肌、中和肌四种角色", "肌纤维走向与羽状角影响力量与速度", "神经支配节段决定损伤后的表现"], "t": "按“关节—运动—肌—神经节段”四列表格记忆。", "kw": ["肌肉", "肌群", "起止", "神经支配", "配布"], "d": [["怎么理解", "p", "肌肉是康复训练的执行器。要知道一块肌肉「起点在哪、止点在哪、跨过哪个关节」，才能判断它收缩时产生什么动作、该用哪个体位去练、拉长位和缩短位分别是什么。"], ["逐条展开", "ul", ["起点（origin）通常在近端/固定侧，止点（insertion）在远端/活动侧；起止点不是绝对的，取决于哪个环节固定。", "跨关节数决定功能：单关节肌管精细动作（如肱肌），双关节肌在两端同时收缩时会产生「主动不足/被动不足」。", "主动不足：双关节肌在一个关节缩短后，对另一个关节的力矩下降（如屈肘后肩屈力量下降）。", "被动不足：双关节肌在一个关节被拉长后，对另一个关节的牵伸受限（如伸膝位屈髋受限，腘绳肌）。", "配布与协同：主动肌、拮抗肌、协同肌、固定肌四种角色；康复训练要按角色设计，而不是只练「那块肌肉」。"]], ["提示", "p", "考「为什么伸膝位屈髋角度变小」答腘绳肌被动不足；考「为什么屈肘后肩屈无力」答肱二头肌主动不足。这两个词几乎每年出。"]]}, {"k": "jiepou-shen", "n": "神经解剖", "c": "中枢与周围神经通路、传导束与定位", "p": ["皮质脊髓束、锥体外系、小脑三条运动通路", "感觉通路：脊髓后索、脊髓丘脑束、三叉", "周围神经丛与关键神经（桡、正中、尺、坐骨、腓总）", "定位诊断：损伤平面决定肌群与反射改变"], "t": "把通路和临床体征对上：上/下运动神经元损伤的区别。", "kw": ["神经", "脑", "脊髓", "传导", "通路", "感觉器", "内分泌"], "d": [["怎么理解", "p", "神经解剖是康复定位的底层地图：哪条通路断了，就出现哪种模式的瘫痪、感觉缺失或反射改变。上运动神经元与下运动神经元的区别，是整本神经康复的第一块砖。"], ["逐条展开", "ul", ["皮质脊髓束（锥体束）：控制精细随意运动，损伤→痉挛性瘫痪、腱反射亢进、病理征阳性（上运动神经元）。", "锥体外系：调节肌张力与协调，损伤→肌张力异常（齿轮样、铅管样）、舞蹈样动作（如帕金森）。", "小脑三对脚：上脚（结合臂）协调、中脚（脑桥臂）传入、下脚（绳状体）平衡；损伤→共济失调、意向性震颤。", "感觉通路：后索（精细触觉、本体觉，薄束/楔束）→ 内侧丘系；脊髓丘脑束（痛温觉、粗触觉）→ 交叉后上行。", "周围神经：颈丛（C1—C4）、臂丛（C5—T1）、腰丛（L1—L4）、骶丛（L4—S4）；常见损伤神经：桡、正中、尺、坐骨、腓总。"]], ["上下运动神经元鉴别", "table", [["体征", "上运动神经元（中枢）", "下运动神经元（周围/前角）"], ["肌张力", "增高（痉挛）", "降低（弛缓）"], ["腱反射", "亢进", "减弱或消失"], ["病理征", "阳性（Babinski）", "阴性"], ["肌萎缩", "晚期轻度", "早期明显"], ["肌电图", "正常或募集减少", "失神经电位、纤颤"]]], ["提示", "p", "定位题先分「上还是下」，再看「哪条通路」：偏瘫 + 面舌瘫 = 皮质脊髓束；单肢弛缓 + 肌萎缩 = 周围神经或前角。"]]}, {"k": "jiepou-zang", "n": "内脏与系统解剖", "c": "呼吸、循环、消化、泌尿生殖系统结构要点", "p": ["呼吸：肺叶分段、胸膜腔、膈肌", "循环：心腔、瓣膜、冠脉、体肺循环", "消化泌尿：腹部分区与脏器体表投影", "康复相关：体位引流、胸廓活动、腹压管理"], "t": "只记与评定/治疗操作相关的解剖，不做外科式记忆。", "kw": ["呼吸", "循环", "消化", "泌尿", "生殖", "血液", "脉管"], "d": [["怎么理解", "p", "内脏解剖在康复里主要服务于两件事：心肺康复（知道通气与循环的路径）+ 盆底与吞咽（知道管道与括约肌）。不需要背到外科手术层面，但要能说出「哪里窄、哪里会漏、哪里该练」。"], ["逐条展开", "ul", ["呼吸：上呼吸道（鼻—咽—喉）→ 气管支气管树 → 肺泡；右主支气管更陡更粗，误吸更易进右下叶。", "呼吸肌：膈肌（主，C3—C5）、肋间外肌、腹肌（呼气）、辅助肌（斜角肌、胸锁乳突肌）。", "循环：体循环（左心—动脉—毛细血管—静脉—右心）与肺循环；康复训练要盯心率、血压、摄氧量。", "消化与吞咽：咽期（软腭上抬、喉上抬、会厌翻转、声门关闭）→ 食管期；吞咽障碍的评估就按这个顺序查。", "泌尿生殖：膀胱（逼尿肌 + 括约肌）、盆底肌；脊髓损伤后的神经源性膀胱分痉挛型与弛缓型。"]], ["提示", "p", "吞咽题优先看「咽期四件事」：软腭上抬、喉上抬、会厌翻转、声门关闭——漏一个就会误吸。"]]}, {"k": "shengli-ji", "n": "骨骼肌生理", "c": "肌纤维类型、收缩形式与疲劳", "p": ["I 型慢肌耐力、II 型快肌爆发", "等长、等张（向心/离心）、等速四种收缩", "力量—长度、力量—速度关系", "疲劳与恢复：中枢与外周机制"], "t": "训练处方要能对上收缩形式与强度。", "kw": ["骨骼肌", "肌纤维", "收缩", "疲劳", "生理"], "d": [["怎么理解", "p", "骨骼肌是「可训练的组织」：不同的收缩形式、不同的负荷与速度，会带来不同的适应。康复开处方时选等长、等张还是等速，取决于这个阶段能不能动、要不要保护关节。"], ["逐条展开", "ul", ["肌纤维：I 型（慢、抗疲劳、耐力）、IIa（快、中等耐力）、IIx/IIb（快、爆发、易疲劳）。", "收缩形式：等长（长度不变、张力增）、等张（张力不变、长度变，分向心/离心）、等速（角速度恒定，需设备）。", "离心收缩力量最大、也最易造成延迟性肌肉酸痛（DOMS），早期康复要慎用大强度离心。", "长度—张力关系：肌肉在静息长度略被拉长时产生最大张力；过短或过长都下降。", "杠杆", "重心", "行走"], "d": [["怎么理解", "p", "生物力学把人体当杠杆系统：力、力矩、力臂决定「这个人为什么搬不动、为什么膝会疼、为什么拐杖要那样用」。康复里的体位、辅具、转移技术，背后都是力矩。"], ["逐条展开", "ul", ["三类杠杆：第一类（支点在中间，如寰枕关节）、第二类（阻力在中间，如提踵）、第三类（力在中间，人体最多，如屈肘）。", "力矩 = 力 × 力臂；力臂是「力的作用线到支点的垂直距离」，不是肌肉到关节的距离。", "增大稳定性的办法：降低重心、扩大支撑面、重力线落在支撑面内——拐杖、助行器、站位训练都按这个设计。", "脊柱负荷：弯腰提物时腰椎负荷可达体重的数倍；搬物要「屈膝屈髋、物体贴近身体」。", "步态生物力学：髋膝踝的力矩与地面反作用力决定异常步态的代偿方式（如臀中肌步态、跨阈步态）。"]], ["提示", "p", "考「为什么膝关节炎患者上下楼比平地疼」：上下楼时髌股关节反作用力可达体重的 3—7 倍，力臂与屈曲角度共同放大负荷。"]]}, {"k": "fayu", "n": "发育", "c": "胎儿期到青春期的发育规律与评定", "p": ["发育遵循头尾、近远、整体到分化顺序", "关键期与里程碑（抬头、坐、爬、走、语）", "发育商（DQ）与筛查工具", "早产矫正月龄、高危儿监测"], "t": "儿童康复所有判断都以“矫正年龄 + 里程碑”为基准。", "kw": ["发育", "胎儿", "婴幼儿", "儿童发育", "青春期", "学龄"], "d": [["怎么理解", "p", "发育是「按顺序出现的里程碑」。儿童康复的第一件事不是治疗，而是判断「这个孩子落后了没有、落后在哪个能区」——所以里程碑与关键期必须背熟。"], ["逐条展开", "ul", ["发育规律：头尾方向（先会抬头再会走）、近端到远端（先会抬臂再会抓握）、整体到分化、由粗到细。", "关键期：0—3 岁脑发育最快，语言关键期约 0—6 岁；错过关键期不是不能学，而是效率下降。", "粗大运动里程碑：2 月抬头、4—6 月翻身、6—8 月独坐、8—10 月爬、10—12 月扶站、12—15 月独走。", "精细运动：3—4 月抓握、6—7 月换手、9—10 月拇食指对捏、18 月叠 2—3 块积木、3 岁画圆。", "语言：3 月咿呀、6—9 月无意义音节、1 岁有意识叫爸妈、2 岁 50 词 + 两词句、3 岁短句可懂。"]], ["提示", "p", "判断「发育迟缓」的常用线：3 月不会抬头、6 月不会翻身、9 月不会独坐、18 月不会独走、2 岁无有意义单词——任一条都建议转诊评估。"]]}, {"k": "pd-zhong", "n": "评定总论与形态/反射", "c": "评定的目的、流程与人体形态、反射检查", "p": ["评定三问：能不能、差多少、为什么", "形态：长度、围度、姿势、脊柱曲度", "反射：深浅反射、病理反射、脑膜刺激征", "评定记录要能复查对比"], "t": "评定总论题答“目的—方法—结果解释—记录”四段。", "kw": ["评定", "形态", "反射", "姿势", "测量", "总论", "人体形态"], "d": [["怎么理解", "p", "评定不是「做检查」，而是回答三个问题：能不能（能力）、差多少（量化）、为什么（原因）。总论要记住评定的流程与「信度、效度、灵敏度、特异度」这四个质量指标。"], ["逐条展开", "ul", ["流程：采集病史 → 观察与视诊 → 选择量表 → 实施 → 记录与解释 → 定目标 → 复评。", "评定三问：能不能（有无障碍）、差多少（程度/分级）、为什么（原因与机制）。", "四个质量指标：信度（重复测一致）、效度（测的是想测的）、灵敏度（有病能查出）、特异度（没病不误判）。", "人体形态：长度（下肢真/假性短缩）、围度（肌萎缩、水肿）、姿势（脊柱侧弯、骨盆倾斜）。", "反射检查：深反射（腱反射，分级 0—4+）、浅反射（腹壁、提睾）、病理反射（Babinski、Hoffmann、Chaddock）。"]], ["深反射分级", "table", [["分级", "表现"], ["0（−）", "消失"], ["1+", "减弱，需加强法"], ["2+", "正常"], ["3+", "增强，无阵挛"], ["4+", "亢进，伴阵挛"]]], ["提示", "p", "评定记录最容易失分的是「只写结果不写条件」：ROM 要写主动/被动与体位，肌力要写体位与是否抗阻，反射要写是否加强法。"]]}, {"k": "pd-jili", "n": "肌力评定", "c": "MMT 与等速/握力等定量方法", "p": ["MMT 0—5 级判断标准与体位固定", "等长、等张、等速测试的适用与差异", "握力计、背力计、便携式测力", "禁忌：骨折未稳、术后早期、疼痛剧烈"], "t": "MMT 的 3 级与 4 级最容易混：能否抗重力、能否抗阻力。", "kw": ["肌力", "MMT", "徒手肌力", "等速", "握力"], "d": [["怎么理解", "p", "肌力评定是康复的「血糖仪」：所有力量训练、术后负重、出院标准都靠它量化。MMT 是床旁筛查，等速与握力是精确计量，两者不能互相替代。"], ["逐条展开", "ul", ["MMT 0—5 级：0 无收缩、1 有收缩无运动、2 消除重力可动、3 抗重力可动、4 抗部分阻力、5 正常。", "3 级与 4 级的分界是「能不能抗阻力」，不是「能不能动」——这是最常错的地方。", "等速测试：角速度设定（60°/s 测力量、180°/s 测耐力），输出峰力矩、总功、疲劳指数。", "握力计：握力体重指数（握力/体重）低于 0.5 提示肌少症风险（不同标准略有差异）。", "徒手肌力测定的信度在 3—4 级之间较差，进展判断建议用「同一测试者 + 同一体位 + 定量工具」。"]], ["提示", "p", "考试爱问「MMT 3 级和 4 级的区别」：3 级能抗重力完成全范围但不能抗阻力；4 级能抗一定阻力但弱于健侧。答「能动就是 3 级」是错的。"]]}, {"k": "pd-jizhangli", "n": "肌张力评定", "c": "肌张力的定义、Ashworth 分级与痉挛处理思路", "p": ["肌张力是静息状态下的肌肉阻力", "改良 Ashworth 0—4 级（含 1+）", "痉挛与僵硬、齿轮样、折刀样的区别", "评定要固定体位与速度，减少主观误差"], "t": "1+ 级是高频考点：ROM 后 1/2 出现阻力。", "kw": ["肌张力", "Ashworth", "痉挛", "僵硬", "张力"], "d": [["怎么理解", "p", "肌张力是「静息状态下的肌肉阻力」，不是力量。增高（痉挛、强直）与降低（弛缓）都会破坏运动控制；评定的目的是决定「要不要降张力、怎么降」。"], ["逐条展开", "ul", ["定义：被动活动肢体时感受到的阻力；与肌力是两个维度，可同时存在（如痉挛 + 无力）。", "Ashworth 分级 0—4：0 无增高、1 轻微增高（被动屈伸末端有阻力）、1+ 阻力小于一半范围、2 明显增高但被动活动容易、3 显著增高被动活动困难、4 僵直。", "改良 Ashworth（MAS）与原始 Ashworth 的差别在 1+ 这一级；临床多用 MAS。", "痉挛的处理顺序：先找诱因（疼痛、压疮、尿潴留、便秘、感染）→ 体位与牵伸 → 药物（巴氯芬、替扎尼定、肉毒毒素）→ 手术。", "肌张力评定要写「哪块肌、哪个方向、速度」——快速被动活动诱发的阻力才是痉挛的特征（速度依赖）。"]], ["提示", "p", "案例题给「下肢僵直、被动活动阻力大、快速活动更明显」，答痉挛（速度依赖）；若阻力均匀、铅管样，答强直（锥体外系）。"]]}, {"k": "pd-rom", "n": "关节活动度评定", "c": "ROM 测量方法与记录", "p": ["量角器三要素：轴心、固定臂、移动臂", "主动 ROM 与被动 ROM 的差值意义", "各关节正常参考值与测量体位", "记录格式：关节-运动-角度-体位"], "t": "主动<被动提示肌无力或疼痛；两者均限制提示关节本身。", "kw": ["关节活动度", "ROM", "量角器", "活动范围"], "d": [["怎么理解", "p", "关节活动度是康复里最客观、最可重复的指标之一：量角器一放，度数就是度数。关键在于测法标准化——体位、固定、轴心、量角器两臂怎么摆。"], ["逐条展开", "ul", ["主动 ROM（AROM）与被动 ROM（PROM）：AROM < PROM 提示肌力不足或疼痛；两者都小提示关节/软组织挛缩。", "测量三要素：轴心对准关节中心、固定臂对准近端骨、移动臂对准远端骨；读数为移动臂与固定臂夹角。", "记录格式：关节 + 方向 + 主动/被动 + 度数 + 有无疼痛（如「右膝屈 AROM 0—110°，末端痛」）。", "常见受限原因：关节囊挛缩、肌肉短缩、瘢痕粘连、骨性阻挡、疼痛保护性痉挛。", "干预对应：关节松动（关节源性）、牵伸（肌源性）、瘢痕松解（软组织）、镇痛后训练（疼痛性）。"]], ["提示", "p", "「主动 90°、被动 130°」这种差距要写清是肌力问题还是疼痛；只写一个数等于没评。"]]}, {"k": "pd-pingheng", "n": "平衡与协调评定", "c": "平衡分级、Berg/TUG 与协调测试", "p": ["静态、动态、反应性平衡三类", "支撑面、重心、感觉整合（视/前庭/本体）", "Berg（0—56）、TUG、单腿站立、功能性前伸", "协调：指鼻、跟膝胫、快速轮替"], "t": "Berg 分级线：<45 跌倒风险明显升高。", "kw": ["平衡", "协调", "Berg", "TUG", "跌倒"], "d": [["怎么理解", "p", "平衡不是「站得稳」，而是「在支撑面内控制重心」的能力。评定要分三级：静态（坐着/站着不动）、动态（主动移动重心）、反应性（被打扰后恢复）。"], ["逐条展开", "ul", ["平衡三要素：感觉输入（视觉、前庭、本体觉）、中枢整合、运动输出（肌力、ROM、协调）。", "支撑面（BOS）越大越稳；重心（COG）投影必须落在 BOS 内，摆动越少越好。", "Berg 平衡量表（BBS）14 项、56 分：<45 分跌倒风险升高，<40 分建议辅具/监护。", "TUG（起立—行走 3 米—返回）：≥12 秒提示跌倒风险，≥20 秒提示需辅助。", "协调：指鼻试验、跟膝胫试验、轮替动作；共济失调与平衡障碍要分开写。"]], ["提示", "p", "考「Berg 45 分意味着什么」：提示跌倒风险增加、需要评估辅具；不要答「正常」。"]]}, {"k": "pd-butai", "n": "步态分析", "c": "步态周期、时空参数与异常步态识别", "p": ["步态周期与各期占比（支撑 60%、摆动 40%）", "时空参数：步长、步频、步速、步宽、对称性", "定性（观察/视频）与定量（三维、足印、压力）", "常见异常：偏瘫、剪刀、跨阈、鸭步、疼痛步态"], "t": "先看对称性与步速，再看具体关节角度。", "kw": ["步态", "步行", "足印", "三维", "行走"], "d": [["怎么理解", "p", "步态分析是把「走路」拆成可测的周期与参数。正常步态是一个「稳定的失衡—再稳定」循环：每一步都在重心前移后靠支撑腿接住。"], ["逐条展开", "ul", ["步态周期：支撑相约占 60%、摆动相约 40%；双支撑期在正常步速下约 10%。", "时空参数：步长（同侧两次着地）、步幅（左右各一步）、步频（约 100—120 步/分）、步速（成人约 1.2—1.4 m/s）。", "关节运动要点：髋屈伸、膝屈曲（支撑相早期缓冲、摆动相屈曲过足）、踝背屈（足廓清）与跖屈（蹬离）。", "常见异常：跨阈步态（足下垂）、划圈步态（偏瘫伸肌模式）、臀中肌步态（Trendelenburg）、帕金森慌张步态、共济失调步态。", "分析工具：肉眼观察（关节角度与时相）→ 足印法/计时 → 三维步态分析（科研与复杂病例）。"]], ["提示", "p", "看到「足下垂 + 跨阈」先想腓总神经损伤或胫前肌无力；看到「划圈 + 上肢屈曲」想偏瘫共同运动模式。"]]}, {"k": "pd-adl", "n": "ADL、生活质量与环境评定", "c": "日常生活能力、参与与环境因素评定", "p": ["Barthel/MBI（0—100）与 FIM（18 项）差异", "IADL：购物、做饭、理财、用药", "生活质量：SF-36、WHOQOL", "环境：家居、无障碍、社区资源"], "t": "Barthel 分级的四个界值要背：60、40、20。", "kw": ["ADL", "日常生活", "生活质量", "社会功能", "环境评定", "Barthel", "FIM"], "d": [["怎么理解", "p", "ADL 是康复的「结果指标」——治疗做得再漂亮，患者能不能自己穿衣、上厕所、出门，才是他要的答案。Barthel 指数是最常用的床旁工具，简单、可重复、能算分。"], ["逐条展开", "ul", ["ADL 分基础 ADL（BADL：吃、穿、洗漱、如厕、转移、行走）与工具性 ADL（IADL：购物、做饭、打电话、理财、乘车）。", "Barthel 指数 10 项、满分 100：进食 10、洗澡 5、修饰 5、穿衣 10、大便 10、小便 10、如厕 10、床椅转移 15、平地行走 15、上下楼梯 10。", "分档：100 自理；61—99 轻度依赖；41—60 中度；21—40 重度；≤20 完全依赖。", "生活质量：SF-36、WHOQOL-BREF；参与：CHART、LIFE-H；环境：CHIEF、家居环境评估表。", "评 ADL 要问「实际怎么做」而不是「能不能做」——很多患者能走但报告「不出门」，那是环境与信心问题。"]], ["提示", "p", "Barthel 的两个 15 分项（转移与行走）最容易记混；考试若给分档，记得 60 分是「中度依赖」的分界（41—60 中度）。"]]}, {"k": "pd-renzhi", "n": "认知评定", "c": "注意、记忆、执行与筛查工具", "p": ["定向、注意、记忆、语言、视空间、执行六域", "MMSE（30 分）与 MoCA（30 分）的敏感度差异", "成套测验：RBMT、WCST、连线测验", "意识障碍：GCS 与 CRS-R"], "t": "MoCA 对轻度认知障碍更敏感，教育年限要校正。", "kw": ["认知", "MMSE", "MoCA", "记忆", "注意", "执行"], "d": [["怎么理解", "p", "认知评定决定「这个人能不能学会训练动作」。注意力不集中，教十遍也记不住；执行功能差，回家就出危险。所以认知筛查要放在康复早期，而不是出院前。"], ["逐条展开", "ul", ["认知域：注意、记忆、执行功能、语言、视空间、定向、计算、判断。", "筛查工具：MMSE（30 分，受教育年限影响）、MoCA（30 分，对轻度认知障碍更敏感，<26 提示异常）。", "注意：数字广度、划消试验；记忆：词语回忆、Rivermead 行为记忆测验。", "执行功能：连线测验（TMT-A/B）、Stroop、威斯康星卡片分类（WCST）。", "评定的前提是「能听见、能看见、能配合」：先排除听力、视力、失语、抑郁、谵妄。"]], ["提示", "p", "MoCA 与 MMSE 的区别常考：MoCA 对轻度认知障碍与血管性认知障碍更敏感，但受教育程度影响更大；筛查阳性要结合功能判断，不能直接下痴呆诊断。"]]}, {"k": "pd-yanyu", "n": "言语语言评定", "c": "失语、构音、嗓音与吞咽的评定框架", "p": ["失语：WAB、ABC、波士顿诊断性失语检查", "构音：Frenchay、音节清晰度", "嗓音：GRBAS、声学分析", "吞咽：洼田饮水、VFSS、FEES"], "t": "先分“语言（失语）”与“言语（构音）”两件事。", "kw": ["言语", "语言", "失语", "构音", "评定", "WAB"], "d": [["怎么理解", "p", "言语语言评定要先把「说不好」拆成三类：失语（语言中枢问题，听不懂/说不出/命名差）、构音障碍（发音器官执行问题，说得含糊）、嗓音障碍（声带与气息问题，声音嘶哑）。三类的训练完全不同。"], ["逐条展开", "ul", ["失语评定：自发语（流畅/非流畅）、听理解、复述、命名、阅读、书写六项；常用 WAB、波士顿诊断性失语检查（BDAE）。", "失语分类速记：Broca（非流畅、理解较好、复述差）、Wernicke（流畅、理解差、复述差）、传导性（复述最差）、经皮质（复述好）、命名性（只有命名差）。", "构音障碍：查呼吸、发声、共鸣、构音（唇舌齿腭）、韵律五环节；Frenchay 构音障碍评定常用。", "嗓音：GRBAS 听感评估（总嘶哑度、粗糙、气息、无力、紧张）+ 声学分析（基频、jitter、shimmer）。", "吞咽：反复唾液吞咽试验、洼田饮水试验、VFSS（金标准）、FEES。"]], ["提示", "p", "「复述差」是失语分类的关键线索：复述差 → Broca/Wernicke/传导性；复述好 → 经皮质或命名性。"]]}, {"k": "pd-xinfei", "n": "心肺功能评定", "c": "心功能、肺功能与运动试验", "p": ["心功能分级（NYHA）、6MWT、心肺运动试验", "肺功能：FEV1、FVC、MVV", "运动试验终止指征与禁忌", "监护指标：心率、血压、SpO₂、Borg"], "t": "6MWT 的禁忌与终止指征是高频考点。", "kw": ["心肺功能", "6MWT", "运动试验", "肺功能", "心功能"], "d": [["怎么理解", "p", "心肺评定回答两个问题：现在能承受多大运动量（安全边界），以及哪里限制了运动（心、肺还是肌肉）。前者决定处方强度，后者决定干预方向。"], ["逐条展开", "ul", ["心功能：NYHA 分级（I—IV）、6 分钟步行试验（6MWT，<300 m 提示预后差）、心肺运动试验（CPET 测峰值摄氧量）。", "肺功能：FVC、FEV1、FEV1/FVC（<0.7 提示阻塞）、MVV；COPD 按 GOLD 分级（FEV1 占预计值）。", "呼吸肌力量：最大吸气压（MIP）、最大呼气压（MEP）。", "运动试验终止指征：胸痛、明显心电图改变、血压异常、严重气促、头晕、患者要求停止。", "康复常用替代指标：Borg 评分（6—20）、说话试验、心率储备法（目标心率 = 静息 + 40—60% ×（最大 − 静息））。"]], ["提示", "p", "心衰患者做 6MWT 前后要测血压、心率、血氧与 Borg 评分；只报「走了 350 米」不报前后生命体征，等于没做安全评估。"]]}, {"k": "pd-dianshengli", "n": "神经电生理", "c": "肌电图、神经传导与诱发电位", "p": ["EMG：静息/轻收缩/重收缩三相", "NCV：运动与感觉传导，潜伏期与波幅", "SEP、MEP、VEP、BAEP 的用途", "判断：轴索损害 vs 脱髓鞘"], "t": "波幅降→轴索；潜伏期延→脱髓鞘。", "kw": ["电生理", "肌电图", "NCV", "诱发电位", "神经传导"], "d": [["怎么理解", "p", "神经电生理是「活的解剖」：肌电图告诉你哪块肌肉失神经，神经传导告诉你哪条神经断了、断得重不重，诱发电位告诉你通路通不通。康复里主要用它定损伤程度、判断预后、指导辅具。"], ["逐条展开", "ul", ["肌电图（EMG）：静息时找纤颤电位/正锐波（失神经）、插入电位延长；轻收缩看运动单位电位（时限、波幅），重收缩看募集型（单纯相/混合相/干扰相）。", "神经传导（NCS）：运动传导测潜伏期、波幅、传导速度；感觉传导测 SNAP。轴索损害以波幅下降为主，脱髓鞘以速度减慢为主。", "诱发电位：SEP（体感通路）、MEP（运动通路，经颅磁刺激）、BAEP（脑干听觉）、VEP（视觉）。", "常见结论：腕管综合征（正中神经远端潜伏期延长）、腓总神经损伤（趾短伸肌失神经 + 传导阻滞）、ALS（广泛失神经 + 传导正常）。", "评定时机：伤后 2—3 周做 EMG 最有价值（此时失神经电位已出现）。"]], ["提示", "p", "「波幅低、速度正常」= 轴索损害；「速度慢、波幅正常或轻度低」= 脱髓鞘。这一条能解大半电生理题。"]]}, {"k": "zl-huodong", "n": "关节活动与牵伸技术", "c": "维持/改善 ROM 的手法与牵伸", "p": ["被动、主动、主动助力 ROM 训练", "牵伸：静态、动态、PNF、器械", "剂量：30 秒×3—5 次，温热后更有效", "禁忌：新鲜骨折、异位骨化、急性炎症"], "t": "牵伸前先热身；疼痛评分 >4 不做强力牵伸。", "kw": ["关节活动技术", "牵伸", "肌肉牵伸", "ROM训练", "软组织"], "d": [["怎么理解", "p", "关节活动技术是所有训练的「地基」：不能动，就谈不上练力量与走路。手法分两类——被动活动（维持/恢复活动度）与牵伸（拉长短缩的软组织），目的不同。"], ["逐条展开", "ul", ["被动关节活动（PROM）：完全由治疗师完成，用于昏迷、瘫痪、术后制动；作用是防挛缩、促滑液循环、维持本体觉输入。", "主动助力（AAROM）与主动（AROM）：患者参与越多，神经肌肉收益越大；原则是「能主动就不助力」。", "牵伸三型：静态（保持 15—30 秒，重复 3—5 次）、动态（摆动，热身用）、PNF 牵伸（收缩—放松、保持—放松）。", "牵伸前要热身（热敷/低强度活动），牵伸时不应出现明显疼痛；「疼痛性牵伸」会引发保护性痉挛。", "禁忌：新鲜骨折、关节急性炎症、血肿、异位骨化活动期、严重骨质疏松、神经血管受压。"]], ["提示", "p", "考题常问「术后早期为什么不练 ROM 而要练等长」：早期目标是保护修复组织，ROM 训练会增加剪切力；等长收缩能在低剪切下维持肌力。"]]}, {"k": "zl-songsdong", "n": "关节松动与手法治疗", "c": "Maitland 分级与脊柱/四肢松动", "p": ["Maitland Ⅰ—Ⅴ 级判断", "附属运动：滚动、滑动、旋转的方向选择", "脊柱松动与神经松动术", "禁忌：不稳、肿瘤、感染、脊髓压迫"], "t": "Ⅴ 级是高速低幅（推扳），不是常规放松。", "kw": ["关节松动", "手法", "Maitland", "推拿", "松动术"], "d": [["怎么理解", "p", "关节松动是「在关节面上做的小幅度、节律性手法」，针对关节源性活动受限；它与牵伸（针对肌肉）是两件事。Maitland 四级是选择力度的标尺。"], ["逐条展开", "ul", ["Maitland 分级：I 级小幅度在起始端、II 级大幅度未到末端、III 级大幅度到末端、IV 级小幅度在末端；I—II 级止痛，III—IV 级改善活动度。", "常用技术：摆动（I—IV 级）、持续牵引、挤压、旋转、滑动（Kaltenborn 的 I—III 级滑移）。", "脊柱松动：颈椎后前位（PA）、腰椎 PA、旋转松动；四肢：肩关节前后向滑移、膝关节前后向滑移。", "适应证：关节僵硬、疼痛伴活动受限、退行性改变早期的活动度下降。", "禁忌/慎用：关节不稳、感染、肿瘤、骨折未愈、脊髓受压、严重骨质疏松、抗凝治疗中。"]], ["提示", "p", "「III 级和 IV 级的区别」常考：III 级是从中程到末端的大幅度，IV 级只在末端做小幅度；两者都用于改善活动度，但 IV 级更靠近终末感。"]]}, {"k": "zl-jili", "n": "肌力训练", "c": "力量训练的类型、强度与进阶", "p": ["等长/等张/等速训练的适用场景", "强度：1RM 的百分比与 RM 方案", "渐进抗阻（DeLorme/Oxford）与离心训练", "禁忌与监护：心血管反应、Valsalva"], "t": "术后早期多等长，中期等张，后期功能性。", "kw": ["肌力训练", "抗阻", "力量训练", "等速训练"], "d": [["怎么理解", "p", "肌力训练的核心是「超负荷 + 渐进 + 特异」：不给超过现有能力的负荷，肌肉不会变强；不按目标动作练，力量不会迁移到功能上。"], ["逐条展开", "ul", ["训练类型：等长（不产生运动）、等张（向心/离心）、等速（恒定角速度）、开链/闭链（OKC/CKC）。", "渐进抗阻（DeLorme）：10RM 的 50% 做 10 次 → 75% 做 10 次 → 100% 做 10 次，逐步加重。", "闭链训练（如深蹲）关节剪切力小、本体觉输入多，适合早期与下肢功能训练；开链（如坐位伸膝）更针对单块肌肉。", "神经肌肉电刺激（NMES）可在主动收缩不足时辅助；生物反馈提高募集。", "训练后 24—48 小时延迟性酸痛正常；若关节肿胀、疼痛持续超过 2 小时，说明负荷过量。"]], ["提示", "p", "「为什么早期用闭链不用开链」：闭链时关节面受压、剪切力相对小，且多关节协同，更接近功能动作；开链在关节不稳或术后早期可能增加剪切应力。"]]}, {"k": "zl-qianyin", "n": "牵引与悬吊", "c": "颈椎/腰椎牵引与悬吊训练", "p": ["牵引力、时间、体位三要素", "适应证：神经根型颈椎病、腰椎间盘突出", "禁忌：脊髓型、骨质疏松、肿瘤、妊娠", "悬吊：闭链训练与核心稳定"], "t": "牵引中出现新神经症状立刻停止。", "kw": ["牵引", "悬吊", "颈椎牵引", "腰椎牵引"], "d": [["怎么理解", "p", "牵引的本质是「拉开间隙、减轻压迫」：颈椎牵引拉开椎间孔与关节突关节，腰椎牵引拉开椎间隙、降低椎间盘内压。悬吊则是借助绳带减重，让患者在低负荷下完成动作。"], ["逐条展开", "ul", ["颈椎牵引：常用 体重的 7—10%（约 5—10 kg），坐位或仰卧，角度按病变节段调（上颈段略屈、下颈段略伸），每次 15—20 分钟。", "腰椎牵引：常用体重的 40—60%，间歇或持续，每次 20—30 分钟；急性椎间盘突出早期慎用。", "适应证：神经根型颈椎病、腰椎间盘突出症（非急性）、椎间孔狭窄、肌肉痉挛。", "禁忌：脊髓型颈椎病、椎体骨折/滑脱、严重骨质疏松、肿瘤/感染、孕妇、严重心肺疾病。", "悬吊训练（SET）：通过绳带减重与不稳定支撑，训练核心稳定与运动控制；常用于腰痛与肩痛。"]], ["提示", "p", "脊髓型颈椎病是牵引的绝对禁忌——出现「走路踩棉花感、手笨拙、腱反射亢进」先停牵引，转诊评估。"]]}, {"k": "zl-zhuanyi", "n": "转移与步行训练", "c": "床—椅—厕转移与步行辅助", "p": ["转移：独立、辅助、机械三类", "偏瘫转移的技巧侧（健侧带动）", "步行训练：平行杠—助行器—拐—独立", "拐杖高度与三点/四点步"], "t": "偏瘫患者“健侧先动”的规则要能举例。", "kw": ["转移", "步行训练", "体位转移", "助行", "拐"], "d": [["怎么理解", "p", "转移与步行训练解决「从床上到厕所」这一段路。原则只有一句话：让患者用残存能力做最大程度的自主转移，治疗师的手只是「保险」而不是「起重机」。"], ["逐条展开", "ul", ["转移方式：床—椅（站起-转身-坐下）、床—轮椅（侧移/滑板）、轮椅—厕、地面—椅（跌倒后起身）。", "偏瘫患者转移：健侧靠近目标、健手支撑、患腿负重；治疗师站在患侧保护。", "截瘫患者：C6 以下可做支撑转移，T4 以上需评估体位性低血压。", "步行训练顺序：平行杠内 → 助行器 → 拐杖 → 独立；先练站立平衡与重心转移，再练迈步。", "拐杖使用：三点步（一侧下肢不能负重）、四点步（稳定但慢）、两点步（快）、摆至/摆过步（截瘫）。"]], ["提示", "p", "「患侧还是健侧靠近床」是高频考点：转移时健侧靠近目标、健手支撑；治疗师保护患侧。"]]}, {"k": "zl-shenjing", "n": "神经发育疗法与运动再学习", "c": "Bobath、PNF、Brunnstrom、MRP、MCIMT", "p": ["Bobath：抑制异常模式、促通正常运动", "PNF：对角线模式、节律启动、收缩-放松", "Brunnstrom 六阶段与协同运动", "运动再学习（MRP）与强制性使用（MCIMT）"], "t": "各疗法共同的底层是“任务导向 + 大量重复”。", "kw": ["神经发育", "Bobath", "PNF", "Brunnstrom", "运动再学习", "强制性使用", "易化"], "d": [["怎么理解", "p", "神经发育疗法是一组「利用神经可塑性重塑运动模式」的方法，不是四套互斥的技术。共同底层是三件事：任务导向、大量重复、感觉输入。差别在于「从哪切入」。"], ["逐条展开", "ul", ["Bobath（NDT）：抑制异常模式、促通正常运动；强调关键点控制（躯干、肩胛、骨盆）与「不让患者练错」。", "PNF：对角线模式（D1/D2 屈伸）、节律启动、等张组合、收缩—放松、保持—放松；利用牵伸与阻力促进。", "Brunnstrom：按恢复六阶段训练，利用共同运动与联合反应「借力」再逐步脱离。", "运动再学习（MRP）：把动作拆成任务成分，练缺失成分再整合；强调闭链、真实任务与反馈。", "强制性使用（CIMT）：限制健手、强制用患手，适用于卒中后 3—6 个月、有一定主动伸展的患者。"]], ["Brunnstrom 六阶段", "table", [["阶段", "表现"], ["I", "弛缓，无随意运动"], ["II", "出现联合反应/共同运动雏形"], ["III", "共同运动可随意完成（屈肌/伸肌模式）"], ["IV", "出现部分分离运动（如手触腰后）"], ["V", "分离运动更明显（如伸肘时前臂旋前）"], ["VI", "接近正常，协调性略差"]]], ["提示", "p", "CIMT 的三个门槛常考：患侧腕背伸 ≥10°、指伸 ≥10°、无明显忽略；不满足就做改良版（mCIMT）。"]]}, {"k": "zl-wuli", "n": "物理因子治疗", "c": "电、光、声、热、磁、水、冷、压力的应用与禁忌", "p": ["低频/中频/高频电疗的作用深度与适应证", "超声波、激光、红外/紫外", "热疗与冷疗的生理反应与时机", "禁忌：恶性肿瘤局部、出血倾向、心脏起搏器、感觉丧失区"], "t": "物理因子题最爱考禁忌证，先背禁忌再背适应证。", "kw": ["电疗", "光疗", "超声波", "传导热", "磁疗", "水疗", "冷疗", "物理因子", "冷冻", "压力治疗"], "d": [["怎么理解", "p", "物理因子是「不开药的治疗」：电、光、声、热、磁、水、冷、压力各有靶组织与禁忌。考试与临床都要先问「这个因子的剂量与禁忌是什么」。"], ["逐条展开", "ul", ["电疗：直流电（离子导入）、低频（TENS 止痛、NMES 肌力）、中频（干扰电、调制中频）、高频（短波、微波，深部产热）。", "光疗：红外线（浅表热）、紫外线（杀菌、促愈合）、激光（低强度激光促修复）。", "超声：0.8—3 MHz，深度越深频率越低；用于软组织粘连、瘢痕、疼痛；禁用于心前区、孕妇腹部、骨骺、眼球。", "热疗：蜡疗、热敷、超短波；冷疗：冰敷、冷浴（急性期消肿止痛）。", "水疗：利用浮力减重、温热放松；压力治疗：气压泵、压力衣（淋巴水肿、瘢痕）。"]], ["高频电疗禁忌", "table", [["项目", "要点"], ["绝对禁忌", "恶性肿瘤局部、出血倾向、心脏起搏器、孕妇腹部、金属植入物局部（部分）"], ["慎用", "感觉障碍区、急性感染、严重心肺疾病"], ["操作", "去除金属饰品、干燥皮肤、患者不得移动"]]], ["提示", "p", "「超声能不能用在孕妇腹部/心前区/眼球」是标准送分题：都不能。频率越高作用越浅，这是另一条常考点。"]]}, {"k": "zl-shengwu", "n": "生物反馈、冲击波与神经调控", "c": "反馈训练、体外冲击波、经颅磁/直流电", "p": ["肌电生物反馈用于再教育与放松", "冲击波：肌腱病、骨不连、足底筋膜炎", "rTMS/tDCS 用于卒中后运动与抑郁", "禁忌：起搏器、癫痫史、颅内金属"], "t": "冲击波不是“哪里痛打哪里”，要打在病变组织。", "kw": ["生物反馈", "冲击波", "经颅", "磁刺激", "电刺激"], "d": [["怎么理解", "p", "这一组是「用信号或能量去调神经」：生物反馈把看不见的生理信号变成看得见的反馈，冲击波用机械能松解组织，经颅磁/直流电直接调节皮层兴奋性。"], ["逐条展开", "ul", ["生物反馈：肌电、压力、角度反馈；用于卒中后腕伸、盆底肌、吞咽、痉挛放松。", "体外冲击波（ESWT）：聚焦/放射状，能量 0.1—0.3 mJ/mm²，用于网球肘、跟痛症、钙化性肌腱炎、骨折不愈合。", "重复经颅磁刺激（rTMS）：高频（≥5 Hz）兴奋患侧皮层、低频（≤1 Hz）抑制健侧皮层，用于卒中后运动与失语。", "经颅直流电（tDCS）：阳极兴奋、阴极抑制，电流 1—2 mA，20 分钟；注意电极位置与皮肤。", "禁忌：癫痫病史、颅内金属、心脏起搏器、妊娠、颅骨缺损（局部）。"]], ["提示", "p", "rTMS 的「高频兴奋、低频抑制」是高频考点；注意是「刺激侧」与「抑制健侧」的组合，别写反。"]]}, {"k": "zl-tieza", "n": "贴扎与压力治疗", "c": "肌内效贴、白贴与压力衣", "p": ["贴扎方向决定促通/抑制/支持", "压力治疗用于瘢痕、水肿、淋巴", "压力梯度：远高近低", "皮肤检查与过敏监测"], "t": "贴扎是辅助，不替代训练。", "kw": ["贴扎", "压力衣", "压力治疗", "压力疗法", "肌内效"], "d": [["怎么理解", "p", "贴扎与压力治疗都是「用外部材料改内部力学或循环」：肌内效贴改变皮肤与筋膜的滑动、提供感觉输入；白贴限制关节；压力衣给瘢痕与水肿一个持续的压力梯度。"], ["逐条展开", "ul", ["肌内效贴（K-tape）：拉力 0—25%（感觉/循环）、25—50%（肌肉促进/抑制）、50—75%（力学矫正）；贴法有 I/Y/X/爪形。", "白贴（运动贴）：限制关节活动度、保护韧带，用于踝扭伤防护、肩关节不稳。", "压力治疗：压力衣 15—25 mmHg（瘢痕）、淋巴水肿用多层绷带/气压泵；压力应「远端大、近端小」。", "禁忌：皮肤破损、感染、过敏、深静脉血栓急性期、心衰（大量加压）。", "贴扎不是「贴了就好」：贴布 3—5 天更换，出现瘙痒、水泡立即去除。"]], ["提示", "p", "压力治疗的方向常考：远端压力大于近端，形成梯度，才能把液体往回推；反过来会加重水肿。"]]}, {"k": "zl-xinfei", "n": "心肺训练与运动处方", "c": "有氧训练、呼吸训练与 FITT 处方", "p": ["FITT：频率、强度、时间、类型", "强度：心率储备法、Borg、无氧阈", "呼吸训练：缩唇、腹式、排痰", "监护与终止指征"], "t": "处方必须写出强度依据（心率/功率/Borg）。", "kw": ["心肺功能训练", "运动处方", "有氧", "呼吸训练", "耐力"], "d": [["怎么理解", "p", "心肺训练用 FITT 框架开处方：频率、强度、时间、类型。核心是有氧 + 抗阻 + 呼吸训练三件套，强度靠心率储备或 Borg 评分定。"], ["逐条展开", "ul", ["有氧：每周 3—5 次、40—60% 心率储备起步、20—40 分钟、快走/功率车/上肢功率车。", "抗阻：每周 2—3 次、60—70% 1RM、8—12 次 × 2—3 组，注意瓦氏动作（憋气）要避免。", "呼吸训练：缩唇呼吸（COPD）、腹式呼吸、呼吸肌训练（阈负荷装置，30% MIP 起步）。", "运动强度监测：心率、Borg 12—14（稍累）、说话试验、血氧（<88% 停止）。", "住院期早期活动：床上踝泵 → 坐起 → 床边站 → 步行；术后（CABG/瓣膜）按胸骨愈合分期限制上肢负重。"]], ["提示", "p", "「缩唇呼吸为什么有效」：增加气道内压、防止小气道过早塌陷、延长呼气，改善气体陷闭——答这三句即可。"]]}, {"k": "zl-vr", "n": "虚拟现实与康复机器人", "c": "VR、外骨骼、上肢/下肢机器人", "p": ["VR 提供任务重复与即时反馈", "外骨骼：步态训练、减重", "机器人：上肢、手、踝", "证据：剂量与强度是疗效关键"], "t": "技术章节答题要落到“训练剂量与适应证”。", "kw": ["虚拟现实", "机器人", "外骨骼", "VR"], "d": [["怎么理解", "p", "VR 与机器人解决的是「重复量」与「趣味性」：卒中康复需要上千次重复，人盯不住，机器可以；虚拟场景把枯燥的重复变成游戏，提高参与度。"], ["逐条展开", "ul", ["VR 分类：沉浸式（头显）、半沉浸式（大屏/投影）、非沉浸式（平板）；康复多用半沉浸与平板。", "适用：上肢功能、平衡与步态、认知训练、恐惧回避（如卒中后怕走路）。", "外骨骼：下肢外骨骼用于脊髓损伤、卒中步态训练；上肢外骨骼用于肩肘腕。", "末端执行器机器人（如 MIT-Manus 类）vs 外骨骼（关节对齐要求高）：前者结构简单、后者更接近生理运动。", "证据与限制：对上肢功能有中等证据；对步行独立性的证据仍在积累；成本高、需治疗师在场。"]], ["提示", "p", "VR 的禁忌常考：严重认知障碍不能配合、癫痫（部分沉浸式）、严重眩晕、皮肤破损处佩戴设备。"]]}, {"k": "ot-gailun", "n": "作业治疗概论与 ADL 训练", "c": "作业表现、活动分析与 ADL 训练", "p": ["作业表现三要素：人、环境、作业", "活动分析：步骤分解与难度调整", "ADL 训练：进食、穿衣、洗漱、如厕、洗澡", "代偿与改造并重"], "t": "OT 的核心是“做事情”，不是“练动作”。", "kw": ["作业治疗", "ADL训练", "作业活动", "活动分析"], "d": [["怎么理解", "p", "作业治疗的核心不是「做手工」，而是「用有意义的作业活动恢复生活能力」。它的独特视角是「活动分析」：把一个任务拆成步骤、能力要求与环境条件，找出卡在哪一步。"], ["逐条展开", "ul", ["作业表现三要素：人（身体、认知、心理）、环境、作业活动；三者交互决定表现。", "活动分析：把「穿衣服」拆成坐稳、取衣、套患侧、拉过肩、系扣、整理；每步对应不同能力。", "ADL 训练原则：从患者最想做的活动开始、在真实环境练、逐步撤除辅助。", "治疗性作业活动：木工、编织、园艺、书法——目的在训练成分（力量、协调、认知），不是产出作品。", "OT 与 PT 的分工：PT 管「能不能动」，OT 管「能不能做生活里的事」。"]], ["提示", "p", "问「OT 与 PT 的区别」不要答「一个上肢一个下肢」；正确答案是「PT 以运动功能与移动为主，OT 以日常生活活动、认知与参与为主」。"]]}, {"k": "ot-shou", "n": "手与上肢功能", "c": "手功能评定与 OT 训练", "p": ["抓握类型：柱状、球状、钩状、捏", "评定：ARAT、九孔柱、握力/捏力", "训练：镜像、任务练习、支具", "水肿与瘢痕管理"], "t": "手外伤早期防挛缩，后期练精细。", "kw": ["手功能", "上肢", "抓握", "支具", "手外伤"], "d": [["怎么理解", "p", "手是「精细动作的执行器」，也是康复里最难恢复的部分。评手要看三件事：能不能抓（力量）、能不能捏（精细）、能不能用（协调与感觉）。"], ["逐条展开", "ul", ["抓握模式：柱状、球状、钩状、侧捏、指腹捏、三指捏、掌指捏。", "评定：握力（Jamar）、捏力（三指/侧捏）、九孔柱试验（灵活度）、盒块试验、Purdue 钉板。", "手功能分级（偏瘫常用）：Brunnstrom 手分期、Fugl-Meyer 上肢部分、ARAT。", "训练：任务导向（拿杯子、系扣、开瓶）、镜像治疗、CIMT、感觉再训练（触觉辨别、脱敏）。", "支具：腕手矫形器（WHS）保持功能位、防挛缩；动态支具辅助伸展。"]], ["提示", "p", "「九孔柱试验测什么」：手指灵活度与手眼协调，不是力量；力量用握力计/捏力计。"]]}, {"k": "ot-gantong", "n": "感觉统合", "c": "感觉统合理论与训练", "p": ["前庭、本体、触觉三大系统", "失调表现：过敏、迟钝、寻求", "训练：秋千、滑板、触觉箱", "儿童多见，成人用于感觉再教育"], "t": "感觉统合是 OT 的专有评估域，别与知觉训练混。", "kw": ["感觉统合", "前庭", "本体", "触觉"], "d": [["怎么理解", "p", "感觉统合（SI）是「大脑把触觉、前庭、本体觉等输入组织起来并做出适应反应」的能力。SI 训练主要用在儿童（感统失调、孤独症、ADHD），成人用得少。"], ["逐条展开", "ul", ["三大基础感觉：触觉（辨别与防御）、前庭觉（平衡与重力安全）、本体觉（身体位置与用力）。", "失调表现：触觉防御（怕标签、怕理发）、前庭敏感（怕荡秋千）、本体觉寻求（撞、跳、咬）。", "训练器材：秋千、滑板、蹦床、触觉箱、重力背心；原则是「以儿童为主导、有挑战但可成功」。", "Ayres 感觉统合理论强调「适应性反应」——不是单纯给刺激，而是让孩子在挑战中组织反应。", "证据边界：对孤独症的核心症状证据有限，主要改善感觉处理与参与；不要夸大疗效。"]], ["提示", "p", "考题若给「怕剪指甲、怕洗头、挑食」，先想触觉防御；给「转圈不晕、爱撞墙」，想前庭/本体觉寻求。"]]}, {"k": "ot-fuju", "n": "辅助器具、环境与职业康复", "c": "辅具适配、环境改造与重返工作", "p": ["辅具：自助具、助行、轮椅、矫形器", "环境：家居、无障碍、工作场所", "职业康复：工作分析、岗位调整、渐进复工", "适配流程：评定—试用—随访"], "t": "辅具选配先看“目标活动”，再看器材参数。", "kw": ["辅助器具", "助行器", "环境调适", "职业康复", "自助具", "无障碍", "轮椅"], "d": [["怎么理解", "p", "辅助器具是把「做不到」变成「换个方式做到」：一把加粗的勺子、一个马桶增高器、一根拐杖，常常比训练更快改善生活。适配的核心是「人—具—环境」三者匹配。"], ["逐条展开", "ul", ["分类：助行（拐杖、助行器）、生活自助具（加粗柄、长柄取物器、穿袜器）、轮椅、矫形器、沟通辅具、环境改造。", "选择顺序：先环境改造（坡道、扶手）→ 再自助具 → 最后才是高成本设备。", "轮椅：手动（轻量、可折叠）、电动（长距离、上肢无力）；座宽、座深、靠背高度要量体裁衣，防压疮。", "职业康复：工作分析 → 岗位调整/辅具 → 渐进复工；目标不是「回去上班」一句话，而是具体岗位任务。", "随访：辅具用 1—2 周后要复查（压疮、疼痛、是否真的在用）；不用等于没配。"]], ["提示", "p", "「先训练还是先配辅具」没有绝对答案：以「安全 + 早期参与」为原则——能练就练，但别为了练而让患者困在家里。"]]}, {"k": "st-shiyu", "n": "失语症", "c": "失语类型、评定与训练", "p": ["Broca、Wernicke、传导、命名、完全性", "评定：WAB、ABC、自发语言/理解/复述/命名", "训练：Schuell 刺激法、旋律语调、交流板", "预后：病因、病灶、年龄、动机"], "t": "复述好→传导性/命名性；复述差→Broca/Wernicke。", "kw": ["失语", "语言治疗", "WAB", "命名"], "d": [["怎么理解", "p", "失语是「语言中枢受损」导致的获得性语言障碍，不是智力下降，也不是构音问题。评定要回答三件事：哪几项语言功能受损（流畅度、理解、复述、命名）、是什么类型、日常沟通还剩多少。"], ["逐条展开", "ul", ["六项评定：自发语、听理解、复述、命名、阅读、书写；这六项决定失语类型。", "流畅 / 非流畅：非流畅（<50 词/分、费力、电报式）多为前部（Broca）；流畅（语量多但空洞、错语）多为后部（Wernicke）。", "复述是关键分水岭：复述差 → Broca、Wernicke、传导性失语；复述好 → 经皮质（运动/感觉/混合）与命名性。", "训练方法：语义治疗（词义网络）、语音治疗（音素）、旋律语调治疗（MIT，非流畅型）、交流板/手势（重度）、群体治疗。", "评定工具：WAB（失语商 AQ）、BDAE、中国康复研究中心汉语标准失语症检查（CRRCAE）。"]], ["四类速查", "table", [["类型", "流畅度", "理解", "复述"], ["Broca（运动性）", "非流畅", "较好", "差"], ["Wernicke（感觉性）", "流畅", "差", "差"], ["传导性", "流畅", "较好", "最差"], ["经皮质运动性", "非流畅", "较好", "好"], ["命名性", "流畅", "好", "好"]]], ["提示", "p", "「复述差 + 理解差 + 流畅」= Wernicke；「复述差 + 理解好 + 非流畅」= Broca；「复述好 + 命名差」先想命名性失语。"]]}, {"k": "st-gouyin", "n": "构音、嗓音、口吃与腭裂", "c": "运动性构音障碍与嗓音/流畅性", "p": ["构音：痉挛、弛缓、共济失调、混合型", "训练：口部运动、发音、韵律", "嗓音：GRBAS、共鸣、呼吸支持", "口吃：流畅性塑造与认知行为"], "t": "构音器官检查先看“能不能动”，再看“准不准”。", "kw": ["构音", "嗓音", "口吃", "腭裂", "发音"], "d": [["怎么理解", "p", "构音障碍是「发音动作的执行问题」：大脑、小脑、脑干或周围神经的病变让唇、舌、软腭、声带动作不准，但语言内容本身正常。与失语的最大区别是：他知道自己想说什么（理解与用词正常），只是说不清。"], ["逐条展开", "ul", ["五环节：呼吸（气息不足）、发声（声带闭合差）、共鸣（鼻音过重/不足）、构音（唇舌齿腭）、韵律（语调平板）。", "类型：痉挛型（上运动神经元，粗糙费力）、弛缓型（下运动神经元，鼻音重、气息声）、共济失调型（小脑，忽大忽小、节律乱）、运动过多/过少型（锥体外系）、混合型。", "评定：Frenchay 构音障碍评定（8 项）、言语清晰度（词/句可懂度）、口颜面检查（舌肌萎缩、震颤、软腭上抬）。", "训练：呼吸训练（腹式、延长呼气）、口部运动（唇舌操）、发音训练（音素—音节—词—句）、语速与韵律训练、代偿策略。", "器械辅助：语音放大器、交流板、AAC（重度）。"]], ["提示", "p", "「鼻音重 + 气息声 + 软腭上抬差」= 弛缓型（延髓/周围神经）；「说话费力 + 粗糙 + 腱反射亢进」= 痉挛型。"]]}, {"k": "st-tunyan", "n": "吞咽障碍", "c": "分期、筛查与训练", "p": ["四期：口腔准备、口腔、咽、食管", "筛查：洼田饮水；金标准 VFSS/FEES", "训练：门德尔松、超声门上吞咽、舌骨上肌训练", "安全：体位、食物质地、误吸征象"], "t": "进食体位与质地调整是最快见效的干预。", "kw": ["吞咽", "洼田", "VFSS", "FEES", "误吸"], "d": [["怎么理解", "p", "吞咽是「把食物安全送进胃」的四期动作，任何一期出问题都可能误吸。康复要做的第一件事不是训练，而是判断「现在能不能经口吃、吃什么性状、用什么姿势」。"], ["逐条展开", "ul", ["四期：口腔准备期（咀嚼、混唾液）、口腔期（舌推食物向后）、咽期（软腭上抬、喉上抬、会厌翻转、声门关闭、环咽肌开放）、食管期。", "筛查：反复唾液吞咽试验（30 秒内吞咽次数 <3 次提示异常）、洼田饮水试验（1—5 级）、EAT-10 问卷。", "金标准：VFSS（吞钡透视，可看误吸与残留）、FEES（纤维内镜，床旁可做）。", "训练：间接训练（冰刺激、舌肌力量、Shaker 训练、门德尔松手法）、直接训练（体位、食物性状、一口量）。", "食物性状：糊状→浓稠→稀薄，从最安全的一档开始；液体最易误吸（可用增稠剂）。"]], ["误吸危险信号", "ul", ["进食中咳嗽、声音变湿、血氧下降 3% 以上", "餐后发热、肺部感染反复", "咽部残留感、食物从鼻腔返流", "隐性误吸：无咳嗽但 VFSS 见造影剂入气道（最危险）"]], ["提示", "p", "「隐性误吸」是高频考点：没有咳嗽不代表安全；卒中后 3 天内建议全部筛查，吞咽筛查不过关禁经口进食。"]]}, {"k": "st-ertong", "n": "儿童语言与孤独症", "c": "语言发育迟缓、孤独症谱系的语言干预", "p": ["语言发育里程碑与迟缓判断", "孤独症：社交沟通、刻板行为", "干预：ESDM、PRT、AAC", "家长参与与自然环境训练"], "t": "先排除听力，再谈语言训练。", "kw": ["儿童语言", "孤独症", "语言发育迟缓", "AAC", "谱系", "听力障碍", "听力"], "d": [["怎么理解", "p", "儿童语言问题要分两层：语言本身（理解与表达）与言语动作（发音）。语言发育迟缓是「按顺序但在慢车道上」，孤独症谱系是「社交沟通动机与语用异常」，两者训练重点不同。"], ["逐条展开", "ul", ["语言发育迟缓（DLD）：理解与表达落后于同龄，但没有孤独症的核心社交缺陷；训练以「语言输入、扩充、情景教学」为主。", "孤独症谱系（ASD）：社交沟通缺陷 + 重复刻板行为 + 兴趣狭窄；语言训练重点在「沟通意图、轮流、共同注意」。", "筛查：语言里程碑（1 岁单词、2 岁两词句）、M-CHAT（18—24 月孤独症筛查）、听力检查必须先做。", "干预：早期密集行为干预（ESDM、ABA）、图片交换沟通系统（PECS）、家长培训（关键：家长是主力）。", "预后：越早干预越好（3 岁前最佳）；「贵人语迟」是最常见的延误借口。"]], ["提示", "p", "2 岁仍无有意义单词 = 语言发育迟缓的警戒线；但同时要看「有没有共同注意、指物、眼神」——这三样缺失要警惕孤独症。"]]}, {"k": "kf-shenjing", "n": "神经康复", "c": "脑卒中、颅脑损伤、脊髓损伤、帕金森病的康复", "p": ["脑卒中：急性期—恢复期—后遗症期三段管理", "脊髓损伤：ASIA、平面、并发症（压疮、痉挛、自主神经反射异常）", "颅脑损伤：意识、认知、行为", "帕金森：节律提示、姿势、冻结步态"], "t": "神经康复题按“评定—目标—方案—并发症”四段答。", "kw": ["脑卒中", "颅脑损伤", "脊髓", "帕金森", "神经康复", "偏瘫", "脑炎", "多发性硬化", "吉兰", "癫痫", "阿尔茨海默", "痴呆"], "d": [["怎么理解", "p", "神经康复是康复里最大的板块，因为它同时具备「发病率高、致残率高、可塑性强」三个特点。核心思路是：急性期防并发症，恢复期抢功能，后遗症期保参与。"], ["逐条展开", "ul", ["脑卒中：发病 24—48 小时生命体征稳定即开始床边康复；坐位耐受 → 站立 → 步行；上肢按 Brunnstrom 分期推进。", "颅脑损伤：先促醒（意识评估用 GCS），再处理认知、行为与吞咽；注意颅骨缺损处的保护。", "脊髓损伤：按 ASIA 定平面与分级；急性期防压疮、深静脉血栓、自主神经反射异常；呼吸训练（C4 以上）优先。", "帕金森病：药物「开期」练动作、大强度幅度训练（LSVT-BIG）、防跌倒、步态提示（节拍器、视觉提示）。", "多发性硬化/吉兰-巴雷：以「节能技术 + 渐进负荷」为主，避免过度疲劳诱发症状加重。"]], ["ASIA 分级速记", "table", [["分级", "含义"], ["A", "完全损伤，骶段（S4—S5）无感觉无运动"], ["B", "不完全，骶段有感觉无运动"], ["C", "不完全，损伤平面以下半数以上关键肌肌力 <3 级"], ["D", "不完全，半数以上关键肌肌力 ≥3 级"], ["E", "正常"]]], ["提示", "p", "脊髓损伤题必考「并发症」：压疮、尿路感染、深静脉血栓、自主神经反射异常（T6 以上，表现为突发高血压 + 头痛 + 出汗）、异位骨化、痉挛。"]]}, {"k": "kf-jigu", "n": "肌骨康复", "c": "骨折、关节置换、截肢、颈腰痛与运动损伤", "p": ["骨折三期：炎症、修复、塑形；对应训练强度", "关节置换：术前教育、术后早期活动、防脱位", "截肢：残端塑形、假肢、幻肢痛", "颈腰痛：分层（特异性/非特异性）、运动疗法"], "t": "肌骨康复的“保护—活动—强化—功能”四阶段要背熟。", "kw": ["骨折", "关节置换", "截肢", "颈椎", "腰痛", "肩", "骨关节炎", "骨质疏松", "运动创伤", "再植", "周围神经", "下肢创伤", "慢性运动系统"], "d": [["怎么理解", "p", "肌骨康复的关键是「分期」：术前/术后早期保护、中期恢复活动度、后期强化与功能。搞错分期就会「该保护时练太猛、该强化时不敢练」。"], ["逐条展开", "ul", ["骨折：早期等长 + 邻近关节活动；愈合期（4—6 周）逐步负重；临床愈合后强化。负重必须在影像与医嘱下进行。", "关节置换：髋置换防脱位（屈髋 <90°、不内收内旋、不交叉腿）；膝置换术后当日/次日下地，重点伸膝与股四头肌。", "截肢：术后即刻/早期假肢（弹性绷带塑形）、残端脱敏与肌力；假肢处方按残肢长度与活动水平定。", "颈腰痛：急性期避免长时间卧床；以「保持活动 + 核心训练 + 宣教」为主，影像不是治疗依据。", "运动损伤：POLICE 原则（保护、适度负荷、冰敷、加压、抬高）替代旧 RICE；重返运动按功能测试而非时间。"]], ["提示", "p", "「髋置换后三个禁止动作」是送分题：屈髋超过 90°、内收过中线、内旋；三者都增加后脱位风险（后侧入路）。"]]}, {"k": "kf-xinfei", "n": "心肺康复", "c": "冠心病、心衰、COPD 的康复", "p": ["冠心病：PCI/CABG 后分期运动", "心衰：低强度起步、监测", "COPD：肺康复、运动+教育+营养", "危险分层与监护"], "t": "心肺康复第一件事是危险分层。", "kw": ["冠心病", "高血压", "COPD", "心衰", "心肺康复", "呼吸疾病"], "d": [["怎么理解", "p", "心肺康复的证据最硬：心梗后、心衰、COPD 患者做康复能降低再入院与死亡。核心不是「多运动」，而是「在安全窗口内、按处方运动 + 危险因素管理」。"], ["逐条展开", "ul", ["冠心病：心梗后 1—2 周开始门诊康复；PCI/CABG 后按分期；运动强度 40—70% 心率储备，Borg 12—14。", "心衰：NYHA II—III 级做有氧 + 抗阻；监测体重（3 天涨 2 kg 提示液体潴留）、血压、心率。", "COPD：缩唇呼吸 + 腹式呼吸 + 呼吸肌训练 + 下肢有氧；急性加重期以排痰与早期活动为主。", "危险分层：低危（无并发症、运动试验正常）可居家；中高危需监护下训练。", "二级预防：戒烟、他汀、抗血小板、血压血糖管理——运动不能替代药物。"]], ["提示", "p", "CABG 术后 6—8 周内避免上肢负重与大幅度肩关节活动（胸骨愈合）；这是常见考点。"]]}, {"k": "kf-ertong", "n": "儿童康复", "c": "脑瘫、高危儿、遗传性疾病的康复", "p": ["脑瘫：GMFCS 分级、痉挛管理、矫形", "高危儿：早期干预窗口", "遗传病：多学科、长期随访", "家庭为中心、游戏化训练"], "t": "脑瘫分型（痉挛/手足徐动/共济失调/混合）必考。", "kw": ["脑瘫", "高危儿", "儿童康复", "遗传", "发育障碍", "孤独症"], "d": [["怎么理解", "p", "儿童康复的两条主线：脑瘫（运动障碍为主）与高危儿（早产、缺氧缺血性脑病，需早期干预）。核心原则是「早期、家庭为中心、功能导向」。"], ["逐条展开", "ul", ["脑瘫分型：痉挛型（最多，占 70%）、不随意运动型（手足徐动）、共济失调型、混合型；按分布分单瘫、双瘫、偏瘫、四肢瘫。", "GMFCS 五级：I 独立行走、II 长距离需辅具、III 助行器、IV 轮椅 + 部分自主移动、V 完全依赖。", "高危儿：早产 <32 周、低体重、窒息、黄疸、颅内出血；干预从 NICU 开始（袋鼠式护理、体位管理、喂养）。", "训练：任务导向、游戏化、家长培训（家庭训练量决定效果）、辅具（AFO、站立架）。", "遗传性疾病：DMD（进行性肌无力，禁高强度离心）、SMA（SMA 药物 + 呼吸管理）、唐氏（肌张力低、关节松弛）。"]], ["提示", "p", "DMD 患儿「能不能练力量」常考：可做低强度、次最大量训练，禁高强度离心与过度牵伸（肌肉脆弱易损伤）。"]]}, {"k": "kf-laonian", "n": "老年康复", "c": "老年综合征与长期照护", "p": ["老年综合征：跌倒、失禁、卧床、肌少症、多重用药", "综合评估（CGA）", "跌倒预防、防压疮、防废用", "长期照护与安宁疗护"], "t": "老年人先做 CGA 再定方案，不按单病种处理。", "kw": ["老年", "跌倒", "失禁", "肌少", "长期照护", "健康管理", "综合征"], "d": [["怎么理解", "p", "老年康复的对象不是「某个病」，而是「多种慢病 + 老年综合征 + 环境」的组合。目标常常不是恢复原状，而是「维持独立、防跌倒、防失能」。"], ["逐条展开", "ul", ["老年综合征：跌倒、肌少症、衰弱、失禁、认知障碍、多重用药、压疮、营养不良。", "衰弱（frailty）：Fried 五条（体重下降、疲乏、握力下降、行走慢、活动少），3 条以上为衰弱。", "肌少症：握力（男 <28 kg、女 <18 kg）+ 肌肉量 + 步速（<1.0 m/s）；干预 = 抗阻训练 + 蛋白质（1.0—1.2 g/kg）。", "跌倒预防：平衡训练（太极、Otago）、环境改造、视力与药物评估、维生素 D。", "长期照护：机构 vs 居家；ADL 维持优先于功能提高，防「越练越累」。"]], ["提示", "p", "老年人训练强度要「低起点、慢进展、多次短时」；一次 40 分钟不如两次 20 分钟——耐力与恢复能力都下降。"]]}, {"k": "kf-shequ", "n": "社区康复 CBR", "c": "社区康复的组织、评估与三级网络", "p": ["CBR 五要素：健康、教育、生计、社会、赋权", "三级网络：县—乡—村", "社区评定与家庭训练计划", "转介与档案管理"], "t": "社区康复考“可及性”与“可持续”，不是技术细节。", "kw": ["社区", "CBR", "基层", "家庭康复", "转介"], "d": [["怎么理解", "p", "社区康复（CBR）是「把康复搬到家门口」：以社区为平台，用最低成本覆盖最多人。它不是「低配版医院康复」，而是另一套组织逻辑——自助、互助、社会参与。"], ["逐条展开", "ul", ["CBR 五大支柱：健康、教育、生计、社会、赋权（WHO 2010 指南）。", "三级网络：县/区级康复中心（技术指导）→ 乡镇/街道康复站（训练与随访）→ 村/社区康复点（家庭训练）。", "核心工具：简易评定（Barthel、ADL）、家庭训练计划、辅具适配、环境改造、照顾者培训。", "人员：社区康复协调员、全科医生、治疗师（巡回指导）、残疾人专职委员。", "我国现状：服务能力不均、人才短缺；「家庭医生签约 + 康复服务包」是常见落地形式。"]], ["提示", "p", "CBR 与机构康复的区别常考：CBR 强调「社区参与与赋权」，不只是训练技术；答题要提到「自助、互助、社会融入」。"]]}, {"k": "kf-gongcheng", "n": "康复工程", "c": "假肢、矫形器、轮椅与无障碍", "p": ["假肢：接受腔、悬吊、对线", "矫形器：AFO/KAFO、脊柱矫形", "轮椅：座宽、座深、靠背、防压疮坐垫", "无障碍：坡道、门宽、扶手、卫浴"], "t": "坐垫与轮椅参数是压疮预防的关键考点。", "kw": ["假肢", "矫形器", "轮椅", "无障碍", "坐垫", "康复工程", "自助具"], "d": [["怎么理解", "p", "康复工程是「用工程技术补功能」：缺了腿给假肢，关节不稳给矫形器，走不远给轮椅，进不了门改环境。评价标准只有一个——患者是否真的在用、是否更独立。"], ["逐条展开", "ul", ["假肢：按截肢平面（小腿、大腿、膝离断、上肢）选；组件有储能脚、液压膝、肌电手；处方看活动水平（K 级）。", "矫形器（AFO/KAFO/WHSO/TLSO）：AFO 用于足下垂与踝不稳；KAFO 用于膝不稳/股四头肌无力；TLSO 用于脊柱侧弯与术后。", "轮椅：手动/电动、倾斜/后仰、减压坐垫；座宽座深按体型，防压疮。", "无障碍：坡道坡度 ≤1:12、门宽 ≥80 cm、扶手高度 85—90 cm。", "评估顺序：需求（要做什么）→ 功能（残存能力）→ 环境（家里/工作）→ 选型 → 试用 → 随访。"]], ["提示", "p", "「K 级」是假肢功能分级（K0—K4），K3 以上才考虑高性能组件；考试若问「为什么有人装了假肢不用」，答适配（残端条件）与训练（步态）两方面。"]]}, {"k": "kf-xinli", "n": "心理康复", "c": "伤残后的心理反应与干预", "p": ["五阶段：否认、愤怒、抑郁、接受、适应", "评估：HADS、SDS/SAS、SCL-90", "干预：支持性、认知行为、团体", "家庭与社会支持"], "t": "心理康复题答“评估—干预—支持”三层。", "kw": ["心理", "情绪", "抑郁", "焦虑", "应激", "心身", "社会支持", "人际关系"], "d": [["怎么理解", "p", "伤残后的心理反应是有规律的「适应过程」，不是「想不开」。康复要提高的是「应对能力」，而不是消灭负面情绪；识别抑郁与病理性哀伤是重点。"], ["逐条展开", "ul", ["反应阶段（非严格线性）：震惊/否认 → 愤怒 → 抑郁/哀伤 → 接受与适应；不要机械套阶段。", "常见问题：抑郁（卒中后约 1/3）、焦虑、创伤后应激、病耻感、体像障碍、家属照护负担。", "筛查：PHQ-9（抑郁）、GAD-7（焦虑）、HADS；卒中后抑郁要主动问，不要等患者说。", "干预：认知行为治疗（CBT）、动机访谈、团体治疗、家属参与；药物由精神科评估。", "沟通要点：先共情再给方案；避免「想开点」「比你惨的人多」这类无效安慰。"]], ["提示", "p", "「患者拒绝康复训练是不是抑郁」：先排除疼痛、疲劳、认知障碍与环境因素，再考虑抑郁；抑郁的诊断需要量表 + 临床判断，不能凭一次拒绝。"]]}, {"k": "kf-chuantong", "n": "传统康复", "c": "针灸、推拿、中药与导引", "p": ["经络与腧穴定位", "针灸：选穴、手法、电针", "推拿：滚法、揉法、点按、扳法", "导引：八段锦、五禽戏、太极"], "t": "传统康复按“辨证+选穴+手法+疗程”答。", "kw": ["传统", "针灸", "推拿", "中药", "经络", "腧穴", "导引", "太极"], "d": [["怎么理解", "p", "传统康复是「针灸、推拿、中药、导引」四件套，优势在疼痛、痉挛、失眠与亚健康，常与现代康复叠加使用。学它要抓「适应证 + 禁忌 + 与现代训练如何配合」。"], ["逐条展开", "ul", ["经络：十二正经 + 奇经八脉；常用穴位（合谷、足三里、阳陵泉、曲池、百会、风池）定位与主治。", "针灸：毫针、电针（用于卒中后瘫痪、面瘫）、温针；注意晕针、气胸（胸背部深刺）、感染。", "推拿：滚法、揉法、按法、拿法；用于肌肉痉挛、腰痛、肩周炎；禁忌骨折、肿瘤、感染、皮肤破损、抗凝中。", "中药：补阳还五汤（气虚血瘀）、黄芪桂枝五物汤（血痹）；必须在中医辨证下用。", "导引：八段锦、太极拳——平衡与心肺的循证支持较好，适合老年人群体训练。"]], ["提示", "p", "「电针」与「普通针刺」的区别常考：电针用微量电流持续刺激，适合瘫痪、疼痛；但心脏起搏器、颈动脉窦处禁用。"]]}, {"k": "kf-zhongzheng", "n": "重症与急诊康复", "c": "ICU 早期活动与急诊后康复", "p": ["ICU：早期活动、呼吸肌训练、谵妄管理", "禁忌与安全：血流动力学、管路", "急诊后：功能评估与转介", "团队协作与分级"], "t": "重症康复答题强调“安全边界”与“逐步进阶”。", "kw": ["重症", "ICU", "急诊", "谵妄", "早期活动"], "d": [["怎么理解", "p", "重症康复是「在 ICU 里做康复」：患者带着呼吸机、管路、镇静，康复要回答「现在能不能动、动多少、怎么防并发症」。核心收益是减少 ICU 获得性衰弱（ICU-AW）。"], ["逐条展开", "ul", ["早期活动分级：被动关节活动 → 床上主动 → 床边坐 → 坐站 → 步行；在血流动力学稳定下尽早开始。", "ICU-AW：危重病后全身肌无力，表现为脱机困难、四肢无力；预防靠早期活动 + 营养 + 控制血糖。", "安全标准：平均动脉压 ≥65 mmHg（或升压药稳定）、FiO₂ ≤60%、SpO₂ ≥90%、无活动性出血、颅内压可控。", "管路管理：气管插管、深静脉、动脉置管、引流管——活动前固定，活动中专人看护。", "呼吸康复：体位引流、排痰、呼吸肌训练、脱机训练（SBT）。"]], ["提示", "p", "「重症患者能不能坐起来」的关键不是诊断，而是「血流动力学是否稳定 + 管路是否安全」；答题要写具体阈值。"]]}, {"k": "kf-tengtong", "n": "疼痛康复", "c": "疼痛机制与综合干预", "p": ["伤害性、神经病理性、混合性", "评估：VAS/NRS、DN4、压痛阈", "干预：物理因子、运动、认知行为、注射", "慢性疼痛的生物心理社会模型"], "t": "先分疼痛类型，再选干预，别只会做理疗。", "kw": ["疼痛", "VAS", "神经病理", "慢性疼痛"], "d": [["怎么理解", "p", "疼痛康复的目标不是「完全无痛」，而是「可耐受、可活动、可睡眠」。慢性疼痛是「生物—心理—社会」三因素模型，单靠止痛药或单靠训练都难奏效。"], ["逐条展开", "ul", ["分类：伤害性（组织损伤，如骨折）、神经病理性（神经损伤，如带状疱疹后）、伤害可塑性（中枢敏化，如纤维肌痛）。", "评估：NRS/VAS、DN4（神经病理性筛查）、疼痛 catastrophizing 量表（PCS）、睡眠与功能。", "干预：运动疗法（渐进有氧 + 力量）、物理因子、认知行为治疗、正念、药物（按阶梯）、神经阻滞/射频。", "中枢敏化特征：痛阈下降、扩散痛、异常性疼痛（轻触即痛）、情绪与睡眠恶化。", "避免：长期卧床、过度依赖被动治疗、反复影像检查「找原因」。"]], ["提示", "p", "「轻触就痛、范围超过损伤区」提示中枢敏化/神经病理性，不是「装病」；治疗要转向运动 + 认知干预，而不是继续加止痛药。"]]}, {"k": "linchuang-jichu", "n": "临床医学基础", "c": "诊断学、外科学与各临床科室要点", "p": ["诊断：病史、查体、实验室、影像、鉴别思路", "外科：无菌、创伤、围手术期、并发症", "危急重：休克、呼衰、心衰、急救流程", "各科（妇产、儿科、精神、运动系统）的康复相关点"], "t": "临床概要只记“影响康复决策”的部分：禁忌、危险信号、转介时机。", "kw": ["诊断学", "外科", "危急重", "妇产", "儿科", "精神疾病", "运动系统疾病", "临床疾病", "鉴别"], "d": [["怎么理解", "p", "临床医学基础是康复的「上游」：不知道疾病怎么发生、怎么治，就判断不了康复的时机与禁忌。这部分内容宽而浅，抓「常见病的康复相关要点」即可。"], ["逐条展开", "ul", ["诊断学：症状（发热、疼痛、水肿）、体征（血压、心肺听诊、神经查体）、常用化验与影像。", "外科基础：无菌、清创、骨折固定、术后并发症（感染、血栓、肺不张）。", "内科要点：高血压、糖尿病（低血糖识别）、冠心病、COPD、脑卒中的急性期处理。", "其他科室：妇产（产后盆底）、儿科（发育）、五官（听力/吞咽）、皮肤（压疮）。", "康复相关红线：发热/感染期不训练、血压过高不训练、急性血栓不训练、骨折未愈合不负重。"]], ["提示", "p", "康复评定前必须看的四项：生命体征、疼痛、皮肤（压疮/破损）、管路；缺一项都可能出安全问题。"]]}, {"k": "zonghe", "n": "综合串讲", "c": "以《康复医学》为代表的整合式叙述", "p": ["把评定、技术、专科串成一条临床路径", "同一病在综合书里更强调流程与转介", "用于考研与执业：口径统一、条目完整", "与规划教材分工：综合书定框架，专科书补细节"], "t": "综合书适合“最后一遍”过框架，第一遍别用它打基础。", "kw": ["相关基础", "治疗技术", "内脏疾病", "特殊人群", "综合", "康复医学相关"], "d": [["怎么理解", "p", "《康复医学》（第 7 版）是「整合式」教材：它不按治疗技术分章，而按「概论—基础—评定—技术—病损」五段组织，把前面各本单科教材的知识串成临床路径。"], ["逐条展开", "ul", ["九章结构：康复概论、相关基础、评定、治疗技术、神经病损、肌骨病损、内脏疾病、其他疾病与特殊人群、常见问题处理。", "它的价值在「横向对照」：同一个病，评定用哪张表、治疗用哪几项技术、出院标准是什么，一章讲完。", "与前 19 本规划教材的关系：那 19 本是「按学科拆细」，这本是「按病人整合」；复习后期用来串讲最有效。", "考研与执医常引它的框架；专升本则更依赖《康复功能评定学》与《临床康复学》。"]], ["提示", "p", "如果只读一本，先读它建立框架；但要做题，仍要回到单科教材找细节——两者互补，不能替代。"]]}, {"k": "kf-qita", "n": "其他系统疾病康复", "c": "肿瘤、糖尿病、风湿、烧伤与五官皮肤", "p": ["肿瘤：术前预康复、术后、淋巴水肿", "糖尿病：运动处方与足部保护", "风湿：关节保护与能量节省", "烧伤：体位、压力、瘢痕"], "t": "这组病按“系统损害→功能问题→方案”答。", "kw": ["肿瘤", "糖尿病", "风湿", "烧伤", "皮肤", "五官", "口腔", "眼科", "耳鼻咽喉", "传染病", "感染", "其他疾病"], "d": [["怎么理解", "p", "除神经、肌骨、心肺之外的病种康复，考频低但常以「病例题背景」出现：肿瘤、糖尿病、风湿、烧伤、五官与皮肤。共同点是「多系统受累 + 需跨科协作」。"], ["逐条展开", "ul", ["肿瘤康复：术前预康复（呼吸训练、肌力）、术后肩关节（乳癌）、淋巴水肿（压力 + 手法引流）、癌性疲乏（有氧运动）。", "糖尿病：运动降糖（餐后 1 小时）、防低血糖（随身糖）、糖尿病足（减压鞋、伤口护理、禁热疗）。", "风湿：类风湿（晨僵、关节保护、避免高强度负重）、强直性脊柱炎（伸展、呼吸训练、姿势）。", "烧伤：抗挛缩体位、压力衣、关节活动度维持、瘢痕按摩。", "五官与皮肤：面瘫（表情肌训练、保护角膜）、眩晕（前庭康复）、压疮（分期与减压）。"]], ["提示", "p", "「糖尿病足能不能做热疗/蜡疗」不能——感觉减退易烫伤；「烧伤后为什么穿压力衣」防瘢痕增生与挛缩。"]]}], "chinfo": {"A1:1": ["gaishu"], "A1:2": ["liuxing", "canji"], "A1:3": ["canji", "liuxing"], "A1:4": ["canji"], "A1:5": ["gaishu"], "A1:6": ["gaishu"], "A1:7": ["lunli"], "A1:8": ["kf-xinli"], "A1:9": ["lunli"], "A1:10": ["gaishu", "lunli"], "A1:11": ["gaishu"], "A1:12": ["gaishu"], "A1:13": ["shengwu", "jiepou-shen"], "A1:14": ["g <script>
const DATA = JSON.parse(document.getElementById('kb-data').textContent);
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LEVELS = DATA.levels;
/* file:// 下部分浏览器禁用 localStorage，做内存回退 */
const store = (() => { try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return localStorage; }
  catch(e){ const m={}; return { getItem:k=>(k in m?m[k]:null), setItem:(k,v)=>{m[k]=String(v);}, removeItem:k=>{delete m[k];} }; } })();
let tab = store.getItem('kb-tab') || 'books';
let filterLevel = 'all', filterCat = 'all';
const WHO_KEY='kb-who';
let who = DATA.ident.find(i=>i.key===store.getItem(WHO_KEY)) || null;
function focusOf(code){ return (who && who.focus && who.focus[code]) || 0; }
let cur = null;

const tabNames = {books:'教材', topics:'主题延伸', paths:'学习路径', scales:'量表速查', diseases:'病种速查', overlaps:'重合取舍', ident:'身份适配', cert:'资格证'};

function bookByCode(c){ return DATA.books.find(b=>b.code===c); }

function progressKey(code, i){ return 'kb-prog:'+code+':'+i; }
function isDone(code,i){ return store.getItem(progressKey(code,i))==='1'; }
function toggleDone(code,i,el){
  const k=progressKey(code,i);
  if(store.getItem(k)==='1'){ store.removeItem(k); el.classList.remove('done'); }
  else { store.setItem(k,'1'); el.classList.add('done'); }
  renderProgress(code);
}
function renderProgress(code){
  const b=bookByCode(code); if(!b) return;
  const done=b.chapters.filter((_,i)=>isDone(code,i)).length;
  const pct=b.chapters.length? Math.round(done*100/b.chapters.length):0;
  const bar=$('#progress-bar'); if(bar){ bar.style.width=pct+'%'; }
  const lab=$('#progress-label'); if(lab){ lab.textContent=done+'/'+b.chapters.length+' 章 · '+pct+'%'; }
  const li=document.querySelector('[data-list="'+code+'"] .mini');
  if(li){ li.textContent=pct+'%'; li.classList.toggle('full', pct===100); }
}

function h(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }

function levelBadge(l){ return '<span class="badge lv-'+l+'">'+l+'</span>'; }

function renderSidebar(){
  const q=($('#search').value||'').trim().toLowerCase();
  const list=$('#list'); list.innerHTML='';
  let items;
  if(tab==='books'){
    items=DATA.books.filter(b=>{
      if(filterLevel!=='all' && b.level!==filterLevel) return false;
      if(filterCat!=='all' && !b.cat.startsWith(filterCat)) return false;
      if(!q) return true;
      const hay=(b.code+b.title+b.editor+b.cat+b.tags.join(' ')+b.role+b.chapters.join(' ')).toLowerCase();
      return hay.includes(q);
    });
    items.forEach(b=>{
      const done=b.chapters.filter((_,i)=>isDone(b.code,i)).length;
      const pct=b.chapters.length? Math.round(done*100/b.chapters.length):0;
      const el=h('<div class="item" data-key="'+b.code+'" data-list="'+b.code+'">'+levelBadge(b.level)+
        '<div class="it-body"><div class="it-title">'+esc(b.title)+'</div>'+
        '<div class="it-sub">'+b.code+' · '+esc(b.editor)+(focusOf(b.code)?' <span class="fp">重点 '+focusOf(b.code)+'%</span>':'')+'</div></div>'+
        '<span class="mini'+(pct===100?' full':'')+'">'+pct+'%</span></div>');
      el.onclick=()=>{ cur=b.code; showBook(b.code); markActive(); };
      list.appendChild(el);
    });
  } else if(tab==='ident'){
    items=DATA.ident.filter(i=>!q || (i.name+i.who+i.exams).toLowerCase().includes(q));

function refsOf(str){
  const out=[];
  const re=/([A-F]\d)\s*(?:第([\d、—\-～,，]+)章|全篇)/g;
  let m;
  while((m=re.exec(str||''))){
    const code=m[1];
    if(m[2]==null){ const b=bookByCode(code); if(b) b.chapters.forEach((_,i)=>out.push([code,i+1])); continue; }
    m[2].split(/[、，,]/).forEach(p=>{
      p=p.trim(); if(!p) return;
      const rg=p.split(/[—\-～]/);
      if(rg.length===2){
        const a=+rg[0],z=+rg[1];
        if(a&&z) for(let i=a;i<=z;i++) out.push([code,i]);
      } else if(/^\d+$/.test(p)) out.push([code,+p]);
    });
  }
  return out;
}
function chName(code,seq){ const b=bookByCode(code); return (b&&b.chapters[seq-1])||(code+' 第'+seq+'章'); }
function plain(s){ return String(s||'').replace(/^第[一二三四五六七八九十百]+章\s*/,''); }

function showChapter(code, seq){
  const b=bookByCode(code); if(!b) return;
  setHash(code+'-'+seq);
  const key=code+':'+seq, i=seq-1, done=isDone(code,i);
  const atoms=(DATA.chinfo[key]||[]).map(k=>DATA.know.find(a=>a.k===k)).filter(Boolean);
  const ref=DATA.chref[key]||{sc:[],ds:[],ov:[]};
  const name=chName(code,seq);
  const atomHtml=atoms.length? atoms.map(a=>

        '<a class="more" data-atom="'+a.k+'">看详解 →</a></div>'+
      '<ul class="pts">'+a.p.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
      (a.t? '<div class="tip">读法：'+esc(a.t)+'</div>':'')+'</div>').join('')
    : '<p class="muted">本章属综述或过渡性内容，按下面「关联」里的条目定位即可。</p>';
  const scs=ref.sc.map(j=>DATA.scales[j]).filter(Boolean);
  const dss=ref.ds.map(j=>DATA.diseases[j]).filter(Boolean);
  const ovs=ref.ov.map(j=>DATA.overlaps[j]).filter(Boolean);
  const relHtml=(scs.length? '<h3>相关量表</h3><table class="grid"><tr><th>量表</th><th>用途</th><th>位置</th></tr>'+
      scs.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td></tr>').join('')+'</table>':'')+
    (dss.length? '<h3>相关病种</h3><table class="grid"><tr><th>病种</th><th>主查</th><th>也在</th></tr>'+
      dss.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td></tr>').join('')+'</table>':'')+
    (ovs.length? '<h3>跨书重合</h3><table class="grid"><tr><th>主题</th><th>精读</th><th>对照</th><th>跳过/理由</th></tr>'+
      ovs.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td><td>'+esc(x[3])+'</td></tr>').join('')+'</table>':'');
  const prev=seq>1? '<a data-ch="'+code+'" data-sq="'+(seq-1)+'">← 第'+(seq-1)+'章</a>':'<span></span>';
  const next=seq<b.chapters.length? '<a data-ch="'+code+'" data-sq="'+(seq+1)+'">第'+(seq+1)+'章 →</a>':'<span></span>';
  $('#main').innerHTML=
   '<div class="crumb"><a data-ch="'+code+'" data-sq="0">'+esc(b.title)+'</a> › '+esc(name)+'</div>'+
   '<h1>'+esc(name)+'</h1>'+idBanner(code)+
   '<div class="meta">'+esc(b.code)+' ｜ '+esc(b.editor)+' ｜ '+esc(b.edition)+' ｜ 全章 '+b.chapters.length+' 章 ｜ 本章位于第 '+seq+' 章</div>'+
   '<div class="progwrap"><button class="chipbtn'+(done?' on':'')+'" id="chdone">'+(done?'已读 ✓':'标记已读')+'</button>'+
     '<span class="hint">勾选状态与本页进度同步</span></div>'+
   '<h3>大纲 <small>本章知识元</small></h3>'+atomHtml+
   '<h3>内容要点 <small>按上列知识元展开，用于定位与复习</small></h3>'+
     '<p class="muted">本站不含教材原文；要点是知识元整理稿，原文请按 ISBN 查对应教材。</p>'+
   (relHtml || '<h3>关联</h3><p class="muted">本章暂无交叉条目，可回到书目页按邻章阅读。</p>')+
   '<h3>我的笔记 <small>只存在本机浏览器</small></h3>'+
   '<textarea id="chnote" placeholder="记下本章重点、疑问、老师强调的内容…"></textarea>'+
   '<div class="chnav"><span>'+prev+'</span><a data-ch="'+code+'" data-sq="0">回到书目</a><span>'+next+'</span></div>';
  const nt=$('#chnote');
  nt.value = store.getItem('kb-note:'+key)||'';
  nt.oninput=()=>store.setItem('kb-note:'+key, nt.value);
  $('#chdone').onclick=()=>{
    toggleDone(code,i,{});
    const now=isDone(code,i);
    const btn=$('#chdone'); btn.classList.toggle('on',now); btn.textContent=now?'已读 ✓':'标记已读';
    renderProgress(code);
  };
  $('#main').querySelectorAll('.atom[data-atom]').forEach(el=>el.onclick=e=>{e.stopPropagation();showAtom(el.getAttribute('data-atom'));});
  $('#main').querySelectorAll('[data-ch]').forEach(a=>a.onclick=()=>{
    const sq=+a.dataset.sq;
    if(sq===0){ setTab('books'); cur=a.dataset.ch; showBook(a.dataset.ch); markActive(); }
    else openChapter(a.dataset.ch, sq);
  });
}

/* ---------------- 问答对话框 ---------------- */
let chat=[];
/* 知识元 → 章节（构建时由 chinfo 反推） */
const ATOM_CH={};
Object.keys(DATA.chinfo).forEach(k=>{
  DATA.chinfo[k].forEach(a=>{ (ATOM_CH[a]=ATOM_CH[a]||[]).push(k); });
});
function norm(s){ return String(s||'').toLowerCase().replace(/[\s，。、；：？！,.;:?!（）()“”"']/g,''); }
function grams(s){ const o=[]; for(let i=0;i<s.length-1;i++) o.push(s.slice(i,i+2)); return o; }
function scoreOf(q,text){
  const qq=norm(q); if(!qq) return 0;
  const t=norm(text);
  let sc=0;
  if(t.includes(qq)) sc+=100;
  else if(qq.includes(t) && t.length>=2) sc+=40;
  grams(qq).forEach(g=>{ if(t.includes(g)) sc+=4; });
  return sc;
}
function candidates(q){
  const out=[];
  DATA.diseases.forEach(d=>{
    const s=scoreOf(q,d[0]);
    if(s) out.push({s:s*1.5,kind:'disease',title:d[0],body:'主查 '+d[1]+'；也在 '+d[2],refs:refsOf(d[1]+'；'+d[2])});
  });
  DATA.scales.forEach(sc=>{
    const s=scoreOf(q,sc[0]);
    if(s) out.push({s:s*1.2,kind:'scale',title:sc[0],body:sc[1]+'；位置 '+sc[2],refs:refsOf(sc[2])});
  });
  DATA.know.forEach(a=>{
    let s=0, best=null;
    a.kw.forEach(k=>{ const sc=scoreOf(q,k)*(k.length>=2?k.length:1); if(sc>s){ s=sc; best=k; } });
    if(s>0){
      const grams=[]; for(let i=0;i<q.length-1;i++) grams.push(q.slice(i,i+2));
      const refs=(ATOM_CH[a.k]||[]).map(k=>[k.split(':')[0], +k.split(':')[1]])
        .map(r=>{ const b=bookByCode(r[0]); const nm=(b&&b.chapters[r[1]-1])||'';
                  r.push(grams.reduce((n,g)=>n+(nm.includes(g)?1:0),0)); return r; })
        .sort((x,y)=>y[2]-x[2]).slice(0,3).map(r=>[r[0],r[1]]);
      out.push({s:s*0.9,kind:'know',title:a.n,body:a.c,atom:a,refs:refs});
    }
  });
  DATA.overlaps.forEach((o,i)=>{
    const s=scoreOf(q,o[0]);
    if(s) out.push({s:s*1.3,kind:'overlap',title:o[0],body:'精读 '+o[1]+'；对照 '+o[2],skip:o[3],refs:refsOf(o[1]+'；'+o[2])});
  });
  DATA.topics.forEach(t=>{
    const s=scoreOf(q,t.topic);
    if(s) out.push({s:s,kind:'topic',title:t.topic,body:t.l2,refs:refsOf(t.l2+'；'+t.l3)});
  });
  DATA.books.forEach(b=>{
    b.chapters.forEach((c,i)=>{
      const s=scoreOf(q,plain(c));
      if(s>8) out.push({s:s*0.5,kind:'chapter',title:b.code+' 第'+(i+1)+'章 '+plain(c),body:'',refs:[[b.code,i+1]]});
    });
  });
  return out.filter(o=>o.s>6).sort((a,b)=>b.s-a.s);
}
function askAnswer(q){
  const cs=candidates(q);
  if(!cs.length){
    return {summary:'没找到直接对应的条目。换个说法试试：病种名（脑卒中、脊髓损伤）、量表名（Berg、MMT）、或章名（肌力评定、吞咽障碍），也可以直接说“膝置换术后怎么练”。',items:[]};
  }
  if(who){
    cs.forEach(c=>{ if(c.refs && c.refs.length && focusOf(c.refs[0][0])) c.s+=30; });
    cs.sort((a,b)=>b.s-a.s);
  }
  /* 先病种/重合（实体），再知识元；章节按来源限量，避免解剖章刷屏 */
  const pri=t=>(t.kind==='disease'||t.kind==='overlap')?0:1;
  const top=cs.slice().sort((a,b)=> pri(a)-pri(b) || b.s-a.s).slice(0,3);
  const refs=[], seen={};
  const push=r=>{ const k=r[0]+':'+r[1]; if(!seen[k]){ seen[k]=1; refs.push(r); } };
  top.forEach(t=>{
    const cap = t.kind==='know'?2 : (t.kind==='disease'?4:3);
    (t.refs||[]).slice(0,cap).forEach(push);
  });
  cs.filter(c=>c.kind==='chapter').slice(0,4).forEach(c=>c.refs.forEach(push));
  const t0=top[0];
  let sum='';
  if(t0.kind==='disease') sum='「'+t0.title+'」：'+t0.body+'。';
  else if(t0.kind==='scale') sum='「'+t0.title+'」是'+t0.body+'。';
  else if(t0.kind==='know') sum='「'+t0.title+'」——'+t0.body+'。'+(t0.atom.p.slice(0,2).join('；'))+'。';
  else if(t0.kind==='overlap') sum='「'+t0.title+'」在 '+t0.body+'。跳过理由：'+t0.skip+'。';
  else sum='「'+t0.title+'」。';
  const seenT={}; seenT[t0.title]=1;
  const others=top.slice(1).map(x=>x.title).filter(t=>t&&!seenT[t]&&(seenT[t]=1));
  if(others.length) sum+=' 另外涉及：'+others.join('、')+'。';
  if(t0.kind==='disease') sum+=' 读法：评定 → 干预 → 并发症与随访。';
  if(who) sum+=' 按你的身份「'+who.name+'」，重点书相关的章会优先排前面。';
  if(refs.length) sum+=' 优先按下面 '+(refs.length>8?8:refs.length)+' 章读，点一下直接打开。';
  else sum+=' 这组内容暂未映射到具体章，可从教材页按类目翻。';
  return {summary:sum, items:refs.slice(0,8)};
}
function renderChat(){
  const box=$('#askLog');
  box.innerHTML = chat.map(m=>{
    if(m.role==='u') return '<div class="msg u">'+esc(m.text)+'</div>';
    const items=(m.res.items||[]).map(r=>'<a class="res" data-code="'+r[0]+'" data-seq="'+r[1]+'"><b>'+r[0]+' 第'+r[1]+'章</b>'+esc(plain(chName(r[0],r[1])))+'</a>').join('');
    return '<div class="msg a"><div>'+esc(m.res.summary)+'</div>'+(items?'<div class="reslist">'+items+'</div>':'')+'</div>';
  }).join('');
  box.querySelectorAll('.res').forEach(a=>a.onclick=()=>{
    openChapter(a.dataset.code, +a.dataset.seq);
    if(window.innerWidth<900) toggleAsk(false);
  });
  box.scrollTop=box.scrollHeight;
}
function ask(q){
  q=(q||'').trim(); if(!q) return;
  chat.push({role:'u',text:q});
  chat.push({role:'a',res:askAnswer(q)});
  renderChat();
  $('#askInput').value='';
}
function toggleAsk(force){
  const p=$('#askPanel'), b=$('#askBtn');
  const show = (force===undefined)? p.hidden : force;
  p.hidden = !show; b.style.display = show? 'none':'block';
  if(show){ if(!chat.length){ chat.push({role:'a',res:{summary:'说一句话，我按知识库检索：先给结论，再列出该读哪几章，点章号直接跳过去。',items:[]}}); renderChat(); } $('#askInput').focus(); }
}

function setTab(t){
  tab=t; store.setItem('kb-tab',t);
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  $('#filters').style.display = (t==='books')?'flex':'none';
  renderSidebar(); markActive();
}

$('#search').oninput=renderSidebar;
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{
  filterLevel=b.dataset.level;

});

whoSel.innerHTML='<option value="">身份：不指定（全部内容）</option>'+

whoSel.value = who? who.key : '';

$('#askClose').onclick=()=>toggleAsk(false);

document.addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){ e.preventDefault(); $('#search').focus(); }
});
setTab(tab); mainEmpty();

/* 支持 #C1 / #神经康复 这类直达链接 */
const _h = decodeURIComponent((location.hash||'').slice(1));
if(_h){
  const _q = _h.match(/^(?:问|ask[:：])\s*(.+)$/);
  if(_q){ toggleAsk(true); ask(_q[1]); }
  else {
  const _m = _h.match(/^([A-F]\d)-(\d+)$/);
  const _b = _m? null : bookByCode(_h.toUpperCase());
  if(_m){
    if(tab!=='books'){ setTab('books'); } cur=_m[1]; renderSidebar(); markActive();
    openChapter(_m[1], +_m[2]);
  }
  else if(_b){ if(tab!=='books'){ setTab('books'); } cur=_b.code; showBook(_b.code); renderSidebar(); markActive(); }
  else {
    const _t = DATA.topics.find(x=>x.topic===_h);
    if(_t){ cur=_t.topic; setTab('topics'); showTopic(_t); renderSidebar(); markActive(); }
    else {
      const m = _h.match(/^重合(\d+)$/);
      if(m){
        const o = DATA.overlaps[+m[1]-1];
        if(o){ cur='ov'+m[1]; setTab('overlaps');
               showOverlap({no:+m[1], topic:o[0], main:o[1], ref:o[2], skip:o[3]});
               renderSidebar(); markActive(); }
      }
    }
  }
  }
}
/* #身份zsb 直达身份页 */
const _h3 = decodeURIComponent((location.hash||'').slice(1));
if(/^元/.test(_h3)){
  const _a=DATA.know.find(x=>x.k===_h3.slice(1));
  if(_a){ cur='atom:'+_a.k; showAtom(_a.k); renderSidebar(); markActive(); }
}
if(/^证/.test(_h3)){
  const _c=DATA.cert.find(x=>x.key===_h3.slice(1));
  if(_c){ setTab('cert'); cur='cert:'+_c.key; showCert(_c.key); renderSidebar(); markActive(); }
}
if(/^身份/.test(_h3)){
  const _it=DATA.ident.find(x=>x.key===_h3.slice(2));
  if(_it){ setTab('ident'); cur='who:'+_it.key; showIdentity(_it.key); renderSidebar(); markActive(); }
}
