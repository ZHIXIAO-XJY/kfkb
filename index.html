L4、小腿三头 S1—S2）；② 上/下运动神经元六行对照表。答题写「起止点—功能—神经—临床（无力时表现）」即可拿分。"], ["依据", "p", "依据：《功能解剖学》第 3 版 上篇 第 1 章 运动系统、下篇 第 9—12 章；《人体运动学》第 3 版 第 3 章 肌肉生物力学；《物理治疗学》第 3 版 第 6 章 肌力训练。"]]}, {"k": "jiepou-shen", "n": "神经解剖", "c": "中枢与周围神经通路、传导束与定位", "p": ["皮质脊髓束、锥体外系、小脑三条运动通路", "感觉通路：脊髓后索、脊髓丘脑束、三叉", "周围神经丛与关键神经（桡、正中、尺、坐骨、腓总）", "定位诊断：损伤平面决定肌群与反射改变"], "t": "把通路和临床体征对上：上/下运动神经元损伤的区别。", "kw": ["神经", "脑", "脊髓", "传导", "通路", "感觉器", "内分泌"], "d": [["怎么理解", "p", "神经解剖决定「损伤在哪、会丢什么」：皮质脊髓束在内囊受损→对侧偏瘫；脊髓 L4 平面损伤→股四头肌保留、胫前肌丧失；桡神经沟受压→垂腕。所以记的是**通路 + 节段 + 关键神经支配**，考试题几乎都从这里出。"], ["教材定义（三句必背）", "p", "① 神经元由胞体、树突、轴突构成，轴突外有髓鞘（加速传导）。② 中枢神经＝脑+脊髓；周围神经＝12 对颅神经+31 对脊神经。③ 传导束：上行（感觉）与下行（运动），皮质脊髓束为随意运动主通路。"], ["主要传导束与损伤表现", "table", [["通路", "起止/走行", "损伤表现"], ["皮质脊髓束（锥体束）", "皮质运动区→内囊后肢→延髓交叉→前角", "对侧痉挛性瘫、腱反射亢进、Babinski 阳性"], ["锥体外系", "基底节、小脑→红核、网状结构", "肌张力异常、震颤、舞蹈样动作"], ["后索-内侧丘系", "脊神经节→薄束/楔束→延髓→丘脑", "深感觉与精细触觉丧失（感觉性共济失调）"], ["脊髓丘脑束", "后角→交叉→脊髓前侧索→丘脑", "对侧痛温觉丧失（分离性感觉障碍）"], ["三叉神经", "脑桥→三叉神经节→面部", "面部感觉丧失、咀嚼无力"], ["小脑通路", "脊髓小脑束、皮质脑桥小脑束", "共济失调、意向性震颤、Romberg 阳性"]]], ["周围神经与关键支配（必背表）", "table", [["神经", "来源节段", "支配/损伤表现"], ["腋神经", "C5—C6", "三角肌；损伤→外展不能（方肩）"], ["桡神经", "C6—C8", "伸腕伸指；损伤→垂腕"], ["正中神经", "C6—T1", "屈腕屈指、拇对掌；损伤→猿手、拇指对掌不能"], ["尺神经", "C8—T1", "骨间肌、小鱼际；损伤→爪形手、Froment 征"], ["坐骨神经", "L4—S3", "股后与小腿；损伤→足下垂+感觉障碍"], ["腓总神经", "L4—S2", "胫前肌、腓骨长短肌；损伤→足下垂内翻"], ["胫神经", "L4—S3", "小腿三头、足底；损伤→不能跖屈、足底感觉丧失"], ["面神经", "脑桥（Ⅶ）", "面部表情肌；损伤→周围性面瘫（额纹消失）"]]], ["脊髓节段与定位（考病例题）", "ul", ["C5：三角肌、肱二头肌（屈肘）；C7：伸肘、屈腕；C8—T1：手内在肌。", "L2—L4：股四头肌（伸膝）；L4：胫前肌（踝背屈）；L5：踇长伸肌；S1—S2：小腿三头（跖屈）。", "S2—S4：膀胱、直肠、性功能（骶髓）；圆锥 vs 马尾损伤鉴别看对称性与下肢。", "皮节关键点：C6 拇指、T4 乳头、T10 脐、L5 足背外侧、S1 足跟外侧。", "反射：肱二头肌 C5—C6、膝反射 L2—L4、跟腱反射 S1—S2、Babinski 锥体束。"]], ["提示", "p", "三个必背：桡神经→垂腕、正中神经→猿手、尺神经→爪形手；膝反射 L2—L4、跟腱反射 S1—S2；皮质脊髓束在延髓交叉（上运动神经元损伤→对侧）。"], ["依据", "p", "依据：《功能解剖学》第 3 版 上篇 第 8 章 神经系统、下篇 第 10—11 章；《康复功能评定学》第 3 版 第 3 章 神经反射、第 13 章 神经电生理。"]]}, {"k": "jiepou-zang", "n": "内脏与系统解剖", "c": "呼吸、循环、消化、泌尿生殖系统结构要点", "p": ["呼吸：肺叶分段、胸膜腔、膈肌", "循环：心腔、瓣膜、冠脉、体肺循环", "消化泌尿：腹部分区与脏器体表投影", "康复相关：体位引流、胸廓活动、腹压管理"], "t": "只记与评定/治疗操作相关的解剖，不做外科式记忆。", "kw": ["呼吸", "循环", "消化", "泌尿", "生殖", "血液", "脉管"], "d": [["怎么理解", "p", "内脏解剖是心肺康复与重症康复的地图：膈肌在第 10 胸椎水平、肺下界在锁骨中线第 6 肋、心脏传导从窦房结到房室结。不做解剖，就看不懂「为什么 COPD 要缩唇呼吸」「为什么心梗后要等 24 h 才下床」。记三样：位置体表投影、功能单位、血供/神经。"], ["教材定义（三句必背）", "p", "① 呼吸系统：上呼吸道（鼻咽喉）与下呼吸道（气管、支气管、肺泡），肺分叶：右 3 叶、左 2 叶。② 循环系统：心四腔、瓣膜、传导系统（窦房结→房室结→希氏束→浦肯野）。③ 消化、泌尿、生殖器官位于腹腔与盆腔，膀胱神经支配为 S2—S4 副交感。"], ["体表投影与关键结构（必背）", "table", [["结构", "体表位置", "临床意义"], ["肺尖", "锁骨上 2—3 cm", "肺结核好发；叩诊过清音"], ["肺下界", "锁骨中线第 6 肋、腋中线第 8 肋、肩胛线第 10 肋", "胸腔积液/肺气肿时下移或变浊"], ["膈肌", "平静呼吸位于 T10 水平，右高于左 1—2 cm", "腹式呼吸训练的目标肌；膈肌每下移 1 cm 约增 250—300 mL 潮气量"], ["心脏", "左第 5 肋间锁骨中线内侧 1—2 cm 为心尖", "心尖搏动位置改变提示心脏扩大"], ["肝", "右锁骨中线肋缘下不可及（成人）", "肝大提示右心衰/肝淤血"], ["脾", "左第 9—11 肋", "脾大见于血液病"], ["肾", "T12—L3，右低于左", "肾区叩击痛；腹膜透析注意保护"], ["膀胱", "耻骨联合上", "尿潴留可及；神经源性膀胱 S2—S4"]]], ["呼吸肌与训练对应", "table", [["肌肉", "作用", "训练/表现"], ["膈肌", "主要吸气肌（占 60%—70%）", "腹式呼吸、缩唇呼吸；膈肌起搏"], ["肋间外肌", "提肋吸气", "胸廓扩张训练"], ["肋间内肌/腹肌", "呼气（用力呼气）", "吹气球、咳嗽训练"], ["斜角肌/胸锁乳突肌", "辅助吸气", "COPD 时过度使用→颈肩痛"]]], ["胸腔/腹腔分区与康复注意", "ul", ["胸骨角（Louis 角）平第 2 肋、T4 椎体：气管分叉、主动脉弓起止标志。", "腹部分区：九分法（左右季肋、脐、左右腰、左右髂、上腹、下腹）；腹壁切口术后避免早期卷腹。", "心梗后：无并发症 24—48 h 床上活动、3—5 天床边、7 天步行（按危险分层）。", "腹部术后：避免 Valsalva（憋气用力），防切口疝；咳嗽时抱枕按压。"]], ["提示", "p", "必背：肺下界（锁骨中线第 6 肋、肩胛线第 10 肋）、膈肌在 T10、右肺 3 叶左肺 2 叶、膀胱神经 S2—S4。答题写「位置—功能—康复训练对应」三栏即可。"], ["依据", "p", "依据：《功能解剖学》第 3 版 上篇 第 3—7 章（呼吸、消化、泌尿、生殖、脉管）；《康复医学》第 7 版 第 2 章；《物理治疗学》第 3 版 第 13 章 心肺功能训练。"]]}, {"k": "shengli-ji", "n": "骨骼肌生理", "c": "肌纤维类型、收缩形式与疲劳", "p": ["I 型慢肌耐力、II 型快肌爆发", "等长、等张（向心/离心）、等速四种收缩", "力量—长度、力量—速度关系", "疲劳与恢复：中枢与外周机制"], "t": "训练处方要能对上收缩形式与强度。", "kw": ["骨骼肌", "肌纤维", "收缩", "疲劳", "生理"], "d": [["怎么理解", "p", "骨骼肌是「可训练的组织」：不同的收缩形式、不同的负荷与速度，会带来不同的适应。康复开处方时选等长、等张还是等速，取决于这个阶段能不能动、要不要保护关节。"], ["逐条展开", "ul", ["肌纤维：I 型（慢、抗疲劳、耐力）、IIa（快、中等耐力）、IIx/IIb（快、爆发、易疲劳）。", "收缩形式：等长（长度不变、张力增）、等张（张力不变、长度变，分向心/离心）、等速（角速度恒定，需设备）。", "离心收缩力量最大、也最易造成延迟性肌肉酸痛（DOMS），早期康复要慎用大强度离心。", "长度—张力关系：肌肉在静息长度略被拉长时产生最大张力；过短或过长都下降。", "疲劳与恢复：力量训练后 24—48 小时为超量恢复窗口；神经适应先于肌肉肥大（前 4 周力量增长主要靠神经）。"]], ["训练参数速记", "table", [["目标", "强度", "次数/组", "组数", "频率"], ["肌力（力量）", "1—6 RM 或 80—90% 1RM", "1—8 次", "3—6", "每周 3—4 次"], ["肌耐力", "40—60% 1RM", "15—25 次", "2—4", "每周 3—5 次"], ["肥大", "60—80% 1RM", "8—12 次", "3—6", "每周 3—5 次"], ["早期/术后", "等长，20—30% MVC", "5—10 秒/次", "5—10", "每日 2—3 次"]]], ["提示", "p", "术后早期为什么练等长不练等张？答：等长不产生关节运动，剪切力小，能在保护修复组织的前提下维持肌力与神经募集。"]]}, {"k": "shengli-xf", "n": "心肺与代谢生理", "c": "氧运输、能量代谢与运动反应", "p": ["最大摄氧量、无氧阈、心率储备", "运动时心输出量、血压、通气反应", "三大供能系统与运动时间对应", "运动处方的 FITT 生理依据"], "t": "把 FITT 四个字母和生理指标一一对应。", "kw": ["能量代谢", "体温", "血液循环", "尿生成", "尿的生成", "心肺", "生理", "细胞"], "d": [["怎么理解", "p", "心肺与代谢生理决定运动处方的「安全边界」。同样一套训练，对健康人是热身，对心衰患者可能是过量——差别在氧运输能力与代谢储备。"], ["逐条展开", "ul", ["氧运输链：肺通气/换气 → 心输出量（心率×每搏量）→ 血红蛋白携氧 → 肌肉利用（线粒体）。", "最大摄氧量 VO₂max：心肺适能的金标准；康复中常用 6 分钟步行距离、运动试验间接推算。", "能量系统：磷酸原（0—10 秒）、糖酵解（10 秒—2 分钟）、有氧氧化（>2 分钟）；康复训练以有氧为主。", "运动反应：心率上升、血压收缩压上升（舒张压不应明显升）、每搏量增加、通气量增加。", "危险信号：运动中胸痛、明显气促（说话断句）、头晕、血压异常升高或下降、心律失常——立即停止。"]], ["提示", "p", "心衰患者为什么用「说话试验」定强度？因为 Borg 评分主观、心率受 β 受体阻滞剂影响，能连贯说话说明还在无氧阈以下。"]]}, {"k": "shengli-shen", "n": "神经生理", "c": "神经元、突触、反射与可塑性", "p": ["兴奋传递、突触可塑性（LTP/LTD）", "牵张反射、屈伸反射、姿势反射", "中枢可塑性：使用依赖、重组、代偿", "抑制与易化的临床对应（痉挛、协同运动）"], "t": "神经发育疗法与运动再学习的理论根在这里。", "kw": ["神经系统", "反射", "突触", "可塑", "感觉器官"], "d": [["怎么理解", "p", "神经生理里最该带走的一个词是「可塑性」：中枢损伤后，残存通路会重排、突触会增强，训练就是在给这种重排提供信号。所以康复不是「等它自己好」，而是「用正确输入去塑形」。"], ["逐条展开", "ul", ["神经元：胞体、树突（输入）、轴突（输出）、髓鞘（传导速度）；周围神经可再生（约 1 mm/天），中枢再生很有限。", "突触传递：兴奋性（谷氨酸）与抑制性（GABA）递质；长时程增强（LTP）是学习与运动记忆的细胞基础。", "反射：牵张反射（肌梭→Ia→α 运动神经元）、屈肌反射、交叉伸肌反射；痉挛就是牵张反射亢进。", "可塑性机制：轴突侧支发芽、突触效能改变、皮层代表区重组、去抑制（损伤后抑制解除导致过度兴奋）。", "训练原则对应：重复（量）、任务导向（特异性）、强度（接近极限）、及时反馈——四条都指向「用进废退」。"]], ["提示", "p", "解释「为什么早期训练要任务导向而不是单纯被动活动」：被动活动维持关节与软组织，但不会产生有效的突触重塑信号；任务导向 + 主动参与才有。"]]}, {"k": "shengwu", "n": "生物力学与运动学", "c": "力、力矩、杠杆与人体运动分析", "p": ["力矩=力×力臂；三类杠杆在人体中的例子", "重心、支撑面、稳定角决定平衡", "步态周期：支撑相/摆动相，时空参数", "异常步态的生物力学解释（代偿、短缩、疼痛）"], "t": "步态参数（步长、步频、步速、对称性）要能和病理对上。", "kw": ["生物力学", "运动学", "力学", "杠杆", "重心", "行走"], "d": [["怎么理解", "p", "生物力学把人体当杠杆系统：力、力矩、力臂决定「这个人为什么搬不动、为什么膝会疼、为什么拐杖要那样用」。康复里的体位、辅具、转移技术，背后都是力矩。"], ["逐条展开", "ul", ["三类杠杆：第一类（支点在中间，如寰枕关节）、第二类（阻力在中间，如提踵）、第三类（力在中间，人体最多，如屈肘）。", "力矩 = 力 × 力臂；力臂是「力的作用线到支点的垂直距离」，不是肌肉到关节的距离。", "增大稳定性的办法：降低重心、扩大支撑面、重力线落在支撑面内——拐杖、助行器、站位训练都按这个设计。", "脊柱负荷：弯腰提物时腰椎负荷可达体重的数倍；搬物要「屈膝屈髋、物体贴近身体」。", "步态生物力学：髋膝踝的力矩与地面反作用力决定异常步态的代偿方式（如臀中肌步态、跨阈步态）。"]], ["提示", "p", "考「为什么膝关节炎患者上下楼比平地疼」：上下楼时髌股关节反作用力可达体重的 3—7 倍，力臂与屈曲角度共同放大负荷。"]]}, {"k": "fayu", "n": "发育", "c": "胎儿期到青春期的发育规律与评定", "p": ["发育遵循头尾、近远、整体到分化顺序", "关键期与里程碑（抬头、坐、爬、走、语）", "发育商（DQ）与筛查工具", "早产矫正月龄、高危儿监测"], "t": "儿童康复所有判断都以“矫正年龄 + 里程碑”为基准。", "kw": ["发育", "胎儿", "婴幼儿", "儿童发育", "青春期", "学龄"], "d": [["怎么理解", "p", "人体发育是儿童康复的「时间标尺」：3 个月抬头、6 个月坐、9 个月爬、12 个月走，早产儿按矫正月龄算。判断一个孩子是否异常，靠的不是单次表现，而是**里程碑是否落后 + 原始反射是否消退 + 姿势是否对称**三件事。"], ["教材定义（三句必背）", "p", "① 发育：随年龄增长，结构与功能由简单到复杂、由低级到高级的连续过程。② 发育规律：头尾律（先抬头后走路）、近远律（先肩后手）、整体到分化、由粗到细。③ 关键期：0—3 岁神经系统可塑性最强，干预越早效果越好。"], ["运动里程碑（矫正月龄，必背）", "table", [["月龄", "粗大运动", "精细/言语/社交"], ["1 月", "俯卧抬头片刻", "握持反射；哭声分化"], ["3 月", "俯卧抬头 45°—90°、肘支撑", "手半张开；逗笑出声"], ["6 月", "独坐（双手支撑→独坐）、翻身", "全掌抓握；咿呀学语；认生"], ["9 月", "爬、扶站", "拇食指对捏；发「ba/ma」"], ["12 月", "独走（可扶走）、蹲起", "有意识叫爸妈；拇食指精细捏"], ["18 月", "跑、上台阶", "10—20 个词；指认身体部位"], ["24 月", "双脚跳、踢球", "50 个词、两词句；脱鞋"], ["3 岁", "单脚站 1—2 s、骑三轮车", "短句、会问「为什么」；自己吃饭"]]], ["原始反射出现与消退（必背表）", "table", [["反射", "出现", "消退", "持续存在的意义"], ["Moro（拥抱）", "0", "3—4 月", "持续→中枢抑制不足"], ["握持反射", "0", "3—4 月", "持续→影响手部精细动作"], ["ATNR（非对称性紧张性颈反射）", "0", "4—6 月", "持续→手口协调差、脊柱侧弯"], ["STNR（对称性紧张性颈反射）", "4—6 月", "8—12 月", "持续→四点爬困难"], ["阳性支持反射", "0", "4—6 月", "持续→尖足、不能全足着地"], ["降落伞反射", "6—9 月", "终身", "不出现→运动发育落后"], ["Landau 反射", "3—4 月", "12—24 月", "缺如→躯干伸展不足"]]], ["发育评定与异常信号", "table", [["工具/信号", "内容", "判读"], ["DDST/年龄与发育进程问卷", "粗大/精细/语言/社交", "任一项落后 2 个标准差需转诊"], ["GMFM-88/66", "脑瘫粗大运动", "百分比；66 项版更快捷"], ["Peabody（PDMS-2）", "粗大+精细", "＜70 提示发育迟缓"], ["危险信号", "4 月不抬头、6 月不能独坐、9 月不爬、18 月不能独走、2 岁无词组", "出现任一即转诊"], ["肌张力", "改良 Ashworth、围巾征、腘角", "增高提示痉挛型脑瘫"]]], ["提示", "p", "两表必背：运动里程碑（3 抬头/6 坐/9 爬/12 走）与原始反射消退时间（Moro 3—4 月、ATNR 4—6 月、握持 3—4 月）。答题写「月龄—里程碑—反射是否消退—异常信号」四段。"], ["依据", "p", "依据：《人体发育学》第 3 版 第 3—7 章（胎儿期、婴幼儿粗大/精细运动、言语、认知）；《儿童康复学》第 2 章 儿童康复评定；《康复功能评定学》第 3 版 第 20 章。"]]}, {"k": "pd-zhong", "n": "评定总论与形态/反射", "c": "评定的目的、流程与人体形态、反射检查", "p": ["评定三问：能不能、差多少、为什么", "形态：长度、围度、姿势、脊柱曲度", "反射：深浅反射、病理反射、脑膜刺激征", "评定记录要能复查对比"], "t": "评定总论题答“目的—方法—结果解释—记录”四段。", "kw": ["评定", "形态", "反射", "姿势", "测量", "总论", "人体形态"], "d": [["怎么理解", "p", "康复评定是「先量后治」的那把尺：不评定量不出问题，量不出问题就定不了目标，定不了目标就没法判断治疗有没有效。它和临床诊断的分工是——诊断回答「是什么病」，评定回答「功能差在哪、差多少、能不能变好」。所以评定报告里必须有数字，不能只有描述。"], ["教材定义（背这句 + 四个质量指标）", "p", "康复评定：是收集患者功能状态相关资料，对其功能状况及潜在能力作出量化或定性判断的过程，是制定康复目标和方案的依据，也是判定康复疗效的手段。评定量表要过四关：信度（重复测量一致性，ICC 或 Kappa 常要求＞0.75）、效度（测的是不是想测的东西）、灵敏度（有病能查出）、特异度（无病不误判）。另需掌握最小临床重要差值（MCID）：如 Barthel 变化≥10 分、6MWT 变化≥30 m 才算患者能感知的改善。"], ["评定三问与流程", "ul", ["三问：能不能（能力有无）、差多少（量化程度）、为什么（原因与预后）。", "流程：采集病史 → 观察与查体（形态、ROM、肌力、肌张力、反射）→ 选量表测评 → 分析问题清单 → 定目标（SMART）→ 出方案 → 定期复评。", "「三间」记录：初始评定（基线）、中期评定（每 1—2 周或每疗程）、末期评定（出院/转介）。", "报告五要素：问题、数字、目标、干预、复评时间。缺一个就是不合格的评定报告。"]], ["人体形态测量（方法与正常值）", "table", [["项目", "测量方法", "参考值/判读"], ["四肢长度", "上肢：肩峰—桡骨茎突；下肢：髂前上棘—内踝（真长）/ 脐—内踝（相对长）", "两侧差＞1 cm 有意义（骨折短缩、髋内收）"], ["肢体围度", "大腿：髌骨上缘上 15 cm；小腿：髌骨下缘下 10 cm；上臂：肩峰下 10 cm", "两侧差＞1 cm 提示肌萎缩或水肿"], ["BMI", "体重(kg) ÷ 身高(m)²", "中国标准：＜18.5 偏瘦、18.5—23.9 正常、24—27.9 超重、≥28 肥胖"], ["脊柱侧弯", "Adam 前屈试验 + Cobb 角（X 线）", "Cobb 角＞10° 诊断侧弯；＞40°—50° 常需手术评估"], ["姿势与骨盆", "站位/坐位观察、骨盆倾斜角", "骨盆前倾常伴腰椎前凸增大、腘绳肌紧张"]]], ["反射检查（定位必背）", "table", [["反射", "节段", "正常反应", "异常意义"], ["肱二头肌反射", "C5—C6", "前臂屈曲", "减弱：下运动神经元/周围神经；增强：上运动神经元"], ["肱三头肌反射", "C6—C7", "前臂伸展", "同上"], ["膝反射", "L2—L4", "小腿伸展", "L4 神经根或股神经病变时减弱"], ["跟腱反射", "S1—S2", "足跖屈", "S1 根性损害减弱；上运动神经元损伤增强"], ["腹壁反射", "T7—T12", "腹肌收缩", "上运动神经元损伤时消失（T7—T12 平面以上）"], ["Babinski 征", "锥体束", "拇趾背伸、其余四趾扇形散开", "阳性＝锥体束损害（1 岁内婴儿可为生理性）"], ["Hoffmann 征", "C5—T1 锥体束", "拇指屈曲内收", "阳性提示颈髓上运动神经元损害"]]], ["分级记录（会写才算会）", "ul", ["深反射分级 0—4+：0 消失、1+ 减弱、2+ 正常、3+ 增强、4+ 阵挛。", "病理反射只记「阳性/阴性」，Babinski 阳性要写清侧别。", "脑膜刺激征：Kernig 征（屈髋 90° 后伸膝＜135° 为阳性）、Brudzinski 征（屈颈引起屈髋屈膝）。", "感觉检查：轻触觉、针刺觉、温度觉，按 C2—S5 关键点记录，用于脊髓损伤平面判定（ASIA）。"]], ["提示", "p", "评定总论最爱考「信度 vs 效度」的区分：信度是「测得稳」，效度是「测得准」。答评定目的时写三条——判断功能障碍的性质与程度、确定康复目标与方案、评价疗效与预后。别漏「量化」两个字，这是康复评定区别于临床查体的核心。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 1 章 总论、第 2 章 人体形态评定、第 3 章 神经反射评定；《康复医学》第 7 版 第 3 章 康复医学评定。"]]}, {"k": "pd-jili", "n": "肌力评定", "c": "MMT 与等速/握力等定量方法", "p": ["MMT 0—5 级判断标准与体位固定", "等长、等张、等速测试的适用与差异", "握力计、背力计、便携式测力", "禁忌：骨折未稳、术后早期、疼痛剧烈"], "t": "MMT 的 3 级与 4 级最容易混：能否抗重力、能否抗阻力。", "kw": ["肌力", "MMT", "徒手肌力", "等速", "握力"], "d": [["怎么理解", "p", "肌力评定是康复科最基础的一把尺：它决定患者能不能站、能不能走、能不能自己穿衣，也决定训练该从哪一级开始。临床上 90% 的「练力量」都要先回答两个问题——现在几级、目标几级。所以 MMT 的分级标准必须能默写，而且每一级都要能说出「用什么姿势、抗不抗重力、加不加阻力」。"], ["教材定义", "p", "肌力：指肌肉主动收缩时所能产生的最大力量，受肌肉横截面积、募集运动单位数量、初长度与收缩速度影响。徒手肌力评定（MMT，Lovett 分级）：在特定体位下，让患者主动收缩肌肉完成关节全范围活动，检查者通过「能否触及收缩、能否完成全 ROM、能否抗重力、能否抗阻力」四级判断，把肌力分为 0—5 级。"], ["MMT 0—5 级（默写这张表）", "table", [["级别", "判断标准（缺一不可）", "操作要点与举例（股四头肌）"], ["0 级", "触不到肌肉收缩", "仰卧伸膝位，嘱伸膝，股四头肌无收缩"], ["1 级", "可触及收缩，但无关节运动", "触及髌上收缩，小腿不动"], ["2 级", "消除重力下可完成全 ROM", "侧卧（患侧在下），伸膝可完成全范围"], ["3 级", "抗重力可完成全 ROM，不能抗阻力", "仰卧，能主动伸膝至 0°"], ["4 级", "抗重力 + 部分阻力完成全 ROM", "仰卧，能伸膝，加中等阻力后仍可完成"], ["5 级", "抗重力 + 最大阻力，与健侧对称", "仰卧，加最大阻力仍可完成全 ROM，双侧对称"]]], ["等长 / 等张 / 等速（三种测试怎么选）", "table", [["方式", "指标", "设备", "适用与注意"], ["等长收缩", "最大随意收缩力（MVC），kg 或 N", "手持测力计、拉力计、握力计", "关节不动、无痛部位适用；骨折早期、术后制动期首选"], ["等张收缩", "1RM（一次最大重复负荷）、重复次数", "哑铃、弹力带、器械", "更接近日常动作；需注意全程关节稳定"], ["等速收缩", "峰力矩 PT、相对峰力矩 PT/BW、总功、平均功率、耐力比", "等速肌力测试仪（常见 60°/s 测力、180°/s 测耐力）", "客观、可重复；但设备贵，急性期与关节不稳慎用"]]], ["握力与临床阈值", "ul", ["握力用握力计，坐位、肘屈 90°、测 3 次取最大值（间隔 30 s）。", "参考：成年男性约 30—45 kg、女性约 20—30 kg（随年龄下降）；握力体重指数（握力/体重×100）＞50 为正常。", "握力是肌少症筛查指标之一：男性＜28 kg、女性＜18 kg 提示肌肉力量不足（亚洲工作组 AWGS 标准）。", "手握力也是术后与重症的预后指标：握力低者并发症与住院时间更长。"]], ["禁忌与质量控制", "ul", ["禁忌：骨折未愈合、关节急性炎症或积液、术后早期（未获许可）、剧烈疼痛、严重骨质疏松、心血管不稳定（不稳定的心绞痛、未控制的高血压）。", "质量控制：固定体位与固定点、先健侧后患侧、同一检查者复评、疲劳前完成（先测健侧再测患侧可能受疲劳影响，注意顺序）。", "记录：级别 + 部位 + 侧别 + 体位 + 是否疼痛，如「右膝伸肌 MMT 4 级（仰卧，抗部分阻力），伸膝末 10° 疼痛」。"]], ["提示", "p", "MMT 三个高频错点：① 2 级写成「能活动」——必须是「消除重力下全 ROM」；② 4 级写成「能抗阻力」——必须是「抗重力 + 部分阻力、未达正常」；③ 忘记写体位。等速测试题记住两个角速度：60°/s 测最大力量、180°/s 测耐力。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 9 章 肌力评定；《物理治疗学》第 3 版 第 6 章 肌力训练；AWGS 2019 肌少症共识（握力切点）。"]]}, {"k": "pd-jizhangli", "n": "肌张力评定", "c": "肌张力的定义、Ashworth 分级与痉挛处理思路", "p": ["肌张力是静息状态下的肌肉阻力", "改良 Ashworth 0—4 级（含 1+）", "痉挛与僵硬、齿轮样、折刀样的区别", "评定要固定体位与速度，减少主观误差"], "t": "1+ 级是高频考点：ROM 后 1/2 出现阻力。", "kw": ["肌张力", "Ashworth", "痉挛", "僵硬", "张力"], "d": [["怎么理解", "p", "肌张力是「静息时的紧张度」，不是力量。临床上最常混淆的是「肌张力高」和「肌力强」——脑卒中早期软瘫是肌张力低但肌力也低，痉挛期是肌张力高但主动力量仍不足。判断痉挛要看「速度依赖性」：被动活动越快阻力越大，这是痉挛；速度无关、全程铅管样阻力，是强直。"], ["教材定义（三个概念一起背）", "p", "① 肌张力：指肌肉在静息状态下的紧张度，是维持身体姿势与正常运动的基础，由牵张反射与高级中枢调控共同决定。② 痉挛（spasticity）：由牵张反射兴奋性增高所致的、以速度依赖的紧张性牵张反射增强为特征的运动障碍，常伴腱反射亢进，是上运动神经元综合征的一部分。③ 僵硬（rigidity）：被动活动时阻力与速度无关、呈铅管样或齿轮样，见于锥体外系病变（帕金森病）。"], ["分类与常见病（表格区分）", "table", [["类型", "表现", "常见疾病"], ["肌张力降低（弛缓）", "被动活动阻力小、关节活动范围过大、腱反射减弱", "脑卒中软瘫期、周围神经损伤、脊髓休克期、小脑病变"], ["痉挛（速度依赖）", "快速被动活动阻力大、慢速阻力小；腱反射亢进；可有阵挛", "脑卒中痉挛期、脑瘫、脊髓损伤（上运动神经元）"], ["僵硬（速度无关）", "铅管样或齿轮样阻力、可伴震颤", "帕金森病、锥体外系病变"], ["肌张力障碍", "持续性或间歇性肌肉收缩导致异常姿势与重复运动", "扭转痉挛、痉挛性斜颈"]]], ["Ashworth 与改良 Ashworth（默写）", "table", [["级别", "改良 Ashworth 标准（MAS 亦可按 0—4 记）"], ["0 级", "无肌张力增加"], ["1 级", "肌张力轻度增加：被动屈伸时在 ROM 末段出现最小阻力"], ["1+ 级", "肌张力轻度增加：ROM 前 1/2 出现「卡住」感，后 1/2 阻力减小"], ["2 级", "肌张力较明显增加：ROM 大部分范围内阻力明显增高，但受累部分仍易被移动"], ["3 级", "肌张力显著增加：被动活动困难"], ["4 级", "受累部分僵直，不能屈伸"]]], ["评定方法（四种，按场景用）", "ul", ["被动活动评定：以「快慢两种速度」分别活动关节，比较阻力差异，判断是否速度依赖。", "钟摆试验：让小腿自然摆动，记录摆动次数与幅度，痉挛侧摆动衰减快。", "改良 Tardieu 量表：记录「出现阻力时的角度 R1」与「被动活动到极限的角度 R2」，角度差反映痉挛程度，比 Ashworth 更能反映速度依赖。", "综合量表：Penn 痉挛频率量表（按痉挛发作频率）、痉挛频率与程度评分；脊髓损伤可用 WISCI 配合步行评估。"]], ["痉挛的处理（剂量要写出来）", "table", [["手段", "具体做法与剂量", "注意"], ["体位与良肢位", "抗痉挛体位摆放，每 2 h 变换一次；患侧上肢伸展、下肢屈曲位", "预防挛缩，是基础措施"], ["被动牵伸", "每次持续 30 s、重复 3—5 次、每日 2—3 次；缓慢持续，不弹震", "急性炎症、异位骨化、骨折未愈禁牵伸"], ["运动疗法", "任务导向训练 + 主动肌-拮抗肌交替控制；Bobath 抑制异常模式", "训练强度以不诱发阵挛为度"], ["口服药", "巴氯芬 5 mg bid 起，每 3—5 天加 5 mg，最大 80 mg/d；替扎尼定、丹曲林按医嘱", "巴氯芬骤停可致反跳性痉挛，须渐减"], ["肉毒毒素", "BTX-A 按肌群注射，常用 100—400 U/次（依产品与部位），3—6 个月重复", "需超声/肌电定位，注意剂量上限"], ["手术/泵", "选择性脊神经后根切断（SPR）、鞘内巴氯芬泵", "用于难治性重度痉挛"]]], ["提示", "p", "Ashworth 靠「阻力」判断，最容易混的是 1 级与 1+ 级：1 级只在 ROM 末段有阻力，1+ 级在前半段就有卡住感。答痉挛定义必须写「速度依赖」，这是与强直的分水岭。处理痉挛的题，先写体位与牵伸（基础），再写药物与肉毒，顺序不能倒。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 8 章 肌张力评定；《物理治疗学》第 3 版 第 4 章 肌肉牵伸技术、《康复医学》第 7 版 第 4 章 康复治疗技术（痉挛管理）。"]]}, {"k": "pd-rom", "n": "关节活动度评定", "c": "ROM 测量方法与记录", "p": ["量角器三要素：轴心、固定臂、移动臂", "主动 ROM 与被动 ROM 的差值意义", "各关节正常参考值与测量体位", "记录格式：关节-运动-角度-体位"], "t": "主动<被动提示肌无力或疼痛；两者均限制提示关节本身。", "kw": ["关节活动度", "ROM", "量角器", "活动范围"], "d": [["怎么理解", "p", "关节活动度（ROM）是康复评定里最「硬」的指标：它不依赖患者配合度，量角器摆上去就是数字，所以既用于定目标（「4 周膝屈曲到 90°」），也用于判断能不能做某个训练（ROM 不到 90° 就做不了标准下蹲）。要分清主动与被动：AROM 反映「能不能自己动」，PROM 反映「关节本身能到哪」，两者一比较，问题出在肌肉还是关节就清楚了。"], ["教材定义（背这两句）", "p", "① 关节活动度：指关节运动时所通过的运动弧或转动的角度，分主动活动度（AROM，患者自主肌肉收缩完成）与被动活动度（PROM，外力完成）。② 关节活动度评定：用量角器测量关节各方向活动的角度，判断关节功能受限的程度与原因，为制定训练方案和判定疗效提供依据。记录格式统一写「起始位—终止位」，如膝关节屈曲 0°—135°。"], ["正常值（成人主要关节，默写常用项）", "table", [["关节", "运动方向", "正常 ROM", "测量体位（轴心—固定臂—移动臂）"], ["肩", "前屈 / 后伸", "0—180° / 0—60°", "仰卧，肩峰—腋中线—肱骨外上髁"], ["肩", "外展 / 内收", "0—180° / 0—45°", "仰卧，肩峰—身体纵轴—肱骨长轴"], ["肩", "外旋 / 内旋", "0—90° / 0—70°", "仰卧屈肘 90°，鹰嘴—尺骨—腕背侧"], ["肘", "屈曲 / 伸展", "0—150° / 0—10°（过伸）", "仰卧，肱骨外上髁—肱骨长轴—桡骨茎突"], ["腕", "背伸 / 掌屈", "0—70° / 0—80°", "前臂旋前，腕背中点—前臂背侧—第 3 掌骨"], ["髋", "屈曲 / 伸展", "0—125° / 0—15°", "仰卧，股骨大转子—躯干纵轴—股骨外髁"], ["髋", "外展 / 内收", "0—45° / 0—30°", "仰卧，髂前上棘—髂前上棘连线—股骨纵轴"], ["膝", "屈曲 / 伸展", "0—135° / 0°（过伸 5°—10°）", "仰卧，股骨外髁—股骨纵轴—腓骨外踝"], ["踝", "背屈 / 跖屈", "0—20° / 0—50°", "仰卧，外踝—腓骨纵轴—第 5 跖骨"]]], ["AROM 与 PROM 的差值说明什么（考点）", "table", [["情况", "判断", "常见原因", "下一步查什么"], ["AROM 正常、PROM 正常", "关节与肌力均无明显问题", "—", "查肌力、协调、步态"], ["AROM＜PROM，PROM 正常", "关节没问题，主动动不了", "肌力不足、疼痛抑制、肌腱断裂、神经损伤", "MMT、疼痛评估、超声/肌电"], ["AROM＝PROM，均受限", "关节本身受限", "关节囊挛缩、骨性阻挡、关节内游离体、强直", "X 线/CT、关节活动末端感觉"], ["PROM 大于正常", "关节不稳或韧带松弛", "韧带损伤、弛缓性瘫痪、Ehlers-Danlos", "应力试验、肌张力评估"]]], ["测量方法与质量控制", "ul", ["工具：通用量角器（大/小号）、方盘量角器、电子角度计、倾角仪；脊柱用皮尺（Schober 试验：10 cm 标记，前屈增加＜5 cm 提示受限）。", "三点定位：轴心对准关节运动轴、固定臂对准近端骨标志、移动臂对准远端骨标志；同一患者固定同一测量者。", "读数精度 1°—5°，同一关节重复测 3 次取均值；记录「主动/被动」两组数字。", "常见误差：软组织遮挡摸不到骨性标志、未固定近端（代偿）、测量时疼痛致保护性收缩、忘记写明体位。"]], ["关节活动受限的处理对应（写方案用）", "table", [["原因", "判断依据", "主要手段与剂量"], ["软组织短缩/挛缩", "末端感觉「硬而渐止」，PROM 受限", "持续牵伸 30 s×3—5 次/日；热敷 15—20 min 后牵伸；支具/矫形器夜间固定"], ["关节囊受限", "末端「紧而实」，各方向普遍受限", "关节松动术（Maitland Ⅱ—Ⅳ 级）10—15 min/次、每日 1 次；配合牵伸"], ["肌力不足", "AROM＜PROM，MMT 3 级以下", "抗阻训练 8—12 RM×2—3 组、每周 3 次；先助力→主动→抗阻"], ["疼痛/痉挛", "活动到某角度即痛或阻力突增", "先镇痛（冷敷/理疗）、抗痉挛体位、必要时药物；疼痛评分＞4 分不强行拉 ROM"], ["骨性阻挡", "末端「骨性硬止」，影像可见", "不强行牵伸；评估手术或代偿训练"]]], ["提示", "p", "最容易丢分的三点：① 只记一个方向的角度，忘了写体位与轴心；② 把 AROM＜PROM 直接判成「关节挛缩」（其实相反，是肌肉/疼痛问题）；③ 膝伸展正常值写成 0—135°（应是屈曲 0—135°、伸展 0°，可有过伸 5°—10°）。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 10 章 关节活动度评定；《物理治疗学》第 3 版 第 2 章 关节活动技术、第 5 章 关节松动技术。"]]}, {"k": "pd-pingheng", "n": "平衡与协调评定", "c": "平衡分级、Berg/TUG 与协调测试", "p": ["静态、动态、反应性平衡三类", "支撑面、重心、感觉整合（视/前庭/本体）", "Berg（0—56）、TUG、单腿站立、功能性前伸", "协调：指鼻、跟膝胫、快速轮替"], "t": "Berg 分级线：<45 跌倒风险明显升高。", "kw": ["平衡", "协调", "Berg", "TUG", "跌倒"], "d": [["怎么理解", "p", "平衡不是「站得稳」这么简单，而是三件事的合成：把感觉信息（视觉、前庭、本体感觉）整合好，把重心控制在支撑面内，还能在受到干扰时快速反应。所以评定要分三层做——静态（睁眼/闭眼站）、动态（够物、转身）、反应性（被推一下能否恢复），只看「能站」会漏掉跌倒高风险的人。"], ["教材定义（背这句）", "p", "平衡：指身体所处的一种姿势状态，不论在何种位置或运动中，当身体重心垂线落在支撑面内时，维持该姿势稳定的能力。分静态平衡（一级）、动态平衡（二级，自动态）、他动态平衡（三级，受到外力时）。支撑面越大、重心越低，平衡越容易。"], ["坐位/站位平衡分级（三级法，床边最常用）", "table", [["级别", "标准", "对应训练起点"], ["Ⅰ 级（静态）", "无支撑下能保持坐/站位，但不能移动重心", "重心转移训练、坐位抛接球"], ["Ⅱ 级（动态/自动态）", "能主动向各方向移动重心并回到原位，无跌倒", "够物训练、单腿站立、平衡垫"], ["Ⅲ 级（他动态）", "能对抗外力（轻推）保持平衡", "抗干扰训练、抛接球、软垫站立"]]], ["量化量表（数字必须记住）", "table", [["量表", "分值范围", "判读与用途"], ["Berg 平衡量表 BBS", "0—56 分（14 项×0—4）", "＜45 分跌倒风险明显升高；＜40 分建议使用助行器；MCID 约 4—5 分"], ["TUG（起立-行走计时）", "秒", "＜10 s 独立；10—20 s 多需辅助；＞20 s 高风险；＞13.5 s 提示跌倒风险"], ["单腿站立试验", "秒", "＜5 s 提示平衡障碍；＜10 s 与跌倒风险相关"], ["Fugl-Meyer 平衡（FMB）", "0—14 分", "脑卒中专用，＜8 分提示平衡差"], ["功能性前伸（FRT）", "cm", "＜15 cm 跌倒风险升高（约 2.5 cm 为 MCID）"], ["Brunel 平衡量表 BBS(UK)", "0—36 分", "含静态/动态/反应性三部分，＜20 分高风险"]]], ["感觉与整合（查「平衡差的原因」）", "ul", ["Romberg 试验：双足并拢、双臂前平举，先睁眼 30 s 再闭眼 30 s；闭眼时明显摇晃为阳性（本体感觉/前庭问题）。", "强化 Romberg：足跟接足尖站立，提高难度。", "单腿站立：睁眼/闭眼各测，比较两侧差。", "前庭功能：甩头试验、Dix-Hallpike（良性阵发性位置性眩晕）。", "足底感觉：10 g 单丝检查，糖尿病周围神经病变是跌倒重要原因。"]], ["提示", "p", "BBS 的 45 分是分水岭（≥45 相对安全、＜45 高风险），这个数字几乎每年考。三级平衡的分级要能说清「静态/自动态/他动态」，很多人只写「坐位平衡 3 级」却说不清 3 级是什么。跌倒评估题一定要写「环境因素」——照明、地毯、门槛、鞋子。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 11 章 协调与平衡功能评定；《康复医学》第 7 版 第 3 章（平衡与步态评定）；Berg 平衡量表原始文献（Berg K, 1989）。"]]}, {"k": "pd-butai", "n": "步态分析", "c": "步态周期、时空参数与异常步态识别", "p": ["步态周期与各期占比（支撑 60%、摆动 40%）", "时空参数：步长、步频、步速、步宽、对称性", "定性（观察/视频）与定量（三维、足印、压力）", "常见异常：偏瘫、剪刀、跨阈、鸭步、疼痛步态"], "t": "先看对称性与步速，再看具体关节角度。", "kw": ["步态", "步行", "足印", "三维", "行走"], "d": [["怎么理解", "p", "步态分析是把「走路」拆成时间与空间两组数字：时间上分支撑相与摆动相，空间上量步长、步宽、足偏角。异常步态的价值在于「从外观反推病因」——划圈步态指向偏瘫痉挛，跨阈步态指向足下垂（腓总神经），鸭步指向近端肌无力。评定的终点不是描述，而是给出「哪一期、哪一侧、差多少」的结论。"], ["教材定义（背这句 + 两个比例）", "p", "步行周期（gait cycle）：从一侧足跟着地到该侧足跟再次着地的过程，分支撑相（stance，约占 60%）与摆动相（swing，约占 40%）；双支撑期约占 20%（随步速增加而缩短）。步态分析：通过目测或仪器，对步行时的时空参数、关节运动与肌肉活动进行测量与判断的方法。"], ["核心参数与正常值", "table", [["参数", "定义", "正常参考值"], ["步长（step length）", "一侧足跟着地到对侧足跟着地的距离", "约 70—80 cm（成人）"], ["跨步长（stride length）", "同一侧足跟两次着地之间的距离（=两倍步长）", "约 140—160 cm"], ["步宽（step width）", "两足中线之间的距离", "约 5—10 cm"], ["足偏角（foot angle）", "足纵轴与前进方向的夹角", "约 7°（外旋 5°—10°）"], ["步频（cadence）", "每分钟步数", "约 100—120 步/分"], ["步速（velocity）", "单位时间行走距离", "约 1.2—1.4 m/s；＞0.8 m/s 可社区行走"]]], ["传统八期（RLA 分期，能默写更好）", "table", [["支撑相（60%）", "摆动相（40%）"], ["① 首次着地 initial contact", "⑤ 摆动前期 initial swing"], ["② 承重反应 loading response", "⑥ 摆动中期 mid swing"], ["③ 支撑中期 mid stance", "⑦ 摆动末期 terminal swing"], ["④ 支撑末期 terminal stance", "（部分教材把 ⑦ 分入末期）"]]], ["常见异常步态与病因（表格对照）", "table", [["步态", "外观特征", "常见病因"], ["偏瘫划圈步态", "患腿伸直、足下垂内翻、向外划圈", "脑卒中后痉挛（伸肌协同模式）"], ["剪刀步态", "双膝内收交叉、足尖着地", "脑瘫、脊髓损伤痉挛型"], ["跨阈步态", "抬腿过高、足尖下垂拍地", "腓总神经损伤、足下垂"], ["鸭步（臀中肌步态）", "躯干左右摇摆、骨盆下沉", "臀中肌无力、髋关节病变"], ["共济失调步态", "步基宽、左右摇晃、直线行走困难", "小脑病变、深感觉障碍"], ["疼痛步态（减痛步态）", "患侧支撑期缩短、身体向健侧倾", "骨关节炎、骨折、足底筋膜炎"], ["帕金森步态", "起步困难、小碎步、前冲（慌张步态）", "帕金森病"]]], ["评定工具与选法", "ul", ["目测观察法：从前方、侧方、后方各看一遍，记录关节角度与躯干偏移；简单但依赖经验，信度一般。", "10 m 步行试验：测舒适速度与最大速度，＞0.8 m/s 提示可社区行走；脑卒中 MCID 约 0.16 m/s。", "6 分钟步行试验 6MWT：健康成人约 400—700 m；慢阻肺 MCID 约 30 m。", "TUG：兼顾起立、步行、转身，＞13.5 s 跌倒风险升高。", "三维步态分析（Vicon 等）：测关节角度曲线、地面反作用力、肌电；用于科研、复杂畸形与术前评估。"]], ["提示", "p", "支撑相 60%、摆动相 40%、双支撑 20% 这三个比例必背。步速 0.8 m/s 是「能不能出门」的临床分界线。答题时把「观察—参数—结论—干预」四段写完：如划圈步态→摆动相足下垂内翻→需踝足矫形器 + 摆动相屈膝训练。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 12 章 步态分析；《康复医学》第 7 版 第 3 章（步态评定与 6MWT）；Perry & Burnfield《Gait Analysis: Normal and Pathological Function》。"]]}, {"k": "pd-adl", "n": "ADL、生活质量与环境评定", "c": "日常生活能力、参与与环境因素评定", "p": ["Barthel/MBI（0—100）与 FIM（18 项）差异", "IADL：购物、做饭、理财、用药", "生活质量：SF-36、WHOQOL", "环境：家居、无障碍、社区资源"], "t": "Barthel 分级的四个界值要背：60、40、20。", "kw": ["ADL", "日常生活", "生活质量", "社会功能", "环境评定", "Barthel", "FIM"], "d": [["怎么理解", "p", "ADL 是康复的「结果指标」——治疗做得再漂亮，患者能不能自己穿衣、上厕所、出门，才是他关心的。所以 ADL 评定的作用有三个：定基线（现在多少分）、定目标（出院要到多少分）、定出院去向（回家/社区/护理机构）。Barthel 指数之所以被用了几十年，是因为它简单、可重复、和结局相关性强。"], ["教材定义（背这句 + 两个分型）", "p", "日常生活活动能力（ADL）：指人维持生存及适应生存环境而每天必须反复进行的最基本活动，包括进食、穿衣、洗漱、如厕、转移、步行、上下楼梯、洗澡等。分基础性 ADL（BADL，自理类）与工具性 ADL（IADL，购物、做饭、理财、用药、使用电话与交通工具）。"], ["Barthel 指数 10 项（分值表，必背）", "table", [["项目", "满分", "分级标准（示例）"], ["进食", "10", "10 独立；5 需部分帮助；0 需极大帮助/完全依赖"], ["洗澡", "5", "5 独立；0 依赖"], ["修饰（洗脸刷牙剃须）", "5", "5 独立；0 依赖"], ["穿衣", "10", "10 独立；5 需部分帮助；0 依赖"], ["大便控制", "10", "10 能控制；5 偶失禁；0 失禁"], ["小便控制", "10", "10 能控制；5 偶失禁；0 失禁"], ["如厕", "10", "10 独立；5 部分帮助；0 依赖"], ["床椅转移", "15", "15 独立；10 少量帮助；5 大量帮助；0 完全依赖"], ["平地步行", "15", "15 独立走 45 m；10 需帮助；5 用轮椅独立；0 不能"], ["上下楼梯", "10", "10 独立；5 需帮助；0 不能"]]], ["判读与配套量表", "table", [["量表", "范围", "判读"], ["Barthel 指数（BI）", "0—100", "≤40 重度依赖（多需住院/护理）；41—60 中度；61—99 轻度；100 独立"], ["改良 Barthel（MBI）", "0—100", "5 级：0—20 完全依赖、21—40 重度、41—60 中度、61—79 轻度、80—100 基本独立"], ["FIM", "18—126（18 项×1—7）", "126 完全独立；108—125 基本独立；90—107 轻度依赖；72—89 中度；54—71 重度；18—53 完全依赖"], ["Katz ADL", "6 项", "按独立/依赖排序，用于老年人功能分级"], ["Lawton IADL", "8 项（女）/5 项（男）", "评估购物、做饭、理财、用药、电话、洗衣、交通"]]], ["怎么测（避免把「能」测成「说」）", "ul", ["以「实际观察 + 患者/照护者报告」结合，能观察的项目（转移、步行、进食）必须现场看。", "评分看「实际完成需要多少帮助」，不看「能不能做一次」；按最近 24—48 h 的通常状态评。", "环境要写明：有无扶手、助行器、坐便器高度；同一患者前后评定环境应一致。", "认知障碍者用「实际表现」而非自述；失语者可用演示 + 照护者补充。", "记录格式：总分 + 分项异常 + 依赖项目清单，如「BI 45 分：洗澡 0、穿衣 5、上下楼 0」。"]], ["从分数到出院去向（会算才有用）", "table", [["BI 分值", "功能状态", "常见去向与配置"], ["0—20", "完全依赖", "护理机构/长期照护；家属培训 + 护理床、气垫床"], ["21—40", "重度依赖", "康复病房继续训练；辅助器具 + 家居改造（扶手、坐便椅）"], ["41—60", "中度依赖", "社区康复 + 门诊训练；部分辅助（助行器、穿袜器）"], ["61—99", "轻度依赖", "居家为主，门诊复评；IADL 训练（购物、做饭）"], ["100", "独立", "回归社区/工作；预防性训练与随访"]]], ["提示", "p", "Barthel 的分值分布要记牢：转移 15、步行 15 是最高两项（因为最能反映独立性），洗澡、修饰各 5 分。答题常见错误：把「部分帮助」和「极大帮助」混着写；漏写「45 m」这个步行距离。改良 Barthel 与 Barthel 的判读分界不同（MBI 80 分以上才算基本独立），别混用。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 14 章 日常生活活动能力评定；《康复医学》第 7 版 第 3 章（ADL 与 IADL）；Mahoney & Barthel（1965）原始量表。"]]}, {"k": "pd-renzhi", "n": "认知评定", "c": "注意、记忆、执行与筛查工具", "p": ["定向、注意、记忆、语言、视空间、执行六域", "MMSE（30 分）与 MoCA（30 分）的敏感度差异", "成套测验：RBMT、WCST、连线测验", "意识障碍：GCS 与 CRS-R"], "t": "MoCA 对轻度认知障碍更敏感，教育年限要校正。", "kw": ["认知", "MMSE", "MoCA", "记忆", "注意", "执行"], "d": [["怎么理解", "p", "认知评定要回答的是「他为什么学不会」：同样是偏瘫，有人两周学会穿衣，有人三个月还在原地，差别常在注意与执行功能。所以认知评定不是给患者贴「痴呆」标签，而是找到训练能不能进行、要用什么方式教（分步骤？给提示？改环境？）。"], ["教材定义（背这句 + 六个域）", "p", "认知：指人脑接受外界信息，经过加工处理，转换成内在的心理活动，进而支配人的行为的过程。认知功能评定包括六个域：注意、记忆、执行功能、语言、视空间、定向力（部分教材加「计算与判断」）。评定的目的是判断认知障碍的类型与程度、指导训练方式、预测康复结局。"], ["常用量表与切点（数字必背）", "table", [["量表", "范围", "切点与用途"], ["MMSE", "0—30", "文盲≤17、小学≤20、中学及以上≤24 提示认知障碍；受教育程度必须校正"], ["MoCA", "0—30", "＜26 提示轻度认知障碍（MCI）；受教育＜12 年加 1 分；对执行与视空间更敏感"], ["MoCA-B（基础版）", "0—30", "用于低教育程度人群"], ["画钟试验 CDT", "0—4 或 0—3", "4 分法：闭合圆、数字位置、12 个数字、指针位置各 1 分"], ["连线测验 TMT-A/B", "秒", "A 段＞78 s、B 段＞273 s（约）提示异常；B-A 差值反映执行功能"], ["数字广度", "顺背 7±2、倒背 4±1", "注意与工作记忆"], ["Rivermead 行为记忆测验", "0—24", "日常记忆功能，＞16 分相对正常"]]], ["六个域怎么查（一项一项对）", "table", [["认知域", "快速筛查方法", "异常表现"], ["注意", "数字广度、划消试验、连续减 7", "易分心、训练中途走神、无法完成两步指令"], ["记忆", "3 词回忆（5 min 后）、Rivermead", "记不住治疗师交代的动作、重复问同一问题"], ["执行功能", "TMT-B、Stroop、Luria 三步动作", "计划性差、不能转换、穿衣顺序错乱"], ["语言", "命名（10 个实物）、复述、阅读", "找词困难、答非所问（需与失语区分）"], ["视空间", "复制立方体、画钟、线段二等分", "穿衣左右颠倒、撞门框、忽略患侧（偏侧忽略）"], ["定向力", "时间、地点、人物", "不知年月、在病房迷路"]]], ["易混概念（选择/简答都爱考）", "ul", ["失语症：语言中枢受损，听、说、读、写某一或多个方面受损，智力相对保留（要与认知障碍区分）。", "构音障碍：发音器官肌肉控制异常，语言内容与理解正常，只是「说不清」。", "失用症：无瘫痪、无感觉障碍、无共济失调，却不能按指令完成有目的动作（观念性/观念运动性/结构性失用）。", "失认症：无感觉通路障碍，却不能识别（视觉失认、触觉失认、偏侧忽略属注意-空间障碍）。", "谵妄与痴呆：谵妄起病急、波动、注意障碍突出；痴呆慢性进展，意识清楚。"]], ["提示", "p", "MMSE 24 分、MoCA 26 分是两条必须记住的线，且都要「按受教育年限校正」。答题别把 MoCA 与 MMSE 混着写：MMSE 偏重记忆与定向、对轻度障碍不敏感；MoCA 对执行与视空间更敏感，用于 MCI 筛查。评定前先确认患者清醒、能听清、能看清——感官问题会造成假性认知障碍。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 5 章 认知功能评定；《康复医学》第 7 版 第 3 章（认知与知觉评定）；MoCA 官方中文版评分说明（Nasreddine, 2005）。"]]}, {"k": "pd-yanyu", "n": "言语语言评定", "c": "失语、构音、嗓音与吞咽的评定框架", "p": ["失语：WAB、ABC、波士顿诊断性失语检查", "构音：Frenchay、音节清晰度", "嗓音：GRBAS、声学分析", "吞咽：洼田饮水、VFSS、FEES"], "t": "先分“语言（失语）”与“言语（构音）”两件事。", "kw": ["言语", "语言", "失语", "构音", "评定", "WAB"], "d": [["怎么理解", "p", "言语-语言评定要先分三类，否则治疗方向全错：失语症是「语言符号系统」坏了（听不懂、说不出、读不了），构音障碍是「发音器官执行」坏了（内容是好的，只是不清），言语失用是「按程序组装发音动作」坏了（努力、摸索、不一致）。三者常同时存在（如脑卒中合并构音障碍），评定要分开记。"], ["教材定义（三个概念对比背）", "p", "① 失语症：因大脑语言中枢及其相关区域病变，导致后天习得的语言功能受损或丧失，表现为听、说、读、写某一或几方面障碍，是语言障碍而非言语障碍。② 构音障碍：因神经肌肉病变导致与言语有关的肌肉麻痹、收缩力减弱或运动不协调，出现发音不准、吐字不清，语言内容与语法正常。③ 言语失用：因大脑运动区或运动前区损伤，导致发音动作的程序编排障碍，表现为发音摸索、错误不一致、自我纠正。"], ["失语症分类（记六型 + 关键特征）", "table", [["类型", "自发言语", "听理解", "复述", "命名", "病变部位"], ["Broca 失语（运动性）", "非流畅、费力、电报式", "相对好", "差", "差", "优势侧额下回后部（Broca 区）"], ["Wernicke 失语（感觉性）", "流畅但空洞、错语多", "差", "差", "差", "优势侧颞上回后部（Wernicke 区）"], ["传导性失语", "流畅、错语", "较好", "明显差（不成比例）", "差", "弓状束/缘上回"], ["经皮质运动性", "非流畅", "好", "好", "差", "Broca 区周围/前额"], ["经皮质感觉性", "流畅、空洞", "差", "好", "差", "颞顶交界"], ["完全性失语", "极少/刻板", "差", "差", "差", "优势侧大脑中动脉大面积"], ["命名性失语", "流畅", "好", "好", "突出差（找词困难）", "颞中回后部/角回"]]], ["量化评定（WAB 与 AQ 要会算）", "table", [["项目", "满分量表", "计分要点"], ["自发言语", "20 分", "信息量 0—10 + 流畅度 0—10"], ["听理解", "200 分（折算 10）", "是/否、听词辨认、执行指令"], ["复述", "100 分（折算 10）", "单词到句子逐级"], ["命名", "100 分（折算 10）", "实物、图片、句子补全"], ["阅读/书写", "各 100 分（折算 10）", "用于失读/失写评估"], ["AQ 计算", "0—100", "AQ＝（自发言语 + 听理解/20 + 复述/10 + 命名/10）×2；AQ＜93.8 提示失语，93.8—98 为可疑"]]], ["构音障碍与吞咽（一起查，别漏）", "ul", ["Frenchay 构音障碍评定：8 项（反射、呼吸、唇、颌、软腭、喉、舌、言语可懂度），每项 0—3 分（a—e 级）。", "言语可懂度分级：0 无法听懂—4 完全可懂（或按 25%/50%/75% 理解率记）。", "吞咽筛查：洼田饮水试验（30 ml 温水，1—5 级；3 级以上需进一步评估）；反复唾液吞咽试验（30 s 内＜3 次提示异常）。", "吞咽金标准：VFSS（视频荧光吞咽造影）与 FEES（纤维内镜吞咽评估）。", "失语者合并构音障碍时，先查构音（可懂度），再查语言（内容），否则会把「说不清」误判成「说不出」。"]], ["提示", "p", "AQ 公式与 93.8 这条线是计算题高频点，必须会代数字。分类题抓住「复述好不好」这一个关键：复述好→经皮质（运动/感觉）；复述差且理解差→Wernicke 或完全性；复述不成比例差→传导性。构音障碍与失语症的区别写在纸上是「语言内容是否保留」，落在床边就是「让他指物/写出来」——能指对、写对，就不是失语。"], ["依据", "p", "依据：《语言治疗学》第 3 版 第 5 章 失语症、第 6 章 构音障碍、第 11 章 吞咽障碍；《康复功能评定学》第 3 版 第 6 章 言语-语言功能评定；WAB 中文版评分手册。"]]}, {"k": "pd-xinfei", "n": "心肺功能评定", "c": "心功能、肺功能与运动试验", "p": ["心功能分级（NYHA）、6MWT、心肺运动试验", "肺功能：FEV1、FVC、MVV", "运动试验终止指征与禁忌", "监护指标：心率、血压、SpO₂、Borg"], "t": "6MWT 的禁忌与终止指征是高频考点。", "kw": ["心肺功能", "6MWT", "运动试验", "肺功能", "心功能"], "d": [["怎么理解", "p", "心肺功能评定要回答的是「这个人能承受多大运动量」。它不只服务心肺病人——脑卒中、脊髓损伤、骨科术后的患者同样会因为「一动就喘」而练不起来。所以评定的落脚点是三组数字：静息与运动的生命体征、耐力试验的距离/时间、以及「能做什么强度」（METs）。有了这三组，训练处方才有依据。"], ["教材定义（背这句 + 三个层次）", "p", "心肺功能评定：通过病史、体格检查、生命体征监测、运动试验与肺功能检查，判断心肺系统的储备能力与运动耐量，为制定运动处方、判断预后与评估疗效提供依据。三个层次：① 静息评定（心率、血压、呼吸频率、SpO₂、肺功能）；② 运动试验（6MWT、2 分钟踏步、功率车/平板运动试验、心肺运动试验 CPET）；③ 日常活动耐量换算（METs）。"], ["核心指标与正常值", "table", [["指标", "测量方法", "参考值与判读"], ["静息心率", "安静坐位 5 min 后测 1 min", "60—100 次/分；＞100 为心动过速"], ["血压", "坐位、上臂与心脏同高", "＜140/90 mmHg；运动中出现＞250/115 应终止"], ["6MWD（6 分钟步行距离）", "30 m 走廊往返，鼓励用语统一", "健康成人约 400—700 m；MCID 约 30 m；＜300 m 提示功能受限明显"], ["2 分钟踏步试验", "原地踏步 2 min 计步数", "老年人＜65 步提示运动耐量差"], ["最大摄氧量 VO₂max", "CPET 直接测（呼吸气分析）", "健康成人约 30—50 ml/(kg·min)；＜15 提示重度受限"], ["无氧阈 AT", "CPET 中 VCO₂ 相对 VO₂ 陡增点", "常为 VO₂max 的 50%—60%，是安全训练上限"], ["METs", "1 MET ≈ 3.5 ml/(kg·min) 耗氧", "见下表"]]], ["METs 对照（写运动处方用）", "table", [["METs", "活动", "适用人群"], ["1—2", "卧床、坐位、缓慢洗漱", "急性期、重症"], ["2—3", "平地慢走（3—4 km/h）、穿衣", "术后早期、心衰稳定期"], ["3—4", "中速步行（4—5 km/h）、家务", "冠心病二级预防起步"], ["4—6", "快走（5—6.5 km/h）、上两层楼", "多数心肺康复目标区间"], ["6—8", "慢跑、骑车 15 km/h、游泳", "运动能力较好者"], ["＞8", "快跑、球类对抗", "运动员或年轻健康者"]]], ["运动试验的终止指征（安全底线，必背）", "ul", ["绝对指征：胸痛伴心电图改变、ST 段压低≥2 mm、室速/室颤、收缩压下降＞10 mmHg 伴症状、头晕或共济失调、面色苍白冷汗。", "相对指征：胸痛但无 ECG 改变、ST 改变＜2 mm、血压＞250/115 mmHg、Borg 评分≥17、SpO₂＜88%、患者要求停止。", "6MWT 停止指征：胸痛、难以忍受的呼吸困难、腿抽筋、头晕、SpO₂＜88%。", "试验前准备：禁食 2 h、避免剧烈运动 2 h、备急救药与除颤仪、连续心电与血氧监测。"]], ["危险分层与训练许可", "table", [["分层", "特征", "训练场所与监护"], ["低危", "心功能Ⅰ级、无心律失常、运动试验无缺血、VO₂max＞20", "可居家/社区训练，定期随访"], ["中危", "心功能Ⅱ级、运动试验轻度缺血或血压反应异常", "监护下门诊训练，心电监测"], ["高危", "心功能Ⅲ—Ⅳ级、复杂心律失常、运动中血压下降", "医院内监护训练，逐次评估"]]], ["提示", "p", "6MWT 的正常值与 MCID（30 m）是最高频数字；METs 换算（1 MET＝3.5 ml/kg/min）常考计算；终止指征要背「绝对」那几条。别把 6MWT 与 CPET 混：前者测功能容量、后者测最大能力与无氧阈。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 4 章 心肺功能评定；《康复医学》第 7 版 第 3 章（运动试验）；ATS/ERS 6MWT 技术标准（2002）。"]]}, {"k": "pd-dianshengli", "n": "神经电生理", "c": "肌电图、神经传导与诱发电位", "p": ["EMG：静息/轻收缩/重收缩三相", "NCV：运动与感觉传导，潜伏期与波幅", "SEP、MEP、VEP、BAEP 的用途", "判断：轴索损害 vs 脱髓鞘"], "t": "波幅降→轴索；潜伏期延→脱髓鞘。", "kw": ["电生理", "肌电图", "NCV", "诱发电位", "神经传导"], "d": [["怎么理解", "p", "神经电生理是「用电找病灶」：肌电图看肌肉和神经末梢，神经传导看通路快慢，诱发电位看中枢通路。它最有价值的判断是分型——轴索损伤（波幅下降）还是脱髓鞘（潜伏期延长、传导减慢），因为这决定了恢复速度与预后：脱髓鞘几周可恢复，轴索要几个月且常留后遗症。"], ["教材定义（四个检查各一句）", "p", "① 肌电图（EMG）：用针电极记录肌肉静息与收缩时的电活动，判断神经源性或肌源性损害。② 神经传导速度（NCV）：用表面电极刺激神经并记录其支配肌（运动）或神经本身（感觉）的反应，测潜伏期、波幅与传导速度。③ 诱发电位（EP）：给感官或运动通路特定刺激，记录中枢的诱发反应，含 SEP（体感）、MEP（运动）、BAEP（脑干听觉）、VEP（视觉）。④ 表面肌电（sEMG）：无创记录肌肉活动，用于生物反馈与疲劳评估。"], ["关键参数与正常值", "table", [["参数", "含义", "正常参考"], ["运动传导速度 MCV", "刺激点到记录点距离 ÷ 传导时间", "上肢 50—60 m/s；下肢 40—45 m/s；＜40 提示减慢"], ["远端潜伏期 DML", "刺激点到肌肉反应起始的时间", "正中神经＜4.2 ms、尺神经＜3.4 ms、腓总神经＜5.5 ms（参考值）"], ["复合肌肉动作电位 CMAP 波幅", "所有运动单位电位之和", "正中/尺神经＞5 mV；波幅下降＞50% 提示轴索损害"], ["感觉神经动作电位 SNAP", "感觉神经传导反应", "波幅＞10 μV；糖尿病周围神经病早期即下降"], ["F 波", "逆向传导至前角细胞再返回", "出现率＞70%、潜伏期与身高相关；延长提示近端脱髓鞘"], ["H 反射", "类似单突触反射", "仅腓肠肌易引出，潜伏期延长提示 S1 根性或近端病变"]]], ["EMG 三步看（插入—静息—收缩）", "table", [["状态", "正常表现", "异常与意义"], ["插入电位", "针插入时短暂电活动（＜300 ms）", "延长：失神经早期、肌强直；减弱：肌肉纤维化"], ["静息期", "电静息", "纤颤电位、正锐波＝失神经（伤后 2—3 周出现）；束颤＝慢性失神经"], ["轻收缩", "单个运动单位电位 MUAP，时限 5—15 ms、波幅 100—2000 μV", "时限增宽、波幅增高＝神经再支配（慢性）；时限短、波幅低、多相＝肌源性损害"], ["重收缩", "干扰相（密集、难以分辨单个电位）", "单纯相/减弱干扰＝运动单位丢失（神经源性）"]]], ["轴索 vs 脱髓鞘（考点的核心）", "table", [["项目", "轴索损害", "脱髓鞘"], ["波幅", "明显下降", "正常或轻度下降"], ["潜伏期/传导速度", "正常或轻度减慢", "明显延长/减慢（＜正常下限 60%）"], ["EMG 失神经电位", "有（伤后 2—3 周）", "无（除非继发轴索损害）"], ["恢复速度", "慢（数月，常留后遗症）", "快（数周，多可完全恢复）"], ["典型疾病", "糖尿病周围神经病、神经断裂", "吉兰-巴雷综合征、腕管综合征（早期）、多灶性运动神经病"]]], ["提示", "p", "一句话区分：**波幅看轴索、传导看髓鞘**。EMG 失神经电位出现时间（伤后 2—3 周）常考——太早做肌电图可能「正常」。别把 CMAP（运动）与 SNAP（感觉）写反；腕管综合征早期是脱髓鞘（DML 延长、SNAP 下降），晚期才出现轴索损害（大鱼际萎缩、CMAP 下降）。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 13 章 神经电生理评定；《康复医学》第 7 版 第 3 章（电诊断）；AANEM 神经传导与肌电图实践指南。"]]}, {"k": "zl-huodong", "n": "关节活动与牵伸技术", "c": "维持/改善 ROM 的手法与牵伸", "p": ["被动、主动、主动助力 ROM 训练", "牵伸：静态、动态、PNF、器械", "剂量：30 秒×3—5 次，温热后更有效", "禁忌：新鲜骨折、异位骨化、急性炎症"], "t": "牵伸前先热身；疼痛评分 >4 不做强力牵伸。", "kw": ["关节活动技术", "牵伸", "肌肉牵伸", "ROM训练", "软组织"], "d": [["怎么理解", "p", "关节活动技术是康复治疗里最基础的一层：先让关节能动，才谈得上练力量、练走路。它分的不是「手法好坏」，而是「谁来动」——被动（治疗师动、患者不动）、助力（患者动一部分、治疗师补一部分）、主动（患者自己动）、抗阻（加负荷）。选哪一档只看三个数字：肌力几级、疼痛几分、ROM 差多少。"], ["教材定义（三个层级要说清）", "p", "关节活动技术：指利用各种方法维持或恢复关节活动范围的治疗技术。被动关节活动（PROM）：完全由外力完成，患者无主动收缩，适用于肌力 0—1 级、昏迷、制动期；助力主动活动（AAROM）：患者主动收缩 + 外力辅助完成，适用于肌力 1—2 级；主动活动（AROM）：患者自主完成，适用于肌力 3 级及以上；抗阻活动（RROM）：在主动活动基础上施加阻力，适用于肌力 4—5 级。"], ["四档怎么选（表格对照）", "table", [["方式", "肌力要求", "患者参与", "主要目的", "典型场景"], ["被动 PROM", "0—1 级", "无", "维持 ROM、防挛缩、促循环", "昏迷、脊髓休克期、骨折制动期"], ["助力 AAROM", "1—2 级", "部分", "逐步恢复主动运动、建立正确模式", "脑卒中早期、术后早期"], ["主动 AROM", "3 级", "全部", "维持与增强肌力、协调性", "恢复期、门诊训练"], ["抗阻 RROM", "4—5 级", "全部 + 负荷", "增强肌力与耐力", "恢复后期、运动损伤康复"]]], ["剂量与操作要点（要能写出数字）", "table", [["项目", "被动/助力", "主动/抗阻"], ["重复次数", "每关节各方向 10—30 次", "8—12 RM × 2—3 组"], ["频次", "每日 1—2 次（制动期每日 2 次）", "每周 3—5 次"], ["关节活动幅度", "至疼痛耐受点，不做暴力的终末牵拉", "全 ROM，控制离心阶段 2—3 s"], ["速度", "缓慢（每个方向约 3—5 s）", "向心 1—2 s、离心 2—3 s"], ["注意", "固定近端、托住远端、避免代偿；关节置换术后遵守活动限制", "先热身、避免憋气（Valsalva）、疼痛＞4 分减量"]]], ["禁忌与慎用（答题必写）", "ul", ["绝对禁忌：关节急性炎症/感染、未复位的骨折与脱位、关节内游离体卡阻、异位骨化活动期、深静脉血栓急性期。", "相对慎用：骨质疏松严重（防骨折）、关节置换术后早期（防脱位，髋屈曲＜90°、不内收内旋）、心脏术后（控制心率血压）、疼痛评分＞4 分。", "制动期也要动：卧床患者每日 2 次被动 ROM，可显著减少挛缩与压疮风险。", "关节置换、韧带修复术后：必须按手术医生给定的角度限制执行，不能按「常规」拉到底。"]], ["常见错误（临床带教最常纠正的）", "ul", ["只动大关节、漏掉腕手与踝足——踝背屈丢失最先导致跌倒与足下垂。", "近端不固定，患者用躯干代偿，看着「动了」其实关节没动。", "被动活动做成「甩」——速度过快诱发痉挛与保护性收缩。", "忽略疼痛：活动前不评估，活动后不加冷敷，第二天肿胀加重。"]], ["提示", "p", "答题模板：「肌力 X 级 → 选 Y 方式 → 剂量（次数/频次/幅度）→ 注意与禁忌」。四档的分界点记在肌力上：0—1 被动、1—2 助力、3 主动、4—5 抗阻。别把 AAROM 写成「主动助力」（教材规范叫「助力主动活动」）。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 2 章 关节活动技术；《康复医学》第 7 版 第 4 章 康复治疗技术。"]]}, {"k": "zl-songsdong", "n": "关节松动与手法治疗", "c": "Maitland 分级与脊柱/四肢松动", "p": ["Maitland Ⅰ—Ⅴ 级判断", "附属运动：滚动、滑动、旋转的方向选择", "脊柱松动与神经松动术", "禁忌：不稳、肿瘤、感染、脊髓压迫"], "t": "Ⅴ 级是高速低幅（推扳），不是常规放松。", "kw": ["关节松动", "手法", "Maitland", "推拿", "松动术"], "d": [["怎么理解", "p", "悬吊训练（SET）的本质是「用绳子把重力和不稳定变成训练工具」：吊起来可以减重（让 2 级肌力的人也能动），站在吊带上可以制造不稳定（逼迫深层稳定肌工作）。所以它既能做早期减重训练，也能做后期的核心稳定训练，关键看「减多少重」和「加多少不稳定」。"], ["教材定义（背这句）", "p", "悬吊运动训练（sling exercise training，SET）：利用悬吊带将身体部分或全部悬吊，通过调整悬吊点、减重程度与支撑面稳定性，进行闭链运动、弱链测试与核心稳定训练的方法。核心理念是「先测弱链、再练弱链」——先用低负荷动作找出稳定肌群中的薄弱环节，再针对性训练。"], ["两种用法（减重 vs 不稳定）", "table", [["用途", "设置", "参数", "适用"], ["减重训练", "身体部分悬吊、减少负重", "减重 10%—30% 体重；动作 10—15 次×2—3 组", "肌力 1—2 级、术后早期、疼痛不能负重"], ["核心稳定/弱链训练", "肢体远端悬吊、支撑面不稳定", "静态保持 10—30 s、动态 8—12 次×2—3 组；每周 3 次", "慢性腰痛、颈痛、肩关节不稳、运动员"], ["渐进不稳定", "逐步减少支撑点（双腿→单腿、双点→单点）", "每次训练增加一级难度", "恢复后期、运动表现提升"]]], ["弱链测试怎么做（写操作流程用）", "ul", ["选动作：如仰卧桥式、俯卧平板支撑、侧卧髋外展。", "逐级加载：从双腿支撑开始，逐步改为单腿、增加悬吊高度与杠杆。", "观察三点：能否保持骨盆/脊柱中立位、有无代偿（塌腰、耸肩、骨盆旋转）、能维持多少秒。", "判定：某一级出现明显代偿或维持＜10 s，即为该肌群的「弱链」。", "训练：以弱链动作为主，配合呼吸与腹压控制，2—4 周复测。"]], ["适应证与禁忌", "ul", ["适应证：慢性非特异性腰痛、颈痛、肩袖损伤恢复期、膝关节术后、脑卒中/脊髓损伤的减重步行与核心训练。", "禁忌/慎用：急性椎间盘突出伴神经症状加重、未稳定的骨折、严重骨质疏松、未控制的高血压、眩晕与平衡极差者（需监护）。", "安全性：训练前检查吊带、卡扣、固定点（承重≥150 kg）；地面防滑；高危患者全程监护。"]], ["提示", "p", "SET 的考点是三组数字：减重 10%—30%、静态保持 10—30 s、每周 3 次。弱链测试的流程要能说出来（逐级加载—观察代偿—定弱链）。别把悬吊与牵引混：悬吊是训练（主动），牵引是治疗（被动拉）。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 8 章 悬吊技术；《康复医学》第 7 版 第 4 章（核心稳定训练）。"]]}, {"k": "zl-jili", "n": "肌力训练", "c": "力量训练的类型、强度与进阶", "p": ["等长/等张/等速训练的适用场景", "强度：1RM 的百分比与 RM 方案", "渐进抗阻（DeLorme/Oxford）与离心训练", "禁忌与监护：心血管反应、Valsalva"], "t": "术后早期多等长，中期等张，后期功能性。", "kw": ["肌力训练", "抗阻", "力量训练", "等速训练"], "d": [["怎么理解", "p", "肌力训练的核心不是「多练」，而是「练对强度」。同样练股四头肌，2 级肌力做抗阻只会代偿，5 级肌力只做被动等于浪费。所以先分级、再选方式、再定剂量，这套顺序就是考试与临床的共同语言。"], ["教材定义（三种收缩 + 三条原则）", "p", "肌力训练：通过主动或抗阻运动，使肌肉收缩产生力量，以提高肌力、耐力和爆发力的治疗方法。三种收缩：等长（长度不变、张力增加）、等张（张力不变、长度改变，分向心/离心）、等速（角速度恒定）。三条基本原则：超负荷（负荷＞日常）、渐进抗阻（随力量增长加负荷）、特异性（练什么得什么：练力量得力量，练耐力得耐力）。"], ["按肌力分级选方法（核心表）", "table", [["肌力", "方法", "具体做法", "剂量"], ["0—1 级", "传递神经冲动 / 电刺激", "健侧抗阻时想象患侧用力；NMES 电极置于肌腹", "每日 1—2 次，每次 20 min；想象训练 10 次×3 组"], ["1—2 级", "助力运动 / 悬吊 / 水中", "消除重力（侧卧、悬吊带减重）完成全 ROM", "10—20 次×2—3 组，每日 1 次"], ["3 级", "主动运动", "抗重力全 ROM，不加阻力", "10—15 次×2—3 组，每日 1—2 次"], ["4 级", "抗阻运动（渐进）", "沙袋/弹力带/器械，从 10 RM 起逐步加至 8 RM", "8—12 RM×2—3 组，每周 3 次"], ["5 级", "最大抗阻 / 等速", "等速 60°/s 测力与训练；渐进负荷至 6—8 RM", "每周 2—3 次，间隔 48 h"]]], ["等长 / 等张 / 等速：怎么选（对比表）", "table", [["方式", "优点", "缺点", "适用"], ["等长", "关节不动、安全；可在制动期做", "只在特定角度增益（±20° 内），不提耐力", "骨折术后早期、关节不稳、石膏固定期"], ["等张（向心/离心）", "接近日常动作，易推广", "最弱点决定负荷（力量曲线不均）", "恢复期、健身与运动康复"], ["等速", "全 ROM 恒定阻力、客观可测、离心训练安全", "设备昂贵、需专用仪器", "运动员、科研、精确评估"]]], ["剂量参数（写方案必须有）", "ul", ["强度：力量用 %1RM（60%—85%）或 RM（8—12 RM 增肌、6—8 RM 增力）；耐力用 40%—60% 1RM × 15—25 次。", "组数次数：2—3 组 × 8—12 次；每组间休息 1—2 min。", "频次：每周 2—3 次（同一肌群间隔 48 h）；老年人可从每周 2 次、1—2 组起步。", "进度：每 1—2 周增加 5%—10% 负荷（渐进抗阻 DeLorme 法：10 RM 的 50%/75%/100% 各 10 次）。", "呼吸：用力时呼气，避免憋气（Valsalva）引起血压骤升。"]], ["禁忌与注意", "ul", ["禁忌：骨折未愈合、关节急性炎症、严重骨质疏松、未控制的高血压与心衰、肌腱断裂修复术后早期（按医嘱）。", "注意：训练前热身 5—10 min；训练后拉伸与冷敷（如有肿胀）；疼痛评分＞4 分或训练后 24 h 肿胀加重则减量。", "代偿识别：练股四头肌时出现骨盆前倾与腰椎过伸，说明在「用髋代偿」，须先降低阻力并固定骨盆。"]], ["提示", "p", "最爱考的三点：① 肌力分级与方法对应（0—1 电刺激/想象、1—2 助力、3 主动、4—5 抗阻）；② 等长训练的「±20° 角度特异性」；③ 渐进抗阻的 DeLorme 三组比例（50%/75%/100%）。别把「等张」写成「等长」，两者区别就一句：长度变不变。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 6 章 肌力训练；《康复医学》第 7 版 第 4 章；DeLorme 渐进抗阻原则（1945）。"]]}, {"k": "zl-qianyin", "n": "牵引与悬吊", "c": "颈椎/腰椎牵引与悬吊训练", "p": ["牵引力、时间、体位三要素", "适应证：神经根型颈椎病、腰椎间盘突出", "禁忌：脊髓型、骨质疏松、肿瘤、妊娠", "悬吊：闭链训练与核心稳定"], "t": "牵引中出现新神经症状立刻停止。", "kw": ["牵引", "悬吊", "颈椎牵引", "腰椎牵引"], "d": [["怎么理解", "p", "牵伸解决的是「软组织短了」——肌肉、肌腱、关节囊、瘢痕。它和关节松动术分工明确：牵伸拉的是软组织（末端感觉「软而有弹性、渐止」），松动动的是关节（末端「紧而实」）。牵伸最怕两件事：一是没热身就拉（易拉伤），二是在急性炎症或异位骨化期拉（越拉越糟）。"], ["教材定义（背这句 + 三种类型）", "p", "牵伸技术：指运用外力（人工或器械）牵伸短缩或挛缩的软组织，使其长度延长、关节活动范围改善的治疗技术。分三类：静态牵伸（保持 15—60 s）、动态牵伸（有节律地反复活动至终末范围）、PNF 牵伸（收缩-放松、保持-放松等）。现代证据支持「静态 30 s × 3—5 次」为基本剂量。"], ["剂量与方式（数字必须写）", "table", [["方式", "具体做法", "剂量", "适用"], ["静态牵伸", "缓慢拉至终末范围（有牵拉感但不痛）并保持", "每次 30 s（15—60 s），重复 3—5 次，每日 1—2 次", "挛缩、肌短缩、术后恢复期"], ["动态牵伸", "有控制地反复活动至终末范围", "10—15 次 × 2—3 组", "运动前热身、运动损伤预防"], ["PNF 收缩-放松", "拉至终末→等长抗阻 5—10 s→放松→再拉更远", "3—5 个循环", "腘绳肌短缩、肩关节活动受限"], ["PNF 保持-放松-主动收缩", "等长收缩后主动向相反方向运动", "3—5 个循环", "提高主动 ROM"], ["持续机械牵伸", "低负荷长时间（支具、牵引）", "每次 20—30 min，每日 1—2 次", "顽固性挛缩、烧伤瘢痕"]]], ["温度与时机（常被忽略的细节）", "ul", ["热疗后牵伸效果更好：热敷/超声波 15—20 min 后组织延展性提高，牵伸更省力。", "冷疗用于运动后或痉挛明显者：冷敷 10—15 min 可短暂降低肌张力，再牵伸。", "牵伸后 10—15 min 内做主动运动，把新获得的活动度「用掉」，否则很快回缩。", "夜间支具/矫形器维持角度，是防回缩的关键（尤其踝背屈、肘屈曲挛缩）。"]], ["禁忌与风险", "ul", ["禁忌：骨折未愈合、关节急性炎症或感染、异位骨化活动期、严重骨质疏松、血肿或新鲜软组织损伤（48—72 h 内）、牵伸区有恶性肿瘤。", "风险：过度牵伸致肌肉撕裂、关节囊松弛（尤其肩关节前向不稳者做大幅外旋牵伸）、神经牵拉伤（坐骨神经、臂丛）。", "脊髓损伤/脑卒中痉挛肌：暴力快速牵伸会诱发痉挛加重，应缓慢持续 + 先降张力。"]], ["提示", "p", "剂量写成「30 s × 3—5 次/日」就对了，只写「适当牵伸」不得分。区分牵伸与松动的一句话：末端感觉「软」是软组织，选牵伸；「硬/骨性」是关节，选松动或不牵伸。运动前用动态、运动后用静态，顺序别倒。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 4 章 肌肉牵伸技术；《康复医学》第 7 版 第 4 章；PNF 技术（Knott & Voss）。"]]}, {"k": "zl-zhuanyi", "n": "转移与步行训练", "c": "床—椅—厕转移与步行辅助", "p": ["转移：独立、辅助、机械三类", "偏瘫转移的技巧侧（健侧带动）", "步行训练：平行杠—助行器—拐—独立", "拐杖高度与三点/四点步"], "t": "偏瘫患者“健侧先动”的规则要能举例。", "kw": ["转移", "步行训练", "体位转移", "助行", "拐"], "d": [["怎么理解", "p", "体位转移是「从床到轮椅、从椅到马桶」这些每天要做十几次的动作，也是照护者腰伤与患者跌倒的最高发环节。它的技术核心只有两条：一是把患者重心移到支撑面上方（不是靠抱），二是让患者参与（能出多少力就出多少力）。所以训练顺序是「评估—分解—辅助—独立」，不是一上来就抱。"], ["教材定义（背这句 + 分级）", "p", "体位转移：指人体从一种姿势转移到另一种姿势的过程，包括床与轮椅、椅与椅、轮椅与马桶、地面与床之间的转移。按参与程度分：独立转移、辅助转移（一人/两人）、被动转移（机械或人力搬动）。转移能力是 ADL 与出院去向的关键指标（Barthel 中「床椅转移」占 15 分，为最高项之一）。"], ["常见转移方式与要点（表格）", "table", [["方式", "适用", "关键要点", "常见错误"], ["床—轮椅（站立法）", "能站立、下肢有一定负重能力", "轮椅与床成 30°—45°；刹车锁死、脚踏板翻起；患者前倾站起、转身坐下", "不锁刹车、脚踏板不翻（最常见跌倒原因）"], ["床—轮椅（滑动板法）", "不能站立、上肢有力", "滑动板一端置臀下、一端置轮椅；患者用手撑起躯干滑过", "板未放稳、臀部蹭伤"], ["一人辅助转移", "需少量帮助", "治疗师双膝抵住患者膝、双手扶髋/腰带；口令「前倾—站—转」", "拉患者上肢（易致肩关节半脱位）"], ["两人辅助转移", "较重或配合差", "一人托躯干、一人托下肢；同步口令", "两人不同步，患者被扭伤"], ["机械转移（移位机）", "完全依赖、体重较大", "吊带置于臀下与背部、检查挂钩；全程锁轮", "吊带位置错误致滑落"]]], ["训练顺序（PEO 思路，写方案用）", "ul", ["① 评估：坐位/站位平衡级别、下肢负重能力、上肢支撑力、认知与配合度、疼痛、体重。", "② 分解：先在治疗床上练「桥式—坐起—坐站」，再合成为完整转移。", "③ 辅助递减：机械 → 两人 → 一人 → 监护 → 独立；每阶段以「安全完成 3 次」为达标。", "④ 环境适配：床高与轮椅座高差＜5 cm、床旁留 90 cm 转身空间、地面防滑、去掉门槛。", "⑤ 照护者培训：教会「屈髋屈膝、用腿不用腰」，并示范跌倒后如何扶起（不抱、用移位机）。"]], ["安全与禁忌", "ul", ["转移前必须锁轮、翻起脚踏板、检查床刹与地面；躁动或认知障碍者加安全带/两人监护。", "禁忌/慎用：不稳定的脊柱骨折、下肢深静脉血栓急性期、严重体位性低血压、髋关节置换术后未达负重许可。", "髋置换术后转移：屈髋＜90°、患腿外展、不交叉腿；起立时患腿在前。", "跌倒后处理：先评估有无骨折与头部损伤，不要立即抱起；确认无伤后用移位机或双人协助。"]], ["提示", "p", "答题常考「转移的三要素」：锁轮（安全）、重心前移（力学）、患者参与（功能）。Barthel 转移 15 分这个数字要记住。别写「抱起患者」——现代康复强调「不用腰、用腿和器械」。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 3 章 体位转移技术；《康复医学》第 7 版 第 4 章；《康复功能评定学》第 3 版 第 14 章（Barthel 转移项）。"]]}, {"k": "zl-shenjing", "n": "神经发育疗法与运动再学习", "c": "Bobath、PNF、Brunnstrom、MRP、MCIMT", "p": ["Bobath：抑制异常模式、促通正常运动", "PNF：对角线模式、节律启动、收缩-放松", "Brunnstrom 六阶段与协同运动", "运动再学习（MRP）与强制性使用（MCIMT）"], "t": "各疗法共同的底层是“任务导向 + 大量重复”。", "kw": ["神经发育", "Bobath", "PNF", "Brunnstrom", "运动再学习", "强制性使用", "易化"], "d": [["怎么理解", "p", "神经发育疗法（NDT）这一组技术——Bobath、PNF、Brunnstrom、MRP、CIMT——看起来五花八门，其实都在回答同一个问题：中枢损伤后，怎么让大脑重新学会控制动作。它们共同的三件事是：任务导向、大量重复、感觉输入。区别只在「从哪儿切入」：Bobath 从抑制异常模式切入，PNF 从对角线模式与本体感觉切入，Brunnstrom 借协同运动「借力」，MRP 拆任务成分，CIMT 限制健手逼患手。"], ["教材定义（五个技术各一句）", "p", "① Bobath 技术（NDT）：通过抑制异常运动模式、促进正常运动模式，强调关键点控制（躯干、肩胛、骨盆）与「不让患者练错」。② PNF（本体感觉神经肌肉促进技术）：利用牵张、阻力、节律等本体感觉输入，通过对角线螺旋模式促进运动，核心手法有节律启动、等张组合、收缩-放松、保持-放松。③ Brunnstrom 技术：按恢复六阶段训练，利用协同运动与联合反应「借力」，再逐步脱离。④ 运动再学习（MRP）：把动作拆成任务成分，练缺失成分再整合，强调闭环、真实任务与反馈。⑤ 强制性使用（CIMT）：限制健手、强制使用患手，适用于卒中后 3—6 个月、有一定主动伸展的患者。"], ["五法对比（考试常考的区别）", "table", [["技术", "核心机制", "典型手法/参数", "适用与时机"], ["Bobath/NDT", "抑制异常模式 + 促通正常模式；关键点控制", "关键点（躯干/肩胛/骨盆）手法、负重、体位转换", "脑卒中、脑瘫早期至恢复期；痉挛明显者"], ["PNF", "本体感觉输入 + 对角线螺旋模式", "节律启动、等张组合、收缩-放松；阻力递增", "肌力不足、ROM 受限、协调障碍"], ["Brunnstrom", "利用协同/联合反应借力，逐期脱离", "按 Ⅰ—Ⅵ 期设计动作（如 Ⅲ 期练共同运动）", "脑卒中偏瘫，按分期推进"], ["MRP", "任务成分分解 + 大量重复 + 反馈", "坐-站、够物、步行分解；每日 30—60 min 任务练习", "脑卒中、脑外伤恢复期；CIMT 的基础"], ["CIMT", "限制健手、强制患手使用（塑形技术）", "每日 6 h 佩戴限制手套 + 2 h 任务训练，连续 2 周（mCIMT 可 3 h/日）", "卒中后 3—6 个月，患侧腕背伸≥10°、指伸≥10°、无明显忽略"]]], ["Brunnstrom 六阶段（默写）", "table", [["阶段", "表现"], ["Ⅰ", "弛缓，无随意运动"], ["Ⅱ", "出现联合反应/共同运动雏形"], ["Ⅲ", "共同运动可随意完成（屈肌/伸肌模式）"], ["Ⅳ", "出现部分分离运动（如手触摸后腰）"], ["Ⅴ", "分离运动更明显（如伸肘时前臂旋前）"], ["Ⅵ", "接近正常，协调性略差"]]], ["CIMT 的三个门槛（常考）", "ul", ["适应证门槛：患侧腕背伸≥10°、手指伸展≥10°、无明显偏侧忽略；病程 3—6 个月以上效果更稳。", "剂量：传统 CIMT 每日清醒时 90% 时间佩戴 + 6 h 训练、连续 2 周；改良 mCIMT 每日 3 h 训练 + 手套，门诊可执行。", "禁忌：严重认知障碍不能配合、患肢疼痛明显、平衡差有跌倒高风险（需监护）。", "不满足门槛就做改良版（mCIMT）：降低强度、增加任务分解与提示。"]], ["提示", "p", "答题时把「机制—手法—适应证」三段写满：只说「促进正常运动」不得分。Brunnstrom 六阶段要能背出 Ⅲ 期（共同运动）与 Ⅳ 期（部分分离）的分界。CIMT 的三个门槛（腕背伸 10°、指伸 10°、无忽略）是近年高频点。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 12 章 神经发育技术、第 13 章 运动再学习技术、第 14 章 强制性使用运动疗法；《康复医学》第 7 版 第 4 章；EXCITE 试验（CIMT，2006）。"]]}, {"k": "zl-wuli", "n": "物理因子治疗", "c": "电、光、声、热、磁、水、冷、压力的应用与禁忌", "p": ["低频/中频/高频电疗的作用深度与适应证", "超声波、激光、红外/紫外", "热疗与冷疗的生理反应与时机", "禁忌：恶性肿瘤局部、出血倾向、心脏起搏器、感觉丧失区"], "t": "物理因子题最爱考禁忌证，先背禁忌再背适应证。", "kw": ["电疗", "光疗", "超声波", "传导热", "磁疗", "水疗", "冷疗", "物理因子", "冷冻", "压力治疗"], "d": [["怎么理解", "p", "物理因子治疗是用电、光、声、热、冷、磁、力这些物理能量来治病，考的是「选对因子 + 选对剂量」。同一个疼痛，急性期用冷、亚急性用超声、慢性用热；同一个电疗，频率不同作用完全不同（镇痛用 TENS 高频 100 Hz，肌肉刺激用低频 20—50 Hz）。所以剂量参数比原理更常考。"], ["教材定义（记分类框架）", "p", "物理因子治疗（理疗）：应用自然或人工的物理因子（电、光、声、磁、热、冷、水、压力等）作用于人体，以预防和治疗疾病、促进康复的方法。按因子分：电疗法（直流、低频、中频、高频、静电）、光疗法（红外、紫外、激光）、超声波疗法、传导热疗法（蜡、热敷、蒸汽）、冷疗法、磁疗法、水疗法、压力疗法、生物反馈、冲击波。"], ["常用因子：适应证 + 剂量（核心表）", "table", [["因子", "治疗作用", "常用剂量/参数", "典型适应证与禁忌"], ["TENS（经皮电刺激）", "镇痛（闸门控制 + 内啡肽）", "高频 100 Hz、脉宽 50—100 μs，20—30 min；或低频 2—4 Hz", "慢性疼痛、术后痛；禁用于心脏起搏器、颈动脉窦区"], ["低频电（NMES/FES）", "肌肉收缩、防萎缩、促神经再生", "20—50 Hz、脉宽 200—400 μs，10—20 min", "失用性肌萎缩、足下垂（FES）；禁用于肿瘤区、孕妇腹部"], ["中频电（干扰电）", "镇痛、促循环、松解粘连", "2—10 kHz 载波，20 min", "软组织劳损、关节痛；急性炎症期慎用"], ["超声波", "深层热效应、机械微按摩", "0.5—1.5 W/cm²，连续或脉冲，5—10 min，移动法", "瘢痕、肌腱炎、关节挛缩；禁用于孕妇腹部、心区、骨骺、恶性肿瘤"], ["红外线", "浅层热、促循环", "距离 30—50 cm，15—20 min，温热感", "肌痛、关节僵硬；禁用于急性炎症、出血倾向"], ["紫外线", "杀菌、促维生素 D、脱敏", "按最小红斑量（MED）分级，亚红斑/红斑量", "压疮、银屑病；禁用于红斑狼疮、光敏者"], ["激光（LLLT）", "促愈合、抗炎、镇痛", "波长 630—980 nm，剂量 1—4 J/cm²", "伤口、肌腱炎、疼痛；禁用于眼睛直射、肿瘤区"], ["石蜡疗法", "深部热、软化瘢痕", "蜡温 50—55 ℃，20—30 min", "关节僵硬、瘢痕挛缩；禁用于感觉障碍（烫伤风险）、出血倾向"], ["冷疗", "镇痛、消肿、降肌张力", "冰袋 10—15 min、冷敷 15—20 min", "急性软组织损伤 48 h 内、痉挛；禁用于雷诺现象、冷过敏"], ["冲击波", "松解粘连、促骨愈合", "0.1—0.3 mJ/mm²，每次 1500—3000 次，每周 1 次 ×3—5 次", "足底筋膜炎、网球肘、骨不连；禁用于骨骺、肺组织、凝血障碍"]]], ["选因子的四条线（写方案用）", "ul", ["按病程选：急性期（48 h 内）冷疗、无热量的电疗；亚急性期超声/中频；慢性期热疗 + 运动。", "按目的选：镇痛→TENS/中频；消肿→冷疗、气压；防萎缩→NMES；松解粘连→超声、冲击波；促骨愈合→冲击波、低频电。", "按部位选：浅表用红外；深部用超声/短波；关节用中频/蜡疗。", "按禁忌选：感觉障碍者不用热（烫伤）；心脏起搏器者不用电疗；孕妇腹部与腰骶部禁电、禁超声。"]], ["安全要点（临床最容易出事的地方）", "ul", ["热疗前必须查感觉与血液循环：糖尿病周围神经病变、脊髓损伤者痛温觉缺失，极易烫伤。", "电疗前查皮肤完整性、有无金属植入物（除颤器、起搏器为禁忌）；电极不与心脏前后对置。", "每次治疗记录：因子、部位、剂量、时间、皮肤反应；出现红肿水疱立即停止并处理。", "冲击波治疗有痛感，治疗前告知，避免用于肺、肠管、骨骺等空腔/生长区。"]], ["提示", "p", "数字最关键：TENS 100 Hz 镇痛、NMES 20—50 Hz 防萎缩、超声 0.5—1.5 W/cm²、蜡温 50—55 ℃、冷疗 10—15 min、冲击波每周 1 次共 3—5 次。禁忌里「感觉障碍禁热疗」「起搏器禁电疗」两条几乎年年考。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 18—27 章（电疗、光疗、超声、传导热、冷疗、冲击波）；《康复医学》第 7 版 第 4 章 康复治疗技术。"]]}, {"k": "zl-shengwu", "n": "生物反馈、冲击波与神经调控", "c": "反馈训练、体外冲击波、经颅磁/直流电", "p": ["肌电生物反馈用于再教育与放松", "冲击波：肌腱病、骨不连、足底筋膜炎", "rTMS/tDCS 用于卒中后运动与抑郁", "禁忌：起搏器、癫痫史、颅内金属"], "t": "冲击波不是“哪里痛打哪里”，要打在病变组织。", "kw": ["生物反馈", "冲击波", "经颅", "磁刺激", "电刺激"], "d": [["怎么理解", "p", "生物反馈是把「看不见的生理信号」变成「看得见的画面」——肌电、皮温、心率、呼吸。它治的不是器官，而是「患者对自己身体的觉察与控制」。所以它最适合两类人：一类是不知道该用哪块肌肉（卒中后腕伸、盆底肌），一类是放松不下来（紧张性头痛、焦虑、痉挛）。"], ["教材定义（背这句）", "p", "生物反馈疗法：借助电子仪器，将人体内不易觉察的生理活动信息（肌电、皮温、皮电、心率、呼吸、脑电等）转换为声、光、图像等可感知的信号，反馈给患者，使其学会有意识地调节自身生理功能的方法。核心是「觉察—尝试—强化」的学习过程，仪器只是镜子。"], ["四类常用反馈（对比表）", "table", [["类型", "采集信号", "训练目标", "典型适应证"], ["肌电生物反馈 EMG-BF", "表面电极记录肌电（μV）", "提高或降低特定肌群张力", "卒中后腕伸、盆底肌（尿失禁）、痉挛肌放松、颈肩痛"], ["温度生物反馈", "指端皮温（℃）", "升高皮温（血管扩张、放松）", "偏头痛、雷诺现象、焦虑"], ["皮电生物反馈", "皮肤电导（汗腺活动）", "降低交感兴奋", "焦虑、应激、失眠"], ["呼吸/心率变异性反馈", "呼吸频率、RSA/HRV", "慢而深的腹式呼吸（约 6 次/分）", "焦虑、慢性疼痛、心肺康复"]]], ["参数与流程（写方案要有数字）", "ul", ["电极位置：肌腹中部、两电极间距 2—3 cm、参考电极置于骨性隆起；贴前清洁去脂。", "训练时长：先测基线 5 min，再训练 20—30 min，每周 2—3 次，10—15 次为一疗程。", "阈值设置：以基线为参照，逐步要求达到基线的 120%（增强）或 80%（放松），达标即给声光奖励。", "家庭作业：每日 2 次、每次 10—15 min 的无仪器练习（把感觉迁移到生活）。", "疗效判断：不只看仪器数字，还要看功能目标（如腕背伸角度、漏尿次数、头痛天数）。"]], ["适应证与禁忌", "ul", ["适应证：脑卒中上肢功能、脊髓损伤肌力训练、盆底功能障碍（压力性尿失禁有效率较高）、紧张性头痛与偏头痛、痉挛放松、焦虑与睡眠障碍、便秘（盆底协调）。", "禁忌/慎用：认知障碍不能理解反馈信号者、精神疾病急性期、癫痫（部分类型慎用）、植入心脏起搏器者（按设备说明）。", "注意：训练环境安静、避免干扰；出现头晕、过度换气立即停止。"]], ["提示", "p", "三个数字：基线 5 min、训练 20—30 min、每周 2—3 次×10—15 次疗程。EMG-BF 电极贴肌腹、间距 2—3 cm。答题要写出「信号—目标—适应证」三段，只说「训练患者自我调节」不得分。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 26 章 生物反馈疗法；《康复医学》第 7 版 第 4 章（物理因子与生物反馈）。"]]}, {"k": "zl-tieza", "n": "贴扎与压力治疗", "c": "肌内效贴、白贴与压力衣", "p": ["贴扎方向决定促通/抑制/支持", "压力治疗用于瘢痕、水肿、淋巴", "压力梯度：远高近低", "皮肤检查与过敏监测"], "t": "贴扎是辅助，不替代训练。", "kw": ["贴扎", "压力衣", "压力治疗", "压力疗法", "肌内效"], "d": [["怎么理解", "p", "贴扎不是「贴块胶布」，而是用贴布的方向、拉力与剪裁去改变皮肤的力学与感觉输入：顺着肌肉走向贴是「帮它收缩」，反向贴是「抑制它」，几乎零拉力贴是「引导淋巴」。所以同一块贴布，贴法不同作用相反——考试最爱考的就是「促进还是抑制，从哪端开始贴」。"], ["教材定义（三种贴布 + 一个参数）", "p", "软组织贴扎：用具有一定弹性或刚性的贴布贴于体表，通过力学支撑、感觉输入与循环改善来达到治疗目的的技术。三类：① 肌内效贴（kinesio tape）：弹性约 120%—140%，厚度接近皮肤，可长时间贴（2—5 天）；② 白贴/运动贴（rigid tape）：几乎无弹性，用于关节限制与固定；③ 弹性绷带/压力贴：用于加压与消肿。"], ["贴法方向（最容易考反的）", "table", [["目的", "贴布方向", "拉力", "机制"], ["促进（facilitation）", "从肌肉止点向起点贴（尾端朝起点）", "15%—25% 轻拉", "贴布回缩方向与肌纤维收缩方向一致，增强收缩"], ["抑制（inhibition）", "从起点向止点贴", "15%—25% 轻拉", "回缩方向与收缩相反，降低肌张力"], ["支持/稳定", "沿韧带或肌腱走向", "25%—50% 中拉（两端 0 拉力）", "提供机械支撑与本体感觉"], ["空间/减压", "痛点上方横向或环形", "50%—75% 拉（贴布抬起皮肤）", "增加皮下间隙、改善循环"], ["淋巴引流", "从远端向近端、爪型剪裁", "0%—15%（几乎无拉）", "沿淋巴走向引导，方向必须朝近端"]]], ["常见剪裁与部位（记 5 个）", "table", [["形状", "用途", "示例"], ["I 型", "直线支持或抑制单块肌肉", "股四头肌、竖脊肌"], ["Y 型", "包绕肌肉、顺应肌腹形态", "腘绳肌、斜方肌"], ["X 型", "痛点中心交叉，用于痛点减压", "肩峰下痛、网球肘"], ["爪型/多尾", "淋巴引流、瘢痕", "踝扭伤肿胀、术后瘢痕"], ["灯笼型", "伤口或瘢痕周围空间", "瘢痕粘连"]]], ["操作与注意", "ul", ["贴前清洁皮肤、剃毛、擦干；贴布两端各留 3—5 cm 不拉（锚点），防翘边。", "贴后用手掌摩擦 30 s 激活胶面；24 h 内避免长时间泡水。", "更换：2—5 天一次；出汗多或边缘翘起即换。", "禁忌：开放性伤口、感染、皮肤过敏或破损、深静脉血栓、心衰所致水肿（压力贴需谨慎）。", "常见错误：把「促进」与「抑制」方向贴反；爪型从近端往远端贴（淋巴引流方向错）；拉力过大起水疱。"]], ["提示", "p", "方向题必考：**促进＝止点→起点，抑制＝起点→止点**，两者拉力都是 15%—25%。淋巴引流必须「远端→近端、几乎零拉力」。贴布弹性 120%—140% 这个数字也常考。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 9 章 软组织贴扎技术；Kase《Clinical Therapeutic Applications of the Kinesio Taping Method》。"]]}, {"k": "zl-xinfei", "n": "心肺训练与运动处方", "c": "有氧训练、呼吸训练与 FITT 处方", "p": ["FITT：频率、强度、时间、类型", "强度：心率储备法、Borg、无氧阈", "呼吸训练：缩唇、腹式、排痰", "监护与终止指征"], "t": "处方必须写出强度依据（心率/功率/Borg）。", "kw": ["心肺功能训练", "运动处方", "有氧", "呼吸训练", "耐力"], "d": [["怎么理解", "p", "心肺康复的核心是有氧训练——把「一口气能走多远」变成「每天能走多久」。它的效果不只在心肺：脑卒中、脊髓损伤、骨科术后的患者做有氧训练，疲劳感下降、步速提高、住院天数减少。处方就按 FITT 写清楚（频率、强度、时间、类型），再加上呼吸训练与监护红线。"], ["教材定义（背这句 + 三块内容）", "p", "心肺功能训练：通过有氧运动、抗阻运动、呼吸肌训练与柔韧性训练，提高心肺耐力、肌力与呼吸效率，改善运动耐量与生活质量的治疗方法。三块内容：① 有氧训练（步行、功率车、上肢测功计）；② 抗阻训练（大肌群、低负荷多次数起步）；③ 呼吸训练（缩唇呼吸、腹式呼吸、呼吸肌抗阻训练）。"], ["运动处方 FITT（写方案必用）", "table", [["要素", "参数", "说明"], ["F 频率", "每周 3—5 次（初期 2—3 次）", "间隔不超 2 天，避免去适应"], ["I 强度", "40%—70% HRR 或 60%—80% HRmax；Borg 12—14（稍累）", "靶心率＝（HRmax−HRrest）×强度% + HRrest；HRmax≈220−年龄（或 208−0.7×年龄）"], ["T 时间", "20—40 min/次（可 10 min×3 段累积）", "含热身 5—10 min、整理 5—10 min"], ["T 类型", "步行、功率车（下肢/上肢）、水中步行", "下肢功能障碍用上肢测功计或水中运动"], ["进度", "每 1—2 周增加 5—10 min 或 5% 强度", "以不出现症状、Borg 不超 14 为界"]]], ["呼吸训练（三种，含剂量）", "table", [["方法", "操作", "剂量"], ["缩唇呼吸", "鼻吸气、缩唇（吹口哨样）缓慢呼气，吸呼比 1:2—1:3", "每次 10—15 min、每日 3—4 次"], ["腹式呼吸", "一手置腹部，吸气时腹部隆起、呼气时回落", "每次 10 min、每日 2—3 次"], ["呼吸肌抗阻训练（IMT）", "阈值负荷装置，阻力为最大吸气压（MIP）的 30%", "每次 15—30 min、每日 2 次；每 1—2 周复测 MIP 调整"], ["有效咳嗽/排痰", "深吸气后屏气 2—3 s，用力咳出；配合体位引流", "每日 2—3 次，餐前进行"]]], ["监护与停止指征（安全红线）", "ul", ["训练中监测：心率、血压、SpO₂、Borg 评分、症状；SpO₂ 应维持≥90%（部分标准≥88%）。", "立即停止：胸痛、胸闷、头晕、面色苍白、冷汗、SpO₂＜88%、心率超靶心率上限或出现心律失常、血压＞220/110 或收缩压下降＞10 mmHg。", "糖尿病者：避免空腹训练，随身带糖；血糖＞16.7 mmol/L 或＜5.6 mmol/L 暂缓。", "抗凝/术后患者：按医嘱控制强度，注意切口与出血。"]], ["提示", "p", "靶心率公式必考，记得 HRmax 用 220−年龄（或用 208−0.7×年龄更准）。Borg 12—14、缩唇呼吸吸呼比 1:2—1:3、IMT 阻力 30% MIP 这三个数字要写出来。停止指征里「SpO₂＜88%」与「收缩压下降＞10 mmHg」是高频项。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 16 章 心肺功能训练；《康复医学》第 7 版 第 6 章 内脏疾病康复；ACSM 运动测试与处方指南（第 11 版）。"]]}, {"k": "zl-vr", "n": "虚拟现实与康复机器人", "c": "VR、外骨骼、上肢/下肢机器人", "p": ["VR 提供任务重复与即时反馈", "外骨骼：步态训练、减重", "机器人：上肢、手、踝", "证据：剂量与强度是疗效关键"], "t": "技术章节答题要落到“训练剂量与适应证”。", "kw": ["虚拟现实", "机器人", "外骨骼", "VR"], "d": [["怎么理解", "p", "虚拟现实与机器人解决的是同一个问题：训练量不够。脑卒中上肢要在 6 个月内做上千次重复才可能有效，治疗师一对一很难做到，VR 用游戏把重复变有趣，机器人用机械臂把重复变精确。它们替代不了治疗师的评估与目标设定，但能把「剂量」做上去。"], ["教材定义（两个概念）", "p", "① 虚拟现实（VR）：用计算机生成三维虚拟环境，通过视觉、听觉与力反馈让患者置身其中并进行交互训练的技术，分沉浸式（头显）与非沉浸式（屏幕/投影）。② 康复机器人：用于评估与训练的可编程机械装置，分末端执行器型（只带动肢体末端）与外骨骼型（多关节同步驱动），以及上肢、下肢、手部、踝足等类型。"], ["VR 与机器人对比（考点）", "table", [["维度", "虚拟现实", "康复机器人"], ["核心作用", "提高兴趣与依从性、增加重复次数、可调难度", "精确控制运动轨迹与阻力、量化评估、减重步行"], ["剂量", "30—60 min/次、每周 3—5 次", "30—45 min/次、每周 3—5 次，10—20 次一疗程"], ["优势人群", "认知尚可、能配合游戏任务的轻中度障碍", "重度障碍、需要减重或精确辅助者"], ["局限", "不能替代真实环境训练；眩晕、癫痫、视力障碍者慎用", "设备昂贵、体积大；被动带动可能替代主动努力"], ["证据", "对卒中上肢功能与平衡有中等证据", "上肢机器人改善 FMA-UE；外骨骼用于步行训练"]]], ["训练设计与参数", "ul", ["任务选择：从「够物—抓握—转移」到「做饭、购物」情景任务，按功能水平分级。", "难度调节：速度、幅度、目标大小、干扰量四档，保持在「成功率 70%—80%」的挑战区间。", "强度：单次 30—60 min，有效训练时间不少于 20 min；每周 3—5 次。", "安全：清除周围障碍、固定安全带、眩晕与癫痫史者先评估；出现恶心立即停止。", "效果评价：用功能量表（FMA、BBT、10 m 步行、6MWT）而不是游戏分数。"]], ["提示", "p", "答题要写「剂量 + 适用 + 局限」三段。别夸大：VR 与机器人是「增加训练量」的工具，不能替代任务导向的真实训练；重度认知障碍、明显忽略、眩晕者不适合 VR。机器人分末端执行器与外骨骼两类，这是常考的分类题。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 15 章 虚拟现实技术、第 17 章 机器人辅助治疗；《康复医学》第 7 版 第 4 章；Cochrane 综述（VR 用于卒中康复，2019）。"]]}, {"k": "ot-gailun", "n": "作业治疗概论与 ADL 训练", "c": "作业表现、活动分析与 ADL 训练", "p": ["作业表现三要素：人、环境、作业", "活动分析：步骤分解与难度调整", "ADL 训练：进食、穿衣、洗漱、如厕、洗澡", "代偿与改造并重"], "t": "OT 的核心是“做事情”，不是“练动作”。", "kw": ["作业治疗", "ADL训练", "作业活动", "活动分析"], "d": [["怎么理解", "p", "作业治疗（OT）与物理治疗（PT）最容易混，区别一句话：PT 解决「能不能动」，OT 解决「动了用来干什么」。同样是肩关节活动度训练，PT 练到能抬手，OT 要练到能自己梳头、扣纽扣、端起碗。所以 OT 的评定从「角色」开始——他原来是什么人（工人、母亲、学生），现在做不了哪些事。"], ["教材定义（背这句）", "p", "作业治疗：以作业活动（occupation）为治疗手段，帮助因疾病、伤残或发育障碍导致作业表现障碍的人，恢复、改善或代偿其日常生活活动、工作与休闲能力，以促进健康、参与和社会融入的专业。作业（occupation）指人日常所做的所有有意义的活动，分三类：日常生活活动（ADL/IADL）、生产性活动（工作、学习、家务）、休闲娱乐。"], ["与 PT 的分工（对比表）", "table", [["维度", "物理治疗 PT", "作业治疗 OT"], ["核心目标", "改善运动功能、肌力、ROM、平衡与步态", "改善作业表现：自理、工作、休闲"], ["主要手段", "运动疗法、物理因子、手法、步态训练", "有目的的活动、任务训练、辅具、环境改造"], ["评定重点", "MMT、ROM、平衡、步态、心肺", "ADL/IADL、角色、兴趣、作业表现（COPM）"], ["典型场景", "卒中后练站立与步行", "卒中后练穿衣、进食、如厕、做饭"], ["共同点", "都强调任务导向、重复练习、功能结局", "同左"]]], ["两个常用理论（要知道名字与用途）", "ul", ["PEO 模式（人-环境-作业）：作业表现由人（能力、角色）、环境（物理与社会）、作业（任务要求）三者匹配决定；干预可改人、改环境或改任务。", "MOHO（人类作业模式）：强调意志（动机）、习惯化（日常节律）、执行能力三层，用于精神科与慢性病。", "CMOP-E（加拿大作业表现模式）：人、环境、作业三者交叉，配合 COPM 做目标设定。", "记住用途：PEO 用于分析与改造环境，MOHO 用于动机与习惯，COPM 用于让患者自己说出「最想改善的三件事」。"]], ["治疗流程与常用手段", "table", [["环节", "产出", "工具/例子"], ["评定", "作业表现问题清单 + 目标", "Barthel、COPM、AMPS、角色清单、家居访问"], ["目标", "患者参与制定的具体目标", "「两周内独立完成扣纽扣」「一个月内自己煮面」"], ["干预", "训练、代偿、环境改造三选一或组合", "穿衣训练、穿袜器、加粗餐具、门槛改坡道"], ["复评", "目标达成度与满意度", "COPM 复评（变化≥2 分有意义）"]]], ["提示", "p", "答题写「作业表现」四个字，不要写「作业治疗就是做手工」。与 PT 的区别记两句：PT 管动作能力、OT 管活动与参与。三个理论名字（PEO、MOHO、CMOP-E）要能对上用途。"], ["依据", "p", "依据：《作业治疗学》第 3 版 第 1 章 概论、第 2 章 作业治疗评定；《康复医学》第 7 版 第 4 章（作业治疗）。"]]}, {"k": "ot-shou", "n": "手与上肢功能", "c": "手功能评定与 OT 训练", "p": ["抓握类型：柱状、球状、钩状、捏", "评定：ARAT、九孔柱、握力/捏力", "训练：镜像、任务练习、支具", "水肿与瘢痕管理"], "t": "手外伤早期防挛缩，后期练精细。", "kw": ["手功能", "上肢", "抓握", "支具", "手外伤"], "d": [["怎么理解", "p", "手是「第二张脸」，也是康复里最难恢复的部位：脑卒中后约 60% 的患者上肢功能恢复不完全。手功能训练的核心不是「练抓」，而是把抓握拆成「够—抓—持—放」四个环节，缺哪一环练哪一环。评定时要同时看力量（握力/捏力）、精细操作（捏小物件）与真实任务（扣纽扣、用筷子）。"], ["教材定义（抓握分类要背）", "p", "手功能：指手完成抓握、捏取、操作与感觉辨识的能力。抓握分两类：① 力量性抓握（power grip）——拇指与手指共同用力，如握杯、握锤；② 精细抓握（precision grip）——指尖对捏，含侧捏（钥匙）、三点捏（笔）、指尖对捏（针线）。手功能评定包括运动（ROM、肌力、抓握类型）、感觉（两点辨别觉、Semmes-Weinstein 单丝）与功能任务三个层面。"], ["常用评定量表（数值记牢）", "table", [["工具", "内容", "正常值/判读"], ["握力计", "握力（kg）", "男 30—45 kg、女 20—30 kg；两侧差＞10% 有意义"], ["捏力计", "侧捏、三点捏、指尖捏（kg）", "侧捏约 7—10 kg、指尖捏约 4—6 kg"], ["Jebsen 手功能测试", "7 项任务计时（写字、翻卡、拾小物、模拟进食、堆棋子、拾大轻物、拾大重物）", "与年龄性别常模比较，用时延长提示障碍"], ["盒块试验 BBT", "60 s 内转移木块数", "成人约 60—80 块/分（优势手更高）"], ["9 孔柱试验", "插拔 9 根柱的时间", "用时越长提示精细操作越差"], ["ARAT（上肢动作研究测验）", "抓、握、捏、粗大动作 19 项，0—57 分", "分数越低障碍越重"], ["Fugl-Meyer 上肢（FMA-UE）", "0—66 分", "＜33 分提示重度；变化 5—6 分为 MCID"]]], ["训练方法（按恢复阶段）", "table", [["阶段/问题", "方法", "剂量"], ["软瘫期（无主动伸展）", "健侧带动、镜像治疗、电刺激、想象训练", "镜像 30 min/次、每日 1 次；NMES 20 min"], ["有部分伸展", "CIMT/mCIMT、任务导向训练", "mCIMT 每日 3 h 训练；任务训练 30—45 min、每周 3—5 次"], ["痉挛明显", "牵伸、支具（手托）、肉毒毒素后训练", "牵伸 30 s×3—5 次/日；支具夜间佩戴"], ["精细操作差", "捏取小物件（豆子、硬币）、装配任务", "10—15 min/次，每日 2 次，难度渐进"], ["感觉障碍", "触觉刺激、辨别训练（闭眼摸物）", "10 min/次，每日 2—3 次"]]], ["提示", "p", "FMA-UE 66 分、ARAT 57 分、BBT 60—80 块/分是三个高频数字。抓握分类（力量性 vs 精细）必考。答题别只写「练抓握」，要写「够—抓—持—放」分解 + 具体任务（扣纽扣、用筷子）。"], ["依据", "p", "依据：《作业治疗学》第 3 版 第 6 章 手及上肢功能康复；《康复功能评定学》第 3 版（上肢功能评定）；Fugl-Meyer 量表原始文献（1975）。"]]}, {"k": "ot-gantong", "n": "感觉统合", "c": "感觉统合理论与训练", "p": ["前庭、本体、触觉三大系统", "失调表现：过敏、迟钝、寻求", "训练：秋千、滑板、触觉箱", "儿童多见，成人用于感觉再教育"], "t": "感觉统合是 OT 的专有评估域，别与知觉训练混。", "kw": ["感觉统合", "前庭", "本体", "触觉"], "d": [["怎么理解", "p", "感觉统合（SI）回答的是「为什么这孩子怕吵、怕碰、坐不住、动作笨」：大脑把前庭、本体、触觉信息整合不好，要么过度反应（怕吹风机、拒穿标签衣服），要么反应不足（撞墙不觉痛），要么运用障碍（不会骑车、扣扣子）。所以训练不是「多刺激」，而是「给恰到好处的刺激，让大脑学会调节」。"], ["教材定义（背这句）", "p", "感觉统合：指大脑将来自身体与环境的感觉信息（前庭觉、本体觉、触觉、视觉、听觉）进行组织、解释与整合，使身体能对环境作出适应性反应的过程（Ayres）。感觉统合失调分三类：① 感觉调节障碍（过敏或迟钝）；② 运用障碍（dyspraxia，计划与执行动作困难）；③ 姿势-眼球控制障碍（平衡差、眼球追踪差）。"], ["三类失调的表现（对照表）", "table", [["类型", "典型表现", "常见误判"], ["触觉过敏", "拒穿粗糙衣物、拒洗头剪发、挑食", "被当成「任性」「挑食」"], ["前庭过敏/迟钝", "怕秋千与旋转；或相反，拼命转圈、喜欢撞跳", "被当成「多动」"], ["本体觉迟钝", "用力过猛、撞人不觉痛、喜欢挤压", "被当成「攻击行为」"], ["运用障碍", "不会骑车、系鞋带、扣纽扣，动作笨拙", "被当成「笨」或「不认真」"], ["姿势-眼球控制差", "坐不住、易疲劳、抄写漏行", "被当成「注意力不集中」"]]], ["评定与训练（写方案用）", "table", [["环节", "工具/方法", "要点"], ["评定", "感觉统合与运用测验（SIPT）、感觉问卷、临床观察", "SIPT 需认证；问卷看家长/老师描述"], ["前庭训练", "秋千、滑板车、旋转台（线性加速为主）", "每次 10—15 min，观察面色与恶心"], ["本体觉训练", "跳床、推拉重物、攀爬、深压", "重物约体重 5%—10%，每日 1—2 次"], ["触觉训练", "触觉刷（Wilbarger 法）、不同材质触摸箱", "刷后配合关节按压，每 90 min 一次（按方案）"], ["剂量", "单次 45—60 min、每周 2—3 次", "疗程 3—6 个月，每 4—6 周复评"]]], ["适应证与注意", "ul", ["适应证：孤独症谱系障碍、注意缺陷多动障碍、发育性协调障碍、脑瘫、学习障碍伴感觉处理异常。", "注意：前庭刺激可能诱发眩晕、恶心、癫痫（有癫痫史者慎用旋转）；训练须由受训治疗师实施，环境安全（软垫、护具）。", "效果证据：对孤独症的感觉与行为问题有中等证据，对学业成绩证据不足——不要过度承诺。"]], ["提示", "p", "三类失调（调节/运用/姿势-眼球）必背。剂量写「45—60 min、每周 2—3 次、疗程 3—6 个月」。注意区分「感觉统合治疗」与「感觉刺激」：前者有目标与适应性挑战，后者只是给刺激。"], ["依据", "p", "依据：《作业治疗学》第 3 版 第 5 章 感觉统合治疗；Ayres《Sensory Integration and the Child》；《儿童康复学》第 3 章 治疗技术。"]]}, {"k": "ot-fuju", "n": "辅助器具、环境与职业康复", "c": "辅具适配、环境改造与重返工作", "p": ["辅具：自助具、助行、轮椅、矫形器", "环境：家居、无障碍、工作场所", "职业康复：工作分析、岗位调整、渐进复工", "适配流程：评定—试用—随访"], "t": "辅具选配先看“目标活动”，再看器材参数。", "kw": ["辅助器具", "助行器", "环境调适", "职业康复", "自助具", "无障碍", "轮椅"], "d": [["怎么理解", "p", "辅助器具的价值是「用工具换独立」：一根手杖能让偏瘫患者走得更稳，一个穿袜器能让髋置换患者自己穿袜。选配的核心不是「有什么卖」，而是三看：看功能（缺什么）、看环境（家里能不能用）、看支付（谁买单）。选错了比不配更危险——腋拐压在腋窝会伤臂丛神经。"], ["教材定义（分类框架）", "p", "辅助器具：指用于改善或代偿人体功能、辅助完成日常活动的器具，包括助行器、轮椅、生活自理辅具、矫形器、假肢、沟通与信息辅具、家居环境改造设备。选配流程：评定功能与需求 → 试用与适配 → 训练使用 → 随访与调整。"], ["助行器选择与高度（必考）", "table", [["器具", "适用", "高度与要点"], ["手杖（单点）", "轻度平衡障碍、下肢部分负重", "高度＝股骨大转子至地面；站立时肘屈 15°—30°；健手持杖"], ["四脚拐", "平衡较差、需要更大支撑面", "同手杖高度；平地使用，上下楼不便"], ["前臂拐（Lofstrand）", "需长期用拐、上肢力量较好", "前臂托在上臂下 1/3，双手持重"], ["腋拐", "短期部分/不负重", "高度＝腋下 2—3 横指；**负重在手柄，不压腋窝**（防臂丛损伤）"], ["助行架（四轮/无轮）", "平衡差、耐力差", "四轮架带刹车与座椅；无轮架需抬起移动"]]], ["轮椅与居家改造参数", "ul", ["座宽：臀部最宽处 +2 cm（约 40—46 cm）；座深：臀部至腘窝 −5 cm，防压疮与滑动。", "座高：腘窝至地面（含鞋）+5 cm，保证脚能踩实；扶手高：坐位肘屈 90° 时前臂高度。", "居家改造：门槛改坡道（坡度≤1:12）、卫生间加扶手（高 65—70 cm）、淋浴椅、床高与轮椅座高差＜5 cm。", "生活自理辅具：穿袜器、长柄鞋拔、加粗餐具柄、防洒碗、扣纽扣钩、开瓶器。"]], ["适配训练与随访（容易被忽略）", "ul", ["试用不少于 20—30 min，测坐姿压力分布、能否自行驱动、能否过门槛。", "训练内容：转移、刹车使用、上下坡（≥10° 坡需人协助）、跌倒时自我保护。", "随访：出院后 1 个月、3 个月各复评一次；儿童每 6—12 个月因生长需更换。", "安全：定期检查轮胎气压、刹车、螺丝；腋拐防滑垫磨损即换。"]], ["提示", "p", "手杖高度「大转子」、腋拐「腋下 2—3 横指且不负重」两条几乎年年考。轮椅座宽 +2 cm、座深 −5 cm 是计算题。答题顺序：评定功能→选器具→调高度→训练使用→随访。"], ["依据", "p", "依据：《作业治疗学》第 3 版 第 9 章 辅助器具与助行器；《临床康复工程学》第 2 版 第 6 章 轮椅与助行器、第 7 章 自助具。"]]}, {"k": "st-shiyu", "n": "失语症", "c": "失语类型、评定与训练", "p": ["Broca、Wernicke、传导、命名、完全性", "评定：WAB、ABC、自发语言/理解/复述/命名", "训练：Schuell 刺激法、旋律语调、交流板", "预后：病因、病灶、年龄、动机"], "t": "复述好→传导性/命名性；复述差→Broca/Wernicke。", "kw": ["失语", "语言治疗", "WAB", "命名"], "d": [["怎么理解", "p", "失语症治疗的本质是「重新建立语言网络」：不是教患者认字，而是用高强度、有意义的听与说去激活残存的语言区。治疗效果与两个因素最相关——损伤范围与训练剂量。所以教材反复强调「早期、大量、有意义」：每天几十分钟、每周 3—5 次、持续数月，才可能看到 AQ 的提升。"], ["教材定义（背这句 + 三条原则）", "p", "失语症治疗：针对失语症患者的语言功能损害，采用语言训练、交流策略与环境调整等方法，促进语言功能恢复与交流能力代偿的治疗。三条原则：① 早期介入（生命体征稳定后即可开始）；② 以交流为中心（练「用得上」的语言，不是背单词）；③ 个体化（按失语类型与严重度设计）。"], ["按类型选方法（对照表）", "table", [["类型", "主要问题", "训练重点与方法"], ["Broca（运动性）", "表达费力、电报式", "发音启动、句法扩展（图片描述→组句）、旋律语调治疗（MIT）"], ["Wernicke（感觉性）", "听理解差、错语多", "听理解训练（词—图匹配）、语义特征分析、节奏与语调提示"], ["传导性", "复述差", "复述训练由词到句、音素提示、韵律训练"], ["命名性", "找词困难", "命名训练（语义与音素提示）、词义网络扩展"], ["完全性", "各通道均差", "交流板、手势、眼控/图片沟通系统（AAC）、家属培训"]]], ["核心方法（能说清操作）", "ul", ["Schuell 刺激法：给强、多通道、有意义的刺激，反复呈现并引导反应；适用于各类型，是最常用的基础方法。", "PACE（交流效果促进法）：治疗师与患者用任何方式（说、写、手势、画）传递信息，以「信息是否传达」为成功标准，而非语法正确。", "MIT（旋律语调治疗）：用旋律与节奏带出语句，适用于 Broca 失语。", "组词/语义训练：从语义特征（类别、功能、外观）扩展到词与句。", "AAC（辅助沟通）：图片、交流板、语音输出设备；用于重度失语或言语失用。"]], ["剂量与疗效判断", "ul", ["强度：每次 30—60 min、每周 3—5 次、疗程至少 12 周（慢性期更长）。", "疗效指标：WAB 的 AQ（提升≥5 分有临床意义）、Boston 命名测验、日常交流问卷（CADL）。", "环境：家属参与、减少背景噪音、给足反应时间（≥10 s）、不打断、不代说。", "注意：合并抑郁者先处理情绪（约 1/3 卒中后失语伴抑郁），否则训练配合度差。"]], ["提示", "p", "答题写「类型—方法—剂量」三件套。三个方法名要能配：Schuell＝多通道刺激、PACE＝任何方式传信息、MIT＝旋律带语句。AQ 提升 5 分这条线常考。"], ["依据", "p", "依据：《语言治疗学》第 3 版 第 5 章 失语症；《康复医学》第 7 版 第 5 章（言语与吞咽康复）；ASHA 失语症实践指南。"]]}, {"k": "st-gouyin", "n": "构音、嗓音、口吃与腭裂", "c": "运动性构音障碍与嗓音/流畅性", "p": ["构音：痉挛、弛缓、共济失调、混合型", "训练：口部运动、发音、韵律", "嗓音：GRBAS、共鸣、呼吸支持", "口吃：流畅性塑造与认知行为"], "t": "构音器官检查先看“能不能动”，再看“准不准”。", "kw": ["构音", "嗓音", "口吃", "腭裂", "发音"], "d": [["怎么理解", "p", "构音障碍是「执行层」的问题：语言内容与语法都在，只是发音器官（唇、舌、软腭、喉）动不好。所以训练的逻辑是「先查哪一环坏—再练那一环」：呼吸支持不够就练呼吸，软腭抬不起就练腭咽闭合，舌尖不灵就练舌的分离运动。分类则决定预后：痉挛型可改善，弛缓型与共济失调型恢复更慢。"], ["教材定义（背这句 + 六型分类）", "p", "构音障碍：因中枢或周围神经系统损害，导致与言语有关的肌肉（呼吸、喉、腭、舌、唇、下颌）麻痹、收缩力减弱或运动不协调，出现发音不准、吐字不清、语速与韵律异常，而语言内容与理解相对保留。六型：痉挛型（上运动神经元）、弛缓型（下运动神经元）、共济失调型（小脑）、运动过弱型（锥体外系，帕金森）、运动过强型（舞蹈症、肌张力障碍）、混合型（如 ALS）。"], ["六型特征对照（考点）", "table", [["类型", "病变", "听感特征", "代表疾病"], ["痉挛型", "上运动神经元（双侧皮质延髓束）", "声音紧、粗糙、语速慢、音调低", "脑卒中、脑瘫"], ["弛缓型", "下运动神经元/周围神经", "鼻音重、气息声、音量弱、句长短", "吉兰-巴雷、面神经麻痹"], ["共济失调型", "小脑", "韵律不稳、忽快忽慢、重音错位（扫描式言语）", "小脑病变、多发性硬化"], ["运动过弱型", "锥体外系（多巴胺不足）", "音量小、单调、启动难、加速", "帕金森病"], ["运动过强型", "锥体外系（多余运动）", "不自主的痉挛、停顿、扭曲", "舞蹈症、肌张力障碍"], ["混合型", "多部位", "上述混合", "ALS、多发性硬化"]]], ["评定工具与训练（要写剂量）", "table", [["环节", "工具/方法", "剂量与要点"], ["评定", "Frenchay 构音障碍评定（8 项，0—3 分）", "反射、呼吸、唇、颌、软腭、喉、舌、言语可懂度"], ["可懂度", "单词/句子复述计理解率", "25%、50%、75%、100% 四档"], ["呼吸训练", "腹式呼吸、最长发声时间（MPT）训练", "目标 MPT≥15 s；每日 2—3 次，每次 10 min"], ["发音与共鸣", "响度训练、软腭抬高（推撑法、冰刺激）", "每日 2 次，每次 15 min"], ["构音动作", "唇、舌、下颌的分离与力量训练（压舌板抗阻）", "每动作 10 次×3 组，每日 1—2 次"], ["韵律与语速", "节拍器、手势提示、放慢语速", "从 60 拍/分起步，逐步接近正常语速"]]], ["提示", "p", "六型与代表疾病必须能配对：痉挛＝卒中/脑瘫、弛缓＝吉兰-巴雷、共济失调＝小脑、运动过弱＝帕金森。Frenchay 是 8 项，不要与 WAB 混。答题要写「呼吸—发声—共鸣—构音—韵律」五层。"], ["依据", "p", "依据：《语言治疗学》第 3 版 第 6 章 构音障碍、第 7 章 腭裂、第 9 章 嗓音障碍；《康复医学》第 7 版 第 5 章。"]]}, {"k": "st-tunyan", "n": "吞咽障碍", "c": "分期、筛查与训练", "p": ["四期：口腔准备、口腔、咽、食管", "筛查：洼田饮水；金标准 VFSS/FEES", "训练：门德尔松、超声门上吞咽、舌骨上肌训练", "安全：体位、食物质地、误吸征象"], "t": "进食体位与质地调整是最快见效的干预。", "kw": ["吞咽", "洼田", "VFSS", "FEES", "误吸"], "d": [["怎么理解", "p", "吞咽障碍最危险的不是「吃不下」，而是「吃进去跑到肺里」——误吸性肺炎是卒中后死亡的重要原因。所以吞咽评定先回答两个问题：有没有误吸风险、能不能经口吃。训练也分两条路：一条是「让吞咽更安全」（代偿策略），一条是「让肌肉更有力」（康复训练），前者立竿见影，后者要几周才见效。"], ["教材定义（四期 + 两类障碍）", "p", "吞咽：指食物经口腔、咽、食管进入胃的过程，分四期——口腔准备期（咀嚼、食团形成）、口腔期（舌推送至咽）、咽期（软腭上抬、喉上抬前移、会厌关闭、环咽肌开放，约 1 s）、食管期（蠕动推送）。吞咽障碍分器质性（肿瘤、狭窄）与功能性（神经性：卒中、帕金森、ALS）。"], ["评定：筛查—临床—金标准（三层）", "table", [["层次", "工具", "判读"], ["筛查", "洼田饮水试验（30 ml 温水）", "1 级 5 s 内一次饮完无呛咳；2 级 5—10 s 分 2 次；3 级能一次饮完但有呛咳；4 级分 2 次以上且有呛咳；5 级频繁呛咳难饮完；≥3 级需进一步评估"], ["筛查", "反复唾液吞咽试验", "30 s 内吞咽次数＜3 次为异常"], ["临床评估", "EAT-10 问卷、反复吞咽、声音变化（湿性嘶哑）、咳嗽力量", "EAT-10≥3 分提示吞咽异常"], ["金标准", "VFSS（视频荧光吞咽造影）", "看食物是否误吸、残留、环咽肌开放"], ["金标准", "FEES（纤维内镜吞咽评估）", "床旁可行，看咽部残留与误吸（无声误吸可发现）"]]], ["代偿策略与训练（含剂量）", "table", [["类别", "方法", "要点"], ["体位", "低头吞咽（chin-tuck）、头转向患侧、侧卧", "低头可保护气道；转头关闭患侧梨状窝"], ["食物性状", "IDDSI 分级：0 稀薄—4 糊状—7 常规", "稀薄液体最易误吸；用增稠剂调至 3—4 级"], ["一口量", "从 3—5 ml 起，逐步增加", "用勺背送入口腔健侧"], ["间接训练", "冰刺激、舌肌抗阻、门德尔松手法、Shaker 训练", "门德尔松：吞咽时喉上抬保持 2—3 s；Shaker：仰卧抬头 1 min×3 组"], ["直接训练", "空吞咽、用力吞咽、声门上吞咽", "每口食物后空吞咽 2—3 次清除残留"], ["神经肌肉电刺激", "VitalStim 置于舌骨上肌群", "30 min/次、每周 5 次、共 2—3 周（需评估）"]]], ["提示", "p", "洼田 1—5 级标准与「≥3 级需进一步评估」必背；IDDSI 0—7 分级近年常考；门德尔松与 Shaker 是两个最常考的手法。答题写「筛查—评估—代偿—训练—监测」五步，别漏「无声误吸」（无呛咳也可能误吸）。"], ["依据", "p", "依据：《语言治疗学》第 3 版 第 11 章 吞咽障碍；《康复医学》第 7 版 第 5 章；IDDSI 框架（2017）。"]]}, {"k": "st-ertong", "n": "儿童语言与孤独症", "c": "语言发育迟缓、孤独症谱系的语言干预", "p": ["语言发育里程碑与迟缓判断", "孤独症：社交沟通、刻板行为", "干预：ESDM、PRT、AAC", "家长参与与自然环境训练"], "t": "先排除听力，再谈语言训练。", "kw": ["儿童语言", "孤独症", "语言发育迟缓", "AAC", "谱系", "听力障碍", "听力"], "d": [["怎么理解", "p", "儿童语言发育迟缓的核心判断是「比同龄人落后多少」：不是看他会不会说话，而是看他的语言年龄相当于几岁。所以评定先做两件事——对照里程碑看他落在哪个阶段，再用 S-S 法确定他处在「符号形式与指示内容关系」的哪一级。训练就从「当前一级的下一步」开始，而不是从「正常孩子该会的」开始。"], ["教材定义（背这句 + 里程碑）", "p", "语言发育迟缓：指儿童在发育过程中，语言理解或表达能力显著落后于同龄正常儿童，且不是由听力障碍、智力障碍或运动障碍单独解释的状态。关键里程碑：3—4 个月咿呀发声、6—9 个月无意义音节、1 岁有意识叫爸妈（单词期）、1.5—2 岁 50 个词并出现双词句、3 岁能用 3—4 词短句、4 岁能讲故事、5 岁语法基本完整。"], ["S-S 法（符号形式—指示内容关系）五阶段（考点）", "table", [["阶段", "内容", "典型表现"], ["第一阶段", "事物、事态与符号形式的基础", "能注视、追视、操作实物"], ["第二阶段", "符号形式与指示内容的关系（含 2-1 至 2-3）", "能配对、选择图片、理解单词"], ["第三阶段", "词与句（3-1 至 3-2）", "理解双词句、能说双词句"], ["第四阶段", "语法规则（4-1 至 4-2）", "使用三词以上句子、理解方位与数量"], ["第五阶段", "语言规则（5-1 至 5-2）", "理解被动句、复杂句，能叙事"]]], ["评定与训练（对应关系）", "table", [["评定", "内容", "训练重点"], ["里程碑对照", "词汇量、句长、语法、语用", "落后 6 个月以上需干预"], ["S-S 法", "符号形式—指示内容关系", "从当前阶段下一级设计目标"], ["构音与口部运动", "口部运动功能、构音清晰度", "口部按摩、唇舌训练"], ["听力与认知排查", "纯音测听、认知评估", "先排除听力与智力因素"], ["训练形式", "游戏、绘本、情景对话", "每次 30—45 min、每周 2—3 次；家长每日 20 min 家庭训练"]]], ["提示", "p", "S-S 法五个阶段必背（尤其 2 阶段是「符号与内容关系」、3 阶段是「词与句」）。里程碑数字：1 岁单词、2 岁 50 词+双词句、3 岁短句。答题要写「先排除听力与智力障碍」，这是诊断的前提。"], ["依据", "p", "依据：《语言治疗学》第 3 版 第 10 章 儿童语言发育迟缓；《儿童康复学》第 3 章（语言治疗）；S-S 法（语言发育迟缓评价法，中国康复研究中心）。"]]}, {"k": "kf-shenjing", "n": "神经康复", "c": "脑卒中、颅脑损伤、脊髓损伤、帕金森病的康复", "p": ["脑卒中：急性期—恢复期—后遗症期三段管理", "脊髓损伤：ASIA、平面、并发症（压疮、痉挛、自主神经反射异常）", "颅脑损伤：意识、认知、行为", "帕金森：节律提示、姿势、冻结步态"], "t": "神经康复题按“评定—目标—方案—并发症”四段答。", "kw": ["脑卒中", "颅脑损伤", "脊髓", "帕金森", "神经康复", "偏瘫", "脑炎", "多发性硬化", "吉兰", "癫痫", "阿尔茨海默", "痴呆"], "d": [["怎么理解", "p", "神经康复的时间账要算清楚：脑卒中后 90 天内是功能恢复最快的窗口（神经可塑性与水肿消退叠加），过了 6 个月进入平台期，但不是「不能进步」——只是同样进步需要更多剂量。所以临床上一条铁律：**早期离床、早期评估吞咽、早期给任务**，越早开始，同样 45 分钟换来的功能越多。"], ["教材定义（背这句）", "p", "神经康复：针对中枢与周围神经系统疾病或损伤所致功能障碍，采用运动、感觉、言语、吞咽、认知、心理与社会参与等多维手段，促进神经功能重塑、功能恢复与生活自理的一门康复亚专业。核心原则四条：早期介入、主动参与、任务导向、贯穿全程。"], ["分期与时间窗（常考数字）", "table", [["分期", "时间", "康复重点"], ["急性期", "发病 1—2 周（卒中）；颅脑损伤 2—4 周", "生命体征稳定后 24—48 h 开始床
