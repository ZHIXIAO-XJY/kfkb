<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="康复知识库">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>康复知识库 · 21 位点 / 22 版次分级检索</title>
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1f;--muted:#6b6b70;--line:#e6e3dc;--card:#fff;--accent:#1f4e79;--soft:#f1efe9}
@media (prefers-color-scheme: dark){:root{--bg:#17181a;--fg:#eceae6;--muted:#a09e98;--line:#2e3033;--card:#1e2023;--accent:#8ab4d8;--soft:#24262a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
.wrap{display:grid;grid-template-columns:330px 1fr;height:100vh}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--card)}
.top{padding:14px 14px 8px}
h1{font-size:22px}
.brand{font-weight:700;font-size:15px;letter-spacing:.02em;margin-bottom:10px}
.brand small{color:var(--muted);font-weight:400;margin-left:6px}
.who{padding:0 14px 8px}
.who select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:12.5px;cursor:pointer}
.idcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0 16px;background:var(--card)}
.idcard .k2{font-weight:700;font-size:13px;margin:8px 0 4px;color:var(--accent)}
.idcard .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--accent)}
.fp{display:inline-block;margin-left:6px;padding:0 5px;border-radius:999px;font-size:10.5px;background:var(--soft);color:var(--accent);border:1px solid var(--line)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-left:3px solid var(--accent);background:var(--soft);padding:9px 12px;border-radius:0 10px 10px 0;margin:10px 0 16px;font-size:13px}
.banner a[data-who]{color:var(--accent);cursor:pointer;text-decoration:underline}
ul.srcs{font-size:12.5px;color:var(--muted);word-break:break-all}
ul.srcs a{color:var(--accent)}
input[type=search]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font-size:14px;outline:none}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 14px 6px}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 9px;border-radius:999px;font-size:12px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#filters{display:flex;gap:4px;padding:0 14px 8px;flex-wrap:wrap;align-items:center}
#filters .sep{width:100%;height:0}
.chipbtn{border:1px solid var(--line);background:transparent;color:var(--muted);font-size:11px;padding:3px 7px;border-radius:6px;cursor:pointer}
.chipbtn.on{background:var(--soft);color:var(--fg);border-color:var(--accent)}
#count{margin-left:auto;font-size:11px;color:var(--muted)}
#list{overflow:auto;flex:1;padding:0 8px 14px}
.item{display:flex;gap:8px;align-items:flex-start;padding:8px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--soft)}
.item.active{background:var(--soft);border-color:var(--accent)}
.it-title{font-size:13.5px;font-weight:600;line-height:1.4}
.it-sub{font-size:11.5px;color:var(--muted)}
.mini{margin-left:auto;font-size:10.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 4px}
.mini.full{color:#fff;background:#2e7d32;border-color:#2e7d32}
.badge{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--soft);color:var(--fg);flex:none;margin-top:2px}
.lv-L0{background:#e8f1fa;color:#1f4e79}.lv-L1{background:#e8f4e6;color:#2e6b2b}.lv-L2{background:#fff1df;color:#8a5300}.lv-L3{background:#f4e8f8;color:#6b2b80}.lv-L4{background:#fde9e7;color:#8a2c22}
@media (prefers-color-scheme: dark){.badge{color:#111}}
main{overflow:auto;padding:30px 44px 80px}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.04em}
main h1{margin:6px 0 10px;font-size:26px;line-height:1.3}
.meta{font-size:12.5px;color:var(--muted);margin-bottom:16px}
main h3{margin:26px 0 8px;font-size:14px;letter-spacing:.03em;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:5px}
main h3 small{color:var(--muted);font-weight:400;letter-spacing:0}
p{margin:6px 0}
.muted{color:var(--muted);font-size:13.5px}
ul.chapters{list-style:none;padding:0;margin:0;columns:1}
.vblock{margin:16px 0 22px}
.vhead{font-size:13.5px;font-weight:700;padding:6px 10px;background:var(--soft);border-left:3px solid var(--accent);border-radius:4px}
.vmeta{font-weight:400;color:var(--muted);font-size:11.5px}
.vnote{font-size:12px;color:var(--muted);margin-top:4px;font-weight:400}
ul.chapters li{display:flex;gap:8px;padding:6px 8px;border-bottom:1px dashed var(--line);cursor:pointer;font-size:13.5px;align-items:flex-start;break-inside:avoid}
@media(min-width:1200px){ul.chapters{columns:2;column-gap:40px}}
ul.chapters li:hover{background:var(--soft)}
ul.chapters li .box{width:16px;height:16px;border:1.5px solid var(--line);border-radius:4px;flex:none;text-align:center;font-size:11px;line-height:14px;margin-top:2px;color:#fff}
ul.chapters li.done{color:var(--muted)}
ul.chapters li.done .box{background:#2e7d32;border-color:#2e7d32}
.progwrap{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.progbar{flex:1;height:6px;background:var(--soft);border-radius:99px;overflow:hidden;max-width:340px}
.progfill{height:100%;background:#2e7d32;width:0;transition:width .2s}
#progress-label{font-size:11.5px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--accent);cursor:pointer;text-decoration:none}
.chip:hover{background:var(--soft)}
table.grid{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0}
table.grid th,table.grid td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.grid th{background:var(--soft);font-weight:600;white-space:nowrap}
td.stage{white-space:nowrap;font-weight:600}
.file{margin-top:36px;font-size:11.5px;color:var(--muted)}
.empty{max-width:640px;margin:8vh auto}
.empty h2{font-size:26px;margin-bottom:8px}
.hint{font-size:12.5px;color:var(--muted)}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px;background:var(--soft)}
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat-n{font-size:26px;font-weight:700}
.stat-l{font-size:11.5px;color:var(--muted)}
.mbar{display:none}
.mask{display:none}
@media(max-width:820px){
  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:45;
        padding:9px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  .mbar b{font-size:15px}
  .mbar small{font-size:11px;color:var(--muted)}
  .mbar .sp{flex:1}
  #hamb,#mAsk{border:1px solid var(--line);background:var(--bg);border-radius:8px;
        font-size:15px;line-height:1;padding:7px 10px;cursor:pointer;color:var(--fg)}
  .wrap{display:block;height:auto}
  aside{position:fixed;top:0;bottom:0;left:0;width:84%;max-width:330px;z-index:60;
        transform:translateX(-102%);transition:transform .22s ease;border-right:1px solid var(--line);
        background:var(--bg);max-height:none;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.18)}
  body.nav-open aside{transform:none}
  body.nav-open .mask{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.35)}
  main{padding:14px 14px 90px;margin-left:0}
  h1{font-size:24px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 6px}
  .tabs button{flex:0 0 auto}
  #filters{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 10px 8px}
  #filters>*{flex:0 0 auto}
  table.grid{display:table;width:100%;table-layout:fixed;font-size:12px}
  table.grid th,table.grid td{white-space:normal;padding:6px 5px;word-break:break-word}
  ul.pts{font-size:13.5px}
  .askpanel{left:8px;right:8px;bottom:66px;width:auto;max-height:72vh}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat-n{font-size:22px}
  .askbtn{padding:9px 14px;font-size:13.5px}
  .chnav{gap:8px;font-size:13px}
}

/* 章节页 */
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
.atom{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--card);cursor:pointer;transition:border-color .15s}
.atom:hover{border-color:var(--accent)}
.atom-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.atom-h .more{margin-left:auto;color:var(--accent);cursor:pointer;font-size:12px;white-space:nowrap}
.atom-h .more:hover{text-decoration:underline}
.atom-h b{font-size:14.5px}
.atom-h span{font-size:12.5px;color:var(--muted)}
ul.pts{margin:8px 0 0;padding-left:18px;font-size:13.5px}
ul.pts li{margin:3px 0}
.tip{margin-top:8px;font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.relrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
textarea#chnote{width:100%;min-height:92px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);font:14px/1.6 inherit;resize:vertical}
.chnav{display:flex;justify-content:space-between;gap:10px;margin:26px 0 0;font-size:13px}
.chnav a{color:var(--accent);cursor:pointer;text-decoration:none}
/* 问答 */
.askbtn{position:fixed;right:26px;bottom:26px;z-index:40;border:none;border-radius:999px;padding:11px 18px;
  background:var(--accent);color:#fff;font-size:14px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.askpanel[hidden]{display:none}
.askpanel{position:fixed;right:26px;bottom:26px;width:min(430px,calc(100vw - 40px));height:min(620px,calc(100vh - 60px));
  background:var(--card);border:1px solid var(--line);border-radius:14px;z-index:41;display:flex;flex-direction:column;
  box-shadow:0 18px 48px rgba(0,0,0,.22)}
.askhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.askhead small{font-weight:400;color:var(--muted);font-size:11.5px}
.askhead button{margin-left:auto;border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
#askLog{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{font-size:13.5px;line-height:1.6;border-radius:10px;padding:9px 11px;max-width:92%}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff}
.msg.a{align-self:flex-start;background:var(--soft)}
.reslist{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.res{display:block;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:6px 9px;font-size:12.5px;cursor:pointer}
.res:hover{border-color:var(--accent)}
.res b{color:var(--accent);font-weight:600;margin-right:6px}
.asksug{display:flex;gap:5px;flex-wrap:wrap;padding:8px 14px 0}
.asksug button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;
  font-size:11.5px;padding:3px 8px;cursor:pointer}
.askfoot{display:flex;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--line)}
#askInput{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg);font-size:13.5px;outline:none}
#askInput:focus{border-color:var(--accent)}
#askSend{border:none;border-radius:9px;padding:0 16px;background:var(--accent);color:#fff;font-size:13.5px;cursor:pointer}
</style></head>
<body>
<div class="mbar"><button id="hamb" aria-label="目录">☰</button><b>康复知识库</b><span class="sp"></span><small id="mbarSub">21 位点</small><button id="mAsk" aria-label="问知识库">问</button></div>
<div class="mask" id="mask"></div>
<div class="wrap">
<aside>
  <div class="top">
    <div class="brand">康复知识库 <small id="brandSub">21 位点 / 22 版次</small></div>
    <div class="who"><select id="whoSel" title="选一个身份，相关的内容会被标成本阶段重点"><option value="">身份：不指定（全部内容）</option></select></div>
    <input id="search" type="search" placeholder="搜索：脑卒中 / 吞咽 / Berg / C1 …">
  </div>
  <div class="tabs">
    <button class="tab on" data-tab="books">教材</button>
    <button class="tab" data-tab="topics">主题延伸</button>
    <button class="tab" data-tab="paths">学习路径</button>
    <button class="tab" data-tab="scales">量表速查</button>
    <button class="tab" data-tab="diseases">病种速查</button>
    <button class="tab" data-tab="overlaps">重合取舍</button>
    <button class="tab" data-tab="ident">身份适配</button>
    <button class="tab" data-tab="cert">资格证</button>
  </div>
  <div id="filters">
    <button class="chipbtn on" data-level="all">全部</button>
    <button class="chipbtn" data-level="L0">L0</button>
    <button class="chipbtn" data-level="L1">L1</button>
    <button class="chipbtn" data-level="L2">L2</button>
    <button class="chipbtn" data-level="L3">L3</button>
    <button class="chipbtn" data-level="L4">L4</button>
    <span class="sep"></span>
    <button class="chipbtn on" data-cat="all">全类</button>
    <button class="chipbtn" data-cat="A">A 入门</button>
    <button class="chipbtn" data-cat="B">B 基础</button>
    <button class="chipbtn" data-cat="C">C 评定</button>
    <button class="chipbtn" data-cat="D">D 技术</button>
    <button class="chipbtn" data-cat="E">E 专科</button>
    <button class="chipbtn" data-cat="F">F 综合</button>
    <span id="count"></span>
  </div>
  <div id="list"></div>
</aside>
<main id="main"></main>
</div>
<button id="askBtn" class="askbtn">问知识库</button>
<section id="askPanel" class="askpanel" hidden>
  <div class="askhead">问知识库 <small>检索 · 总结 · 直达章节</small><button id="askClose" title="收起">×</button></div>
  <div id="askLog"></div>
  <div class="asksug">
    <button data-q="脑卒中手功能怎么练">脑卒中手功能</button>
    <button data-q="膝置换术后多久能负重">膝置换术后</button>
    <button data-q="吞咽障碍怎么评">吞咽评定</button>
    <button data-q="肌力评定 MMT 分级">MMT 分级</button>
    <button data-q="脊髓损伤并发症">脊髓损伤</button>
  </div>
  <div class="askfoot">
    <input id="askInput" placeholder="说出你的需求，例如：偏瘫肩痛怎么处理" autocomplete="off">
    <button id="askSend">发送</button>

个人因素是背景", "残损—活动受限—参与限制，对应残疾三级预防", "ICD 说病因，ICF 说功能，二者互补不替代", "评定落到“能做什么”，不停在诊断名上"], "t": "常考 ICF 成分举例、三级预防对应措施。", "kw": ["残疾", "ICF", "功能", "残损", "预防", "分类"], "d": [["怎么理解", "p", "残疾不是「身体坏了」这么简单，而是个人能力与环境要求之间不匹配。ICF 把这件事拆成两半：一半是功能与残疾（身体功能 b、身体结构 s、活动与参与 d），另一半是背景因素（环境 e、个人因素）。同一个胸 10 脊髓损伤者，在有坡道、有电梯、有辅助器具的城市里能上班，在没坡道的旧楼里就出不了门——损伤一样，残疾程度不同，差别就在环境。"], ["教材定义（背这两句）", "p", "① 残疾（disability）：指因外伤、疾病、发育缺陷或精神因素造成明显的身心功能障碍，以致不同程度地丧失正常生活、工作和学习能力的一种状态。② 残疾学：研究残疾的病因、分类、发生规律、预防、评定与康复的学科。答题按「原因—表现—后果」三段写：原因＝伤病与发育缺陷，表现＝身心功能障碍，后果＝生活、学习、工作能力部分或全部丧失。要能说出旧分类（ICIDH 1980）与新分类（ICF 2001）的区别：旧分类是单向线性「损伤→失能→残障」，新分类是双向交互，环境与个人因素可以加重也可以减轻残疾。"], ["残疾的三个层次（旧分类，仍常考）", "table", [["层次", "英文", "定义", "举例（脑卒中后）"], ["损伤", "impairment", "器官或系统水平的结构异常与功能丧失", "左侧基底节梗死；右侧肢体肌力 2 级、肌张力 Ashworth 2 级"], ["活动受限", "activity limitation / disability", "个人层面完成日常活动的能力下降", "不能独立穿衣、进食需帮助、不能独自行走"], ["参与限制", "participation restriction / handicap", "社会层面参与生活情境受限", "不能返岗、不能独自乘车、无法参加社区活动"]]], ["中国残疾分类与分级（六类四级）", "table", [["类别", "评定要点", "常用分级线"], ["视力残疾", "双眼视力或视野", "盲：一级＜0.02 或视野半径＜5°；二级 0.02—＜0.05 或视野＜10°；低视力：三级 0.05—＜0.1；四级 0.1—＜0.3"], ["听力残疾", "较好耳平均听力损失（0.5/1/2/4 kHz）", "一级≥91 dB HL；二级 81—90；三级 61—80；四级 41—60"], ["言语残疾", "言语清晰度与交流能力", "按语音清晰度与表达能力分四级，一级最重"], ["肢体残疾", "运动功能（上肢、下肢、躯干）", "一级：四肢瘫/截瘫（肌力≤2 级）等；四级：单肢功能部分受限"], ["智力残疾", "智力商数 + 社会适应行为", "一级 IQ＜20；二级 20—34；三级 35—49；四级 50—69（须结合适应行为）"], ["精神残疾", "精神障碍持续 1 年以上并影响社会功能", "按 WHO-DAS 或社会功能缺陷筛选量表分四级"]]], ["三级预防（这题几乎每年都考）", "table", [["级别", "目标", "具体措施", "课本例子"], ["一级预防", "防止残疾发生（防伤病本身）", "免疫接种、安全生产与交通安全、优生优育与遗传咨询、产前诊断、控制致残因素（高血压、糖尿病、酗酒）", "新生儿乙肝疫苗；孕期补叶酸防神经管缺陷；工地安全帽"], ["二级预防", "残疾发生后防止其发展为永久性障碍", "早发现、早诊断、早治疗；新生儿听力与代谢病筛查；脑卒中超早期溶栓；骨折早期内固定 + 早期康复介入", "发病 4.5 h 内溶栓；脑瘫 6 个月前开始干预"], ["三级预防", "防止残障（功能与参与受限）加重", "康复训练、矫形器与辅具、环境无障碍改造、职业康复、心理支持、社区康复", "截瘫者配轮椅 + 改造家居门槛；偏瘫者佩戴踝足矫形器防足下垂"]]], ["ICF 限定值与评定记录", "table", [["成分", "编码字母", "限定值 0—4 的含义", "记录示例"], ["身体功能", "b", "0 无损伤，1 轻度，2 中度，3 重度，4 完全损伤", "b730 肌力 .2（右下肢 MMT 3 级）"], ["身体结构", "s", "0 无变化，1—4 依次加重（含缺失）", "s750 下肢结构 .3（膝上截肢）"], ["活动与参与", "d", "0 无困难，1 轻度，2 中度，3 重度，4 完全（含「未特指」「不适用」8/9）", "d450 步行 .3（需一人扶持走 10 m）"], ["环境因素", "e", "障碍用 .1—.4，促进用 +1—+4（加分号）", "e120 公共交通 +2（有低地板公交）"]]], ["康复里怎么用（写评定报告的顺序）", "ul", ["第一步写损伤：诊断 + 具体数字（肌力、ROM、肌张力、感觉平面），对应 b、s。", "第二步写活动：Barthel 指数分项得分（进食 5、洗澡 0、步行 10……），对应 d4。", "第三步写参与：能否返岗/返校、能否独自出行、社会角色，对应 d8、d9。", "第四步写环境与个人因素：住几楼有无电梯、家庭照护者、经济与医保、依从性——它们决定目标能不能落地。", "报告结尾必须是「问题清单 + 目标 + 干预 + 复评时间」，不能只堆描述。"]], ["必背数字与术语", "ul", ["残疾三级预防：一级防发生、二级防发展、三级防残障。", "Barthel 指数 0—100 分：≤40 重度依赖、41—60 中度、61—99 轻度、100 独立。", "ICF 两大成分：功能与残疾（b/s/d）+ 背景因素（e/个人）。", "impairment 损伤 → activity limitation 活动受限 → participation restriction 参与限制。", "中国残疾分类六类：视力、听力、言语、肢体、智力、精神（多重残疾按两类以上计）。"]], ["提示", "p", "最容易丢分的两个点：① 把残疾等同于「病」，答成因时漏掉「发育缺陷」和「精神因素」；② 三级预防写反，记住「一级防发生、二级防发展、三级防残障」。ICF 题只要答出「双向、含环境因素、限定值 0—4」三点就算会了。"], ["依据", "p", "依据：《康复医学概论》第 3 版 第 3 章 残疾学；ICF 分类（WHO，2001）；《残疾人残疾分类和分级》（GB/T 26341—2010）。"]]}, {"k": "liuxing", "n": "流行病学与需求", "c": "康复需求的人群分布与统计口径", "p": ["残疾率、患病率、致残原因构成比三组指标", "数据来源：抽样调查、登记报告、医保结算", "用于配置床位、人力与社区服务", "不同口径不可直接相加比较"], "t": "记定义与用途，不背具体百分比。", "kw": ["流行病", "统计", "调查", "致残原因", "分布"], "d": [["怎么理解", "p", "流行病学给康复提供的是「分母」：某病一年新发多少人、现患多少人、致残率多高，直接决定要建多少床位、配多少治疗师、买多少辅具。所以它既是公卫课，也是康复科做规划与写论文的方法课：横断面调查告诉你现患率，队列研究告诉你危险因素，RCT 告诉你哪种训练有效。"], ["教材定义（背这句）", "p", "流行病学：研究疾病与健康状况在人群中的分布及其决定因素，并研究防制疾病、促进健康的策略与措施的科学。三个关键词要答出来——「人群」（不是个体）、「分布」（时间、地点、人群三间分布）、「决定因素」（病因与危险因素）。康复流行病学则把结局从「发病/死亡」换成「功能与残疾」，常用指标增加了致残率、DALY、功能恢复率。"], ["常用指标（公式要能写）", "table", [["指标", "定义与公式", "康复中的用处"], ["发病率", "一定期间内新发病例数 ÷ 同期暴露人口 × 10 万（或 10 万/年）", "估算康复床位与早期介入需求"], ["患病率", "某时点（或期间）现患病例数 ÷ 调查人口 × 100%（或 /10 万）", "规划门诊量、社区康复覆盖"], ["致残率", "残疾人数 ÷ 该病患病人数 × 100%", "判断某病康复负荷（脑卒中约 70%—80% 遗留功能障碍）"], ["病死率", "一定期间死亡数 ÷ 患该病总人数 × 100%", "与致残率一起看疾病负担的「两端」"], ["DALY", "伤残调整生命年＝YLL（早死损失年）+ YLD（伤残损失年）", "跨病种比较负担，写立项/论文常用"], ["功能恢复率", "达到目标功能的人数 ÷ 康复治疗人数 × 100%", "评价康复科疗效与质量"]]], ["研究设计怎么选（考点）", "table", [["设计", "能回答什么", "康复例子", "主要偏倚"], ["横断面调查", "患病率、功能现状", "某社区 60 岁以上老人跌倒史与平衡能力调查", "不能定因果"], ["病例对照", "罕见病的危险因素", "脊髓损伤患者压疮的危险因素（病例 vs 对照）", "回忆偏倚、选择偏倚"], ["队列研究", "发病率与危险因素", "脑卒中后抑郁随访 1 年的发生率", "失访偏倚"], ["随机对照试验 RCT", "干预是否有效", "任务导向训练 vs 常规 PT 对步行能力的疗效", "实施偏倚、沾染"], ["系统评价/Meta", "多研究合并效应", "CI 治疗对偏瘫上肢功能的有效性", "发表偏倚"]]], ["康复常见病种的量级（记住数量级即可）", "table", [["病种", "常用口径", "记法"], ["脑卒中", "我国年发病率约 200/10 万以上，现患约 1300 万，约 3/4 遗留功能障碍", "「千万级现患、七成致残」"], ["脊髓损伤", "年发病率约 25—35/百万", "「每百万人每年二三十例」"], ["脑性瘫痪", "患病率约 2‰—3.5‰ 活产儿", "「千分之二三」"], ["创伤性截肢/骨关节炎", "骨关节炎 65 岁以上约半数有影像学表现", "「老年人过半」"], ["跌倒", "社区 65 岁以上每年约 30% 发生跌倒，其中约 5%—10% 致骨折", "「三成跌倒、一成伤」"]]], ["偏倚与因果（简答常考）", "ul", ["选择偏倚：入选对象不能代表目标人群（只招住院患者代表全社区）。", "信息偏倚：测量或回忆不准（自报跌倒次数、家属代答 ADL）。", "混杂偏倚：年龄、病程同时在两组间不平衡；处理靠随机化、匹配、分层或多因素回归。", "因果推断的五个条件：关联强度、剂量反应、时间顺序（因在前）、可重复性、生物学合理性。"]], ["提示", "p", "概念题别只写「研究疾病分布」，必须补「决定因素 + 防制策略」。计算题记两个分母：发病率用「暴露人口/人年」，患病率用「调查人口」。康复论文最常被退稿的原因是拿横断面数据讲因果，答「能否定因果」时要斩钉截铁说不能。"], ["依据", "p", "依据：《康复医学概论》第 3 版 第 2 章 流行病学；《康复医学》第 7 版 第 1 章 康复概论（疾病负担部分）；ICF（WHO，2001）用于结局指标口径。"]]}, {"k": "lunli", "n": "伦理、文书与质控", "c": "康复伦理问题、医疗文书规范与质量控制", "p": ["伦理：知情同意、隐私保护、资源分配、终止治疗", "文书：入院评定、治疗记录、阶段小结、出院小结", "质控：评定完成率、目标达成率、并发症与再入院", "记录必须可复现：谁、何时、做了什么、反应如何"], "t": "文书类题答“客观、及时、完整、可追溯”。", "kw": ["伦理", "文书", "质控", "记录", "知情同意", "科研", "科学研究", "设备", "循证"], "d": [["怎么理解", "p", "康复伦理的特殊性在于三件事：治疗周期长（几个月到几年，依从性靠信任）、疗效不确定（功能改善常以「月」计，患者容易放弃）、资源稀缺（床位、辅具、医保额度都要分配）。所以伦理在康复里不是空谈原则，而是每天都要做的决定：这个患者要不要继续强化训练、昂贵辅具给谁、患者拒绝训练时听谁的。"], ["四条基本原则（必背）", "table", [["原则", "含义", "康复场景中的具体表现"], ["尊重自主", "尊重有决定能力的患者的意愿与选择", "患者拒绝继续训练，医师须告知后果并记录，不能强迫；但可改目标、换方式"], ["不伤害", "避免造成身心伤害", "痉挛牵伸过度致肌肉撕裂；训练强度超出心肺耐受；为「完成指标」强拉 ROM"], ["有利（行善）", "以患者利益为出发点", "选疗效与负担比最好的方案；能门诊解决的不强制住院"], ["公正", "公平分配有限资源", "床位与辅具按病情需要而非关系分配；社区康复资源向重度残疾者倾斜"]]], ["知情同意四要素（简答模板）", "ul", ["能力：患者有理解与决定能力（无能力者由法定代理人，精神障碍者按《精神卫生法》）。", "信息：告知诊断、方案内容与频次、预期效果、可能风险与替代方案（如手术 vs 保守）。", "理解：用患者能懂的语言，必要时家属在场复述确认。", "自愿：无胁迫、无诱导；可随时撤回，撤回不影响后续治疗。", "形式：口头 + 书面（有创操作、昂贵自费辅具、科研入组必须书面）。"]], ["康复特有的伦理冲突（案例题常用）", "table", [["情境", "冲突点", "处理要点"], ["患者拒绝训练", "自主 vs 有利", "先找原因（疼痛、抑郁、无望感），告知不训练的后果，改目标与方式，记录「已告知」"], ["重度残疾者长期占用床位", "公正 vs 有利", "按功能进步速度与替代方案（社区/家庭康复）评估转介，不是简单劝退"], ["昂贵辅具（智能假肢、外骨骼）", "公正", "按适应证与获益排序，说明自费/医保政策，提供替代方案"], ["训练中身体暴露（截瘫导尿、偏瘫更衣）", "隐私与尊严", "遮挡、同性别陪护、仅暴露必要部位、教学须另征同意"], ["科研入组（新疗法）", "不伤害 vs 有利", "伦理委员会审批、对照设置不剥夺有效治疗、可随时退出"]]], ["案例答题四步（照着写不丢分）", "ul", ["① 定性：这是哪两条原则的冲突（如自主 vs 有利）。", "② 查事实：患者是否有决定能力、是否充分知情、有无替代方案。", "③ 给方案：尊重意愿 + 充分告知 + 调整目标/方式 + 必要时团队与家属沟通 + 记录。", "④ 兜底：涉及无能力、危险行为时按法规与院内流程上报（如精神卫生法、医疗纠纷预防条例）。"]], ["提示", "p", "别把伦理答成道德说教。评分点永远是「原则名称 + 具体做法 + 记录」。最常见失分：只说「应尊重患者」，不说「怎么尊重、后果谁告知、写进哪里」。"], ["依据", "p", "依据：《康复医学概论》第 3 版 第 7 章 康复医学中的伦理问题；《康复医学》第 7 版 第 1 章（康复伦理与团队）；《中华人民共和国基本医疗卫生与健康促进法》《精神卫生法》相关条款。"]]}, {"k": "jiepou-gu", "n": "骨关节解剖", "c": "骨骼、关节、韧带与关节运动学基础", "p": ["骨性标志是触诊与手法的定位依据", "关节类型决定活动方向与生理性限制", "关节运动：滚动、滑动、旋转；生理运动与附属运动", "关节囊、韧带决定稳定方向与损伤机制"], "t": "先记标志点与运动轴，再记肌与神经支配。", "kw": ["解剖", "骨骼", "骨", "关节", "韧带", "标志"], "d": [["怎么理解", "p", "骨关节是康复的「杠杆与支点」。评定关节活动度、判断疼痛来源、设计训练动作，都要先知道这个关节有几个自由度、由谁稳定、正常活动范围多少。"], ["逐条展开", "ul", ["骨：长骨（杠杆）、短骨（腕踝，灵活）、扁骨（颅骨胸骨，保护）、不规则骨（椎骨）。", "关节三型：纤维连接（不动，如颅缝）、软骨连接（微动，如椎间盘、耻骨联合）、滑膜关节（自由活动，康复主要对象）。", "滑膜关节的基本结构：关节面与软骨、关节囊、关节腔、韧带；辅助结构有半月板、盂唇、滑囊、脂肪垫。", "自由度：单轴（肘、指间）、双轴（膝近似、腕）、三轴（肩、髋）。自由度决定能做哪些方向的 ROM 训练。", "稳定结构：韧带限制方向、关节囊限制范围、肌肉提供动态稳定；康复里「稳定」往往比「灵活」更该先练。"]], ["正常活动度速记", "table", [["关节", "主要方向与正常值"], ["肩", "前屈 180°、后伸 60°、外展 180°、内外旋各 90°"], ["肘", "屈 150°、伸 0°（过伸 5—10°）"], ["腕", "背伸 70°、掌屈 80°、桡偏 20°、尺偏 30°"], ["髋", "屈 120°、伸 30°、外展 45°、内收 30°"], ["膝", "屈 135°、伸 0°"], ["踝", "背屈 20°、跖屈 50°"]]], ["提示", "p", "评定 ROM 一定要写「主动 / 被动」两个值：主动明显小于被动 = 肌力或疼痛问题；两者都小 = 关节本身或软组织挛缩。"]]}, {"k": "jiepou-ji", "n": "肌肉解剖与功能", "c": "肌肉起止、配布与协同分工", "p": ["起止点决定力矩与运动方向", "原动肌、拮抗肌、固定肌、中和肌四种角色", "肌纤维走向与羽状角影响力量与速度", "神经支配节段决定损伤后的表现"], "t": "按“关节—运动—肌—神经节段”四列表格记忆。", "kw": ["肌肉", "肌群", "起止", "神经支配", "配布"], "d": [["怎么理解", "p", "肌肉是康复训练的执行器。要知道一块肌肉「起点在哪、止点在哪、跨过哪个关节」，才能判断它收缩时产生什么动作、该用哪个体位去练、拉长位和缩短位分别是什么。"], ["逐条展开", "ul", ["起点（origin）通常在近端/固定侧，止点（insertion）在远端/活动侧；起止点不是绝对的，取决于哪个环节固定。", "跨关节数决定功能：单关节肌管精细动作（如肱肌），双关节肌在两端同时收缩时会产生「主动不足/被动不足」。", "主动不足：双关节肌在一个关节缩短后，对另一个关节的力矩下降（如屈肘后肩屈力量下降）。", "被动不足：双关节肌在一个关节被拉长后，对另一个关节的牵伸受限（如伸膝位屈髋受限，腘绳肌）。", "配布与协同：主动肌、拮抗肌、协同肌、固定肌四种角色；康复训练要按角色设计，而不是只练「那块肌肉」。"]], ["提示", "p", "考「为什么伸膝位屈髋角度变小」答腘绳肌被动不足；考「为什么屈肘后肩屈无力」答肱二头肌主动不足。这两个词几乎每年出。"]]}, {"k": "jiepou-shen", "n": "神经解剖", "c": "中枢与周围神经通路、传导束与定位", "p": ["皮质脊髓束、锥体外系、小脑三条运动通路", "感觉通路：脊髓后索、脊髓丘脑束、三叉", "周围神经丛与关键神经（桡、正中、尺、坐骨、腓总）", "定位诊断：损伤平面决定肌群与反射改变"], "t": "把通路和临床体征对上：上/下运动神经元损伤的区别。", "kw": ["神经", "脑", "脊髓", "传导", "通路", "感觉器", "内分泌"], "d": [["怎么理解", "p", "神经解剖是康复定位的底层地图：哪条通路断了，就出现哪种模式的瘫痪、感觉缺失或反射改变。上运动神经元与下运动神经元的区别，是整本神经康复的第一块砖。"], ["逐条展开", "ul", ["皮质脊髓束（锥体束）：控制精细随意运动，损伤→痉挛性瘫痪、腱反射亢进、病理征阳性（上运动神经元）。", "锥体外系：调节肌张力与协调，损伤→肌张力异常（齿轮样、铅管样）、舞蹈样动作（如帕金森）。", "小脑三对脚：上脚（结合臂）协调、中脚（脑桥臂）传入、下脚（绳状体）平衡；损伤→共济失调、意向性震颤。", "感觉通路：后索（精细触觉、本体觉，薄束/楔束）→ 内侧丘系；脊髓丘脑束（痛温觉、粗触觉）→ 交叉后上行。", "周围神经：颈丛（C1—C4）、臂丛（C5—T1）、腰丛（L1—L4）、骶丛（L4—S4）；常见损伤神经：桡、正中、尺、坐骨、腓总。"]], ["上下运动神经元鉴别", "table", [["体征", "上运动神经元（中枢）", "下运动神经元（周围/前角）"], ["肌张力", "增高（痉挛）", "降低（弛缓）"], ["腱反射", "亢进", "减弱或消失"], ["病理征", "阳性（Babinski）", "阴性"], ["肌萎缩", "晚期轻度", "早期明显"], ["肌电图", "正常或募集减少", "失神经电位、纤颤"]]], ["提示", "p", "定位题先分「上还是下」，再看「哪条通路」：偏瘫 + 面舌瘫 = 皮质脊髓束；单肢弛缓 + 肌萎缩 = 周围神经或前角。"]]}, {"k": "jiepou-zang", "n": "内脏与系统解剖", "c": "呼吸、循环、消化、泌尿生殖系统结构要点", "p": ["呼吸：肺叶分段、胸膜腔、膈肌", "循环：心腔、瓣膜、冠脉、体肺循环", "消化泌尿：腹部分区与脏器体表投影", "康复相关：体位引流、胸廓活动、腹压管理"], "t": "只记与评定/治疗操作相关的解剖，不做外科式记忆。", "kw": ["呼吸", "循环", "消化", "泌尿", "生殖", "血液", "脉管"], "d": [["怎么理解", "p", "内脏解剖在康复里主要服务于两件事：心肺康复（知道通气与循环的路径）+ 盆底与吞咽（知道管道与括约肌）。不需要背到外科手术层面，但要能说出「哪里窄、哪里会漏、哪里该练」。"], ["逐条展开", "ul", ["呼吸：上呼吸道（鼻—咽—喉）→ 气管支气管树 → 肺泡；右主支气管更陡更粗，误吸更易进右下叶。", "呼吸肌：膈肌（主，C3—C5）、肋间外肌、腹肌（呼气）、辅助肌（斜角肌、胸锁乳突肌）。", "循环：体循环（左心—动脉—毛细血管—静脉—右心）与肺循环；康复训练要盯心率、血压、摄氧量。", "消化与吞咽：咽期（软腭上抬、喉上抬、会厌翻转、声门关闭）→ 食管期；吞咽障碍的评估就按这个顺序查。", "泌尿生殖：膀胱（逼尿肌 + 括约肌）、盆底肌；脊髓损伤后的神经源性膀胱分痉挛型与弛缓型。"]], ["提示", "p", "吞咽题优先看「咽期四件事」：软腭上抬、喉上抬、会厌翻转、声门关闭——漏一个就会误吸。"]]}, {"k": "shengli-ji", "n": "骨骼肌生理", "c": "肌纤维类型、收缩形式与疲劳", "p": ["I 型慢肌耐力、II 型快肌爆发", "等长、等张（向心/离心）、等速四种收缩", "力量—长度、力量—速度关系", "疲劳与恢复：中枢与外周机制"], "t": "训练处方要能对上收缩形式与强度。", "kw": ["骨骼肌", "肌纤维", "收缩", "疲劳", "生理"], "d": [["怎么理解", "p", "骨骼肌是「可训练的组织」：不同的收缩形式、不同的负荷与速度，会带来不同的适应。康复开处方时选等长、等张还是等速，取决于这个阶段能不能动、要不要保护关节。"], ["逐条展开", "ul", ["肌纤维：I 型（慢、抗疲劳、耐力）、IIa（快、中等耐力）、IIx/IIb（快、爆发、易疲劳）。", "收缩形式：等长（长度不变、张力增）、等张（张力不变、长度变，分向心/离心）、等速（角速度恒定，需设备）。", "离心收缩力量最大、也最易造成延迟性肌肉酸痛（DOMS），早期康复要慎用大强度离心。", "长度—张力关系：肌肉在静息长度略被拉长时产生最大张力；过短或过长都下降。", "疲劳与恢复：力量训练后 24—48 小时为超量恢复窗口；神经适应先于肌肉肥大（前 4 周力量增长主要靠神经）。"]], ["训练参数速记", "table", [["目标", "强度", "次数/组", "组数", "频率"], ["肌力（力量）", "1—6 RM 或 80—90% 1RM", "1—8 次", "3—6", "每周 3—4 次"], ["肌耐力", "40—60% 1RM", "15—25 次", "2—4", "每周 3—5 次"], ["肥大", "60—80% 1RM", "8—12 次", "3—6", "每周 3—5 次"], ["早期/术后", "等长，20—30% MVC", "5—10 秒/次", "5—10", "每日 2—3 次"]]], ["提示", "p", "术后早期为什么练等长不练等张？答：等长不产生关节运动，剪切力小，能在保护修复组织的前提下维持肌力与神经募集。"]]}, {"k": "shengli-xf", "n": "心肺与代谢生理", "c": "氧运输、能量代谢与运动反应", "p": ["最大摄氧量、无氧阈、心率储备", "运动时心输出量、血压、通气反应", "三大供能系统与运动时间对应", "运动处方的 FITT 生理依据"], "t": "把 FITT 四个字母和生理指标一一对应。", "kw": ["能量代谢", "体温", "血液循环", "尿生成", "尿的生成", "心肺", "生理", "细胞"], "d": [["怎么理解", "p", "心肺与代谢生理决定运动处方的「安全边界」。同样一套训练，对健康人是热身，对心衰患者可能是过量——差别在氧运输能力与代谢储备。"], ["逐条展开", "ul", ["氧运输链：肺通气/换气 → 心输出量（心率×每搏量）→ 血红蛋白携氧 → 肌肉利用（线粒体）。", "最大摄氧量 VO₂max：心肺适能的金标准；康复中常用 6 分钟步行距离、运动试验间接推算。", "能量系统：磷酸原（0—10 秒）、糖酵解（10 秒—2 分钟）、有氧氧化（>2 分钟）；康复训练以有氧为主。", "运动反应：心率上升、血压收缩压上升（舒张压不应明显升）、每搏量增加、通气量增加。", "危险信号：运动中胸痛、明显气促（说话断句）、头晕、血压异常升高或下降、心律失常——立即停止。"]], ["提示", "p", "心衰患者为什么用「说话试验」定强度？因为 Borg 评分主观、心率受 β 受体阻滞剂影响，能连贯说话说明还在无氧阈以下。"]]}, {"k": "shengli-shen", "n": "神经生理", "c": "神经元、突触、反射与可塑性", "p": ["兴奋传递、突触可塑性（LTP/LTD）", "牵张反射、屈伸反射、姿势反射", "中枢可塑性：使用依赖、重组、代偿", "抑制与易化的临床对应（痉挛、协同运动）"], "t": "神经发育疗法与运动再学习的理论根在这里。", "kw": ["神经系统", "反射", "突触", "可塑", "感觉器官"], "d": [["怎么理解", "p", "神经生理里最该带走的一个词是「可塑性」：中枢损伤后，残存通路会重排、突触会增强，训练就是在给这种重排提供信号。所以康复不是「等它自己好」，而是「用正确输入去塑形」。"], ["逐条展开", "ul", ["神经元：胞体、树突（输入）、轴突（输出）、髓鞘（传导速度）；周围神经可再生（约 1 mm/天），中枢再生很有限。", "突触传递：兴奋性（谷氨酸）与抑制性（GABA）递质；长时程增强（LTP）是学习与运动记忆的细胞基础。", "反射：牵张反射（肌梭→Ia→α 运动神经元）、屈肌反射、交叉伸肌反射；痉挛就是牵张反射亢进。", "可塑性机制：轴突侧支发芽、突触效能改变、皮层代表区重组、去抑制（损伤后抑制解除导致过度兴奋）。", "训练原则对应：重复（量）、任务导向（特异性）、强度（接近极限）、及时反馈——四条都指向「用进废退」。"]], ["提示", "p", "解释「为什么早期训练要任务导向而不是单纯被动活动」：被动活动维持关节与软组织，但不会产生有效的突触重塑信号；任务导向 + 主动参与才有。"]]}, {"k": "shengwu", "n": "生物力学与运动学", "c": "力、力矩、杠杆与人体运动分析", "p": ["力矩=力×力臂；三类杠杆在人体中的例子", "重心、支撑面、稳定角决定平衡", "步态周期：支撑相/摆动相，时空参数", "异常步态的生物力学解释（代偿、短缩、疼痛）"], "t": "步态参数（步长、步频、步速、对称性）要能和病理对上。", "kw": ["生物力学", "运动学", "力学", "杠杆", "重心", "行走"], "d": [["怎么理解", "p", "生物力学把人体当杠杆系统：力、力矩、力臂决定「这个人为什么搬不动、为什么膝会疼、为什么拐杖要那样用」。康复里的体位、辅具、转移技术，背后都是力矩。"], ["逐条展开", "ul", ["三类杠杆：第一类（支点在中间，如寰枕关节）、第二类（阻力在中间，如提踵）、第三类（力在中间，人体最多，如屈肘）。", "力矩 = 力 × 力臂；力臂是「力的作用线到支点的垂直距离」，不是肌肉到关节的距离。", "增大稳定性的办法：降低重心、扩大支撑面、重力线落在支撑面内——拐杖、助行器、站位训练都按这个设计。", "脊柱负荷：弯腰提物时腰椎负荷可达体重的数倍；搬物要「屈膝屈髋、物体贴近身体」。", "步态生物力学：髋膝踝的力矩与地面反作用力决定异常步态的代偿方式（如臀中肌步态、跨阈步态）。"]], ["提示", "p", "考「为什么膝关节炎患者上下楼比平地疼」：上下楼时髌股关节反作用力可达体重的 3—7 倍，力臂与屈曲角度共同放大负荷。"]]}, {"k": "fayu", "n": "发育", "c": "胎儿期到青春期的发育规律与评定", "p": ["发育遵循头尾、近远、整体到分化顺序", "关键期与里程碑（抬头、坐、爬、走、语）", "发育商（DQ）与筛查工具", "早产矫正月龄、高危儿监测"], "t": "儿童康复所有判断都以“矫正年龄 + 里程碑”为基准。", "kw": ["发育", "胎儿", "婴幼儿", "儿童发育", "青春期", "学龄"], "d": [["怎么理解", "p", "发育是「按顺序出现的里程碑」。儿童康复的第一件事不是治疗，而是判断「这个孩子落后了没有、落后在哪个能区」——所以里程碑与关键期必须背熟。"], ["逐条展开", "ul", ["发育规律：头尾方向（先会抬头再会走）、近端到远端（先会抬臂再会抓握）、整体到分化、由粗到细。", "关键期：0—3 岁脑发育最快，语言关键期约 0—6 岁；错过关键期不是不能学，而是效率下降。", "粗大运动里程碑：2 月抬头、4—6 月翻身、6—8 月独坐、8—10 月爬、10—12 月扶站、12—15 月独走。", "精细运动：3—4 月抓握、6—7 月换手、9—10 月拇食指对捏、18 月叠 2—3 块积木、3 岁画圆。", "语言：3 月咿呀、6—9 月无意义音节、1 岁有意识叫爸妈、2 岁 50 词 + 两词句、3 岁短句可懂。"]], ["提示", "p", "判断「发育迟缓」的常用线：3 月不会抬头、6 月不会翻身、9 月不会独坐、18 月不会独走、2 岁无有意义单词——任一条都建议转诊评估。"]]}, {"k": "pd-zhong", "n": "评定总论与形态/反射", "c": "评定的目的、流程与人体形态、反射检查", "p": ["评定三问：能不能、差多少、为什么", "形态：长度、围度、姿势、脊柱曲度", "反射：深浅反射、病理反射、脑膜刺激征", "评定记录要能复查对比"], "t": "评定总论题答“目的—方法—结果解释—记录”四段。", "kw": ["评定", "形态", "反射", "姿势", "测量", "总论", "人体形态"], "d": [["怎么理解", "p", "康复评定是「先量后治」的那把尺：不评定量不出问题，量不出问题就定不了目标，定不了目标就没法判断治疗有没有效。它和临床诊断的分工是——诊断回答「是什么病」，评定回答「功能差在哪、差多少、能不能变好」。所以评定报告里必须有数字，不能只有描述。"], ["教材定义（背这句 + 四个质量指标）", "p", "康复评定：是收集患者功能状态相关资料，对其功能状况及潜在能力作出量化或定性判断的过程，是制定康复目标和方案的依据，也是判定康复疗效的手段。评定量表要过四关：信度（重复测量一致性，ICC 或 Kappa 常要求＞0.75）、效度（测的是不是想测的东西）、灵敏度（有病能查出）、特异度（无病不误判）。另需掌握最小临床重要差值（MCID）：如 Barthel 变化≥10 分、6MWT 变化≥30 m 才算患者能感知的改善。"], ["评定三问与流程", "ul", ["三问：能不能（能力有无）、差多少（量化程度）、为什么（原因与预后）。", "流程：采集病史 → 观察与查体（形态、ROM、肌力、肌张力、反射）→ 选量表测评 → 分析问题清单 → 定目标（SMART）→ 出方案 → 定期复评。", "「三间」记录：初始评定（基线）、中期评定（每 1—2 周或每疗程）、末期评定（出院/转介）。", "报告五要素：问题、数字、目标、干预、复评时间。缺一个就是不合格的评定报告。"]], ["人体形态测量（方法与正常值）", "table", [["项目", "测量方法", "参考值/判读"], ["四肢长度", "上肢：肩峰—桡骨茎突；下肢：髂前上棘—内踝（真长）/ 脐—内踝（相对长）", "两侧差＞1 cm 有意义（骨折短缩、髋内收）"], ["肢体围度", "大腿：髌骨上缘上 15 cm；小腿：髌骨下缘下 10 cm；上臂：肩峰下 10 cm", "两侧差＞1 cm 提示肌萎缩或水肿"], ["BMI", "体重(kg) ÷ 身高(m)²", "中国标准：＜18.5 偏瘦、18.5—23.9 正常、24—27.9 超重、≥28 肥胖"], ["脊柱侧弯", "Adam 前屈试验 + Cobb 角（X 线）", "Cobb 角＞10° 诊断侧弯；＞40°—50° 常需手术评估"], ["姿势与骨盆", "站位/坐位观察、骨盆倾斜角", "骨盆前倾常伴腰椎前凸增大、腘绳肌紧张"]]], ["反射检查（定位必背）", "table", [["反射", "节段", "正常反应", "异常意义"], ["肱二头肌反射", "C5—C6", "前臂屈曲", "减弱：下运动神经元/周围神经；增强：上运动神经元"], ["肱三头肌反射", "C6—C7", "前臂伸展", "同上"], ["膝反射", "L2—L4", "小腿伸展", "L4 神经根或股神经病变时减弱"], ["跟腱反射", "S1—S2", "足跖屈", "S1 根性损害减弱；上运动神经元损伤增强"], ["腹壁反射", "T7—T12", "腹肌收缩", "上运动神经元损伤时消失（T7—T12 平面以上）"], ["Babinski 征", "锥体束", "拇趾背伸、其余四趾扇形散开", "阳性＝锥体束损害（1 岁内婴儿可为生理性）"], ["Hoffmann 征", "C5—T1 锥体束", "拇指屈曲内收", "阳性提示颈髓上运动神经元损害"]]], ["分级记录（会写才算会）", "ul", ["深反射分级 0—4+：0 消失、1+ 减弱、2+ 正常、3+ 增强、4+ 阵挛。", "病理反射只记「阳性/阴性」，Babinski 阳性要写清侧别。", "脑膜刺激征：Kernig 征（屈髋 90° 后伸膝＜135° 为阳性）、Brudzinski 征（屈颈引起屈髋屈膝）。", "感觉检查：轻触觉、针刺觉、温度觉，按 C2—S5 关键点记录，用于脊髓损伤平面判定（ASIA）。"]], ["提示", "p", "评定总论最爱考「信度 vs 效度」的区分：信度是「测得稳」，效度是「测得准」。答评定目的时写三条——判断功能障碍的性质与程度、确定康复目标与方案、评价疗效与预后。别漏「量化」两个字，这是康复评定区别于临床查体的核心。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 1 章 总论、第 2 章 人体形态评定、第 3 章 神经反射评定；《康复医学》第 7 版 第 3 章 康复医学评定。"]]}, {"k": "pd-jili", "n": "肌力评定", "c": "MMT 与等速/握力等定量方法", "p": ["MMT 0—5 级判断标准与体位固定", "等长、等张、等速测试的适用与差异", "握力计、背力计、便携式测力", "禁忌：骨折未稳、术后早期、疼痛剧烈"], "t": "MMT 的 3 级与 4 级最容易混：能否抗重力、能否抗阻力。", "kw": ["肌力", "MMT", "徒手肌力", "等速", "握力"], "d": [["怎么理解", "p", "肌力评定是康复科最基础的一把尺：它决定患者能不能站、能不能走、能不能自己穿衣，也决定训练该从哪一级开始。临床上 90% 的「练力量」都要先回答两个问题——现在几级、目标几级。所以 MMT 的分级标准必须能默写，而且每一级都要能说出「用什么姿势、抗不抗重力、加不加阻力」。"], ["教材定义", "p", "肌力：指肌肉主动收缩时所能产生的最大力量，受肌肉横截面积、募集运动单位数量、初长度与收缩速度影响。徒手肌力评定（MMT，Lovett 分级）：在特定体位下，让患者主动收缩肌肉完成关节全范围活动，检查者通过「能否触及收缩、能否完成全 ROM、能否抗重力、能否抗阻力」四级判断，把肌力分为 0—5 级。"], ["MMT 0—5 级（默写这张表）", "table", [["级别", "判断标准（缺一不可）", "操作要点与举例（股四头肌）"], ["0 级", "触不到肌肉收缩", "仰卧伸膝位，嘱伸膝，股四头肌无收缩"], ["1 级", "可触及收缩，但无关节运动", "触及髌上收缩，小腿不动"], ["2 级", "消除重力下可完成全 ROM", "侧卧（患侧在下），伸膝可完成全范围"], ["3 级", "抗重力可完成全 ROM，不能抗阻力", "仰卧，能主动伸膝至 0°"], ["4 级", "抗重力 + 部分阻力完成全 ROM", "仰卧，能伸膝，加中等阻力后仍可完成"], ["5 级", "抗重力 + 最大阻力，与健侧对称", "仰卧，加最大阻力仍可完成全 ROM，双侧对称"]]], ["等长 / 等张 / 等速（三种测试怎么选）", "table", [["方式", "指标", "设备", "适用与注意"], ["等长收缩", "最大随意收缩力（MVC），kg 或 N", "手持测力计、拉力计、握力计", "关节不动、无痛部位适用；骨折早期、术后制动期首选"], ["等张收缩", "1RM（一次最大重复负荷）、重复次数", "哑铃、弹力带、器械", "更接近日常动作；需注意全程关节稳定"], ["等速收缩", "峰力矩 PT、相对峰力矩 PT/BW、总功、平均功率、耐力比", "等速肌力测试仪（常见 60°/s 测力、180°/s 测耐力）", "客观、可重复；但设备贵，急性期与关节不稳慎用"]]], ["握力与临床阈值", "ul", ["握力用握力计，坐位、肘屈 90°、测 3 次取最大值（间隔 30 s）。", "参考：成年男性约 30—45 kg、女性约 20—30 kg（随年龄下降）；握力体重指数（握力/体重×100）＞50 为正常。", "握力是肌少症筛查指标之一：男性＜28 kg、女性＜18 kg 提示肌肉力量不足（亚洲工作组 AWGS 标准）。", "手握力也是术后与重症的预后指标：握力低者并发症与住院时间更长。"]], ["禁忌与质量控制", "ul", ["禁忌：骨折未愈合、关节急性炎症或积液、术后早期（未获许可）、剧烈疼痛、严重骨质疏松、心血管不稳定（不稳定的心绞痛、未控制的高血压）。", "质量控制：固定体位与固定点、先健侧后患侧、同一检查者复评、疲劳前完成（先测健侧再测患侧可能受疲劳影响，注意顺序）。", "记录：级别 + 部位 + 侧别 + 体位 + 是否疼痛，如「右膝伸肌 MMT 4 级（仰卧，抗部分阻力），伸膝末 10° 疼痛」。"]], ["提示", "p", "MMT 三个高频错点：① 2 级写成「能活动」——必须是「消除重力下全 ROM」；② 4 级写成「能抗阻力」——必须是「抗重力 + 部分阻力、未达正常」；③ 忘记写体位。等速测试题记住两个角速度：60°/s 测最大力量、180°/s 测耐力。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 9 章 肌力评定；《物理治疗学》第 3 版 第 6 章 肌力训练；AWGS 2019 肌少症共识（握力切点）。"]]}, {"k": "pd-jizhangli", "n": "肌张力评定", "c": "肌张力的定义、Ashworth 分级与痉挛处理思路", "p": ["肌张力是静息状态下的肌肉阻力", "改良 Ashworth 0—4 级（含 1+）", "痉挛与僵硬、齿轮样、折刀样的区别", "评定要固定体位与速度，减少主观误差"], "t": "1+ 级是高频考点：ROM 后 1/2 出现阻力。", "kw": ["肌张力", "Ashworth", "痉挛", "僵硬", "张力"], "d": [["怎么理解", "p", "肌张力是「静息时的紧张度」，不是力量。临床上最常混淆的是「肌张力高」和「肌力强」——脑卒中早期软瘫是肌张力低但肌力也低，痉挛期是肌张力高但主动力量仍不足。判断痉挛要看「速度依赖性」：被动活动越快阻力越大，这是痉挛；速度无关、全程铅管样阻力，是强直。"], ["教材定义（三个概念一起背）", "p", "① 肌张力：指肌肉在静息状态下的紧张度，是维持身体姿势与正常运动的基础，由牵张反射与高级中枢调控共同决定。② 痉挛（spasticity）：由牵张反射兴奋性增高所致的、以速度依赖的紧张性牵张反射增强为特征的运动障碍，常伴腱反射亢进，是上运动神经元综合征的一部分。③ 僵硬（rigidity）：被动活动时阻力与速度无关、呈铅管样或齿轮样，见于锥体外系病变（帕金森病）。"], ["分类与常见病（表格区分）", "table", [["类型", "表现", "常见疾病"], ["肌张力降低（弛缓）", "被动活动阻力小、关节活动范围过大、腱反射减弱", "脑卒中软瘫期、周围神经损伤、脊髓休克期、小脑病变"], ["痉挛（速度依赖）", "快速被动活动阻力大、慢速阻力小；腱反射亢进；可有阵挛", "脑卒中痉挛期、脑瘫、脊髓损伤（上运动神经元）"], ["僵硬（速度无关）", "铅管样或齿轮样阻力、可伴震颤", "帕金森病、锥体外系病变"], ["肌张力障碍", "持续性或间歇性肌肉收缩导致异常姿势与重复运动", "扭转痉挛、痉挛性斜颈"]]], ["Ashworth 与改良 Ashworth（默写）", "table", [["级别", "改良 Ashworth 标准（MAS 亦可按 0—4 记）"], ["0 级", "无肌张力增加"], ["1 级", "肌张力轻度增加：被动屈伸时在 ROM 末段出现最小阻力"], ["1+ 级", "肌张力轻度增加：ROM 前 1/2 出现「卡住」感，后 1/2 阻力减小"], ["2 级", "肌张力较明显增加：ROM 大部分范围内阻力明显增高，但受累部分仍易被移动"], ["3 级", "肌张力显著增加：被动活动困难"], ["4 级", "受累部分僵直，不能屈伸"]]], ["评定方法（四种，按场景用）", "ul", ["被动活动评定：以「快慢两种速度」分别活动关节，比较阻力差异，判断是否速度依赖。", "钟摆试验：让小腿自然摆动，记录摆动次数与幅度，痉挛侧摆动衰减快。", "改良 Tardieu 量表：记录「出现阻力时的角度 R1」与「被动活动到极限的角度 R2」，角度差反映痉挛程度，比 Ashworth 更能反映速度依赖。", "综合量表：Penn 痉挛频率量表（按痉挛发作频率）、痉挛频率与程度评分；脊髓损伤可用 WISCI 配合步行评估。"]], ["痉挛的处理（剂量要写出来）", "table", [["手段", "具体做法与剂量", "注意"], ["体位与良肢位", "抗痉挛体位摆放，每 2 h 变换一次；患侧上肢伸展、下肢屈曲位", "预防挛缩，是基础措施"], ["被动牵伸", "每次持续 30 s、重复 3—5 次、每日 2—3 次；缓慢持续，不弹震", "急性炎症、异位骨化、骨折未愈禁牵伸"], ["运动疗法", "任务导向训练 + 主动肌-拮抗肌交替控制；Bobath 抑制异常模式", "训练强度以不诱发阵挛为度"], ["口服药", "巴氯芬 5 mg bid 起，每 3—5 天加 5 mg，最大 80 mg/d；替扎尼定、丹曲林按医嘱", "巴氯芬骤停可致反跳性痉挛，须渐减"], ["肉毒毒素", "BTX-A 按肌群注射，常用 100—400 U/次（依产品与部位），3—6 个月重复", "需超声/肌电定位，注意剂量上限"], ["手术/泵", "选择性脊神经后根切断（SPR）、鞘内巴氯芬泵", "用于难治性重度痉挛"]]], ["提示", "p", "Ashworth 靠「阻力」判断，最容易混的是 1 级与 1+ 级：1 级只在 ROM 末段有阻力，1+ 级在前半段就有卡住感。答痉挛定义必须写「速度依赖」，这是与强直的分水岭。处理痉挛的题，先写体位与牵伸（基础），再写药物与肉毒，顺序不能倒。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 8 章 肌张力评定；《物理治疗学》第 3 版 第 4 章 肌肉牵伸技术、《康复医学》第 7 版 第 4 章 康复治疗技术（痉挛管理）。"]]}, {"k": "pd-rom", "n": "关节活动度评定", "c": "ROM 测量方法与记录", "p": ["量角器三要素：轴心、固定臂、移动臂", "主动 ROM 与被动 ROM 的差值意义", "各关节正常参考值与测量体位", "记录格式：关节-运动-角度-体位"], "t": "主动<被动提示肌无力或疼痛；两者均限制提示关节本身。", "kw": ["关节活动度", "ROM", "量角器", "活动范围"], "d": [["怎么理解", "p", "关节活动度（ROM）是康复评定里最「硬」的指标：它不依赖患者配合度，量角器摆上去就是数字，所以既用于定目标（「4 周膝屈曲到 90°」），也用于判断能不能做某个训练（ROM 不到 90° 就做不了标准下蹲）。要分清主动与被动：AROM 反映「能不能自己动」，PROM 反映「关节本身能到哪」，两者一比较，问题出在肌肉还是关节就清楚了。"], ["教材定义（背这两句）", "p", "① 关节活动度：指关节运动时所通过的运动弧或转动的角度，分主动活动度（AROM，患者自主肌肉收缩完成）与被动活动度（PROM，外力完成）。② 关节活动度评定：用量角器测量关节各方向活动的角度，判断关节功能受限的程度与原因，为制定训练方案和判定疗效提供依据。记录格式统一写「起始位—终止位」，如膝关节屈曲 0°—135°。"], ["正常值（成人主要关节，默写常用项）", "table", [["关节", "运动方向", "正常 ROM", "测量体位（轴心—固定臂—移动臂）"], ["肩", "前屈 / 后伸", "0—180° / 0—60°", "仰卧，肩峰—腋中线—肱骨外上髁"], ["肩", "外展 / 内收", "0—180° / 0—45°", "仰卧，肩峰—身体纵轴—肱骨长轴"], ["肩", "外旋 / 内旋", "0—90° / 0—70°", "仰卧屈肘 90°，鹰嘴—尺骨—腕背侧"], ["肘", "屈曲 / 伸展", "0—150° / 0—10°（过伸）", "仰卧，肱骨外上髁—肱骨长轴—桡骨茎突"], ["腕", "背伸 / 掌屈", "0—70° / 0—80°", "前臂旋前，腕背中点—前臂背侧—第 3 掌骨"], ["髋", "屈曲 / 伸展", "0—125° / 0—15°", "仰卧，股骨大转子—躯干纵轴—股骨外髁"], ["髋", "外展 / 内收", "0—45° / 0—30°", "仰卧，髂前上棘—髂前上棘连线—股骨纵轴"], ["膝", "屈曲 / 伸展", "0—135° / 0°（过伸 5°—10°）", "仰卧，股骨外髁—股骨纵轴—腓骨外踝"], ["踝", "背屈 / 跖屈", "0—20° / 0—50°", "仰卧，外踝—腓骨纵轴—第 5 跖骨"]]], ["AROM 与 PROM 的差值说明什么（考点）", "table", [["情况", "判断", "常见原因", "下一步查什么"], ["AROM 正常、PROM 正常", "关节与肌力均无明显问题", "—", "查肌力、协调、步态"], ["AROM＜PROM，PROM 正常", "关节没问题，主动动不了", "肌力不足、疼痛抑制、肌腱断裂、神经损伤", "MMT、疼痛评估、超声/肌电"], ["AROM＝PROM，均受限", "关节本身受限", "关节囊挛缩、骨性阻挡、关节内游离体、强直", "X 线/CT、关节活动末端感觉"], ["PROM 大于正常", "关节不稳或韧带松弛", "韧带损伤、弛缓性瘫痪、Ehlers-Danlos", "应力试验、肌张力评估"]]], ["测量方法与质量控制", "ul", ["工具：通用量角器（大/小号）、方盘量角器、电子角度计、倾角仪；脊柱用皮尺（Schober 试验：10 cm 标记，前屈增加＜5 cm 提示受限）。", "三点定位：轴心对准关节运动轴、固定臂对准近端骨标志、移动臂对准远端骨标志；同一患者固定同一测量者。", "读数精度 1°—5°，同一关节重复测 3 次取均值；记录「主动/被动」两组数字。", "常见误差：软组织遮挡摸不到骨性标志、未固定近端（代偿）、测量时疼痛致保护性收缩、忘记写明体位。"]], ["关节活动受限的处理对应（写方案用）", "table", [["原因", "判断依据", "主要手段与剂量"], ["软组织短缩/挛缩", "末端感觉「硬而渐止」，PROM 受限", "持续牵伸 30 s×3—5 次/日；热敷 15—20 min 后牵伸；支具/矫形器夜间固定"], ["关节囊受限", "末端「紧而实」，各方向普遍受限", "关节松动术（Maitland Ⅱ—Ⅳ 级）10—15 min/次、每日 1 次；配合牵伸"], ["肌力不足", "AROM＜PROM，MMT 3 级以下", "抗阻训练 8—12 RM×2—3 组、每周 3 次；先助力→主动→抗阻"], ["疼痛/痉挛", "活动到某角度即痛或阻力突增", "先镇痛（冷敷/理疗）、抗痉挛体位、必要时药物；疼痛评分＞4 分不强行拉 ROM"], ["骨性阻挡", "末端「骨性硬止」，影像可见", "不强行牵伸；评估手术或代偿训练"]]], ["提示", "p", "最容易丢分的三点：① 只记一个方向的角度，忘了写体位与轴心；② 把 AROM＜PROM 直接判成「关节挛缩」（其实相反，是肌肉/疼痛问题）；③ 膝伸展正常值写成 0—135°（应是屈曲 0—135°、伸展 0°，可有过伸 5°—10°）。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 10 章 关节活动度评定；《物理治疗学》第 3 版 第 2 章 关节活动技术、第 5 章 关节松动技术。"]]}, {"k": "pd-pingheng", "n": "平衡与协调评定", "c": "平衡分级、Berg/TUG 与协调测试", "p": ["静态、动态、反应性平衡三类", "支撑面、重心、感觉整合（视/前庭/本体）", "Berg（0—56）、TUG、单腿站立、功能性前伸", "协调：指鼻、跟膝胫、快速轮替"], "t": "Berg 分级线：<45 跌倒风险明显升高。", "kw": ["平衡", "协调", "Berg", "TUG", "跌倒"], "d": [["怎么理解", "p", "平衡不是「站得稳」这么简单，而是三件事的合成：把感觉信息（视觉、前庭、本体感觉）整合好，把重心控制在支撑面内，还能在受到干扰时快速反应。所以评定要分三层做——静态（睁眼/闭眼站）、动态（够物、转身）、反应性（被推一下能否恢复），只看「能站」会漏掉跌倒高风险的人。"], ["教材定义（背这句）", "p", "平衡：指身体所处的一种姿势状态，不论在何种位置或运动中，当身体重心垂线落在支撑面内时，维持该姿势稳定的能力。分静态平衡（一级）、动态平衡（二级，自动态）、他动态平衡（三级，受到外力时）。支撑面越大、重心越低，平衡越容易。"], ["坐位/站位平衡分级（三级法，床边最常用）", "table", [["级别", "标准", "对应训练起点"], ["Ⅰ 级（静态）", "无支撑下能保持坐/站位，但不能移动重心", "重心转移训练、坐位抛接球"], ["Ⅱ 级（动态/自动态）", "能主动向各方向移动重心并回到原位，无跌倒", "够物训练、单腿站立、平衡垫"], ["Ⅲ 级（他动态）", "能对抗外力（轻推）保持平衡", "抗干扰训练、抛接球、软垫站立"]]], ["量化量表（数字必须记住）", "table", [["量表", "分值范围", "判读与用途"], ["Berg 平衡量表 BBS", "0—56 分（14 项×0—4）", "＜45 分跌倒风险明显升高；＜40 分建议使用助行器；MCID 约 4—5 分"], ["TUG（起立-行走计时）", "秒", "＜10 s 独立；10—20 s 多需辅助；＞20 s 高风险；＞13.5 s 提示跌倒风险"], ["单腿站立试验", "秒", "＜5 s 提示平衡障碍；＜10 s 与跌倒风险相关"], ["Fugl-Meyer 平衡（FMB）", "0—14 分", "脑卒中专用，＜8 分提示平衡差"], ["功能性前伸（FRT）", "cm", "＜15 cm 跌倒风险升高（约 2.5 cm 为 MCID）"], ["Brunel 平衡量表 BBS(UK)", "0—36 分", "含静态/动态/反应性三部分，＜20 分高风险"]]], ["感觉与整合（查「平衡差的原因」）", "ul", ["Romberg 试验：双足并拢、双臂前平举，先睁眼 30 s 再闭眼 30 s；闭眼时明显摇晃为阳性（本体感觉/前庭问题）。", "强化 Romberg：足跟接足尖站立，提高难度。", "单腿站立：睁眼/闭眼各测，比较两侧差。", "前庭功能：甩头试验、Dix-Hallpike（良性阵发性位置性眩晕）。", "足底感觉：10 g 单丝检查，糖尿病周围神经病变是跌倒重要原因。"]], ["提示", "p", "BBS 的 45 分是分水岭（≥45 相对安全、＜45 高风险），这个数字几乎每年考。三级平衡的分级要能说清「静态/自动态/他动态」，很多人只写「坐位平衡 3 级」却说不清 3 级是什么。跌倒评估题一定要写「环境因素」——照明、地毯、门槛、鞋子。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 11 章 协调与平衡功能评定；《康复医学》第 7 版 第 3 章（平衡与步态评定）；Berg 平衡量表原始文献（Berg K, 1989）。"]]}, {"k": "pd-butai", "n": "步态分析", "c": "步态周期、时空参数与异常步态识别", "p": ["步态周期与各期占比（支撑 60%、摆动 40%）", "时空参数：步长、步频、步速、步宽、对称性", "定性（观察/视频）与定量（三维、足印、压力）", "常见异常：偏瘫、剪刀、跨阈、鸭步、疼痛步态"], "t": "先看对称性与步速，再看具体关节角度。", "kw": ["步态", "步行", "足印", "三维", "行走"], "d": [["怎么理解", "p", "步态分析是把「走路」拆成时间与空间两组数字：时间上分支撑相与摆动相，空间上量步长、步宽、足偏角。异常步态的价值在于「从外观反推病因」——划圈步态指向偏瘫痉挛，跨阈步态指向足下垂（腓总神经），鸭步指向近端肌无力。评定的终点不是描述，而是给出「哪一期、哪一侧、差多少」的结论。"], ["教材定义（背这句 + 两个比例）", "p", "步行周期（gait cycle）：从一侧足跟着地到该侧足跟再次着地的过程，分支撑相（stance，约占 60%）与摆动相（swing，约占 40%）；双支撑期约占 20%（随步速增加而缩短）。步态分析：通过目测或仪器，对步行时的时空参数、关节运动与肌肉活动进行测量与判断的方法。"], ["核心参数与正常值", "table", [["参数", "定义", "正常参考值"], ["步长（step length）", "一侧足跟着地到对侧足跟着地的距离", "约 70—80 cm（成人）"], ["跨步长（stride length）", "同一侧足跟两次着地之间的距离（=两倍步长）", "约 140—160 cm"], ["步宽（step width）", "两足中线之间的距离", "约 5—10 cm"], ["足偏角（foot angle）", "足纵轴与前进方向的夹角", "约 7°（外旋 5°—10°）"], ["步频（cadence）", "每分钟步数", "约 100—120 步/分"], ["步速（velocity）", "单位时间行走距离", "约 1.2—1.4 m/s；＞0.8 m/s 可社区行走"]]], ["传统八期（RLA 分期，能默写更好）", "table", [["支撑相（60%）", "摆动相（40%）"], ["① 首次着地 initial contact", "⑤ 摆动前期 initial swing"], ["② 承重反应 loading response", "⑥ 摆动中期 mid swing"], ["③ 支撑中期 mid stance", "⑦ 摆动末期 terminal swing"], ["④ 支撑末期 terminal stance", "（部分教材把 ⑦ 分入末期）"]]], ["常见异常步态与病因（表格对照）", "table", [["步态", "外观特征", "常见病因"], ["偏瘫划圈步态", "患腿伸直、足下垂内翻、向外划圈", "脑卒中后痉挛（伸肌协同模式）"], ["剪刀步态", "双膝内收交叉、足尖着地", "脑瘫、脊髓损伤痉挛型"], ["跨阈步态", "抬腿过高、足尖下垂拍地", "腓总神经损伤、足下垂"], ["鸭步（臀中肌步态）", "躯干左右摇摆、骨盆下沉", "臀中肌无力、髋关节病变"], ["共济失调步态", "步基宽、左右摇晃、直线行走困难", "小脑病变、深感觉障碍"], ["疼痛步态（减痛步态）", "患侧支撑期缩短、身体向健侧倾", "骨关节炎、骨折、足底筋膜炎"], ["帕金森步态", "起步困难、小碎步、前冲（慌张步态）", "帕金森病"]]], ["评定工具与选法", "ul", ["目测观察法：从前方、侧方、后方各看一遍，记录关节角度与躯干偏移；简单但依赖经验，信度一般。", "10 m 步行试验：测舒适速度与最大速度，＞0.8 m/s 提示可社区行走；脑卒中 MCID 约 0.16 m/s。", "6 分钟步行试验 6MWT：健康成人约 400—700 m；慢阻肺 MCID 约 30 m。", "TUG：兼顾起立、步行、转身，＞13.5 s 跌倒风险升高。", "三维步态分析（Vicon 等）：测关节角度曲线、地面反作用力、肌电；用于科研、复杂畸形与术前评估。"]], ["提示", "p", "支撑相 60%、摆动相 40%、双支撑 20% 这三个比例必背。步速 0.8 m/s 是「能不能出门」的临床分界线。答题时把「观察—参数—结论—干预」四段写完：如划圈步态→摆动相足下垂内翻→需踝足矫形器 + 摆动相屈膝训练。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 12 章 步态分析；《康复医学》第 7 版 第 3 章（步态评定与 6MWT）；Perry & Burnfield《Gait Analysis: Normal and Pathological Function》。"]]}, {"k": "pd-adl", "n": "ADL、生活质量与环境评定", "c": "日常生活能力、参与与环境因素评定", "p": ["Barthel/MBI（0—100）与 FIM（18 项）差异", "IADL：购物、做饭、理财、用药", "生活质量：SF-36、WHOQOL", "环境：家居、无障碍、社区资源"], "t": "Barthel 分级的四个界值要背：60、40、20。", "kw": ["ADL", "日常生活", "生活质量", "社会功能", "环境评定", "Barthel", "FIM"], "d": [["怎么理解", "p", "ADL 是康复的「结果指标」——治疗做得再漂亮，患者能不能自己穿衣、上厕所、出门，才是他关心的。所以 ADL 评定的作用有三个：定基线（现在多少分）、定目标（出院要到多少分）、定出院去向（回家/社区/护理机构）。Barthel 指数之所以被用了几十年，是因为它简单、可重复、和结局相关性强。"], ["教材定义（背这句 + 两个分型）", "p", "日常生活活动能力（ADL）：指人维持生存及适应生存环境而每天必须反复进行的最基本活动，包括进食、穿衣、洗漱、如厕、转移、步行、上下楼梯、洗澡等。分基础性 ADL（BADL，自理类）与工具性 ADL（IADL，购物、做饭、理财、用药、使用电话与交通工具）。"], ["Barthel 指数 10 项（分值表，必背）", "table", [["项目", "满分", "分级标准（示例）"], ["进食", "10", "10 独立；5 需部分帮助；0 需极大帮助/完全依赖"], ["洗澡", "5", "5 独立；0 依赖"], ["修饰（洗脸刷牙剃须）", "5", "5 独立；0 依赖"], ["穿衣", "10", "10 独立；5 需部分帮助；0 依赖"], ["大便控制", "10", "10 能控制；5 偶失禁；0 失禁"], ["小便控制", "10", "10 能控制；5 偶失禁；0 失禁"], ["如厕", "10", "10 独立；5 部分帮助；0 依赖"], ["床椅转移", "15", "15 独立；10 少量帮助；5 大量帮助；0 完全依赖"], ["平地步行", "15", "15 独立走 45 m；10 需帮助；5 用轮椅独立；0 不能"], ["上下楼梯", "10", "10 独立；5 需帮助；0 不能"]]], ["判读与配套量表", "table", [["量表", "范围", "判读"], ["Barthel 指数（BI）", "0—100", "≤40 重度依赖（多需住院/护理）；41—60 中度；61—99 轻度；100 独立"], ["改良 Barthel（MBI）", "0—100", "5 级：0—20 完全依赖、21—40 重度、41—60 中度、61—79 轻度、80—100 基本独立"], ["FIM", "18—126（18 项×1—7）", "126 完全独立；108—125 基本独立；90—107 轻度依赖；72—89 中度；54—71 重度；18—53 完全依赖"], ["Katz ADL", "6 项", "按独立/依赖排序，用于老年人功能分级"], ["Lawton IADL", "8 项（女）/5 项（男）", "评估购物、做饭、理财、用药、电话、洗衣、交通"]]], ["怎么测（避免把「能」测成「说」）", "ul", ["以「实际观察 + 患者/照护者报告」结合，能观察的项目（转移、步行、进食）必须现场看。", "评分看「实际完成需要多少帮助」，不看「能不能做一次」；按最近 24—48 h 的通常状态评。", "环境要写明：有无扶手、助行器、坐便器高度；同一患者前后评定环境应一致。", "认知障碍者用「实际表现」而非自述；失语者可用演示 + 照护者补充。", "记录格式：总分 + 分项异常 + 依赖项目清单，如「BI 45 分：洗澡 0、穿衣 5、上下楼 0」。"]], ["从分数到出院去向（会算才有用）", "table", [["BI 分值", "功能状态", "常见去向与配置"], ["0—20", "完全依赖", "护理机构/长期照护；家属培训 + 护理床、气垫床"], ["21—40", "重度依赖", "康复病房继续训练；辅助器具 + 家居改造（扶手、坐便椅）"], ["41—60", "中度依赖", "社区康复 + 门诊训练；部分辅助（助行器、穿袜器）"], ["61—99", "轻度依赖", "居家为主，门诊复评；IADL 训练（购物、做饭）"], ["100", "独立", "回归社区/工作；预防性训练与随访"]]], ["提示", "p", "Barthel 的分值分布要记牢：转移 15、步行 15 是最高两项（因为最能反映独立性），洗澡、修饰各 5 分。答题常见错误：把「部分帮助」和「极大帮助」混着写；漏写「45 m」这个步行距离。改良 Barthel 与 Barthel 的判读分界不同（MBI 80 分以上才算基本独立），别混用。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 14 章 日常生活活动能力评定；《康复医学》第 7 版 第 3 章（ADL 与 IADL）；Mahoney & Barthel（1965）原始量表。"]]}, {"k": "pd-renzhi", "n": "认知评定", "c": "注意、记忆、执行与筛查工具", "p": ["定向、注意、记忆、语言、视空间、执行六域", "MMSE（30 分）与 MoCA（30 分）的敏感度差异", "成套测验：RBMT、WCST、连线测验", "意识障碍：GCS 与 CRS-R"], "t": "MoCA 对轻度认知障碍更敏感，教育年限要校正。", "kw": ["认知", "MMSE", "MoCA", "记忆", "注意", "执行"], "d": [["怎么理解", "p", "认知评定要回答的是「他为什么学不会」：同样是偏瘫，有人两周学会穿衣，有人三个月还在原地，差别常在注意与执行功能。所以认知评定不是给患者贴「痴呆」标签，而是找到训练能不能进行、要用什么方式教（分步骤？给提示？改环境？）。"], ["教材定义（背这句 + 六个域）", "p", "认知：指人脑接受外界信息，经过加工处理，转换成内在的心理活动，进而支配人的行为的过程。认知功能评定包括六个域：注意、记忆、执行功能、语言、视空间、定向力（部分教材加「计算与判断」）。评定的目的是判断认知障碍的类型与程度、指导训练方式、预测康复结局。"], ["常用量表与切点（数字必背）", "table", [["量表", "范围", "切点与用途"], ["MMSE", "0—30", "文盲≤17、小学≤20、中学及以上≤24 提示认知障碍；受教育程度必须校正"], ["MoCA", "0—30", "＜26 提示轻度认知障碍（MCI）；受教育＜12 年加 1 分；对执行与视空间更敏感"], ["MoCA-B（基础版）", "0—30", "用于低教育程度人群"], ["画钟试验 CDT", "0—4 或 0—3", "4 分法：闭合圆、数字位置、12 个数字、指针位置各 1 分"], ["连线测验 TMT-A/B", "秒", "A 段＞78 s、B 段＞273 s（约）提示异常；B-A 差值反映执行功能"], ["数字广度", "顺背 7±2、倒背 4±1", "注意与工作记忆"], ["Rivermead 行为记忆测验", "0—24", "日常记忆功能，＞16 分相对正常"]]], ["六个域怎么查（一项一项对）", "table", [["认知域", "快速筛查方法", "异常表现"], ["注意", "数字广度、划消试验、连续减 7", "易分心、训练中途走神、无法完成两步指令"], ["记忆", "3 词回忆（5 min 后）、Rivermead", "记不住治疗师交代的动作、重复问同一问题"], ["执行功能", "TMT-B、Stroop、Luria 三步动作", "计划性差、不能转换、穿衣顺序错乱"], ["语言", "命名（10 个实物）、复述、阅读", "找词困难、答非所问（需与失语区分）"], ["视空间", "复制立方体、画钟、线段二等分", "穿衣左右颠倒、撞门框、忽略患侧（偏侧忽略）"], ["定向力", "时间、地点、人物", "不知年月、在病房迷路"]]], ["易混概念（选择/简答都爱考）", "ul", ["失语症：语言中枢受损，听、说、读、写某一或多个方面受损，智力相对保留（要与认知障碍区分）。", "构音障碍：发音器官肌肉控制异常，语言内容与理解正常，只是「说不清」。", "失用症：无瘫痪、无感觉障碍、无共济失调，却不能按指令完成有目的动作（观念性/观念运动性/结构性失用）。", "失认症：无感觉通路障碍，却不能识别（视觉失认、触觉失认、偏侧忽略属注意-空间障碍）。", "谵妄与痴呆：谵妄起病急、波动、注意障碍突出；痴呆慢性进展，意识清楚。"]], ["提示", "p", "MMSE 24 分、MoCA 26 分是两条必须记住的线，且都要「按受教育年限校正」。答题别把 MoCA 与 MMSE 混着写：MMSE 偏重记忆与定向、对轻度障碍不敏感；MoCA 对执行与视空间更敏感，用于 MCI 筛查。评定前先确认患者清醒、能听清、能看清——感官问题会造成假性认知障碍。"], ["依据", "p", "依据：《康复功能评定学》第 3 版 第 5 章 认知功能评定；《康复医学》第 7 版 第 3 章（认知与知觉评定）；MoCA 官方中文版评分说明（Nasreddine, 2005）。"]]}, {"k": "pd-yanyu", "n": "言语语言评定", "c": "失语、构音、嗓音与吞咽的评定框架", "p": ["失语：WAB、ABC、波士顿诊断性失语检查", "构音：Frenchay、音节清晰度", "嗓音：GRBAS、声学分析", "吞咽：洼田饮水、VFSS、FEES"], "t": "先分“语言（失语）”与“言语（构音）”两件事。", "kw": ["言语", "语言", "失语", "构音", "评定", "WAB"], "d": [["怎么理解", "p", "言语-语言评定要先分三类，否则治疗方向全错：失语症是「语言符号系统」坏了（听不懂、说不出、读不了），构音障碍是「发音器官执行」坏了（内容是好的，只是不清），言语失用是「按程序组装发音动作」坏了（努力、摸索、不一致）。三者常同时存在（如脑卒中合并构音障碍），评定要分开记。"], ["教材定义（三个概念对比背）", "p", "① 失语症：因大脑语言中枢及其相关区域病变，导致后天习得的语言功能受损或丧失，表现为听、说、读、写某一或几方面障碍，是语言障碍而非言语障碍。② 构音障碍：因神经肌肉病变导致与言语有关的肌肉麻痹、收缩力减弱或运动不协调，出现发音不准、吐字不清，语言内容与语法正常。③ 言语失用：因大脑运动区或运动前区损伤，导致发音动作的程序编排障碍，表现为发音摸索、错误不一致、自我纠正。"], ["失语症分类（记六型 + 关键特征）", "table", [["类型", "自发言语", "听理解", "复述", "命名", "病变部位"], ["Broca 失语（运动性）", "非流畅、费力、电报式", "相对好", "差", "差", "优势侧额下回后部（Broca 区）"], ["Wernicke 失语（感觉性）", "流畅但空洞、错语多", "差", "差", "差", "优势侧颞上回后部（Wernicke 区）"], ["传导性失语", "流畅、错语", "较好", "明显差（不成比例）", "差", "弓状束/缘上回"], ["经皮质运动性", "非流畅", "好", "好", "差", "Broca 区周围/前额"], ["经皮质感觉性", "流畅、空洞", "差", "好", "差", "颞顶交界"], ["完全性失语", "极少/刻板", "差", "差", "差", "优势侧大脑中动脉大面积"], ["命名性失语", "流畅", "好", "好", "突出差（找词困难）", "颞中回后部/角回"]]], ["量化评定（WAB 与 AQ 要会算）", "table", [["项目", "满分量表", "计分要点"], ["自发言语", "20 分", "信息量 0—10 + 流畅度 0—10"], ["听理解", "200 分（折算 10）", "是/否、听词辨认、执行指令"], ["复述", "100 分（折算 10）", "单词到句子逐级"], ["命名", "100 分（折算 10）", "实物、图片、句子补全"], ["阅读/书写", "各 100 分（折算 10）", "用于失读/失写评估"], ["AQ 计算", "0—100", "AQ＝（自发言语 + 听理解/20 + 复述/10 + 命名/10）×2；AQ＜93.8 提示失语，93.8—98 为可疑"]]], ["构音障碍与吞咽（一起查，别漏）", "ul", ["Frenchay 构音障碍评定：8 项（反射、呼吸、唇、颌、软腭、喉、舌、言语可懂度），每项 0—3 分（a—e 级）。", "言语可懂度分级：0 无法听懂—4 完全可懂（或按 25%/50%/75% 理解率记）。", "吞咽筛查：洼田饮水试验（30 ml 温水，1—5 级；3 级以上需进一步评估）；反复唾液吞咽试验（30 s 内＜3 次提示异常）。", "吞咽金标准：VFSS（视频荧光吞咽造影）与 FEES（纤维内镜吞咽评估）。", "失语者合并构音障碍时，先查构音（可懂度），再查语言（内容），否则会把「说不清」误判成「说不出」。"]], ["提示", "p", "AQ 公式与 93.8 这条线是计算题高频点，必须会代数字。分类题抓住「复述好不好」这一个关键：复述好→经皮质（运动/感觉）；复述差且理解差→Wernicke 或完全性；复述不成比例差→传导性。构音障碍与失语症的区别写在纸上是「语言内容是否保留」，落在床边就是「让他指物/写出来」——能指对、写对，就不是失语。"], ["依据", "p", "依据：《语言治疗学》第 3 版 第 5 章 失语症、第 6 章 构音障碍、第 11 章 吞咽障碍；《康复功能评定学》第 3 版 第 6 章 言语-语言功能评定；WAB 中文版评分手册。"]]}, {"k": "pd-xinfei", "n": "心肺功能评定", "c": "心功能、肺功能与运动试验", "p": ["心功能分级（NYHA）、6MWT、心肺运动试验", "肺功能：FEV1、FVC、MVV", "运动试验终止指征与禁忌", "监护指标：心率、血压、SpO₂、Borg"], "t": "6MWT 的禁忌与终止指征是高频考点。", "kw": ["心肺功能", "6MWT", "运动试验", "肺功能", "心功能"], "d": [["怎么理解", "p", "心肺评定回答两个问题：现在能承受多大运动量（安全边界），以及哪里限制了运动（心、肺还是肌肉）。前者决定处方强度，后者决定干预方向。"], ["逐条展开", "ul", ["心功能：NYHA 分级（I—IV）、6 分钟步行试验（6MWT，<300 m 提示预后差）、心肺运动试验（CPET 测峰值摄氧量）。", "肺功能：FVC、FEV1、FEV1/FVC（<0.7 提示阻塞）、MVV；COPD 按 GOLD 分级（FEV1 占预计值）。", "呼吸肌力量：最大吸气压（MIP）、最大呼气压（MEP）。", "运动试验终止指征：胸痛、明显心电图改变、血压异常、严重气促、头晕、患者要求停止。", "康复常用替代指标：Borg 评分（6—20）、说话试验、心率储备法（目标心率 = 静息 + 40—60% ×（最大 − 静息））。"]], ["提示", "p", "心衰患者做 6MWT 前后要测血压、心率、血氧与 Borg 评分；只报「走了 350 米」不报前后生命体征，等于没做安全评估。"]]}, {"k": "pd-dianshengli", "n": "神经电生理", "c": "肌电图、神经传导与诱发电位", "p": ["EMG：静息/轻收缩/重收缩三相", "NCV：运动与感觉传导，潜伏期与波幅", "SEP、MEP、VEP、BAEP 的用途", "判断：轴索损害 vs 脱髓鞘"], "t": "波幅降→轴索；潜伏期延→脱髓鞘。", "kw": ["电生理", "肌电图", "NCV", "诱发电位", "神经传导"], "d": [["怎么理解", "p", "神经电生理是「活的解剖」：肌电图告诉你哪块肌肉失神经，神经传导告诉你哪条神经断了、断得重不重，诱发电位告诉你通路通不通。康复里主要用它定损伤程度、判断预后、指导辅具。"], ["逐条展开", "ul", ["肌电图（EMG）：静息时找纤颤电位/正锐波（失神经）、插入电位延长；轻收缩看运动单位电位（时限、波幅），重收缩看募集型（单纯相/混合相/干扰相）。", "神经传导（NCS）：运动传导测潜伏期、波幅、传导速度；感觉传导测 SNAP。轴索损害以波幅下降为主，脱髓鞘以速度减慢为主。", "诱发电位：SEP（体感通路）、MEP（运动通路，经颅磁刺激）、BAEP（脑干听觉）、VEP（视觉）。", "常见结论：腕管综合征（正中神经远端潜伏期延长）、腓总神经损伤（趾短伸肌失神经 + 传导阻滞）、ALS（广泛失神经 + 传导正常）。", "评定时机：伤后 2—3 周做 EMG 最有价值（此时失神经电位已出现）。"]], ["提示", "p", "「波幅低、速度正常」= 轴索损害；「速度慢、波幅正常或轻度低」= 脱髓鞘。这一条能解大半电生理题。"]]}, {"k": "zl-huodong", "n": "关节活动与牵伸技术", "c": "维持/改善 ROM 的手法与牵伸", "p": ["被动、主动、主动助力 ROM 训练", "牵伸：静态、动态、PNF、器械", "剂量：30 秒×3—5 次，温热后更有效", "禁忌：新鲜骨折、异位骨化、急性炎症"], "t": "牵伸前先热身；疼痛评分 >4 不做强力牵伸。", "kw": ["关节活动技术", "牵伸", "肌肉牵伸", "ROM训练", "软组织"], "d": [["怎么理解", "p", "关节活动技术是康复治疗里最基础的一层：先让关节能动，才谈得上练力量、练走路。它分的不是「手法好坏」，而是「谁来动」——被动（治疗师动、患者不动）、助力（患者动一部分、治疗师补一部分）、主动（患者自己动）、抗阻（加负荷）。选哪一档只看三个数字：肌力几级、疼痛几分、ROM 差多少。"], ["教材定义（三个层级要说清）", "p", "关节活动技术：指利用各种方法维持或恢复关节活动范围的治疗技术。被动关节活动（PROM）：完全由外力完成，患者无主动收缩，适用于肌力 0—1 级、昏迷、制动期；助力主动活动（AAROM）：患者主动收缩 + 外力辅助完成，适用于肌力 1—2 级；主动活动（AROM）：患者自主完成，适用于肌力 3 级及以上；抗阻活动（RROM）：在主动活动基础上施加阻力，适用于肌力 4—5 级。"], ["四档怎么选（表格对照）", "table", [["方式", "肌力要求", "患者参与", "主要目的", "典型场景"], ["被动 PROM", "0—1 级", "无", "维持 ROM、防挛缩、促循环", "昏迷、脊髓休克期、骨折制动期"], ["助力 AAROM", "1—2 级", "部分", "逐步恢复主动运动、建立正确模式", "脑卒中早期、术后早期"], ["主动 AROM", "3 级", "全部", "维持与增强肌力、协调性", "恢复期、门诊训练"], ["抗阻 RROM", "4—5 级", "全部 + 负荷", "增强肌力与耐力", "恢复后期、运动损伤康复"]]], ["剂量与操作要点（要能写出数字）", "table", [["项目", "被动/助力", "主动/抗阻"], ["重复次数", "每关节各方向 10—30 次", "8—12 RM × 2—3 组"], ["频次", "每日 1—2 次（制动期每日 2 次）", "每周 3—5 次"], ["关节活动幅度", "至疼痛耐受点，不做暴力的终末牵拉", "全 ROM，控制离心阶段 2—3 s"], ["速度", "缓慢（每个方向约 3—5 s）", "向心 1—2 s、离心 2—3 s"], ["注意", "固定近端、托住远端、避免代偿；关节置换术后遵守活动限制", "先热身、避免憋气（Valsalva）、疼痛＞4 分减量"]]], ["禁忌与慎用（答题必写）", "ul", ["绝对禁忌：关节急性炎症/感染、未复位的骨折与脱位、关节内游离体卡阻、异位骨化活动期、深静脉血栓急性期。", "相对慎用：骨质疏松严重（防骨折）、关节置换术后早期（防脱位，髋屈曲＜90°、不内收内旋）、心脏术后（控制心率血压）、疼痛评分＞4 分。", "制动期也要动：卧床患者每日 2 次被动 ROM，可显著减少挛缩与压疮风险。", "关节置换、韧带修复术后：必须按手术医生给定的角度限制执行，不能按「常规」拉到底。"]], ["常见错误（临床带教最常纠正的）", "ul", ["只动大关节、漏掉腕手与踝足——踝背屈丢失最先导致跌倒与足下垂。", "近端不固定，患者用躯干代偿，看着「动了」其实关节没动。", "被动活动做成「甩」——速度过快诱发痉挛与保护性收缩。", "忽略疼痛：活动前不评估，活动后不加冷敷，第二天肿胀加重。"]], ["提示", "p", "答题模板：「肌力 X 级 → 选 Y 方式 → 剂量（次数/频次/幅度）→ 注意与禁忌」。四档的分界点记在肌力上：0—1 被动、1—2 助力、3 主动、4—5 抗阻。别把 AAROM 写成「主动助力」（教材规范叫「助力主动活动」）。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 2 章 关节活动技术；《康复医学》第 7 版 第 4 章 康复治疗技术。"]]}, {"k": "zl-songsdong", "n": "关节松动与手法治疗", "c": "Maitland 分级与脊柱/四肢松动", "p": ["Maitland Ⅰ—Ⅴ 级判断", "附属运动：滚动、滑动、旋转的方向选择", "脊柱松动与神经松动术", "禁忌：不稳、肿瘤、感染、脊髓压迫"], "t": "Ⅴ 级是高速低幅（推扳），不是常规放松。", "kw": ["关节松动", "手法", "Maitland", "推拿", "松动术"], "d": [["怎么理解", "p", "关节松动是「在关节面上做的小幅度、节律性手法」，针对关节源性活动受限；它与牵伸（针对肌肉）是两件事。Maitland 四级是选择力度的标尺。"], ["逐条展开", "ul", ["Maitland 分级：I 级小幅度在起始端、II 级大幅度未到末端、III 级大幅度到末端、IV 级小幅度在末端；I—II 级止痛，III—IV 级改善活动度。", "常用技术：摆动（I—IV 级）、持续牵引、挤压、旋转、滑动（Kaltenborn 的 I—III 级滑移）。", "脊柱松动：颈椎后前位（PA）、腰椎 PA、旋转松动；四肢：肩关节前后向滑移、膝关节前后向滑移。", "适应证：关节僵硬、疼痛伴活动受限、退行性改变早期的活动度下降。", "禁忌/慎用：关节不稳、感染、肿瘤、骨折未愈、脊髓受压、严重骨质疏松、抗凝治疗中。"]], ["提示", "p", "「III 级和 IV 级的区别」常考：III 级是从中程到末端的大幅度，IV 级只在末端做小幅度；两者都用于改善活动度，但 IV 级更靠近终末感。"]]}, {"k": "zl-jili", "n": "肌力训练", "c": "力量训练的类型、强度与进阶", "p": ["等长/等张/等速训练的适用场景", "强度：1RM 的百分比与 RM 方案", "渐进抗阻（DeLorme/Oxford）与离心训练", "禁忌与监护：心血管反应、Valsalva"], "t": "术后早期多等长，中期等张，后期功能性。", "kw": ["肌力训练", "抗阻", "力量训练", "等速训练"], "d": [["怎么理解", "p", "肌力训练的核心不是「多练」，而是「练对强度」。同样练股四头肌，2 级肌力做抗阻只会代偿，5 级肌力只做被动等于浪费。所以先分级、再选方式、再定剂量，这套顺序就是考试与临床的共同语言。"], ["教材定义（三种收缩 + 三条原则）", "p", "肌力训练：通过主动或抗阻运动，使肌肉收缩产生力量，以提高肌力、耐力和爆发力的治疗方法。三种收缩：等长（长度不变、张力增加）、等张（张力不变、长度改变，分向心/离心）、等速（角速度恒定）。三条基本原则：超负荷（负荷＞日常）、渐进抗阻（随力量增长加负荷）、特异性（练什么得什么：练力量得力量，练耐力得耐力）。"], ["按肌力分级选方法（核心表）", "table", [["肌力", "方法", "具体做法", "剂量"], ["0—1 级", "传递神经冲动 / 电刺激", "健侧抗阻时想象患侧用力；NMES 电极置于肌腹", "每日 1—2 次，每次 20 min；想象训练 10 次×3 组"], ["1—2 级", "助力运动 / 悬吊 / 水中", "消除重力（侧卧、悬吊带减重）完成全 ROM", "10—20 次×2—3 组，每日 1 次"], ["3 级", "主动运动", "抗重力全 ROM，不加阻力", "10—15 次×2—3 组，每日 1—2 次"], ["4 级", "抗阻运动（渐进）", "沙袋/弹力带/器械，从 10 RM 起逐步加至 8 RM", "8—12 RM×2—3 组，每周 3 次"], ["5 级", "最大抗阻 / 等速", "等速 60°/s 测力与训练；渐进负荷至 6—8 RM", "每周 2—3 次，间隔 48 h"]]], ["等长 / 等张 / 等速：怎么选（对比表）", "table", [["方式", "优点", "缺点", "适用"], ["等长", "关节不动、安全；可在制动期做", "只在特定角度增益（±20° 内），不提耐力", "骨折术后早期、关节不稳、石膏固定期"], ["等张（向心/离心）", "接近日常动作，易推广", "最弱点决定负荷（力量曲线不均）", "恢复期、健身与运动康复"], ["等速", "全 ROM 恒定阻力、客观可测、离心训练安全", "设备昂贵、需专用仪器", "运动员、科研、精确评估"]]], ["剂量参数（写方案必须有）", "ul", ["强度：力量用 %1RM（60%—85%）或 RM（8—12 RM 增肌、6—8 RM 增力）；耐力用 40%—60% 1RM × 15—25 次。", "组数次数：2—3 组 × 8—12 次；每组间休息 1—2 min。", "频次：每周 2—3 次（同一肌群间隔 48 h）；老年人可从每周 2 次、1—2 组起步。", "进度：每 1—2 周增加 5%—10% 负荷（渐进抗阻 DeLorme 法：10 RM 的 50%/75%/100% 各 10 次）。", "呼吸：用力时呼气，避免憋气（Valsalva）引起血压骤升。"]], ["禁忌与注意", "ul", ["禁忌：骨折未愈合、关节急性炎症、严重骨质疏松、未控制的高血压与心衰、肌腱断裂修复术后早期（按医嘱）。", "注意：训练前热身 5—10 min；训练后拉伸与冷敷（如有肿胀）；疼痛评分＞4 分或训练后 24 h 肿胀加重则减量。", "代偿识别：练股四头肌时出现骨盆前倾与腰椎过伸，说明在「用髋代偿」，须先降低阻力并固定骨盆。"]], ["提示", "p", "最爱考的三点：① 肌力分级与方法对应（0—1 电刺激/想象、1—2 助力、3 主动、4—5 抗阻）；② 等长训练的「±20° 角度特异性」；③ 渐进抗阻的 DeLorme 三组比例（50%/75%/100%）。别把「等张」写成「等长」，两者区别就一句：长度变不变。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 6 章 肌力训练；《康复医学》第 7 版 第 4 章；DeLorme 渐进抗阻原则（1945）。"]]}, {"k": "zl-qianyin", "n": "牵引与悬吊", "c": "颈椎/腰椎牵引与悬吊训练", "p": ["牵引力、时间、体位三要素", "适应证：神经根型颈椎病、腰椎间盘突出", "禁忌：脊髓型、骨质疏松、肿瘤、妊娠", "悬吊：闭链训练与核心稳定"], "t": "牵引中出现新神经症状立刻停止。", "kw": ["牵引", "悬吊", "颈椎牵引", "腰椎牵引"], "d": [["怎么理解", "p", "牵伸解决的是「软组织短了」——肌肉、肌腱、关节囊、瘢痕。它和关节松动术分工明确：牵伸拉的是软组织（末端感觉「软而有弹性、渐止」），松动动的是关节（末端「紧而实」）。牵伸最怕两件事：一是没热身就拉（易拉伤），二是在急性炎症或异位骨化期拉（越拉越糟）。"], ["教材定义（背这句 + 三种类型）", "p", "牵伸技术：指运用外力（人工或器械）牵伸短缩或挛缩的软组织，使其长度延长、关节活动范围改善的治疗技术。分三类：静态牵伸（保持 15—60 s）、动态牵伸（有节律地反复活动至终末范围）、PNF 牵伸（收缩-放松、保持-放松等）。现代证据支持「静态 30 s × 3—5 次」为基本剂量。"], ["剂量与方式（数字必须写）", "table", [["方式", "具体做法", "剂量", "适用"], ["静态牵伸", "缓慢拉至终末范围（有牵拉感但不痛）并保持", "每次 30 s（15—60 s），重复 3—5 次，每日 1—2 次", "挛缩、肌短缩、术后恢复期"], ["动态牵伸", "有控制地反复活动至终末范围", "10—15 次 × 2—3 组", "运动前热身、运动损伤预防"], ["PNF 收缩-放松", "拉至终末→等长抗阻 5—10 s→放松→再拉更远", "3—5 个循环", "腘绳肌短缩、肩关节活动受限"], ["PNF 保持-放松-主动收缩", "等长收缩后主动向相反方向运动", "3—5 个循环", "提高主动 ROM"], ["持续机械牵伸", "低负荷长时间（支具、牵引）", "每次 20—30 min，每日 1—2 次", "顽固性挛缩、烧伤瘢痕"]]], ["温度与时机（常被忽略的细节）", "ul", ["热疗后牵伸效果更好：热敷/超声波 15—20 min 后组织延展性提高，牵伸更省力。", "冷疗用于运动后或痉挛明显者：冷敷 10—15 min 可短暂降低肌张力，再牵伸。", "牵伸后 10—15 min 内做主动运动，把新获得的活动度「用掉」，否则很快回缩。", "夜间支具/矫形器维持角度，是防回缩的关键（尤其踝背屈、肘屈曲挛缩）。"]], ["禁忌与风险", "ul", ["禁忌：骨折未愈合、关节急性炎症或感染、异位骨化活动期、严重骨质疏松、血肿或新鲜软组织损伤（48—72 h 内）、牵伸区有恶性肿瘤。", "风险：过度牵伸致肌肉撕裂、关节囊松弛（尤其肩关节前向不稳者做大幅外旋牵伸）、神经牵拉伤（坐骨神经、臂丛）。", "脊髓损伤/脑卒中痉挛肌：暴力快速牵伸会诱发痉挛加重，应缓慢持续 + 先降张力。"]], ["提示", "p", "剂量写成「30 s × 3—5 次/日」就对了，只写「适当牵伸」不得分。区分牵伸与松动的一句话：末端感觉「软」是软组织，选牵伸；「硬/骨性」是关节，选松动或不牵伸。运动前用动态、运动后用静态，顺序别倒。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 4 章 肌肉牵伸技术；《康复医学》第 7 版 第 4 章；PNF 技术（Knott & Voss）。"]]}, {"k": "zl-zhuanyi", "n": "转移与步行训练", "c": "床—椅—厕转移与步行辅助", "p": ["转移：独立、辅助、机械三类", "偏瘫转移的技巧侧（健侧带动）", "步行训练：平行杠—助行器—拐—独立", "拐杖高度与三点/四点步"], "t": "偏瘫患者“健侧先动”的规则要能举例。", "kw": ["转移", "步行训练", "体位转移", "助行", "拐"], "d": [["怎么理解", "p", "体位转移是「从床到轮椅、从椅到马桶」这些每天要做十几次的动作，也是照护者腰伤与患者跌倒的最高发环节。它的技术核心只有两条：一是把患者重心移到支撑面上方（不是靠抱），二是让患者参与（能出多少力就出多少力）。所以训练顺序是「评估—分解—辅助—独立」，不是一上来就抱。"], ["教材定义（背这句 + 分级）", "p", "体位转移：指人体从一种姿势转移到另一种姿势的过程，包括床与轮椅、椅与椅、轮椅与马桶、地面与床之间的转移。按参与程度分：独立转移、辅助转移（一人/两人）、被动转移（机械或人力搬动）。转移能力是 ADL 与出院去向的关键指标（Barthel 中「床椅转移」占 15 分，为最高项之一）。"], ["常见转移方式与要点（表格）", "table", [["方式", "适用", "关键要点", "常见错误"], ["床—轮椅（站立法）", "能站立、下肢有一定负重能力", "轮椅与床成 30°—45°；刹车锁死、脚踏板翻起；患者前倾站起、转身坐下", "不锁刹车、脚踏板不翻（最常见跌倒原因）"], ["床—轮椅（滑动板法）", "不能站立、上肢有力", "滑动板一端置臀下、一端置轮椅；患者用手撑起躯干滑过", "板未放稳、臀部蹭伤"], ["一人辅助转移", "需少量帮助", "治疗师双膝抵住患者膝、双手扶髋/腰带；口令「前倾—站—转」", "拉患者上肢（易致肩关节半脱位）"], ["两人辅助转移", "较重或配合差", "一人托躯干、一人托下肢；同步口令", "两人不同步，患者被扭伤"], ["机械转移（移位机）", "完全依赖、体重较大", "吊带置于臀下与背部、检查挂钩；全程锁轮", "吊带位置错误致滑落"]]], ["训练顺序（PEO 思路，写方案用）", "ul", ["① 评估：坐位/站位平衡级别、下肢负重能力、上肢支撑力、认知与配合度、疼痛、体重。", "② 分解：先在治疗床上练「桥式—坐起—坐站」，再合成为完整转移。", "③ 辅助递减：机械 → 两人 → 一人 → 监护 → 独立；每阶段以「安全完成 3 次」为达标。", "④ 环境适配：床高与轮椅座高差＜5 cm、床旁留 90 cm 转身空间、地面防滑、去掉门槛。", "⑤ 照护者培训：教会「屈髋屈膝、用腿不用腰」，并示范跌倒后如何扶起（不抱、用移位机）。"]], ["安全与禁忌", "ul", ["转移前必须锁轮、翻起脚踏板、检查床刹与地面；躁动或认知障碍者加安全带/两人监护。", "禁忌/慎用：不稳定的脊柱骨折、下肢深静脉血栓急性期、严重体位性低血压、髋关节置换术后未达负重许可。", "髋置换术后转移：屈髋＜90°、患腿外展、不交叉腿；起立时患腿在前。", "跌倒后处理：先评估有无骨折与头部损伤，不要立即抱起；确认无伤后用移位机或双人协助。"]], ["提示", "p", "答题常考「转移的三要素」：锁轮（安全）、重心前移（力学）、患者参与（功能）。Barthel 转移 15 分这个数字要记住。别写「抱起患者」——现代康复强调「不用腰、用腿和器械」。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 3 章 体位转移技术；《康复医学》第 7 版 第 4 章；《康复功能评定学》第 3 版 第 14 章（Barthel 转移项）。"]]}, {"k": "zl-shenjing", "n": "神经发育疗法与运动再学习", "c": "Bobath、PNF、Brunnstrom、MRP、MCIMT", "p": ["Bobath：抑制异常模式、促通正常运动", "PNF：对角线模式、节律启动、收缩-放松", "Brunnstrom 六阶段与协同运动", "运动再学习（MRP）与强制性使用（MCIMT）"], "t": "各疗法共同的底层是“任务导向 + 大量重复”。", "kw": ["神经发育", "Bobath", "PNF", "Brunnstrom", "运动再学习", "强制性使用", "易化"], "d": [["怎么理解", "p", "神经发育疗法（NDT）这一组技术——Bobath、PNF、Brunnstrom、MRP、CIMT——看起来五花八门，其实都在回答同一个问题：中枢损伤后，怎么让大脑重新学会控制动作。它们共同的三件事是：任务导向、大量重复、感觉输入。区别只在「从哪儿切入」：Bobath 从抑制异常模式切入，PNF 从对角线模式与本体感觉切入，Brunnstrom 借协同运动「借力」，MRP 拆任务成分，CIMT 限制健手逼患手。"], ["教材定义（五个技术各一句）", "p", "① Bobath 技术（NDT）：通过抑制异常运动模式、促进正常运动模式，强调关键点控制（躯干、肩胛、骨盆）与「不让患者练错」。② PNF（本体感觉神经肌肉促进技术）：利用牵张、阻力、节律等本体感觉输入，通过对角线螺旋模式促进运动，核心手法有节律启动、等张组合、收缩-放松、保持-放松。③ Brunnstrom 技术：按恢复六阶段训练，利用协同运动与联合反应「借力」，再逐步脱离。④ 运动再学习（MRP）：把动作拆成任务成分，练缺失成分再整合，强调闭环、真实任务与反馈。⑤ 强制性使用（CIMT）：限制健手、强制使用患手，适用于卒中后 3—6 个月、有一定主动伸展的患者。"], ["五法对比（考试常考的区别）", "table", [["技术", "核心机制", "典型手法/参数", "适用与时机"], ["Bobath/NDT", "抑制异常模式 + 促通正常模式；关键点控制", "关键点（躯干/肩胛/骨盆）手法、负重、体位转换", "脑卒中、脑瘫早期至恢复期；痉挛明显者"], ["PNF", "本体感觉输入 + 对角线螺旋模式", "节律启动、等张组合、收缩-放松；阻力递增", "肌力不足、ROM 受限、协调障碍"], ["Brunnstrom", "利用协同/联合反应借力，逐期脱离", "按 Ⅰ—Ⅵ 期设计动作（如 Ⅲ 期练共同运动）", "脑卒中偏瘫，按分期推进"], ["MRP", "任务成分分解 + 大量重复 + 反馈", "坐-站、够物、步行分解；每日 30—60 min 任务练习", "脑卒中、脑外伤恢复期；CIMT 的基础"], ["CIMT", "限制健手、强制患手使用（塑形技术）", "每日 6 h 佩戴限制手套 + 2 h 任务训练，连续 2 周（mCIMT 可 3 h/日）", "卒中后 3—6 个月，患侧腕背伸≥10°、指伸≥10°、无明显忽略"]]], ["Brunnstrom 六阶段（默写）", "table", [["阶段", "表现"], ["Ⅰ", "弛缓，无随意运动"], ["Ⅱ", "出现联合反应/共同运动雏形"], ["Ⅲ", "共同运动可随意完成（屈肌/伸肌模式）"], ["Ⅳ", "出现部分分离运动（如手触摸后腰）"], ["Ⅴ", "分离运动更明显（如伸肘时前臂旋前）"], ["Ⅵ", "接近正常，协调性略差"]]], ["CIMT 的三个门槛（常考）", "ul", ["适应证门槛：患侧腕背伸≥10°、手指伸展≥10°、无明显偏侧忽略；病程 3—6 个月以上效果更稳。", "剂量：传统 CIMT 每日清醒时 90% 时间佩戴 + 6 h 训练、连续 2 周；改良 mCIMT 每日 3 h 训练 + 手套，门诊可执行。", "禁忌：严重认知障碍不能配合、患肢疼痛明显、平衡差有跌倒高风险（需监护）。", "不满足门槛就做改良版（mCIMT）：降低强度、增加任务分解与提示。"]], ["提示", "p", "答题时把「机制—手法—适应证」三段写满：只说「促进正常运动」不得分。Brunnstrom 六阶段要能背出 Ⅲ 期（共同运动）与 Ⅳ 期（部分分离）的分界。CIMT 的三个门槛（腕背伸 10°、指伸 10°、无忽略）是近年高频点。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 12 章 神经发育技术、第 13 章 运动再学习技术、第 14 章 强制性使用运动疗法；《康复医学》第 7 版 第 4 章；EXCITE 试验（CIMT，2006）。"]]}, {"k": "zl-wuli", "n": "物理因子治疗", "c": "电、光、声、热、磁、水、冷、压力的应用与禁忌", "p": ["低频/中频/高频电疗的作用深度与适应证", "超声波、激光、红外/紫外", "热疗与冷疗的生理反应与时机", "禁忌：恶性肿瘤局部、出血倾向、心脏起搏器、感觉丧失区"], "t": "物理因子题最爱考禁忌证，先背禁忌再背适应证。", "kw": ["电疗", "光疗", "超声波", "传导热", "磁疗", "水疗", "冷疗", "物理因子", "冷冻", "压力治疗"], "d": [["怎么理解", "p", "物理因子治疗是用电、光、声、热、冷、磁、力这些物理能量来治病，考的是「选对因子 + 选对剂量」。同一个疼痛，急性期用冷、亚急性用超声、慢性用热；同一个电疗，频率不同作用完全不同（镇痛用 TENS 高频 100 Hz，肌肉刺激用低频 20—50 Hz）。所以剂量参数比原理更常考。"], ["教材定义（记分类框架）", "p", "物理因子治疗（理疗）：应用自然或人工的物理因子（电、光、声、磁、热、冷、水、压力等）作用于人体，以预防和治疗疾病、促进康复的方法。按因子分：电疗法（直流、低频、中频、高频、静电）、光疗法（红外、紫外、激光）、超声波疗法、传导热疗法（蜡、热敷、蒸汽）、冷疗法、磁疗法、水疗法、压力疗法、生物反馈、冲击波。"], ["常用因子：适应证 + 剂量（核心表）", "table", [["因子", "治疗作用", "常用剂量/参数", "典型适应证与禁忌"], ["TENS（经皮电刺激）", "镇痛（闸门控制 + 内啡肽）", "高频 100 Hz、脉宽 50—100 μs，20—30 min；或低频 2—4 Hz", "慢性疼痛、术后痛；禁用于心脏起搏器、颈动脉窦区"], ["低频电（NMES/FES）", "肌肉收缩、防萎缩、促神经再生", "20—50 Hz、脉宽 200—400 μs，10—20 min", "失用性肌萎缩、足下垂（FES）；禁用于肿瘤区、孕妇腹部"], ["中频电（干扰电）", "镇痛、促循环、松解粘连", "2—10 kHz 载波，20 min", "软组织劳损、关节痛；急性炎症期慎用"], ["超声波", "深层热效应、机械微按摩", "0.5—1.5 W/cm²，连续或脉冲，5—10 min，移动法", "瘢痕、肌腱炎、关节挛缩；禁用于孕妇腹部、心区、骨骺、恶性肿瘤"], ["红外线", "浅层热、促循环", "距离 30—50 cm，15—20 min，温热感", "肌痛、关节僵硬；禁用于急性炎症、出血倾向"], ["紫外线", "杀菌、促维生素 D、脱敏", "按最小红斑量（MED）分级，亚红斑/红斑量", "压疮、银屑病；禁用于红斑狼疮、光敏者"], ["激光（LLLT）", "促愈合、抗炎、镇痛", "波长 630—980 nm，剂量 1—4 J/cm²", "伤口、肌腱炎、疼痛；禁用于眼睛直射、肿瘤区"], ["石蜡疗法", "深部热、软化瘢痕", "蜡温 50—55 ℃，20—30 min", "关节僵硬、瘢痕挛缩；禁用于感觉障碍（烫伤风险）、出血倾向"], ["冷疗", "镇痛、消肿、降肌张力", "冰袋 10—15 min、冷敷 15—20 min", "急性软组织损伤 48 h 内、痉挛；禁用于雷诺现象、冷过敏"], ["冲击波", "松解粘连、促骨愈合", "0.1—0.3 mJ/mm²，每次 1500—3000 次，每周 1 次 ×3—5 次", "足底筋膜炎、网球肘、骨不连；禁用于骨骺、肺组织、凝血障碍"]]], ["选因子的四条线（写方案用）", "ul", ["按病程选：急性期（48 h 内）冷疗、无热量的电疗；亚急性期超声/中频；慢性期热疗 + 运动。", "按目的选：镇痛→TENS/中频；消肿→冷疗、气压；防萎缩→NMES；松解粘连→超声、冲击波；促骨愈合→冲击波、低频电。", "按部位选：浅表用红外；深部用超声/短波；关节用中频/蜡疗。", "按禁忌选：感觉障碍者不用热（烫伤）；心脏起搏器者不用电疗；孕妇腹部与腰骶部禁电、禁超声。"]], ["安全要点（临床最容易出事的地方）", "ul", ["热疗前必须查感觉与血液循环：糖尿病周围神经病变、脊髓损伤者痛温觉缺失，极易烫伤。", "电疗前查皮肤完整性、有无金属植入物（除颤器、起搏器为禁忌）；电极不与心脏前后对置。", "每次治疗记录：因子、部位、剂量、时间、皮肤反应；出现红肿水疱立即停止并处理。", "冲击波治疗有痛感，治疗前告知，避免用于肺、肠管、骨骺等空腔/生长区。"]], ["提示", "p", "数字最关键：TENS 100 Hz 镇痛、NMES 20—50 Hz 防萎缩、超声 0.5—1.5 W/cm²、蜡温 50—55 ℃、冷疗 10—15 min、冲击波每周 1 次共 3—5 次。禁忌里「感觉障碍禁热疗」「起搏器禁电疗」两条几乎年年考。"], ["依据", "p", "依据：《物理治疗学》第 3 版 第 18—27 章（电疗、光疗、超声、传导热、冷疗、冲击波）；《康复医学》第 7 版 第 4 章 康复治疗技术。"]]}, {"k": "zl-shengwu", "n": "生物反馈、冲击波与神经调控", "c": "反馈训练、体外冲击波、经颅磁/直流电", "p": ["肌电生物反馈用于再教育与放松", "冲击波：肌腱病、骨不连、足底筋膜炎", "rTMS/tDCS 用于卒中后运动与抑郁", "禁忌：起搏器、癫痫史、颅内金属"], "t": "冲击波不是“哪里痛打哪里”，要打在病变组织。", "kw": ["生物反馈", "冲击波", "经颅", "磁刺激", "电刺激"], "d": [["怎么理解", "p", "这一组是「用信号或能量去调神经」：生物反馈把看不见的生理信号变成看得见的反馈，冲击波用机械能松解组织，经颅磁/直流电直接调节皮层兴奋性。"], ["逐条展开", "ul", ["生物反馈：肌电、压力、角度反馈；用于卒中后腕伸、盆底肌、吞咽、痉挛放松。", "体外冲击波（ESWT）：聚焦/放射状，能量 0.1—0.3 mJ/mm²，用于网球肘、跟痛症、钙化性肌腱炎、骨折不愈合。", "重复经颅磁刺激（rTMS）：高频（≥5 Hz）兴奋患侧皮层、低频（≤1 Hz）抑制健侧皮层，用于卒中后运动与失语。", "经颅直流电（tDCS）：阳极兴奋、阴极抑制，电流 1—2 mA，20 分钟；注意电极位置与皮肤。", "禁忌：癫痫病史、颅内金属、心脏起搏器、妊娠、颅骨缺损（局部）。"]], ["提示", "p", "rTMS 的「高频兴奋、低频抑制」是高频考点；注意是「刺激侧」与「抑制健侧」的组合，别写反。"]]}, {"k": "zl-tieza", "n": "贴扎与压力治疗", "c": "肌内效贴、白贴与压力衣", "p": ["贴扎方向决定促通/抑制/支持", "压力治疗用于瘢痕、水肿、淋巴", "压力梯度：远高近低", "皮肤检查与过敏监测"], "t": "贴扎是辅助，不替代训练。", "kw": ["贴扎", "压力衣", "压力治疗", "压力疗法", "肌内效"], "d": [["怎么理解", "p", "贴扎与压力治疗都是「用外部材料改内部力学或循环」：肌内效贴改变皮肤与筋膜的滑动、提供感觉输入；白贴限制关节；压力衣给瘢痕与水肿一个持续的压力梯度。"], ["逐条展开", "ul", ["肌内效贴（K-tape）：拉力 0—25%（感觉/循环）、25—50%（肌肉促进/抑制）、50—75%（力学矫正）；贴法有 I/Y/X/爪形。", "白贴（运动贴）：限制关节活动度、保护韧带，用于踝扭伤防护、肩关节不稳。", "压力治疗：压力衣 15—25 mmHg（瘢痕）、淋巴水肿用多层绷带/气压泵；压力应「远端大、近端小」。", "禁忌：皮肤破损、感染、过敏、深静脉血栓急性期、心衰（大量加压）。", "贴扎不是「贴了就好」：贴布 3—5 天更换，出现瘙痒、水泡立即去除。"]], ["提示", "p", "压力治疗的方向常考：远端压力大于近端，形成梯度，才能把液体往回推；反过来会加重水肿。"]]}, {"k": "zl-xinfei", "n": "心肺训练与运动处方", "c": "有氧训练、呼吸训练与 FITT 处方", "p": ["FITT：频率、强度、时间、类型", "强度：心率储备法、Borg、无氧阈", "呼吸训练：缩唇、腹式、排痰", "监护与终止指征"], "t": "处方必须写出强度依据（心率/功率/Borg）。", "kw": ["心肺功能训练", "运动处方", "有氧", "呼吸训练", "耐力"], "d": [["怎么理解", "p", "心肺训练用 FITT 框架开处方：频率、强度、时间、类型。核心是有氧 + 抗阻 + 呼吸训练三件套，强度靠心率储备或 Borg 评分定。"], ["逐条展开", "ul", ["有氧：每周 3—5 次、40—60% 心率储备起步、20—40 分钟、快走/功率车/上肢功率车。", "抗阻：每周 2—3 次、60—70% 1RM、8—12 次 × 2—3 组，注意瓦氏动作（憋气）要避免。", "呼吸训练：缩唇呼吸（COPD）、腹式呼吸、呼吸肌训练（阈负荷装置，30% MIP 起步）。", "运动强度监测：心率、Borg 12—14（稍累）、说话试验、血氧（<88% 停止）。", "住院期早期活动：床上踝泵 → 坐起 → 床边站 → 步行；术后（CABG/瓣膜）按胸骨愈合分期限制上肢负重。"]], ["提示", "p", "「缩唇呼吸为什么有效」：增加气道内压、防止小气道过早塌陷、延长呼气，改善气体陷闭——答这三句即可。"]]}, {"k": "zl-vr", "n": "虚拟现实与康复机器人", "c": "VR、外骨骼、上肢/下肢机器人", "p": ["VR 提供任务重复与即时反馈", "外骨骼：步态训练、减重", "机器人：上肢、手、踝", "证据：剂量与强度是疗效关键"], "t": "技术章节答题要落到“训练剂量与适应证”。", "kw": ["虚拟现实", "机器人", "外骨骼", "VR"], "d": [["怎么理解", "p", "VR 与机器人解决的是「重复量」与「趣味性」：卒中康复需要上千次重复，人盯不住，机器可以；虚拟场景把枯燥的重复变成游戏，提高参与度。"], ["逐条展开", "ul", ["VR 分类：沉浸式（头显）、半沉浸式（大屏/投影）、非沉浸式（平板）；康复多用半沉浸与平板。", "适用：上肢功能、平衡与步态、认知训练、恐惧回避（如卒中后怕走路）。", "外骨骼：下肢外骨骼用于脊髓损伤、卒中步态训练；上肢外骨骼用于肩肘腕。", "末端执行器机器人（如 MIT-Manus 类）vs 外骨骼（关节对齐要求高）：前者结构简单、后者更接近生理运动。", "证据与限制：对上肢功能有中等证据；对步行独立性的证据仍在积累；成本高、需治疗师在场。"]], ["提示", "p", "VR 的禁忌常考：严重认知障碍不能配合、癫痫（部分沉浸式）、严重眩晕、皮肤破损处佩戴设备。"]]}, {"k": "ot-gailun", "n": "作业治疗概论与 ADL 训练", "c": "作业表现、活动分析与 ADL 训练", "p": ["作业表现三要素：人、环境、作业", "活动分析：步骤分解与难度调整", "ADL 训练：进食、穿衣、洗漱、如厕、洗澡", "代偿与改造并重"], "t": "OT 的核心是“做事情”，不是“练动作”。", "kw": ["作业治疗", "ADL训练", "作业活动", "活动分析"], "d": [["怎么理解", "p", "作业治疗的核心不是「做手工」，而是「用有意义的作业活动恢复生活能力」。它的独特视角是「活动分析」：把一个任务拆成步骤、能力要求与环境条件，找出卡在哪一步。"], ["逐条展开", "ul", ["作业表现三要素：人（身体、认知、心理）、环境、作业活动；三者交互决定表现。", "活动分析：把「穿衣服」拆成坐稳、取衣、套患侧、拉过肩、系扣、整理；每步对应不同能力。", "ADL 训练原则：从患者最想做的活动开始、在真实环境练、逐步撤除辅助。", "治疗性作业活动：木工、编织、园艺、书法——目的在训练成分（力量、协调、认知），不是产出作品。", "OT 与 PT 的分工：PT 管「能不能动」，OT 管「能不能做生活里的事」。"]], ["提示", "p", "问「OT 与 PT 的区别」不要答「一个上肢一个下肢」；正确答案是「PT 以运动功能与移动为主，OT 以日常生活活动、认知与参与为主」。"]]}, {"k": "ot-shou", "n": "手与上肢功能", "c": "手功能评定与 OT 训练", "p": ["抓握类型：柱状、球状、钩状、捏", "评定：ARAT、九孔柱、握力/捏力", "训练：镜像、任务练习、支具", "水肿与瘢痕管理"], "t": "手外伤早期防挛缩，后期练精细。", "kw": ["手功能", "上肢", "抓握", "支具", "手外伤"], "d": [["怎么理解", "p", "手是「精细动作的执行器」，也是康复里最难恢复的部分。评手要看三件事：能不能抓（力量）、能不能捏（精细）、能不能用（协调与感觉）。"], ["逐条展开", "ul", ["抓握模式：柱状、球状、钩状、侧捏、指腹捏、三指捏、掌指捏。", "评定：握力（Jamar）、捏力（三指/侧捏）、九孔柱试验（灵活度）、盒块试验、Purdue 钉板。", "手功能分级（偏瘫常用）：Brunnstrom 手分期、Fugl-Meyer 上肢部分、ARAT。", "训练：任务导向（拿杯子、系扣、开瓶）、镜像治疗、CIMT、感觉再训练（触觉辨别、脱敏）。", "支具：腕手矫形器（WHS）保持功能位、防挛缩；动态支具辅助伸展。"]], ["提示", "p", "「九孔柱试验测什么」：手指灵活度与手眼协调，不是力量；力量用握力计/捏力计。"]]}, {"k": "ot-gantong", "n": "感觉统合", "c": "感觉统合理论与训练", "p": ["前庭、本体、触觉三大系统", "失调表现：过敏、迟钝、寻求", "训练：秋千、滑板、触觉箱", "儿童多见，成人用于感觉再教育"], "t": "感觉统合是 OT 的专有评估域，别与知觉训练混。", "kw": ["感觉统合", "前庭", "本体", "触觉"], "d": [["怎么理解", "p", "感觉统合（SI）是「大脑把触觉、前庭、本体觉等输入组织起来并做出适应反应」的能力。SI 训练主要用在儿童（感统失调、孤独症、ADHD），成人用得少。"], ["逐条展开", "ul", ["三大基础感觉：触觉（辨别与防御）、前庭觉（平衡与重力安全）、本体觉（身体位置与用力）。", "失调表现：触觉防御（怕标签、怕理发）、前庭敏感（怕荡秋千）、本体觉寻求（撞、跳、咬）。", "训练器材：秋千、滑板、蹦床、触觉箱、重力背心；原则是「以儿童为主导、有挑战但可成功」。", "Ayres 感觉统合理论强调「适应性反应」——不是单纯给刺激，而是让孩子在挑战中组织反应。", "证据边界：对孤独症的核心症状证据有限，主要改善感觉处理与参与；不要夸大疗效。"]], ["提示", "p", "考题若给「怕剪指甲、怕洗头、挑食」，先想触觉防御；给「转圈不晕、爱撞墙」，想前庭/本体觉寻求。"]]}, {"k": "ot-fuju", "n": "辅助器具、环境与职业康复", "c": "辅具适配、环境改造与重返工作", "p": ["辅具：自助具、助行、轮椅、矫形器", "环境：家居、无障碍、工作场所", "职业康复：工作分析、岗位调整、渐进复工", "适配流程：评定—试用—随访"], "t": "辅具选配先看“目标活动”，再看器材参数。", "kw": ["辅助器具", "助行器", "环境调适", "职业康复", "自助具", "无障碍", "轮椅"], "d": [["怎么理解", "p", "辅助器具是把「做不到」变成「换个方式做到」：一把加粗的勺子、一个马桶增高器、一根拐杖，常常比训练更快改善生活。适配的核心是「人—具—环境」三者匹配。"], ["逐条展开", "ul", ["分类：助行（拐杖、助行器）、生活自助具（加粗柄、长柄取物器、穿袜器）、轮椅、矫形器、沟通辅具、环境改造。", "选择顺序：先环境改造（坡道、扶手）→ 再自助具 → 最后才是高成本设备。", "轮椅：手动（轻量、可折叠）、电动（长距离、上肢无力）；座宽、座深、靠背高度要量体裁衣，防压疮。", "职业康复：工作分析 → 岗位调整/辅具 → 渐进复工；目标不是「回去上班」一句话，而是具体岗位任务。", "随访：辅具用 1—2 周后要复查（压疮、疼痛、是否真的在用）；不用等于没配。"]], ["提示", "p", "「先训练还是先配辅具」没有绝对答案：以「安全 + 早期参与」为原则——能练就练，但别为了练而让患者困在家里。"]]}, {"k": "st-shiyu", "n": "失语症", "c": "失语类型、评定与训练", "p": ["Broca、Wernicke、传导、命名、完全性", "评定：WAB、ABC、自发语言/理解/复述/命名", "训练：Schuell 刺激法、旋律语调、交流板", "预后：病因、病灶、年龄、动机"], "t": "复述好→传导性/命名性；复述差→Broca/Wernicke。", "kw": ["失语", "语言治疗", "WAB", "命名"], "d": [["怎么理解", "p", "失语是「语言中枢受损」导致的获得性语言障碍，不是智力下降，也不是构音问题。评定要回答三件事：哪几项语言功能受损（流畅度、理解、复述、命名）、是什么类型、日常沟通还剩多少。"], ["逐条展开", "ul", ["六项评定：自发语、听理解、复述、命名、阅读、书写；这六项决定失语类型。", "流畅 / 非流畅：非流畅（<50 词/分、费力、电报式）多为前部（Broca）；流畅（语量多但空洞、错语）多为后部（Wernicke）。", "复述是关键分水岭：复述差 → Broca、Wernicke、传导性失语；复述好 → 经皮质（运动/感觉/混合）与命名性。", "训练方法：语义治疗（词义网络）、语音治疗（音素）、旋律语调治疗（MIT，非流畅型）、交流板/手势（重度）、群体治疗。", "评定工具：WAB（失语商 AQ）、BDAE、中国康复研究中心汉语标准失语症检查（CRRCAE）。"]], ["四类速查", "table", [["类型", "流畅度", "理解", "复述"], ["Broca（运动性）", "非流畅", "较好", "差"], ["Wernicke（感觉性）", "流畅", "差", "差"], ["传导性", "流畅", "较好", "最差"], ["经皮质运动性", "非流畅", "较好", "好"], ["命名性", "流畅", "好", "好"]]], ["提示", "p", "「复述差 + 理解差 + 流畅」= Wernicke；「复述差 + 理解好 + 非流畅」= Broca；「复述好 + 命名差」先想命名性失语。"]]}, {"k": "st-gouyin", "n": "构音、嗓音、口吃与腭裂", "c": "运动性构音障碍与嗓音/流畅性", "p": ["构音：痉挛、弛缓、共济失调、混合型", "训练：口部运动、发音、韵律", "嗓音：GRBAS、共鸣、呼吸支持", "口吃：流畅性塑造与认知行为"], "t": "构音器官检查先看“能不能动”，再看“准不准”。", "kw": ["构音", "嗓音", "口吃", "腭裂", "发音"], "d": [["怎么理解", "p", "构音障碍是「发音动作的执行问题」：大脑、小脑、脑干或周围神经的病变让唇、舌、软腭、声带动作不准，但语言内容本身正常。与失语的最大区别是：他知道自己想说什么（理解与用词正常），只是说不清。"], ["逐条展开", "ul", ["五环节：呼吸（气息不足）、发声（声带闭合差）、共鸣（鼻音过重/不足）、构音（唇舌齿腭）、韵律（语调平板）。", "类型：痉挛型（上运动神经元，粗糙费力）、弛缓型（下运动神经元，鼻音重、气息声）、共济失调型（小脑，忽大忽小、节律乱）、运动过多/过少型（锥体外系）、混合型。", "评定：Frenchay 构音障碍评定（8 项）、言语清晰度（词/句可懂度）、口颜面检查（舌肌萎缩、震颤、软腭上抬）。", "训练：呼吸训练（腹式、延长呼气）、口部运动（唇舌操）、发音训练（音素—音节—词—句）、语速与韵律训练、代偿策略。", "器械辅助：语音放大器、交流板、AAC（重度）。"]], ["提示", "p", "「鼻音重 + 气息声 + 软腭上抬差」= 弛缓型（延髓/周围神经）；「说话费力 + 粗糙 + 腱反射亢进」= 痉挛型。"]]}, {"k": "st-tunyan", "n": "吞咽障碍", "c": "分期、筛查与训练", "p": ["四期：口腔准备、口腔、咽、食管", "筛查：洼田饮水；金标准 VFSS/FEES", "训练：门德尔松、超声门上吞咽、舌骨上肌训练", "安全：体位、食物质地、误吸征象"], "t": "进食体位与质地调整是最快见效的干预。", "kw": ["吞咽", "洼田", "VFSS", "FEES", "误吸"], "d": [["怎么理解", "p", "吞咽是「把食物安全送进胃」的四期动作，任何一期出问题都可能误吸。康复要做的第一件事不是训练，而是判断「现在能不能经口吃、吃什么性状、用什么姿势」。"], ["逐条展开", "ul", ["四期：口腔准备期（咀嚼、混唾液）、口腔期（舌推食物向后）、咽期（软腭上抬、喉上抬、会厌翻转、声门关闭、环咽肌开放）、食管期。", "筛查：反复唾液吞咽试验（30 秒内吞咽次数 <3 次提示异常）、洼田饮水试验（1—5 级）、EAT-10 问卷。", "金标准：VFSS（吞钡透视，可看误吸与残留）、FEES（纤维内镜，床旁可做）。", "训练：间接训练（冰刺激、舌肌力量、Shaker 训练、门德尔松手法）、直接训练（体位、食物性状、一口量）。", "食物性状：糊状→浓稠→稀薄，从最安全的一档开始；液体最易误吸（可用增稠剂）。"]], ["误吸危险信号", "ul", ["进食中咳嗽、声音变湿、血氧下降 3% 以上", "餐后发热、肺部感染反复", "咽部残留感、食物从鼻腔返流", "隐性误吸：无咳嗽但 VFSS 见造影剂入气道（最危险）"]], ["提示", "p", "「隐性误吸」是高频考点：没有咳嗽不代表安全；卒中后 3 天内建议全部筛查，吞咽筛查不过关禁经口进食。"]]}, {"k": "st-ertong", "n": "儿童语言与孤独症", "c": "语言发育迟缓、孤独症谱系的语言干预", "p": ["语言发育里程碑与迟缓判断", "孤独症：社交沟通、刻板行为", "干预：ESDM、PRT、AAC", "家长参与与自然环境训练"], "t": "先排除听力，再谈语言训练。", "kw": ["儿童语言", "孤独症", "语言发育迟缓", "AAC", "谱系", "听力障碍", "听力"], "d": [["怎么理解", "p", "儿童语言问题要分两层：语言本身（理解与表达）与言语动作（发音）。语言发育迟缓是「按顺序但在慢车道上」，孤独症谱系是「社交沟通动机与语用异常」，两者训练重点不同。"], ["逐条展开", "ul", ["语言发育迟缓（DLD）：理解与表达落后于同龄，但没有孤独症的核心社交缺陷；训练以「语言输入、扩充、情景教学」为主。", "孤独症谱系（ASD）：社交沟通缺陷 + 重复刻板行为 + 兴趣狭窄；语言训练重点在「沟通意图、轮流、共同注意」。", "筛查：语言里程碑（1 岁单词、2 岁两词句）、M-CHAT（18—24 月孤独症筛查）、听力检查必须先做。", "干预：早期密集行为干预（ESDM、ABA）、图片交换沟通系统（PECS）、家长培训（关键：家长是主力）。", "预后：越早干预越好（3 岁前最佳）；「贵人语迟」是最常见的延误借口。"]], ["提示", "p", "2 岁仍无有意义单词 = 语言发育迟缓的警戒线；但同时要看「有没有共同注意、指物、眼神」——这三样缺失要警惕孤独症。"]]}, {"k": "kf-shenjing", "n": "神经康复", "c": "脑卒中、颅脑损伤、脊髓损伤、帕金森病的康复", "p": ["脑卒中：急性期—恢复期—后遗症期三段管理", "脊髓损伤：ASIA、平面、并发症（压疮、痉挛、自主神经反射异常）", "颅脑损伤：意识、认知、行为", "帕金森：节律提示、姿势、冻结步态"], "t": "神经康复题按“评定—目标—方案—并发症”四段答。", "kw": ["脑卒中", "颅脑损伤", "脊髓", "帕金森", "神经康复", "偏瘫", "脑炎", "多发性硬化", "吉兰", "癫痫", "阿尔茨海默", "痴呆"], "d": [["怎么理解", "p", "神经康复是康复里最大的板块，因为它同时具备「发病率高、致残率高、可塑性强」三个特点。核心思路是：急性期防并发症，恢复期抢功能，后遗症期保参与。"], ["逐条展开", "ul", ["脑卒中：发病 24—48 小时生命体征稳定即开始床边康复；坐位耐受 → 站立 → 步行；上肢按 Brunnstrom 分期推进。", "颅脑损伤：先促醒（意识评估用 GCS），再处理认知、行为与吞咽；注意颅骨缺损处的保护。", "脊髓损伤：按 ASIA 定平面与分级；急性期防压疮、深静脉血栓、自主神经反射异常；呼吸训练（C4 以上）优先。", "帕金森病：药物「开期」练动作、大强度幅度训练（LSVT-BIG）、防跌倒、步态提示（节拍器、视觉提示）。", "多发性硬化/吉兰-巴雷：以「节能技术 + 渐进负荷」为主，避免过度疲劳诱发症状加重。"]], ["ASIA 分级速记", "table", [["分级", "含义"], ["A", "完全损伤，骶段（S4—S5）无感觉无运动"], ["B", "不完全，骶段有感觉无运动"], ["C", "不完全，损伤平面以下半数以上关键肌肌力 <3 级"], ["D", "不完全，半数以上关键肌肌力 ≥3 级"], ["E", "正常"]]], ["提示", "p", "脊髓损伤题必考「并发症」：压疮、尿路感染、深静脉血栓、自主神经反射异常（T6 以上，表现为突发高血压 + 头痛 + 出汗）、异位骨化、痉挛。"]]}, {"k": "kf-jigu", "n": "肌骨康复", "c": "骨折、关节置换、截肢、颈腰痛与运动损伤", "p": ["骨折三期：炎症、修复、塑形；对应训练强度", "关节置换：术前教育、术后早期活动、防脱位", "截肢：残端塑形、假肢、幻肢痛", "颈腰痛：分层（特异性/非特异性）、运动疗法"], "t": "肌骨康复的“保护—活动—强化—功能”四阶段要背熟。", "kw": ["骨折", "关节置换", "截肢", "颈椎", "腰痛", "肩", "骨关节炎", "骨质疏松", "运动创伤", "再植", "周围神经", "下肢创伤", "慢性运动系统"], "d": [["怎么理解", "p", "肌骨康复的关键是「分期」：术前/术后早期保护、中期恢复活动度、后期强化与功能。搞错分期就会「该保护时练太猛、该强化时不敢练」。"], ["逐条展开", "ul", ["骨折：早期等长 + 邻近关节活动；愈合期（4—6 周）逐步负重；临床愈合后强化。负重必须在影像与医嘱下进行。", "关节置换：髋置换防脱位（屈髋 <90°、不内收内旋、不交叉腿）；膝置换术后当日/次日下地，重点伸膝与股四头肌。", "截肢：术后即刻/早期假肢（弹性绷带塑形）、残端脱敏与肌力；假肢处方按残肢长度与活动水平定。", "颈腰痛：急性期避免长时间卧床；以「保持活动 + 核心训练 + 宣教」为主，影像不是治疗依据。", "运动损伤：POLICE 原则（保护、适度负荷、冰敷、加压、抬高）替代旧 RICE；重返运动按功能测试而非时间。"]], ["提示", "p", "「髋置换后三个禁止动作」是送分题：屈髋超过 90°、内收过中线、内旋；三者都增加后脱位风险（后侧入路）。"]]}, {"k": "kf-xinfei", "n": "心肺康复", "c": "冠心病、心衰、COPD 的康复", "p": ["冠心病：PCI/CABG 后分期运动", "心衰：低强度起步、监测", "COPD：肺康复、运动+教育+营养", "危险分层与监护"], "t": "心肺康复第一件事是危险分层。", "kw": ["冠心病", "高血压", "COPD", "心衰", "心肺康复", "呼吸疾病"], "d": [["怎么理解", "p", "心肺康复的证据最硬：心梗后、心衰、COPD 患者做康复能降低再入院与死亡。核心不是「多运动」，而是「在安全窗口内、按处方运动 + 危险因素管理」。"], ["逐条展开", "ul", ["冠心病：心梗后 1—2 周开始门诊康复；PCI/CABG 后按分期；运动强度 40—70% 心率储备，Borg 12—14。", "心衰：NYHA II—III 级做有氧 + 抗阻；监测体重（3 天涨 2 kg 提示液体潴留）、血压、心率。", "COPD：缩唇呼吸 + 腹式呼吸 + 呼吸肌训练 + 下肢有氧；急性加重期以排痰与早期活动为主。", "危险分层：低危（无并发症、运动试验正常）可居家；中高危需监护下训练。", "二级预防：戒烟、他汀、抗血小板、血压血糖管理——运动不能替代药物。"]], ["提示", "p", "CABG 术后 6—8 周内避免上肢负重与大幅度肩关节活动（胸骨愈合）；这是常见考点。"]]}, {"k": "kf-ertong", "n": "儿童康复", "c": "脑瘫、高危儿、遗传性疾病的康复", "p": ["脑瘫：GMFCS 分级、痉挛管理、矫形", "高危儿：早期干预窗口", "遗传病：多学科、长期随访", "家庭为中心、游戏化训练"], "t": "脑瘫分型（痉挛/手足徐动/共济失调/混合）必考。", "kw": ["脑瘫", "高危儿", "儿童康复", "遗传", "发育障碍", "孤独症"], "d": [["怎么理解", "p", "儿童康复的两条主线：脑瘫（运动障碍为主）与高危儿（早产、缺氧缺血性脑病，需早期干预）。核心原则是「早期、家庭为中心、功能导向」。"], ["逐条展开", "ul", ["脑瘫分型：痉挛型（最多，占 70%）、不随意运动型（手足徐动）、共济失调型、混合型；按分布分单瘫、双瘫、偏瘫、四肢瘫。", "GMFCS 五级：I 独立行走、II 长距离需辅具、III 助行器、IV 轮椅 + 部分自主移动、V 完全依赖。", "高危儿：早产 <32 周、低体重、窒息、黄疸、颅内出血；干预从 NICU 开始（袋鼠式护理、体位管理、喂养）。", "训练：任务导向、游戏化、家长培训（家庭训练量决定效果）、辅具（AFO、站立架）。", "遗传性疾病：DMD（进行性肌无力，禁高强度离心）、SMA（SMA 药物 + 呼吸管理）、唐氏（肌张力低、关节松弛）。"]], ["提示", "p", "DMD 患儿「能不能练力量」常考：可做低强度、次最大量训练，禁高强度离心与过度牵伸（肌肉脆弱易损伤）。"]]}, {"k": "kf-laonian", "n": "老年康复", "c": "老年综合征与长期照护", "p": ["老年综合征：跌倒、失禁、卧床、肌少症、多重用药", "综合评估（CGA）", "跌倒预防、防压疮、防废用", "长期照护与安宁疗护"], "t": "老年人先做 CGA 再定方案，不按单病种处理。", "kw": ["老年", "跌倒", "失禁", "肌少", "长期照护", "健康管理", "综合征"], "d": [["怎么理解", "p", "老年康复的对象不是「某个病」，而是「多种慢病 + 老年综合征 + 环境」的组合。目标常常不是恢复原状，而是「维持独立、防跌倒、防失能」。"], ["逐条展开", "ul", ["老年综合征：跌倒、肌少症、衰弱、失禁、认知障碍、多重用药、压疮、营养不良。", "衰弱（frailty）：Fried 五条（体重下降、疲乏、握力下降、行走慢、活动少），3 条以上为衰弱。", "肌少症：握力（男 <28 kg、女 <18 kg）+ 肌肉量 + 步速（<1.0 m/s）；干预 = 抗阻训练 + 蛋白质（1.0—1.2 g/kg）。", "跌倒预防：平衡训练（太极、Otago）、环境改造、视力与药物评估、维生素 D。", "长期照护：机构 vs 居家；ADL 维持优先于功能提高，防「越练越累」。"]], ["提示", "p", "老年人训练强度要「低起点、慢进展、多次短时」；一次 40 分钟不如两次 20 分钟——耐力与恢复能力都下降。"]]}, {"k": "kf-shequ", "n": "社区康复 CBR", "c": "社区康复的组织、评估与三级网络", "p": ["CBR 五要素：健康、教育、生计、社会、赋权", "三级网络：县—乡—村", "社区评定与家庭训练计划", "转介与档案管理"], "t": "社区康复考“可及性”与“可持续”，不是技术细节。", "kw": ["社区", "CBR", "基层", "家庭康复", "转介"], "d": [["怎么理解", "p", "社区康复（CBR）是「把康复搬到家门口」：以社区为平台，用最低成本覆盖最多人。它不是「低配版医院康复」，而是另一套组织逻辑——自助、互助、社会参与。"], ["逐条展开", "ul", ["CBR 五大支柱：健康、教育、生计、社会、赋权（WHO 2010 指南）。", "三级网络：县/区级康复中心（技术指导）→ 乡镇/街道康复站（训练与随访）→ 村/社区康复点（家庭训练）。", "核心工具：简易评定（Barthel、ADL）、家庭训练计划、辅具适配、环境改造、照顾者培训。", "人员：社区康复协调员、全科医生、治疗师（巡回指导）、残疾人专职委员。", "我国现状：服务能力不均、人才短缺；「家庭医生签约 + 康复服务包」是常见落地形式。"]], ["提示", "p", "CBR 与机构康复的区别常考：CBR 强调「社区参与与赋权」，不只是训练技术；答题要提到「自助、互助、社会融入」。"]]}, {"k": "kf-gongcheng", "n": "康复工程", "c": "假肢、矫形器、轮椅与无障碍", "p": ["假肢：接受腔、悬吊、对线", "矫形器：AFO/KAFO、脊柱矫形", "轮椅：座宽、座深、靠背、防压疮坐垫", "无障碍：坡道、门宽、扶手、卫浴"], "t": "坐垫与轮椅参数是压疮预防的关键考点。", "kw": ["假肢", "矫形器", "轮椅", "无障碍", "坐垫", "康复工程", "自助具"], "d": [["怎么理解", "p", "康复工程是「用工程技术补功能」：缺了腿给假肢，关节不稳给矫形器，走不远给轮椅，进不了门改环境。评价标准只有一个——患者是否真的在用、是否更独立。"], ["逐条展开", "ul", ["假肢：按截肢平面（小腿、大腿、膝离断、上肢）选；组件有储能脚、液压膝、肌电手；处方看活动水平（K 级）。", "矫形器（AFO/KAFO/WHSO/TLSO）：AFO 用于足下垂与踝不稳；KAFO 用于膝不稳/股四头肌无力；TLSO 用于脊柱侧弯与术后。", "轮椅：手动/电动、倾斜/后仰、减压坐垫；座宽座深按体型，防压疮。", "无障碍：坡道坡度 ≤1:12、门宽 ≥80 cm、扶手高度 85—90 cm。", "评估顺序：需求（要做什么）→ 功能（残存能力）→ 环境（家里/工作）→ 选型 → 试用 → 随访。"]], ["提示", "p", "「K 级」是假肢功能分级（K0—K4），K3 以上才考虑高性能组件；考试若问「为什么有人装了假肢不用」，答适配（残端条件）与训练（步态）两方面。"]]}, {"k": "kf-xinli", "n": "心理康复", "c": "伤残后的心理反应与干预", "p": ["五阶段：否认、愤怒、抑郁、接受、适应", "评估：HADS、SDS/SAS、SCL-90", "干预：支持性、认知行为、团体", "家庭与社会支持"], "t": "心理康复题答“评估—干预—支持”三层。", "kw": ["心理", "情绪", "抑郁", "焦虑", "应激", "心身", "社会支持", "人际关系"], "d": [["怎么理解", "p", "伤残后的心理反应是有规律的「适应过程」，不是「想不开」。康复要提高的是「应对能力」，而不是消灭负面情绪；识别抑郁与病理性哀伤是重点。"], ["逐条展开", "ul", ["反应阶段（非严格线性）：震惊/否认 → 愤怒 → 抑郁/哀伤 → 接受与适应；不要机械套阶段。", "常见问题：抑郁（卒中后约 1/3）、焦虑、创伤后应激、病耻感、体像障碍、家属照护负担。", "筛查：PHQ-9（抑郁）、GAD-7（焦虑）、HADS；卒中后抑郁要主动问，不要等患者说。", "干预：认知行为治疗（CBT）、动机访谈、团体治疗、家属参与；药物由精神科评估。", "沟通要点：先共情再给方案；避免「想开点」「比你惨的人多」这类无效安慰。"]], ["提示", "p", "「患者拒绝康复训练是不是抑郁」：先排除疼痛、疲劳、认知障碍与环境因素，再考虑抑郁；抑郁的诊断需要量表 + 临床判断，不能凭一次拒绝。"]]}, {"k": "kf-chuantong", "n": "传统康复", "c": "针灸、推拿、中药与导引", "p": ["经络与腧穴定位", "针灸：选穴、手法、电针", "推拿：滚法、揉法、点按、扳法", "导引：八段锦、五禽戏、太极"], "t": "传统康复按“辨证+选穴+手法+疗程”答。", "kw": ["传统", "针灸", "推拿", "中药", "经络", "腧穴", "导引", "太极"], "d": [["怎么理解", "p", "传统康复是「针灸、推拿、中药、导引」四件套，优势在疼痛、痉挛、失眠与亚健康，常与现代康复叠加使用。学它要抓「适应证 + 禁忌 + 与现代训练如何配合」。"], ["逐条展开", "ul", ["经络：十二正经 + 奇经八脉；常用穴位（合谷、足三里、阳陵泉、曲池、百会、风池）定位与主治。", "针灸：毫针、电针（用于卒中后瘫痪、面瘫）、温针；注意晕针、气胸（胸背部深刺）、感染。", "推拿：滚法、揉法、按法、拿法；用于肌肉痉挛、腰痛、肩周炎；禁忌骨折、肿瘤、感染、皮肤破损、抗凝中。", "中药：补阳还五汤（气虚血瘀）、黄芪桂枝五物汤（血痹）；必须在中医辨证下用。", "导引：八段锦、太极拳——平衡与心肺的循证支持较好，适合老年人群体训练。"]], ["提示", "p", "「电针」与「普通针刺」的区别常考：电针用微量电流持续刺激，适合瘫痪、疼痛；但心脏起搏器、颈动脉窦处禁用。"]]}, {"k": "kf-zhongzheng", "n": "重症与急诊康复", "c": "ICU 早期活动与急诊后康复", "p": ["ICU：早期活动、呼吸肌训练、谵妄管理", "禁忌与安全：血流动力学、管路", "急诊后：功能评估与转介", "团队协作与分级"], "t": "重症康复答题强调“安全边界”与“逐步进阶”。", "kw": ["重症", "ICU", "急诊", "谵妄", "早期活动"], "d": [["怎么理解", "p", "重症康复是「在 ICU 里做康复」：患者带着呼吸机、管路、镇静，康复要回答「现在能不能动、动多少、怎么防并发症」。核心收益是减少 ICU 获得性衰弱（ICU-AW）。"], ["逐条展开", "ul", ["早期活动分级：被动关节活动 → 床上主动 → 床边坐 → 坐站 → 步行；在血流动力学稳定下尽早开始。", "ICU-AW：危重病后全身肌无力，表现为脱机困难、四肢无力；预防靠早期活动 + 营养 + 控制血糖。", "安全标准：平均动脉压 ≥65 mmHg（或升压药稳定）、FiO₂ ≤60%、SpO₂ ≥90%、无活动性出血、颅内压可控。", "管路管理：气管插管、深静脉、动脉置管、引流管——活动前固定，活动中专人看护。", "呼吸康复：体位引流、排痰、呼吸肌训练、脱机训练（SBT）。"]], ["提示", "p", "「重症患者能不能坐起来」的关键不是诊断，而是「血流动力学是否稳定 + 管路是否安全」；答题要写具体阈值。"]]}, {"k": "kf-tengtong", "n": "疼痛康复", "c": "疼痛机制与综合干预", "p": ["伤害性、神经病理性、混合性", "评估：VAS/NRS、DN4、压痛阈", "干预：物理因子、运动、认知行为、注射", "慢性疼痛的生物心理社会模型"], "t": "先分疼痛类型，再选干预，别只会做理疗。", "kw": ["疼痛", "VAS", "神经病理", "慢性疼痛"], "d": [["怎么理解", "p", "疼痛康复的目标不是「完全无痛」，而是「可耐受、可活动、可睡眠」。慢性疼痛是「生物—心理—社会」三因素模型，单靠止痛药或单靠训练都难奏效。"], ["逐条展开", "ul", ["分类：伤害性（组织损伤，如骨折）、神经病理性（神经损伤，如带状疱疹后）、伤害可塑性（中枢敏化，如纤维肌痛）。", "评估：NRS/VAS、DN4（神经病理性筛查）、疼痛 catastrophizing 量表（PCS）、睡眠与功能。", "干预：运动疗法（渐进有氧 + 力量）、物理因子、认知行为治疗、正念、药物（按阶梯）、神经阻滞/射频。", "中枢敏化特征：痛阈下降、扩散痛、异常性疼痛（轻触即痛）、情绪与睡眠恶化。", "避免：长期卧床、过度依赖被动治疗、反复影像检查「找原因」。"]], ["提示", "p", "「轻触就痛、范围超过损伤区」提示中枢敏化/神经病理性，不是「装病」；治疗要转向运动 + 认知干预，而不是继续加止痛药。"]]}, {"k": "linchuang-jichu", "n": "临床医学基础", "c": "诊断学、外科学与各临床科室要点", "p": ["诊断：病史、查体、实验室、影像、鉴别思路", "外科：无菌、创伤、围手术期、并发症", "危急重：休克、呼衰、心衰、急救流程", "各科（妇产、儿科、精神、运动系统）的康复相关点"], "t": "临床概要只记“影响康复决策”的部分：禁忌、危险信号、转介时机。", "kw": ["诊断学", "外科", "危急重", "妇产", "儿科", "精神疾病", "运动系统疾病", "临床疾病", "鉴别"], "d": [["怎么理解", "p", "临床医学基础是康复的「上游」：不知道疾病怎么发生、怎么治，就判断不了康复的时机与禁忌。这部分内容宽而浅，抓「常见病的康复相关要点」即可。"], ["逐条展开", "ul", ["诊断学：症状（发热、疼痛、水肿）、体征（血压、心肺听诊、神经查体）、常用化验与影像。", "外科基础：无菌、清创、骨折固定、术后并发症（感染、血栓、肺不张）。", "内科要点：高血压、糖尿病（低血糖识别）、冠心病、COPD、脑卒中的急性期处理。", "其他科室：妇产（产后盆底）、儿科（发育）、五官（听力/吞咽）、皮肤（压疮）。", "康复相关红线：发热/感染期不训练、血压过高不训练、急性血栓不训练、骨折未愈合不负重。"]], ["提示", "p", "康复评定前必须看的四项：生命体征、疼痛、皮肤（压疮/破损）、管路；缺一项都可能出安全问题。"]]}, {"k": "zonghe", "n": "综合串讲", "c": "以《康复医学》为代表的整合式叙述", "p": ["把评定、技术、专科串成一条临床路径", "同一病在综合书里更强调流程与转介", "用于考研与执业：口径统一、条目完整", "与规划教材分工：综合书定框架，专科书补细节"], "t": "综合书适合“最后一遍”过框架，第一遍别用它打基础。", "kw": ["相关基础", "治疗技术", "内脏疾病", "特殊人群", "综合", "康复医学相关"], "d": [["怎么理解", "p", "《康复医学》（第 7 版）是「整合式」教材：它不按治疗技术分章，而按「概论—基础—评定—技术—病损」五段组织，把前面各本单科教材的知识串成临床路径。"], ["逐条展开", "ul", ["九章结构：康复概论、相关基础、评定、治疗技术、神经病损、肌骨病损、内脏疾病、其他疾病与特殊人群、常见问题处理。", "它的价值在「横向对照」：同一个病，评定用哪张表、治疗用哪几项技术、出院标准是什么，一章讲完。", "与前 19 本规划
