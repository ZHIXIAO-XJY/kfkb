多裂肌）、麦肯基方向偏好训练"], ["脊髓损伤", "ASIA 分级 A—E；压疮预防每 2 h 翻身", "良肢位、轮椅技能、间歇导尿、呼吸训练（颈髓损伤）"]]], ["剂量与负荷（写方案用）", "ul", ["关节活动：术后早期被动/助力活动每日 2 次，每关节 10—15 次，不引起明显疼痛（VAS≤3）。", "肌力：等长收缩从术后第 1 天起；抗阻训练一般在骨痂形成后（约 6—8 周）由 30%—50% 1RM 起步。", "负重：根据固定稳定性分触地（ toe touch ）、部分（体重的 25%—50%）、完全负重三档。", "有氧：上肢功率车或步行 20—30 min、每周 3—5 次，维持心肺与代谢。", "物理因子：冷疗 15—20 min（术后消肿）、超声 0.5—1.5 W/cm²（软组织粘连）、神经肌肉电刺激防萎缩。"]], ["提示", "p", "三条最容易考的数字：髋置换屈髋＜90° 且禁内收内旋、TKA 出院屈膝≥90°、腰痛卧床不超过 2 天。骨折愈合三期时间要能背。答题写「时间窗—允许活动—禁忌—剂量」。"], ["依据", "p", "依据：《肌肉骨骼康复学》第 3 版 第 3—6 章（创伤/脊柱/关节置换）、第 7—8 章（颈椎病/腰痛）；《康复医学》第 7 版 第 6 章。"]]}, {"k": "kf-xinfei", "n": "心肺康复", "c": "冠心病、心衰、COPD 的康复", "p": ["冠心病：PCI/CABG 后分期运动", "心衰：低强度起步、监测", "COPD：肺康复、运动+教育+营养", "危险分层与监护"], "t": "心肺康复第一件事是危险分层。", "kw": ["冠心病", "高血压", "COPD", "心衰", "心肺康复", "呼吸疾病"], "d": [["怎么理解", "p", "心肺康复是唯一被证明能降低死亡率的康复手段之一：心梗后规范运动训练可降低全因死亡约 20%—25%。但它也是风险最高的——运动中出现室速、血压骤降并不罕见。所以流程固定：**先做危险分层与运动试验，再开 FITT 处方，每次训练前后监测**。"], ["教材定义（背这句 + 三期）", "p", "心肺康复：以运动训练为核心，联合健康教育、危险因素管理、心理与营养支持，改善心肺疾病患者运动耐量、症状与预后的综合干预。分三期：Ⅰ 期（住院期，发病/术后 24—48 h 起）、Ⅱ 期（门诊监护期，2—12 周）、Ⅲ 期（社区/家庭维持期，长期）。"], ["评定与危险分层", "table", [["工具", "指标", "判读"], ["6MWT", "6 分钟步行距离", "健康成人 400—700 m；MCID 30 m；＜300 m 预后较差"], ["CPET（心肺运动试验）", "峰值 VO₂、无氧阈、VE/VCO₂ 斜率", "峰值 VO₂＜15 mL/kg/min 高风险；无氧阈约占峰值 50%—60%"], ["NYHA 心功能", "Ⅰ—Ⅳ 级", "Ⅲ—Ⅳ 级需监护下训练"], ["危险分层", "低/中/高", "低危：无并发症、峰值 VO₂＞20；高危：心衰、心律失常、运动诱发缺血"]]], ["运动处方（FITT，写方案用）", "table", [["要素", "有氧", "抗阻", "呼吸肌"], ["频率 F", "3—5 次/周", "2—3 次/周（隔天）", "每日 1—2 次"], ["强度 I", "40%—70% HRR 或 60%—80% 峰值心率；Borg 12—14", "40%—60% 1RM，8—12 RM", "30% MIP"], ["时间 T", "20—40 min（可累计）", "1—2 组×8—12 次，大肌群", "15—30 min/次"], ["类型 T", "步行、功率车、椭圆机", "弹力带、器械", "吸气肌训练器"]]], ["停止指征与长期管理", "ul", ["停止训练：胸痛、头晕、面色苍白、SpO₂＜88%、收缩压下降＞10 mmHg 或＞220/110 mmHg、室速/频发室早、呼吸＞35 次/分。", "Ⅰ 期：心梗 PCI 后 24—48 h 开始床旁活动，住院 5—7 天内完成出院评估。", "Ⅱ 期：门诊监护下 36 次（约 12 周）为经典疗程，可降低再入院。", "长期：危险因素管理（戒烟、血压＜130/80、LDL＜1.4 mmol/L、HbA1c＜7%）、每周≥150 min 中等强度运动。"]], ["提示", "p", "6MWT 的 MCID 30 m、靶心率公式、Borg 12—14、SpO₂＜88% 停止四条必背。答题写「评定—分层—FITT—监测—长期管理」，并强调「运动前必须做运动试验或 6MWT」。"], ["依据", "p", "依据：《内外科疾病康复学》第 3 版 第 3 章 循环系统、第 4 章 呼吸系统；《康复医学》第 7 版 第 7 章；ACSM 运动测试与处方指南（第 11 版）。"]]}, {"k": "kf-ertong", "n": "儿童康复", "c": "脑瘫、高危儿、遗传性疾病的康复", "p": ["脑瘫：GMFCS 分级、痉挛管理、矫形", "高危儿：早期干预窗口", "遗传病：多学科、长期随访", "家庭为中心、游戏化训练"], "t": "脑瘫分型（痉挛/手足徐动/共济失调/混合）必考。", "kw": ["脑瘫", "高危儿", "儿童康复", "遗传", "发育障碍", "孤独症"], "d": [["怎么理解", "p", "儿童康复与成人最大的差别是「目标在变」：成人恢复原有功能，儿童则要在发育中追赶——同样一个动作，对 2 岁是「该会了」，对 6 岁是「落后了」。所以儿童康复先定两件事：**发育年龄（相当于几岁）与功能分级（GMFCS 几级）**，再谈训练。"], ["教材定义（背这句 + 脑瘫分型）", "p", "儿童康复：针对儿童期因先天或后天因素导致的发育障碍、功能障碍与残疾，通过运动、作业、言语、心理与家庭干预，促进发育、提高功能与参与。脑性瘫痪（CP）分型：① 痉挛型（约占 70%）；② 不随意运动型（手足徐动/肌张力障碍）；③ 共济失调型；④ 混合型。按部位分单瘫、偏瘫、双瘫、四肢瘫。"], ["功能分级与评定（数字要记）", "table", [["工具", "内容", "判读"], ["GMFCS", "Ⅰ—Ⅴ 级", "Ⅰ 独立行走；Ⅳ 辅助移动；Ⅴ 依赖轮椅"], ["GMFM-88 / GMFM-66", "88 项 / 66 项，0—100 分", "总分反映粗大运动；GMFM-66 更线性"], ["Peabody（PDMS-2）", "粗大+精细运动商", "＜70 明显落后"], ["Bayley-III", "认知、语言、运动", "＜85 需随访干预"], ["发育里程碑", "3 月抬头、6 月独坐、9 月爬、12 月独站/走、2 岁跑", "落后 2 个标准差或 3 个月以上需评估"]]], ["干预方法与剂量", "table", [["方法", "适用", "剂量"], ["任务导向/主动训练", "各型，尤其痉挛型", "45 min×3—5 次/周，家庭训练每日 20—30 min"], ["Bobath（NDT）", "改善姿势控制与异常模式", "45 min×2—3 次/周"], ["约束诱导（mCIMT）", "偏瘫上肢", "每日 2—3 h×2—4 周"], ["肉毒毒素+支具", "痉挛影响功能", "注射后 2 周内强化训练；支具每日佩戴"], ["家长培训", "所有患儿", "每月 1—2 次，家庭训练落实率决定疗效"], ["辅具与矫形器", "踝足矫形器（AFO）改善尖足", "日间佩戴、每 6—12 个月随生长更换"]]], ["提示", "p", "GMFCS 五级与痉挛型占 70% 是高频。发育里程碑（3 抬头/6 坐/9 爬/12 走）必背。答题强调「发育评估 + 功能分级 + 家庭参与」，并写清剂量（45 min×3—5 次/周 + 家庭每日 20—30 min）。"], ["依据", "p", "依据：《儿童康复学》第 3 版 第 2—3 章（评定与治疗技术）、第 5 章 神经发育障碍；《康复医学》第 7 版 第 8 章。"]]}, {"k": "kf-laonian", "n": "老年康复", "c": "老年综合征与长期照护", "p": ["老年综合征：跌倒、失禁、卧床、肌少症、多重用药", "综合评估（CGA）", "跌倒预防、防压疮、防废用", "长期照护与安宁疗护"], "t": "老年人先做 CGA 再定方案，不按单病种处理。", "kw": ["老年", "跌倒", "失禁", "肌少", "长期照护", "健康管理", "综合征"], "d": [["怎么理解", "p", "老年康复面对的不是单一疾病，而是「老年综合征」叠加：肌少症让跌倒风险升高，跌倒后卧床又加速衰弱，衰弱让认知下降——形成一个越躺越差的闭环。康复的切入点是打断这个环：**先查肌力与步速，再查跌倒与认知，然后用抗阻+营养+平衡训练把链条反向拉回来**。"], ["教材定义（背这句 + 三个核心综合征）", "p", "老年康复：针对老年人因增龄、慢性病与急性事件导致的功能下降，通过综合评估与多维度干预，维持和改善日常生活能力、预防失能与跌倒、提高生活质量。三个核心综合征：① 肌少症；② 衰弱；③ 跌倒（含跌倒恐惧）。"], ["评估标准（数字必须准确）", "table", [["问题", "标准", "判读"], ["肌少症（AWGS 2019）", "握力：男＜28 kg、女＜18 kg；步速＜1.0 m/s；或 5 次起坐≥12 s", "肌力↓或体能↓ + 肌量↓ 可诊断"], ["衰弱（Fried 5 项）", "体重下降、疲乏、握力低、步速慢、活动量低", "≥3 项为衰弱，1—2 项为衰弱前期"], ["跌倒风险", "TUG＞13.5 s、单腿站立＜5 s、Berg＜45 分", "任一异常即高危"], ["认知", "MMSE＜24（按教育程度校正）、MoCA＜26", "需进一步评估"], ["ADL/IADL", "Barthel、Lawton IADL", "IADL 下降常早于 ADL"]]], ["干预与剂量（含营养）", "table", [["手段", "内容", "剂量"], ["抗阻训练", "下肢为主：坐-站、弹力带、器械", "每周 2—3 次、2—3 组×8—12 次、60%—70% 1RM"], ["有氧", "步行、功率车", "每周 3—5 次、20—30 min、Borg 11—13"], ["平衡与步态", "太极、单腿站、障碍跨越", "每周 2—3 次、每次 30 min"], ["蛋白质", "优质蛋白均分三餐", "1.0—1.2 g/kg/d（肾病者调整）；维生素 D 800 IU/d"], ["跌倒预防", "家居改造（扶手、防滑、夜灯）、逐步停用镇静药", "每 6 个月复评一次"], ["综合评估", "CGA（老年综合评估）", "入院/出院各一次，多学科团队"]]], ["提示", "p", "AWGS 2019 的握力男＜28/女＜18 kg、步速＜1.0 m/s 是最常考的两个数字；Fried 五项≥3 为衰弱；TUG＞13.5 s 高危。答题写「CGA—肌少/衰弱/跌倒筛查—抗阻+营养+平衡—复评」，并提醒「老年人训练强度从低起、避免憋气」。"], ["依据", "p", "依据：《老年康复学》第 3 版 第 2—6 章；《康复医学》第 7 版 第 8 章；AWGS 2019 肌少症共识、Fried 衰弱表型（2001）。"]]}, {"k": "kf-shequ", "n": "社区康复 CBR", "c": "社区康复的组织、评估与三级网络", "p": ["CBR 五要素：健康、教育、生计、社会、赋权", "三级网络：县—乡—村", "社区评定与家庭训练计划", "转介与档案管理"], "t": "社区康复考“可及性”与“可持续”，不是技术细节。", "kw": ["社区", "CBR", "基层", "家庭康复", "转介"], "d": [["怎么理解", "p", "社区康复解决的是「出院以后怎么办」：医院里练到能走 50 m，回家发现楼道没扶手、厕所门槛 15 cm、没人陪着练，功能很快掉回去。所以社区康复的功夫一半在训练、一半在**环境与支持网络**——评估的是家庭能不能改造、照顾者会不会练、社区有没有器材。"], ["教材定义（背这句 + 三级网络）", "p", "社区康复：以社区为依托，依靠社区资源（卫生、民政、残联、教育、志愿者）为残疾人及慢性病患者提供就近、可及的康复评定、训练、辅具适配与转介服务，实现「康复进社区、服务到家庭」。三级网络：一级＝社区卫生服务中心/乡镇卫生院（基础训练与随访）；二级＝区县级康复中心（评定与技术指导）；三级＝省级/三级医院康复医学科（疑难会诊、转诊）。"], ["服务内容与人员分工", "table", [["内容", "做什么", "谁来做"], ["筛查与评定", "简易 Barthel、TUG、跌倒风险、血压血糖", "社区全科/康复治疗师"], ["训练指导", "家庭训练计划、器械训练、小组训练", "治疗师+培训后的照顾者"], ["辅具与家改", "手杖/助行器、扶手、坡道、防滑、夜灯", "辅具师+社工+残联"], ["转介", "病情变化/功能停滞时上转；稳定后下转", "社区医生"], ["健康管理", "用药、血压、血糖、体重、疫苗", "全科+护理"], ["回归支持", "职业康复、残疾人就业、教育安置", "社工+残联"]]], ["家庭环境改造（剂量与参数）", "ul", ["门槛：改坡道，坡度≤1:12（约 4.8°），两侧加扶手（高 65—70 cm）。", "卫生间：坐便加高 5—10 cm、扶手距坐便 25—30 cm、地面防滑、淋浴椅。", "卧室：床高＝膝下高度（约 45—50 cm）、夜灯、呼叫铃。", "通道：净宽≥90 cm（轮椅 80 cm+余量），门宽≥80 cm。", "随访：出院 1 周、1 个月、3 个月各一次，之后每 3—6 个月；Barthel 下降≥5 分即转介。"]], ["常用评定与训练处方（社区可用）", "table", [["目标", "工具/方法", "剂量"], ["ADL", "Barthel 指数", "每 1—3 个月复评"], ["步行与跌倒", "TUG、单腿站立、5 次起坐", "每周 3—5 次平衡与步行训练，每次 30 min"], ["肌力", "30 s 坐-站、握力", "弹力带 2—3 次/周、2 组×10 次"], ["心肺", "6MWT、血压心率监测", "步行 20—30 min×3—5 次/周、Borg 11—13"]]], ["提示", "p", "社区康复答题框架：**三级网络—服务内容—家改参数—转介标准**。家改三个数字最常考：坡道≤1:12、门宽≥80 cm、通道≥90 cm。别写成「社区做康复」一句空话。"], ["依据", "p", "依据：《社区康复学》第 2 版 第 1—3 章（概论、管理、评定）、第 12 章 康复器材与辅具、第 13 章 无障碍改造；《康复医学》第 7 版 第 9 章。"]]}, {"k": "kf-gongcheng", "n": "康复工程", "c": "假肢、矫形器、轮椅与无障碍", "p": ["假肢：接受腔、悬吊、对线", "矫形器：AFO/KAFO、脊柱矫形", "轮椅：座宽、座深、靠背、防压疮坐垫", "无障碍：坡道、门宽、扶手、卫浴"], "t": "坐垫与轮椅参数是压疮预防的关键考点。", "kw": ["假肢", "矫形器", "轮椅", "无障碍", "坐垫", "康复工程", "自助具"], "d": [["怎么理解", "p", "康复工程是「用机械补功能」：截肢的人靠假肢走、脊髓损伤靠轮椅移动、偏瘫靠踝足矫形器防尖足。它看似器械活，实际考的是**选择标准与参数**——同样一个 AFO，角度错 5° 就能把膝压出过伸。所以记三件事：适配的适应证、尺寸参数、禁忌与复查周期。"], ["教材定义（背这句 + 四大类）", "p", "康复工程：运用工程学原理与技术，为功能障碍者研制、适配与评估辅助器具，代偿或改善功能。四大类：① 矫形器（orthosis）；② 假肢（prosthesis）；③ 个人移动辅具（轮椅、助行器）；④ 自助具、环境控制与信息辅具（含 FES、脑机接口）。"], ["矫形器（上肢/下肢/脊柱，参数要记）", "table", [["类型", "适应证", "关键参数/注意"], ["AFO（踝足）", "足下垂、尖足、踝不稳", "踝背屈 0°—5°；夜间用保持位；每 6—12 个月随生长/肿胀调整"], ["KAFO（膝踝足）", "股四头肌无力、膝不稳", "膝关节锁定/摆动相解锁；坐位需解锁"], ["手部矫形器", "腕手屈曲挛缩、类风湿", "休息位 20°—30° 腕背伸；每日佩戴 8—12 h"], ["脊柱矫形器", "脊柱骨折、侧弯", "胸腰段固定；侧弯 Cobb＞20°—25° 才考虑支具"], ["颈托", "颈椎术后/损伤", "硬颈托限位，长期用致肌萎缩，2—6 周评估"]]], ["假肢与轮椅（数字必背）", "table", [["项目", "内容", "参数"], ["小腿假肢（TT）", "截肢平面：膝下 10—15 cm", "PTB 接受腔；首次适配 3—6 个月调整"], ["大腿假肢（TF）", "截肢平面：膝上 15 cm 以上", "坐骨承重接受腔；膝关节屈曲 5°—7° 装配"], ["假肢训练", "穿脱、负重、步行、上下楼", "每日 1—2 次×30 min，6—8 周达社区步行"], ["轮椅（手动）", "脊髓损伤、下肢重度障碍", "座宽＝臀宽+2 cm；座深＝臀至腘窝−5 cm；扶手高＝坐位肘屈 90°"], ["电动轮椅/FES", "高位脊髓损伤、足下垂", "FES 胫前肌、30 min/次；需皮肤与痉挛评估"]]], ["提示", "p", "三个最常考的参数：AFO 踝背屈 0°—5°、轮椅座宽臀宽+2 cm、小腿截肢膝下 10—15 cm。答题顺序写「适应证—选型参数—训练—复查（皮肤/压疮/对线）」，并提醒「矫形器不能替代肌力训练」。"], ["依据", "p", "依据：《临床康复工程学》第 2 版 第 4 章 矫形器、第 5 章 假肢、第 6 章 轮椅与助行器；《康复医学》第 7 版 第 4 章。"]]}, {"k": "kf-xinli", "n": "心理康复", "c": "伤残后的心理反应与干预", "p": ["五阶段：否认、愤怒、抑郁、接受、适应", "评估：HADS、SDS/SAS、SCL-90", "干预：支持性、认知行为、团体", "家庭与社会支持"], "t": "心理康复题答“评估—干预—支持”三层。", "kw": ["心理", "情绪", "抑郁", "焦虑", "应激", "心身", "社会支持", "人际关系"], "d": [["怎么理解", "p", "康复心理不是「安慰病人」，而是处理一条可预测的心理轨迹：受伤/确诊后先否认（不敢相信）→愤怒（为什么是我）→抑郁（反正练不好）→接受（试试看）。治疗师最常踩的坑是在「抑郁期」硬推训练量，病人直接放弃。所以先识别阶段，再决定是给支持、给信息还是给训练。"], ["教材定义（背这句 + 四期）", "p", "康复心理学：研究伤病残过程中的心理反应与行为问题，通过评估与干预促进患者适应残疾、配合康复、重返社会。心理反应四期（库布勒-罗斯改编）：① 否认期；② 愤怒期；③ 抑郁/哀伤期；④ 接受与适应期。并非人人按序、可反复。"], ["评定工具（要能给分界）", "table", [["工具", "内容", "判读"], ["PHQ-9", "9 项抑郁", "≥5 轻、≥10 中度、≥15 中重度、≥20 重度"], ["GAD-7", "7 项焦虑", "≥5 轻、≥10 中度、≥15 重度"], ["HAMD/HAMA", "他评量表", "HAMD≥17 提示抑郁"], ["SCL-90", "90 项症状自评", "任一因子分≥2 需关注"], ["应对方式/社会支持", "MCMQ、SSRS", "低支持+回避应对＝预后差"], ["认知筛查", "MMSE/MoCA", "排除器质性因素导致的「不配合」"]]], ["干预方法与剂量", "table", [["方法", "适用", "剂量"], ["支持性心理治疗", "各期，建立信任", "每次 30—50 min、每周 1 次"], ["CBT", "抑郁、灾难化、疼痛恐惧", "8—12 次，每周 1 次"], ["放松训练/正念", "焦虑、痉挛、失眠", "每日 10—20 min"], ["团体治疗", "卒中/脊髓损伤病友", "每周 1 次×60—90 min、6—8 次"], ["家庭干预", "照顾者负担重", "每 2 周 1 次家庭会谈"], ["药物（协同）", "中重度抑郁/焦虑", "精神科处方，康复不替代"]]], ["提示", "p", "PHQ-9≥10、GAD-7≥10 是两个必背分界；四期名称要能写。答题要点：「先评估（抑郁/焦虑/认知/支持）—再分期—分层干预（支持/CBT/团体/家庭）—与精神科协作」，并强调治疗师的语言与节奏本身也是干预。"], ["依据", "p", "依据：《康复心理学》第 2 版 第 1—5 章（概论、心理活动、评估、干预）、第 8 章 肢体功能障碍；《康复医学》第 7 版 第 2 章。"]]}, {"k": "kf-chuantong", "n": "传统康复", "c": "针灸、推拿、中药与导引", "p": ["经络与腧穴定位", "针灸：选穴、手法、电针", "推拿：滚法、揉法、点按、扳法", "导引：八段锦、五禽戏、太极"], "t": "传统康复按“辨证+选穴+手法+疗程”答。", "kw": ["传统", "针灸", "推拿", "中药", "经络", "腧穴", "导引", "太极"], "d": [["怎么理解", "p", "传统康复在考试里是「送分题但易写空」：只写「针灸推拿有效」得分很低，要写出**取穴、手法、刺激量、疗程**。它的作用定位也清楚：缓解疼痛与痉挛、改善循环、调节情绪与睡眠，多作为现代康复的协同手段，而不是替代运动训练。"], ["教材定义（背这句 + 四大类方法）", "p", "传统康复方法学：在中医学理论指导下，运用针灸、推拿、传统运动疗法、中药等手段，促进功能恢复与残疾康复的方法学。四大类：① 针灸（体针、电针、头针、艾灸、拔罐）；② 推拿（㨰法、揉法、拿法、点按、关节松动类手法）；③ 传统运动疗法（太极拳、八段锦、五禽戏、易筋经）；④ 中药（内服、熏洗、外敷）。"], ["常用取穴与手法（对照表）", "table", [["病症", "主穴", "手法/刺激量"], ["偏瘫（上肢）", "肩髃、曲池、手三里、外关、合谷", "平补平泻，留针 20—30 min，每日或隔日 1 次，10 次 1 疗程"], ["偏瘫（下肢）", "环跳、委中、足三里、阳陵泉、三阴交", "同上；足内翻加丘墟、照海"], ["面瘫", "阳白、四白、地仓、颊车、翳风", "急性期浅刺轻刺激，1 周后加电针"], ["颈肩腰腿痛", "阿是穴+循经取穴、夹脊", "㨰揉拿+点按，每次 20 min；拔罐 10—15 min"], ["痉挛", "拮抗肌侧取穴（如肱二头肌痉挛取伸肌侧）", "电针 2—10 Hz、20 min"], ["吞咽/失语", "廉泉、通里、金津玉液（点刺）", "每日 1 次，10 次 1 疗程"]]], ["传统运动疗法（剂量）", "ul", ["太极拳：24 式简化，每次 20—30 min、每周 3—5 次；改善平衡、降低跌倒（老年人首选）。", "八段锦：8 式，每次 15—20 min、每日 1—2 次；改善颈肩腰背与呼吸。", "五禽戏/易筋经：每次 20—30 min、每周 3—5 次，强度以微汗、心率上升 10—20 次/分为度。", "禁忌与注意：针刺避开感染、出血倾向、装有起搏器者禁电针；艾灸避烫伤（糖尿病周围神经病变慎用）。"]], ["提示", "p", "答题不要只写「针灸推拿」，要写「穴位+手法+刺激量+疗程」。偏瘫上肢五穴（肩髃、曲池、手三里、外关、合谷）与下肢五穴是高频。传统运动剂量写「每次 20—30 min、每周 3—5 次」。"], ["依据", "p", "依据：《传统康复方法学》第 3 版 第 3 章 经络腧穴、第 4 章 针灸、第 5 章 推拿、第 6 章 传统运动疗法；《康复医学》第 7 版 第 4 章。"]]}, {"k": "kf-zhongzheng", "n": "重症与急诊康复", "c": "ICU 早期活动与急诊后康复", "p": ["ICU：早期活动、呼吸肌训练、谵妄管理", "禁忌与安全：血流动力学、管路", "急诊后：功能评估与转介", "团队协作与分级"], "t": "重症康复答题强调“安全边界”与“逐步进阶”。", "kw": ["重症", "ICU", "急诊", "谵妄", "早期活动"], "d": [["怎么理解", "p", "重症康复的难点不是「练什么」，而是「什么时候敢练」：病人带着呼吸机、深静脉导管、CRRT，动一下可能脱管，不动则每天流失 1%—2% 的肌力，两周就能出现 ICU 获得性衰弱。所以核心是一张**安全准入清单**加一套**分级活动方案**，把「敢不敢」变成「按标准判断」。"], ["教材定义（背这句 + ICU-AW 诊断）", "p", "重症康复：在 ICU 或重症病房对危重症患者实施的早期、渐进性康复评估与干预，目的是预防与治疗 ICU 获得性衰弱（ICU-AW）、减少机械通气时间与谵妄、改善出院功能。ICU-AW 诊断：排除其他原因后，医学研究委员会肌力评分（MRC）总分为 0—60 分，**＜48 分**即可诊断。"], ["活动分级（五级，从被动到步行）", "table", [["级别", "内容", "适用"], ["1 级", "被动关节活动、良肢位、体位管理", "镇静/血流动力学不稳"], ["2 级", "床上主动/助力活动、床上坐起 30°—60°", "意识清楚、循环稳定"], ["3 级", "床边坐、坐-站转移、床旁站立", "能配合、下肢可负重"], ["4 级", "床旁踏步、辅助步行", "肌力≥3 级、无体位性低血压"], ["5 级", "独立步行、ADL 训练", "生命体征稳定、能耐受"]]], ["安全标准与剂量（必须记住的数字）", "table", [["项目", "可进行", "暂缓/停止"], ["呼吸", "FiO₂≤0.60、PEEP≤10 cmH₂O、SpO₂≥90%", "SpO₂＜88%、呼吸＞35 次/分、新发心律失常"], ["循环", "MAP≥65 mmHg、无活动性出血", "收缩压＜90 或＞180、需大剂量升压药"], ["神经", "RASS −2—+1、能配合指令", "躁动（RASS≥+2）、癫痫发作"], ["管路", "气管插管、中心静脉、引流管固定牢靠", "股动脉鞘未拔、ECMO 管路、颅内压增高"], ["剂量", "每次 20—30 min，每日 1—2 次，逐步增加", "出现上述停止指标立即终止"]]], ["常见并发症与预防", "ul", ["VAP（呼吸机相关肺炎）：床头抬高 30°—45°、口腔护理每 4—6 h、声门下吸引。", "压疮：每 2 h 翻身、减压床垫、Braden 评分≤12 高危。", "深静脉血栓：踝泵、间歇充气加压、早期活动；药物预防由医师决定。", "谵妄：睡眠节律、家属陪伴、早期活动、减少约束（CAM-ICU 筛查）。", "肌肉萎缩与关节挛缩：入院 24—48 h 内开始被动活动，每日 2 次。"]], ["提示", "p", "ICU-AW 的 MRC＜48 分、FiO₂≤0.6 / PEEP≤10 / SpO₂≥90% 三个门槛必背。五级活动方案是答题模板。写「安全准入—分级活动—剂量—监测停止指标」四段，比写「早期活动有益」得分高得多。"], ["依据", "p", "依据：《内外科疾病康复学》第 3 版 第 13 章 重症康复；《康复医学》第 7 版 第 9 章；重症康复中国专家共识（2018）。"]]}, {"k": "kf-tengtong", "n": "疼痛康复", "c": "疼痛机制与综合干预", "p": ["伤害性、神经病理性、混合性", "评估：VAS/NRS、DN4、压痛阈", "干预：物理因子、运动、认知行为、注射", "慢性疼痛的生物心理社会模型"], "t": "先分疼痛类型，再选干预，别只会做理疗。", "kw": ["疼痛", "VAS", "神经病理", "慢性疼痛"], "d": [["怎么理解", "p", "慢性疼痛不是「痛的久一点」，而是神经系统本身被改写：外周敏化→中枢敏化→下行抑制减弱，于是止痛药越吃越不管用、影像看不出大问题却痛得睡不着。所以康复的主战场不是「消除病灶」，而是**重建活动能力、打断疼痛-废用-抑郁的循环**，运动与认知行为是两条主线。"], ["教材定义（背这句 + 三类机制）", "p", "慢性疼痛：指持续超过 3 个月（或超过组织愈合时间）的疼痛，已不再是单纯的组织损伤信号，而涉及外周与中枢敏化、心理社会因素。按机制分三类：① 伤害感受性（炎症、机械）；② 神经病理性（神经损伤或疾病，如带状疱疹后、糖尿病周围神经病）；③ 中枢敏化/伤害可塑性（纤维肌痛、慢性腰痛）。"], ["评定（要能给数字）", "table", [["工具", "内容", "判读"], ["NRS / VAS", "0—10 分", "≤3 轻度、4—6 中度、≥7 重度"], ["DN4 问卷", "10 项（7 项问诊+3 项查体）", "≥4 分提示神经病理性疼痛"], ["LANSS", "5 项症状+2 项体征", "≥12 分提示神经病理性"], ["ODI（Oswestry）", "0—100%", "0—20 轻度失能、41—60 重度"], ["疼痛灾难化量表 PCS", "13 项", "≥30 分提示高灾难化，预后差"], ["压痛阈/条件性疼痛调制", "定量感觉测试", "中枢敏化者调制功能减弱"]]], ["干预方法与剂量", "table", [["手段", "做法", "剂量/参数"], ["运动疗法（核心）", "有氧+力量+渐进暴露，从「可耐受」起", "有氧 30 min×3—5 次/周（40%—60% HRR）；力量 2—3 次/周、8—12 RM"], ["认知行为治疗 CBT", "纠正灾难化思维、设定活动节奏", "每周 1 次×8—12 次，或团体 2 h×8 周"], ["渐进性活动/分级暴露", "把「怕做的动作」拆小步完成", "每周提升 10%—20% 活动量"], ["物理因子", "TENS、热疗、冲击波", "TENS 100 Hz、20—30 min；冲击波 1500—3000 次/疗程"], ["神经病理性用药（协同）", "加巴喷丁/普瑞巴林、度洛西汀", "需医师处方，康复不替代药物"], ["多学科", "疼痛科+康复+心理+睡眠", "难治性疼痛首选"]]], ["提示", "p", "「3 个月」是慢性疼痛的分界；DN4≥4 判断神经病理性；运动剂量写「每周 3—5 次、每次 30 min、从 40%—60% HRR 起」。答题要点：慢性疼痛的治疗目标是从「止痛」改为「功能与参与」，药物与康复并重。"], ["依据", "p", "依据：《内外科疾病康复学》第 3 版 第 12 章 慢性疼痛；《肌肉骨骼康复学》第 3 版 第 16 章；IASP 慢性疼痛分类（2019）。"]]}, {"k": "linchuang-jichu", "n": "临床医学基础", "c": "诊断学、外科学与各临床科室要点", "p": ["诊断：病史、查体、实验室、影像、鉴别思路", "外科：无菌、创伤、围手术期、并发症", "危急重：休克、呼衰、心衰、急救流程", "各科（妇产、儿科、精神、运动系统）的康复相关点"], "t": "临床概要只记“影响康复决策”的部分：禁忌、危险信号、转介时机。", "kw": ["诊断学", "外科", "危急重", "妇产", "儿科", "精神疾病", "运动系统疾病", "临床疾病", "鉴别"], "d": [["怎么理解", "p", "临床医学基础是康复的「安全底线」：不知道心梗的禁忌、不认血常规的危急值，训练就可能出事。考试里它常以单选题或病例题出现——给一个合并高血压/糖尿病的患者，问「能不能练、练多少」。所以记的是**数值边界与红旗征**。"], ["教材定义（背这句 + 内容范围）", "p", "临床疾病概要：以诊断学与内外科常见病为基础，掌握疾病的表现、检查、治疗原则与康复禁忌，为康复评定与干预提供医学保障。范围：诊断学基础（症状、体征、实验室与影像）、常见内科病、外科基础、危急重症识别。"], ["必须记住的检验/生命体征边界", "table", [["项目", "正常/参考", "康复中的警戒值"], ["血压", "＜130/80 理想", "≥180/110 暂缓训练；＜90/60 慎立位训练"], ["心率", "60—100 次/分", "静息＞100 或＜50 需评估；运动后 5 min 未回落需注意"], ["SpO₂", "≥95%", "＜90% 停止、＜88% 禁忌"], ["血糖", "空腹 3.9—6.1、餐后＜7.8 mmol/L", "＜3.9 补糖；＞16.7 禁运动（酮症风险）"], ["血红蛋白", "男 130—175、女 115—150 g/L", "＜80 g/L 免高强度训练"], ["血小板", "100—300×10⁹/L", "＜50 免抗阻与注射类操作"], ["白细胞/体温", "4—10×10⁹/L、＜37.3 ℃", "发热或白细胞＜3×10⁹/L 暂停训练"], ["INR（抗凝）", "2.0—3.0（房颤/机械瓣）", "＞3.5 免深部按摩与针刺"]]], ["红旗征（出现即停并转诊）", "ul", ["胸痛、胸闷伴出汗或放射痛（警惕急性冠脉综合征）。", "新发言语不清、口角歪斜、单侧无力（卒中）。", "不明原因发热、伤口红肿渗液（感染）。", "突发呼吸困难、SpO₂ 骤降、单侧下肢肿痛（肺栓塞/深静脉血栓）。", "剧烈头痛、意识改变、抽搐。", "跌倒后髋部疼痛、不能负重（骨折）。"]], ["常见合并症的训练调整", "table", [["合并症", "调整"], ["高血压", "避免憋气与头低位；训练前测压，运动中 Borg≤13"], ["糖尿病", "餐后 1—2 h 训练；随身带糖；检查足部"], ["房颤/抗凝", "控制心率；免深部按摩、拔罐、针刺（INR 高时）"], ["心衰", "小强度间歇、监测体重与水肿"], ["骨质疏松", "免脊柱屈曲+旋转、免跌倒风险高的项目"]]], ["提示", "p", "血压 180/110、血糖 3.9/16.7、SpO₂ 88%、血小板 50、血红蛋白 80 这五组数字是高频。答题用「先评估能不能练（红旗征+数值）—再定强度—训练中监测」三步，能覆盖大部分病例题。"], ["依据", "p", "依据：《临床疾病概要》第 3 版 第 1 章 诊断学基础、第 3 章 危急重病、第 5—12 章 内科各系统；《康复医学》第 7 版 第 3 章。"]]}, {"k": "zonghe", "n": "综合串讲", "c": "以《康复医学》为代表的整合式叙述", "p": ["把评定、技术、专科串成一条临床路径", "同一病在综合书里更强调流程与转介", "用于考研与执业：口径统一、条目完整", "与规划教材分工：综合书定框架，专科书补细节"], "t": "综合书适合“最后一遍”过框架，第一遍别用它打基础。", "kw": ["相关基础", "治疗技术", "内脏疾病", "特殊人群", "综合", "康复医学相关"], "d": [["怎么理解", "p", "综合串讲不是再学一遍，而是把 57 个知识元压成一张**可调用的答题网**：任何一个病例题，都从「评定—分期/分级—目标—剂量—复评」五步写；任何一个理论题，都从「定义—对象—机制—方法—参数」五段写。背框架比背条文更抗遗忘。"], ["五个万能答题框架", "table", [["题型", "框架", "举例（脑卒中）"], ["病例/方案题", "评定→分期→目标→剂量→复评", "NIHSS+Barthel→急性期→4 周步行 50 m→PT 45 min×5/周→2 周复评"], ["理论/概念题", "定义→对象→机制→方法→参数", "神经发育疗法→中枢损伤→可塑性→任务导向→45 min×5 次/周"], ["对比题", "维度表：对象/目标/手段/时点/指标", "临床 vs 康复 8 行对照"], ["操作题", "适应证→禁忌→步骤→参数→注意", "关节松动 Ⅳ 级：疼痛/僵硬→骨折未愈禁→体位固定→30 s×3"], ["安全题", "红旗征→数值边界→停止指标", "血压 180/110、SpO₂ 88%、血糖 3.9/16.7"]]], ["核心数字一页表（考前最后看）", "table", [["类别", "数字"], ["ADL", "Barthel 0—100（≤40 重、61—99 轻、100 独立）；FIM 18—126"], ["运动", "MMT 0—5 级；ROM 关节正常值；6MWT 400—700 m（MCID 30）"], ["平衡步态", "BBS 0—56（＜45 高危）；TUG＞13.5 s；步速＜1.0 m/s；正常步行 1.2—1.4 m/s"], ["认知言语", "MMSE 24/文盲 17/小学 20；MoCA 26；AQ 93.8；MPT≥15 s"], ["吞咽", "洼田 1—5 级（≥3 禁经口）；EAT-10≥3；IDDSI 0—7"], ["老年", "AWGS 握力男 28/女 18 kg；Fried≥3 衰弱"], ["重症", "MRC＜48 为 ICU-AW；FiO₂≤0.6、PEEP≤10"], ["安全", "血压 180/110、血糖 3.9/16.7、SpO₂ 88%、血小板 50、Hb 80"]]], ["按考试类型的取舍（三种身份）", "ul", ["专升本：C1 评定学全篇 + F2 临床康复学 + B1 解剖，重点在量表操作与常见病方案。", "卫生资格（士/师）：四科均衡，基础知识偏解剖生理，专业实践偏病例与操作参数。", "考研 306：内科 33%、外科 23% 为主，康复部分考概念与适应证，深度不如临床。", "规培/入职：病例分析 + 操作规范（评定流程、治疗剂量、安全边界）。"]], ["提示", "p", "考前只看两页：五框架表 + 核心数字表。答题宁可少写病名，也要把「剂量与参数」写出来——这是与「背概念」拉开分差的地方。"], ["依据", "p", "依据：本库 01-教材 21 本对应章节汇总；《康复功能评定学》第 3 版、《物理治疗学》第 3 版、《康复医学》第 7 版；各专科学会指南（脑卒中、重症、心肺、老年）。"]]}, {"k": "kf-qita", "n": "其他系统疾病康复", "c": "肿瘤、糖尿病、风湿、烧伤与五官皮肤", "p": ["肿瘤：术前预康复、术后、淋巴水肿", "糖尿病：运动处方与足部保护", "风湿：关节保护与能量节省", "烧伤：体位、压力、瘢痕"], "t": "这组病按“系统损害→功能问题→方案”答。", "kw": ["肿瘤", "糖尿病", "风湿", "烧伤", "皮肤", "五官", "口腔", "眼科", "耳鼻咽喉", "传染病", "感染", "其他疾病"], "d": [["怎么理解", "p", "「其他疾病康复」是把前面各专科没覆盖的病种收口：烧伤、肿瘤、骨质疏松、糖尿病、慢性肾病、HIV 等。它们的共同点是**并发症与全身状态决定训练强度**，而不是局部损伤——烧伤怕挛缩、肿瘤怕骨转移、糖尿病怕低血糖与足溃疡。所以每个病种记「最怕什么并发症 + 强度上限」。"], ["教材定义（背这句 + 病种清单）", "p", "其他疾病康复：针对烧伤、恶性肿瘤、代谢与内分泌疾病、慢性肾脏病、传染病等非神经非肌骨原发病所致功能障碍，实施的综合康复评估与干预。核心目标：预防继发障碍（挛缩、压疮、肌少症、淋巴水肿）、维持功能、提高生活质量。"], ["主要病种的要点（对照表）", "table", [["病种", "康复重点", "关键参数/禁忌"], ["烧伤", "抗挛缩体位、压力衣、瘢痕管理", "压力衣 20—25 mmHg，每日 23 h；植皮后 7—10 天开始"], ["恶性肿瘤", "有氧+抗阻、淋巴水肿、癌因性疲乏", "骨转移处禁负重与强牵伸；血小板＜50×10⁹/L 免抗阻；疲乏者每周 150 min 中等强度"], ["骨质疏松", "负重与抗阻、平衡防跌倒", "避免脊柱屈曲+旋转（防压缩骨折）；T值≤−2.5 为骨质疏松"], ["糖尿病", "有氧+抗阻、足部护理", "运动前血糖 5.6—13.9 mmol/L；＜3.9 先补糖；足溃疡者免负重"], ["慢性肾脏病", "透析中有氧/抗阻、肌力", "透析日非穿刺侧肢体；容量负荷与血压监测"], ["COPD/心衰", "见心肺康复条目", "以症状与 SpO₂ 为准"]]], ["剂量与监测", "ul", ["有氧：每周 3—5 次、20—40 min、40%—60% HRR 起步；肿瘤患者从 10 min 累积。", "抗阻：每周 2—3 次、1—2 组×10—12 次、50%—60% 1RM。", "柔韧/牵伸：每日 1—2 次，每次 30 s×2—3 个循环。", "监测：心率、血压、SpO₂、血糖（糖尿病运动前后）、体温与伤口（烧伤）。", "停止：胸痛、SpO₂＜88%、血糖＜3.9 或＞16.7 mmol/L、伤口渗血。"]], ["提示", "p", "烧伤压力衣 20—25 mmHg / 每日 23 h、肿瘤骨转移禁负重、糖尿病运动前血糖 5.6—13.9 mmol/L 三条最常考。答题写「原发病并发症—强度上限—监测指标」，别写成通用运动处方。"], ["依据", "p", "依据：《内外科疾病康复学》第 3 版 第 7—12 章（内分泌、肿瘤、感染等）；《康复医学》第 7 版 第 8 章。"]]}], "chinfo": {"A1:1": ["gaishu"], "A1:2": ["liuxing", "canji"], "A1:3": ["canji", "liuxing"], "A1:4": ["canji"], "A1:5": ["gaishu"], "A1:6": ["gaishu"], "A1:7": ["lunli"], "A1:8": ["kf-xinli"], "A1:9": ["lunli"], "A1:10": ["gaishu", "lunli"], "A1:11": ["gaishu"], "A1:12": ["gaishu"], "A1:13": ["shengwu", "jiepou-shen"], "A1:14": ["gaishu", "canji"], "A1:15": ["gaishu", "lunli"], "A1:16": ["kf-laonian"], "A1:17": ["canji", "pd-zhong"], "A1:18": ["kf-shequ"], "A1:19": ["gaishu"], "A3:1": ["gaishu"], "A3:2": ["kf-xinli"], "A3:3": ["kf-xinli"], "A3:4": ["kf-xinli"], "A3:5": ["kf-xinli"], "A3:6": ["kf-xinli"], "A3:7": ["kf-xinli"], "A3:8": ["canji", "kf-xinli"], "A3:9": ["shengli-shen", "jiepou-shen"], "A3:10": ["kf-xinli"], "A3:11": ["kf-xinli"], "A3:12": ["kf-laonian", "kf-xinli"], "A3:13": ["kf-xinli"], "A3:14": ["kf-xinli"], "B1:1": ["gaishu", "canji"], "B1:2": ["jiepou-gu", "shengli-ji"], "B1:3": ["jiepou-zang"], "B1:4": ["jiepou-zang"], "B1:5": ["jiepou-zang"], "B1:6": ["jiepou-zang"], "B1:7": ["jiepou-zang"], "B1:8": ["shengli-shen", "jiepou-shen"], "B1:9": ["shengli-shen", "jiepou-shen"], "B1:10": ["jiepou-shen"], "B1:11": ["jiepou-gu", "ot-shou"], "B2:1": ["gaishu"], "B2:2": ["shengli-xf", "canji"], "B2:3": ["jiepou-gu", "shengli-ji"], "B2:4": ["jiepou-gu", "canji"], "B2:5": ["jiepou-zang"], "B2:6": ["shengli-xf", "jiepou-zang"], "B2:7": ["jiepou-zang"], "B2:8": ["jiepou-zang"], "B2:9": ["shengli-xf"], "B2:10": ["shengli-xf"], "B2:11": ["shengli-shen", "jiepou-shen"], "B2:12": ["shengli-shen", "jiepou-shen"], "B2:13": ["jiepou-shen"], "B2:14": ["jiepou-zang"], "B2:15": ["shengli-ji", "shengli-xf"], "B3:1": ["gaishu", "pd-zhong"], "B3:2": ["ot-shou", "shengwu"], "B3:3": ["shengwu", , ["报考条件", "ul", ["学历：具备相应专业中专、大专学历即可报士（人社部发〔2021〕51 号）；部分考区仍按「从事本专业工作满 1 年」执行，以当地卫健委当年通知为准。", "单位：工作证明须由持《医疗机构执业许可证》的机构出具；养生馆、健身房、月子中心开的证明不予认可。", "年限：学历取得时间与工作年限一般截止上一年 12 月 31 日（2026 年度报考截止 2025-12-31）。", "不能报考：医疗事故责任未满 3 年、医疗差错责任未满 1 年、行政处分期内、伪造学历或考试违纪未满 2 年。"]], ["考试科目", "table", [["科目", "题量", "时长", "形式"], ["基础知识", "100 题", "90 分钟", "人机对话"], ["相关专业知识", "100 题", "90 分钟", "人机对话"], ["专业知识", "100 题", "90 分钟", "人机对话"], ["专业实践能力", "100 题", "90 分钟", "人机对话"]]], ["题型", "ul", ["A1 单句型最佳选择题：一句话一个考点，占基础科目大头。", "A2 病历摘要型：一段病史 + 提问，考「看到症状想到什么」。", "A3 病历组型：一个病例带 2—3 问，考点彼此独立。", "A4 病历串型：一个病例带 4—6 问，后面的问依赖前面的判断，答错会连锁。", "B1 共用备选答案：2—3 个题干共用 5 个选项，选项可重复选或不选。"]], ["官方用书", "table", [["书", "版本 / ISBN", "用途"], ["全国卫生专业技术资格考试指导·康复医学与治疗技术", "2026 版 9787117385497（人卫，2025-09，886 页）", "四科合一，士 / 师 / 中级通用，按四篇对应四科"], ["康复医学治疗技术（士）模拟试卷", "2026 版 9787117388771（燕铁斌、吴伟 主编）", "考前 6 套整卷，最后两周用"], ["考试大纲", "免费（卫健委人才交流服务中心官网）", "报名前后必下载，按大纲划范围"]]], ["考什么（对应本库教材）", "ul", ["基础知识：解剖、运动学、生理、神经生理、发育、物理因子、心理 → B1 功能解剖学、B3 人体运动学、B2 康复生理学、A3 康复心理学。", "相关专业知识：临床疾病、影像、药理、伦理 → B5 临床疾病概要、E3 内外科疾病康复学、A1 康复医学概论（伦理章）。", "专业知识：评定与三大治疗技术总论 → C1 康复功能评定学、D1 物理治疗学、D2 作业治疗学、D3 语言治疗学。", "专业实践能力：病例与操作 → D1、D2、E1 神经康复学、E2 肌肉骨骼康复学。"]], ["复习顺序", "ul", ["① B1 解剖 + B3 运动学（占基础知识一半）。", "② B2 生理 + A3 心理（基础知识的另一半）。", "③ C1 评定全篇：量表是「专业知识」和病例题的地基。", "④ D1 物理治疗学：物理因子与手法的操作细节最容易出题。", "⑤ E1 / E2 病种：A3 / A4 病例题的素材来源。", "⑥ 指导书第四篇 + 士模拟卷 6 套，按 90 分钟计时做。"]], ["时间线", "table", [["阶段", "时间", "做什么"], ["报名", "前一年 12 月—当年 1 月（2026 年度 2025-11 底起）", "网上报名 + 现场/线上确认，单位盖章"], ["考试", "4 月中下旬（2026 年 107、209 均为 4 月 19 日机考）", "4 科分两个半天考完"], ["查分", "考后约 2 个月", "每科 60 分及格，两年滚动"], ["证书", "次年", "电子证书在中国人事考试网下载，纸质证书按考区发放"]]], ["常见坑", "ul", ["证书不是执业证：康复治疗师没有执业注册，考的是职称，不是「上岗许可」。", "107 与 209 只差工作年限：本科毕业满 1 年可直接报师，别多等一年。", "大纲文件里有 348：那是医师序列的「康复医学（中级）」，治疗技术专业别报错。", "只刷题不看指导书：A3 / A4 病例题要靠体系，不是靠背答案。", "成绩两年滚动：缺考一科不影响，但跨省报考先确认考区接收规则。"]], ["来源", "src", ["https://exam.ipmph.com/examzcms/kangfuyixueshi1/bkzn/", "https://www.pmphmall.com/gdsdetail/658557-335175", "htt <script>
const DATA = JSON.parse(document.getElementById('kb-data').textContent);
const $ = (s, r=document) => r.querySelector(s);

const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const LEVELS = DATA.levels;
/* file:// 下部分浏览器禁用 localStorage，做内存回退 */
const store = (() => { try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return localStorage; }
  catch(e){ const m={}; return { getItem:k=>(k in m?m[k]:null), setItem:(k,v)=>{m[k]=String(v);}, removeItem:k=>{delete m[k];} }; } })();
let tab = store.getItem('kb-tab') || 'books';
let filterLevel = 'all', filterCat = 'all';
const WHO_KEY='kb-who';
let who = DATA.ident.find(i=>i.key===store.getItem(WHO_KEY)) || null;
function focusOf(code){ return (who && who.focus && who.focus[code]) || 0; }
let cur = null;

const tabNames = {books:'教材', topics:'主题延伸', paths:'学习路径', scales:'量表速查', diseases:'病种速查', overlaps:'重合取舍', ident:'身份适配', cert:'资格证'};

function bookByCode(c){ return DATA.books.find(b=>b.code===c); }

function progressKey(code, i){ return 'kb-prog:'+code+':'+i; }
function isDone(code,i){ return store.getItem(progressKey(code,i))==='1'; }
function toggleDone(code,i,el){
  const k=progressKey(code,i);
  if(store.getItem(k)==='1'){ store.removeItem(k); el.classList.remove('done'); }
  else { store.setItem(k,'1'); el.classList.add('done'); }
  renderProgress(code);
}
function renderProgress(code){
  const b=bookByCode(code); if(!b) return;
  const done=b.chapters.filter((_,i)=>isDone(code,i)).length;
  const pct=b.chapters.length? Math.round(done*100/b.chapters.length):0;
  const bar=$('#progress-bar'); if(bar){ bar.style.width=pct+'%'; }

      list.appendChild(el);
    });

    items=DATA.scales.filter(s=>!q || (s[0]+s[1]+s[2]).toLowerCase().includes(q));

    });

    items=DATA.overlaps.map((o,i)=>({no:i+1,topic:o[0],main:o[1],ref:o[2],skip:o[3]}))
      .filter(o=>!q || (o.topic+o.main+o.ref+o.skip).toLowerCase().includes(q));
    items.forEach(o=>{

function chShort(s){return String(s||'').replace(/^第[一二三四五六七八九十百]+章\s*/,'');}
function renderBlocks(blocks){
  return (blocks||[]).map(b=>{
    const title=esc(b[0]), kind=b[1], pl=b[2];
    let inner='';
    if(kind==='p') inner='<p>'+md(pl)+'</p>';
    else if(kind==='ul') inner='<ul class="pts">'+pl.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul>';
    else if(kind==='src') inner='<ul class="srcs">'+pl.map(u=>'<li><a href="'+esc(u)+'" target="_blank" rel="noreferrer">'+esc(u)+'</a></li>').join('')+'</ul>';
    else if(kind==='table') inner='<table class="grid"><tr>'+pl[0].map(h=>'<th>'+md(h)+'</th>').join('')+'</tr>'+
      pl.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+md(c)+'</td>').join('')+'</tr>').join('')+'</table>';
    return '<h3>'+title+'</h3>'+inner;
  }).join('');
}

function showBook(code){
  const b=bookByCode(code); if(!b) return;
  setHash(code);
  renderProgress(code);
  const rel=b.related.map(c=>{const r=bookByCode(c); return r?'<a class="chip" data-goto="'+c+'">'+esc(r.title)+'</a>':'';}).join('');
  const chLi=(c,i)=>{
    const done=isDone(code,i)?'done':'';
    return '<li class="ch '+done+'" data-i="'+i+'" title="打开本章大纲与要点"><span class="box">'+(isDone(code,i)?'✓':'')+'</span>'+
      '<span class="ch-name">'+esc(c)+'</span></li>';
  };

  if(b.variants){
    chs=b.variants.map(v=>{
      const ul='<ul class="chapters">'+v.chapters.map((c,j)=>chLi(c,base+j)).join('')+'</ul>';
      base+=v.chapters.length;
      return '<div class="vblock"><div class="vhead">'+esc(v.label)+
        '　<span class="vmeta">'+esc(v.editor)+' · ISBN '+esc(v.isbn)+'</span>'+
        '<div class="vnote">'+esc(v.note)+'</div></div>'+ul+'</div>';
    }).join('');
  } else {
    chs='<ul class="chapters" id="chs">'+b.chapters.map(chLi).join('')+'</ul>';
  }
  $('#main').innerHTML=
   '<div class="kicker">'+esc(b.cat)+' · '+levelBadge(b.level)+' '+esc(b.level_name)+'</div>'+

   '<div class="progwrap"><div class="progbar"><div id="progress-bar" class="progfill"></div></div><span id="progress-label"></span></div>'+

   '<h3>往上延伸</h3><p>'+esc(b.extend)+'</p>'+
   '<h3>电子版</h3><p class="muted">'+esc(b.ebook)+'</p>'+

    cur=a.dataset.goto;

   '<tr><th>跳过/理由</th><td>'+esc(o.skip)+'</td></tr></table>'+
   '<p class="hint">同一内容出现在多本教材时，只精读一本；其余在做题对不上时再查。</p>';
}


/* ---------------- 章节页 ---------------- */
function refsOf(str){
  const out=[];
  const re=/([A-F]\d)\s*(?:第([\d、—\-～,，]+)章|全篇)/g;
  let m;
  while((m=re.exec(str||''))){
    const code=m[1];
    if(m[2]==null){ const b=bookByCode(code); if(b) b.chapters.forEach((_,i)=>out.push([code,i+1])); continue; }
    m[2].split(/[、，,]/).forEach(p=>{
      p=p.trim(); if(!p) return;
      const rg=p.split(/[—\-～]/);
      if(rg.length===2){
        const a=+rg[0],z=+rg[1];
        if(a&&z) for(let i=a;i<=z;i++) out.push([code,i]);
      } else if(/^\d+$/.test(p)) out.push([code,+p]);
    });
  }
  return out;
}
function chName(code,seq){ const b=bookByCode(code); return (b&&b.chapters[seq-1])||(code+' 第'+seq+'章'); }
function plain(s){ return String(s||'').replace(/^第[一二三四五六七八九十百]+章\s*/,''); }
function openChapter(code, seq){
  if(tab!=='books'){ setTab('books'); } else { renderSidebar(); }
  cur = code; markActive();
  showChapter(code, seq);
}

function showChapter(code, seq){
  const b=bookByCode(code); if(!b) return;
  setHash(code+'-'+seq);
  const key=code+':'+seq, i=seq-1, done=isDone(code,i);
  const atoms=(DATA.chinfo[key]||[]).map(k=>DATA.know.find(a=>a.k===k)).filter(Boolean);
  const ref=DATA.chref[key]||{sc:[],ds:[],ov:[]};
  const name=chName(code,seq);
  const atomHtml=atoms.length? atoms.map(a=>
      '<div class="atom" data-atom="'+a.k+'" title="点开看详解"><div class="atom-h"><b>'+esc(a.n)+'</b><span>'+esc(a.c)+'</span>'+
        '<a class="more" data-atom="'+a.k+'">看详解 →</a></div>'+
      '<ul class="pts">'+a.p.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
      (a.t? '<div class="tip">读法：'+esc(a.t)+'</div>':'')+'</div>').join('')
    : '<p class="muted">本章属综述或过渡性内容，按下面「关联」里的条目定位即可。</p>';
  const scs=ref.sc.map(j=>DATA.scales[j]).filter(Boolean);
  const dss=ref.ds.map(j=>DATA.diseases[j]).filter(Boolean);
  const ovs=ref.ov.map(j=>DATA.overlaps[j]).filter(Boolean);
  const relHtml=(scs.length? '<h3>相关量表</h3><table class="grid"><tr><th>量表</th><th>用途</th><th>位置</th></tr>'+
      scs.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td></tr>').join('')+'</table>':'')+
    (dss.length? '<h3>相关病种</h3><table class="grid"><tr><th>病种</th><th>主查</th><th>也在</th></tr>'+
      dss.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td></tr>').join('')+'</table>':'')+
    (ovs.length? '<h3>跨书重合</h3><table class="grid"><tr><th>主题</th><th>精读</th><th>对照</th><th>跳过/理由</th></tr>'+
      ovs.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td><td>'+esc(x[3])+'</td></tr>').join('')+'</table>':'');
  const prev=seq>1? '<a data-ch="'+code+'" data-sq="'+(seq-1)+'">← 第'+(seq-1)+'章</a>':'<span></span>';
  const next=seq<b.chapters.length? '<a data-ch="'+code+'" data-sq="'+(seq+1)+'">第'+(seq+1)+'章 →</a>':'<span></span>';
  $('#main').innerHTML=
   '<div class="crumb"><a data-ch="'+code+'" data-sq="0">'+esc(b.title)+'</a> › '+esc(name)+'</div>'+
   '<h1>'+esc(name)+'</h1>'+idBanner(code)+
   '<div class="meta">'+esc(b.code)+' ｜ '+esc(b.editor)+' ｜ '+esc(b.edition)+' ｜ 全章 '+b.chapters.length+' 章 ｜ 本章位于第 '+seq+' 章</div>'+
   '<div class="progwrap"><button class="chipbtn'+(done?' on':'')+'" id="chdone">'+(done?'已读 ✓':'标记已读')+'</button>'+
     '<span class="hint">勾选状态与本页进度同步</span></div>'+
   '<h3>大纲 <small>本章知识元</small></h3>'+atomHtml+
   '<h3>内容要点 <small>按上列知识元展开，用于定位与复习</small></h3>'+
     '<p class="muted">本站不含教材原文；要点是知识元整理稿，原文请按 ISBN 查对应教材。</p>'+
   (relHtml || '<h3>关联</h3><p class="muted">本章暂无交叉条目，可回到书目页按邻章阅读。</p>')+
   '<h3>我的笔记 <small>只存在本机浏览器</small></h3>'+
   '<textarea id="chnote" placeholder="记下本章重点、疑问、老师强调的内容…"></textarea>'+
   '<div class="chnav"><span>'+prev+'</span><a data-ch="'+code+'" data-sq="0">回到书目</a><span>'+next+'</span></div>';
  const nt=$('#chnote');
  nt.value = store.getItem('kb-note:'+key)||'';
  nt.oninput=()=>store.setItem('kb-note:'+key, nt.value);
  $('#chdone').onclick=()=>{
    toggleDone(code,i,{});
    const now=isDone(code,i);
    const btn=$('#chdone'); btn.classList.toggle('on',now); btn.textContent=now?'已读 ✓':'标记已读';
    renderProgress(code);
  };
  $('#main').querySelectorAll('.atom[data-atom]').forEach(el=>el.onclick=e=>{e.stopPropagation();showAtom(el.getAttribute('data-atom'));});
  $('#main').querySelectorAll('[data-ch]').forEach(a=>a.onclick=()=>{
    const sq=+a.dataset.sq;
    if(sq===0){ setTab('books'); cur=a.dataset.ch; showBook(a.dataset.ch); markActive(); }
    else openChapter(a.dataset.ch, sq);
  });
}

/* ---------------- 问答对话框 ---------------- */
let chat=[];
/* 知识元 → 章节（构建时由 chinfo 反推） */
const ATOM_CH={};
Object.keys(DATA.chinfo).forEach(k=>{
  DATA.chinfo[k].forEach(a=>{ (ATOM_CH[a]=ATOM_CH[a]||[]).push(k); });
});
function norm(s){ return String(s||'').toLowerCase().replace(/[\s，。、；：？！,.;:?!（）()“”"']/g,''); }
function grams(s){ const o=[]; for(let i=0;i<s.length-1;i++) o.push(s.slice(i,i+2)); return o; }
function scoreOf(q,text){
  const qq=norm(q); if(!qq) return 0;
  const t=norm(text);
  let sc=0;
  if(t.includes(qq)) sc+=100;
  else if(qq.includes(t) && t.length>=2) sc+=40;
  grams(qq).forEach(g=>{ if(t.includes(g)) sc+=4; });
  return sc;
}
function candidates(q){
  const out=[];
  DATA.diseases.forEach(d=>{
    const s=scoreOf(q,d[0]);
    if(s) out.push({s:s*1.5,kind:'disease',title:d[0],body:'主查 '+d[1]+'；也在 '+d[2],refs:refsOf(d[1]+'；'+d[2])});
  });
  DATA.scales.forEach(sc=>{
    const s=scoreOf(q,sc[0]);
    if(s) out.push({s:s*1.2,kind:'scale',title:sc[0],body:sc[1]+'；位置 '+sc[2],refs:refsOf(sc[2])});
  });
  DATA.know.forEach(a=>{
    let s=0, best=null;
    a.kw.forEach(k=>{ const sc=scoreOf(q,k)*(k.length>=2?k.length:1); if(sc>s){ s=sc; best=k; } });
    if(s>0){
      const grams=[]; for(let i=0;i<q.length-1;i++) grams.push(q.slice(i,i+2));
      const refs=(ATOM_CH[a.k]||[]).map(k=>[k.split(':')[0], +k.split(':')[1]])
        .map(r=>{ const b=bookByCode(r[0]); const nm=(b&&b.chapters[r[1]-1])||'';
                  r.push(grams.reduce((n,g)=>n+(nm.includes(g)?1:0),0)); return r; })
        .sort((x,y)=>y[2]-x[2]).slice(0,3).map(r=>[r[0],r[1]]);
      out.push({s:s*0.9,kind:'know',title:a.n,body:a.c,atom:a,refs:refs});
    }
  });
  DATA.overlaps.forEach((o,i)=>{
    const s=scoreOf(q,o[0]);
    if(s) out.push({s:s*1.3,kind:'overlap',title:o[0],body:'精读 '+o[1]+'；对照 '+o[2],skip:o[3],refs:refsOf(o[1]+'；'+o[2])});
  });
  DATA.topics.forEach(t=>{
    const s=scoreOf(q,t.topic);
    if(s) out.push({s:s,kind:'topic',title:t.topic,body:t.l2,refs:refsOf(t.l2+'；'+t.l3)});
  });
  DATA.books.forEach(b=>{
    b.chapters.forEach((c,i)=>{
      const s=scoreOf(q,plain(c));
      if(s>8) out.push({s:s*0.5,kind:'chapter',title:b.code+' 第'+(i+1)+'章 '+plain(c),body:'',refs:[[b.code,i+1]]});
    });
  });
  return out.filter(o=>o.s>6).sort((a,b)=>b.s-a.s);
}
function askAnswer(q){
  const cs=candidates(q);
  if(!cs.length){
    return {summary:'没找到直接对应的条目。换个说法试试：病种名（脑卒中、脊髓损伤）、量表名（Berg、MMT）、或章名（肌力评定、吞咽障碍），也可以直接说“膝置换术后怎么练”。',items:[]};
  }
  if(who){
    cs.forEach(c=>{ if(c.refs && c.refs.length && focusOf(c.refs[0][0])) c.s+=30; });
    cs.sort((a,b)=>b.s-a.s);
  }
  /* 先病种/重合（实体），再知识元；章节按来源限量，避免解剖章刷屏 */
  const pri=t=>(t.kind==='disease'||t.kind==='overlap')?0:1;
  const top=cs.slice().sort((a,b)=> pri(a)-pri(b) || b.s-a.s).slice(0,3);
  const refs=[], seen={};
  const push=r=>{ const k=r[0]+':'+r[1]; if(!seen[k]){ seen[k]=1; refs.push(r); } };
  top.forEach(t=>{
    const cap = t.kind==='know'?2 : (t.kind==='disease'?4:3);
    (t.refs||[]).slice(0,cap).forEach(push);
  });
  cs.filter(c=>c.kind==='chapter').slice(0,4).forEach(c=>c.refs.forEach(push));
  const t0=top[0];
  let sum='';
  if(t0.kind==='disease') sum='「'+t0.title+'」：'+t0.body+'。';
  else if(t0.kind==='scale') sum='「'+t0.title+'」是'+t0.body+'。';
  else if(t0.kind==='know') sum='「'+t0.title+'」——'+t0.body+'。'+(t0.atom.p.slice(0,2).join('；'))+'。';
  else if(t0.kind==='overlap') sum='「'+t0.title+'」在 '+t0.body+'。跳过理由：'+t0.skip+'。';
  else sum='「'+t0.title+'」。';
  const seenT={}; seenT[t0.title]=1;
  const others=top.slice(1).map(x=>x.title).filter(t=>t&&!seenT[t]&&(seenT[t]=1));
  if(others.length) sum+=' 另外涉及：'+others.join('、')+'。';
  if(t0.kind==='disease') sum+=' 读法：评定 → 干预 → 并发症与随访。';
  if(who) sum+=' 按你的身份「'+who.name+'」，重点书相关的章会优先排前面。';
  if(refs.length) sum+=' 优先按下面 '+(refs.length>8?8:refs.length)+' 章读，点一下直接打开。';
  else sum+=' 这组内容暂未映射到具体章，可从教材页按类目翻。';
  return {summary:sum, items:refs.slice(0,8)};
}
function renderChat(){
  const box=$('#askLog');
  box.innerHTML = chat.map(m=>{
    if(m.role==='u') return '<div class="msg u">'+esc(m.text)+'</div>';
    const items=(m.res.items||[]).map(r=>'<a class="res" data-code="'+r[0]+'" data-seq="'+r[1]+'"><b>'+r[0]+' 第'+r[1]+'章</b>'+esc(plain(chName(r[0],r[1])))+'</a>').join('');
    return '<div class="msg a"><div>'+esc(m.res.summary)+'</div>'+(items?'<div class="reslist">'+items+'</div>':'')+'</div>';
  }).join('');
  box.querySelectorAll('.res').forEach(a=>a.onclick=()=>{
    openChapter(a.dataset.code, +a.dataset.seq);
    if(window.innerWidth<900) toggleAsk(false);
  });
  box.scrollTop=box.scrollHeight;
}
function ask(q){
  q=(q||'').trim(); if(!q) return;
  chat.push({role:'u',text:q});
  chat.push({role:'a',res:askAnswer(q)});
  renderChat();
  $('#askInput').value='';
}
function toggleAsk(force){
  const p=$('#askPanel'), b=$('#askBtn');
  const show = (force===undefined)? p.hidden : force;
  p.hidden = !show; b.style.display = show? 'none':'block';
  if(show){ if(!chat.length){ chat.push({role:'a',res:{summary:'说一句话，我按知识库检索：先给结论，再列出该读哪几章，点章号直接跳过去。',items:[]}}); renderChat(); } $('#askInput').focus(); }
}

function setTab(t){
  tab=t; store.setItem('kb-tab',t);
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  $('#filters').style.display = (t==='books')?'flex':'none';
  renderSidebar(); markActive();
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ setTab(b.dataset.tab); mainEmpty(); cur=null; });
$('#search').oninput=renderSidebar;
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{

whoSel.value = who? who.key : '';

});

/* 支持 #C1 / #神经康复 这类直达链接 */
const _h = decodeURIComponent((location.hash||'').slice(1));
if(_h){
  const _q = _h.match(/^(?:问|ask[:：])\s*(.+)$/);
  if(_q){ toggleAsk(true); ask(_q[1]); }
  else {
  const _m = _h.match(/^([A-F]\d)-(\d+)$/);
  const _b = _m? null : bookByCode(_h.toUpperCase());
  if(_m){
    if(tab!=='books'){ setTab('books'); } cur=_m[1]; renderSidebar(); markActive();
    openChapter(_m[1], +_m[2]);
  }
  else if(_b){ if(tab!=='books'){ setTab('books'); } cur=_b.code; showBook(_b.code); renderSidebar(); markActive(); }
  else {
    const _t = DATA.topics.find(x=>x.topic===_h);
    if(_t){ cur=_t.topic; setTab('topics'); showTopic(_t); renderSidebar(); markActive(); }
    else {
      const m = _h.match(/^重合(\d+)$/);
      if(m){
        const o = DATA.overlaps[+m[1]-1];
        if(o){ cur='ov'+m[1]; setTab('overlaps');
               showOverlap({no:+m[1], topic:o[0], main:o[1], ref:o[2], skip:o[3]});
               renderSidebar(); markActive(); }
      }
    }
  }
  }
}

if(/^元/.test(_h3)){
  const _a=DATA.know.find(x=>x.k===_h3.slice(1));

}
